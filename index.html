function triggerPrint(cleanupFn, options = {}) {

  const pa = document.getElementById('printArea');
  if (!pa) {
    toast('ไม่พบพื้นที่สำหรับพิมพ์');
    return;
  }

  const imgs = Array.from(pa.querySelectorAll('img'));

  let cleaned = false;
  let started = false;

  const cleanupOnce = () => {

    if (cleaned) return;

    cleaned = true;

    const dyn = document.getElementById('dynPageStyle');
    if (dyn) dyn.remove();

    /* สำคัญ:
       ล้างค่าที่อาจถูกใส่จากระบบเดิม */
    pa.style.removeProperty('zoom');
    pa.style.removeProperty('transform');
    pa.style.removeProperty('width');
    pa.style.removeProperty('min-width');
    pa.style.removeProperty('max-width');

    if (cleanupFn) {
      cleanupFn();
    }
  };

  /* =========================================
     เตรียมหน้ากระดาษ
     ========================================= */

  const prepareLayout = () => {

    /* ลบ style @page เก่าที่ฝังอยู่ในรายงาน
       แต่เก็บข้อมูล orientation / margin เอาไว้ */

    let landscape = false;
    let margin = '0';

    pa.querySelectorAll('style').forEach(st => {

      st.textContent = st.textContent.replace(
        /@page\s*\{([^}]*)\}/g,
        (m, body) => {

          const sizeMatch =
            /size\s*:\s*([^;]+)/i.exec(body);

          const marginMatch =
            /margin\s*:\s*([^;]+)/i.exec(body);

          if (
            sizeMatch &&
            /landscape/i.test(sizeMatch[1])
          ) {
            landscape = true;
          }

          if (marginMatch) {
            margin = marginMatch[1].trim();
          }

          return '';
        }
      );
    });

    const old =
      document.getElementById('dynPageStyle');

    if (old) {
      old.remove();
    }

    /* orientation เท่านั้นที่อนุญาตให้เปลี่ยน */
    const dyn =
      document.createElement('style');

    dyn.id = 'dynPageStyle';

    dyn.textContent =
      '@page{' +
      'size:A4 ' +
      (landscape ? 'landscape' : 'portrait') +
      ';margin:' +
      margin +
      ';}';

    document.head.appendChild(dyn);

    /*
      สำคัญมาก

      ห้าม:
        - วัด scrollWidth
        - คำนวณ zoom
        - scale ตาม viewport
        - width ตามมือถือ

      เพราะเอกสารต้องเป็น A4 จริง
    */

    pa.style.removeProperty('zoom');
    pa.style.removeProperty('transform');

    /*
      แก้ บชก.3 แนวนอน:
      A4 แนวนอนกว้าง 297mm แต่พื้นที่ใช้งานต้องหัก margin ของ @page
      เช่น @page margin: 8mm => 297 - 8 - 8 = 281mm
      ส่วนเอกสารแนวตั้งยังคง 210mm ตามเดิม
    */
    let paperWidthMm = 210;

    if (landscape) {
      const m = margin.trim().split(/\s+/)
        .filter(Boolean)
        .map(v => parseFloat(v));

      let horizontalMarginMm = 0;

      if (m.length === 1) {
        horizontalMarginMm = isFinite(m[0]) ? m[0] : 0;
      } else if (m.length === 2 || m.length === 3) {
        horizontalMarginMm = isFinite(m[1]) ? m[1] : 0;
      } else if (m.length >= 4) {
        horizontalMarginMm =
          (isFinite(m[1]) ? m[1] : 0) +
          (isFinite(m[3]) ? m[3] : 0);
      }

      paperWidthMm = 297 - (horizontalMarginMm * 2);

      // กันค่าผิดปกติจาก @page
      paperWidthMm = Math.max(240, Math.min(297, paperWidthMm));
    }

    pa.style.setProperty(
      'width',
      paperWidthMm + 'mm',
      'important'
    );

    pa.style.setProperty(
      'min-width',
      paperWidthMm + 'mm',
      'important'
    );

    pa.style.setProperty(
      'max-width',
      paperWidthMm + 'mm',
      'important'
    );
  };

  /* =========================================
     สั่งพิมพ์
     ========================================= */

  const doPrint = () => {

    prepareLayout();

    /*
      บังคับ reflow ก่อน window.print()
      สำคัญกับ Safari / iPadOS
    */
    void pa.offsetHeight;

    requestAnimationFrame(() => {

      requestAnimationFrame(() => {

        const onAfter = () => {

          window.removeEventListener(
            'afterprint',
            onAfter
          );

          cleanupOnce();
        };

        window.addEventListener(
          'afterprint',
          onAfter
        );

        window.print();

        /*
          fallback สำหรับ browser ที่ไม่ยิง afterprint
        */
        setTimeout(
          cleanupOnce,
          5000
        );

      });

    });
  };

  const start = () => {

    if (started) return;

    started = true;

    doPrint();
  };

  /*
    iPhone / iPad:
    ถ้าเป็น immediate ให้เข้า window.print()
    จาก click flow โดยเร็วที่สุด
  */

  if (options.immediate) {

    start();

    return;
  }

  /* =========================================
     รอรูป
     ========================================= */

  let remaining = imgs.length;

  imgs.forEach(img => {

    if (img.complete) {

      remaining--;

      return;
    }

    const done = () => {

      remaining--;

      if (remaining <= 0) {

        start();
      }
    };

    img.addEventListener(
      'load',
      done,
      { once:true }
    );

    img.addEventListener(
      'error',
      done,
      { once:true }
    );

  });

  /* =========================================
     รอฟอนต์
     ========================================= */

  const fontsReady =
    (
      document.fonts &&
      document.fonts.ready
    )
      ? document.fonts.ready
      : Promise.resolve();

  const paperFontsReady =
    (
      document.fonts &&
      document.fonts.load
    )
      ? Promise.all([

          fontsReady,

          document.fonts.load(
            "400 15pt 'TH Sarabun New'",
            'ภาษาไทย'
          ),

          document.fonts.load(
            "700 18pt 'TH Sarabun New'",
            'รายงานสรุปพัสดุในความครอบครอง'
          ),

          document.fonts.load(
            "400 15pt 'Sarabun'",
            'ภาษาไทย'
          ),

          document.fonts.load(
            "400 15pt 'Kanit'",
            'ภาษาไทย'
          )

        ])
      : fontsReady;

  paperFontsReady.then(() => {

    if (remaining <= 0) {

      setTimeout(
        start,
        60
      );

    } else {

      /*
        เผื่อ Safari โหลด font/image ช้า
      */
      setTimeout(
        start,
        2500
      );

    }

  });

}

        <div style="font-size:9pt;">${escapeHtml(a['รหัสครุภัณฑ์'])}</div></div>`);
    }
  } finally {
    document.body.removeChild(tmp);
    setLoading(false);
  }

  pa.classList.add('report-print-area');
  pa.innerHTML = `<style>@page{size:A4;margin:10mm;}
    .qr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;font-family:'Kanit',sans-serif;}
    .qr-cell{text-align:center;border:1px dashed #999;padding:3mm;break-inside:avoid;}</style>
    <div class="qr-grid">${cells.join('')}</div>`;
 triggerPrint(() => { pa.classList.remove('report-print-area'); pa.innerHTML = ''; }, { immediate: true });
}

function openComponentForm(parentId, c) {

  if (curType && typeOptions.indexOf(curType) === -1) typeOptions.unshift(curType);

  const otherNameDefault = (c && curType === 'อื่นๆ' && c['ชื่อส่วนควบ'] && c['ชื่อส่วนควบ'] !== 'อื่นๆ') ? c['ชื่อส่วนควบ'] : '';

    <div class="field"><label>จำนวน</label><input class="input" type="number" min="1" id="c_qty" value="${c ? compQty(c) : 1}"></div>
    <div class="field"><label>หมายเลข/ซีเรียล</label><input class="input" id="c_serial" value="${c ? escapeHtml(c['หมายเลข/ซีเรียล'])||'' : ''}"></div>
    <div class="field"><label>หมายเหตุ</label><input class="input" id="c_note" value="${c ? escapeHtml(c['หมายเหตุ'])||'' : ''}"></div>
    <div class="btn-row"><button class="btn btn-ghost" id="btnCancel">ยกเลิก</button><button class="btn btn-primary" id="btnSave">บันทึก</button></div>
    ${editing ? `<div class="btn-row"><button class="btn btn-danger" id="btnDeleteComp">ลบส่วนควบนี้</button></div>` : ''}
  `);

  // แสดง/ซ่อนช่องชื่อ ตามประเภทที่เลือก
  function toggleNameField() {
    document.getElementById('c_nameWrap').style.display = (val('c_type') === 'อื่นๆ') ? 'block' : 'none';
  }
  document.getElementById('c_type').onchange = toggleNameField;
  toggleNameField();

  document.getElementById('btnCancel').onclick = closeSheet;
  document.getElementById('btnSave').onclick = async () => {
    const type = val('c_type');
    // ชื่อ = ชื่อประเภท (ยกเว้น "อื่นๆ" ให้ใช้ชื่อที่กรอก ถ้าไม่กรอกใช้คำว่า "อื่นๆ")
    const name = (type === 'อื่นๆ') ? (val('c_name').trim() || 'อื่นๆ') : type;
    if (!type) { toast('กรุณาเลือกประเภทส่วนควบ'); return; }
    const qty = Math.max(1, parseInt(val('c_qty'), 10) || 1);
    if (editing && qty < compOut(c)) { toast('จำนวนต้องไม่น้อยกว่าที่ถูกยืมอยู่ (' + compOut(c) + ')'); return; }
    const payload = { id: c ? c['รหัสส่วนควบ'] : undefined, parentId, name, type, serial: val('c_serial'), note: val('c_note'), qty };
    const saveBtn = document.getElementById('btnSave'); if (saveBtn.disabled) return; setButtonBusy(saveBtn, true); setLoading(true, 'กำลังบันทึกส่วนควบ...');
    try { await apiPost(editing ? 'updateComponent' : 'addComponent', payload); closeSheet(); toast('บันทึกส่วนควบแล้ว'); await reloadThen(() => openAssetDetail(parentId)); }

/* ========================================================= BORROW */
function borrowDaysInfo(b) {
  if (b['สถานะ'] === 'คืนแล้ว') return 'คืนแล้ว ' + systemDate(b['วันที่คืนจริง']);
  if (b['สถานะ'] === 'ถูกปฏิเสธ' || b['สถานะ'] === 'รออนุมัติ') return 'กำหนดคืน ' + systemDate(b['กำหนดคืน']);
  const days = daysUntil(b['กำหนดคืน']);
  if (days === null) return '';
  if (days < 0) return 'เกินกำหนด ' + Math.abs(days) + ' วัน';
  if (days === 0) return 'ครบกำหนดวันนี้';
  return 'เหลืออีก ' + days + ' วัน';
}
function renderBorrow() {
  const el = document.getElementById('view-borrow');
  if (state.borrowTab === undefined) state.borrowTab = 'active';
  if (state.borrowSearch === undefined) state.borrowSearch = '';
  if (state.borrowSort === undefined) state.borrowSort = 'due_asc';
  if (state.borrowView === undefined) state.borrowView = getViewMode('borrow');

  const pending = state.borrow.filter(b => b['สถานะ'] === 'รออนุมัติ');
  const active = state.borrow.filter(b => b['สถานะ'] !== 'คืนแล้ว' && b['สถานะ'] !== 'รออนุมัติ' && b['สถานะ'] !== 'ถูกปฏิเสธ');
  const history = state.borrow.filter(b => b['สถานะ'] === 'คืนแล้ว' || b['สถานะ'] === 'ถูกปฏิเสธ');
  const overdueCount = active.filter(b => effectiveBorrowStatus(b) === 'เกินกำหนด').length;

  if (state.borrowTab === 'pending' && !isAdmin()) state.borrowTab = 'active';

  const TABS = [
    { id: 'pending', label: 'รออนุมัติ', count: pending.length, show: isAdmin() },
    { id: 'active',  label: 'ค้างคืน',   count: active.length,  show: true },
    { id: 'history', label: 'ประวัติ',   count: history.length, show: true }
  ].filter(t => t.show);

  let list = { pending, active, history }[state.borrowTab] || [];
  const q = state.borrowSearch.toLowerCase();
  if (q) list = list.filter(b => String(b['ผู้ยืม']||'').toLowerCase().includes(q) || String(b['ชื่อครุภัณฑ์']||'').toLowerCase().includes(q));

  const [sField, sDir] = state.borrowSort.split('_');
  const sMul = sDir === 'desc' ? -1 : 1;
  list = [...list].sort((a, b) => {
    if (sField === 'due') return sMul * (toDate(a['กำหนดคืน']||0) - toDate(b['กำหนดคืน']||0));
    if (sField === 'name') return sMul * String(a['ผู้ยืม']||'').localeCompare(String(b['ผู้ยืม']||''), 'th');
    return 0;
  });

  const isGrid = state.borrowView === 'grid';

  el.innerHTML = `
    <div class="section-title">
      รายการยืม-คืน <small>${active.length} รายการค้างคืน${overdueCount ? ' · เกินกำหนด ' + overdueCount : ''}</small>
      <span class="section-actions">
        ${viewToggleHtml('borrow', state.borrowView)}
        <button class="icon-btn" id="btnPrintAllBorrow" title="พิมพ์รายการยืม-คืนทั้งหมด" aria-label="พิมพ์รายการยืม-คืนทั้งหมด">${ICONS.print}</button>
        <button class="icon-btn" id="btnExportBorrow" title="ส่งออก CSV">${ICONS.download}</button>
      </span>
    </div>
    <div class="stat-grid" style="margin-bottom:14px;">
      <div class="stat-card warn"><div class="stat-num">${pending.length}</div><div class="stat-label">รออนุมัติ</div></div>
      <div class="stat-card ok"><div class="stat-num">${active.length}</div><div class="stat-label">ค้างคืน</div></div>
      <div class="stat-card bad"><div class="stat-num">${overdueCount}</div><div class="stat-label">เกินกำหนด</div></div>
    </div>
    <div class="search-row">
      <input class="input" id="borrowSearchInput" placeholder="ค้นหาชื่อผู้ยืมหรือครุภัณฑ์..." value="${escapeHtml(state.borrowSearch)}">
      <select class="input sort-select" id="borrowSortSelect">
        <option value="due_asc" ${state.borrowSort==='due_asc'?'selected':''}>กำหนดคืนใกล้สุด</option>
        <option value="due_desc" ${state.borrowSort==='due_desc'?'selected':''}>กำหนดคืนไกลสุด</option>
        <option value="name_asc" ${state.borrowSort==='name_asc'?'selected':''}>ชื่อผู้ยืม ก-ฮ</option>
      </select>
    </div>
    <div class="chip-row">
      ${TABS.map(t => `<div class="chip ${state.borrowTab===t.id?'active':''}" data-btab="${t.id}">${t.label} (${t.count})</div>`).join('')}
    </div>
    <div id="borrowList" class="${isGrid ? 'asset-grid' : ''}">${list.length ? list.map(isGrid ? borrowCard : borrowRow).join('') : emptyState(
      state.borrowTab==='pending' ? 'ไม่มีคำขอรออนุมัติ' :
      state.borrowTab==='active'  ? 'ไม่มีรายการค้างคืน' : 'ยังไม่มีประวัติ'
    )}</div>
  `;
  document.querySelectorAll('.borrow-item').forEach(it => it.onclick = () => openBorrowDetail(it.dataset.id));
  document.getElementById('btnExportBorrow').onclick = () => exportCsv('ยืมคืน.csv', ['รหัสรายการ','รหัสครุภัณฑ์','ชื่อครุภัณฑ์','ผู้ยืม','วันที่ยืม','กำหนดคืน','วันที่คืนจริง','สถานะ','ผู้อนุมัติ','หมายเหตุ'], state.borrow);
  document.getElementById('btnPrintAllBorrow').onclick = printAllBorrow;
  document.querySelectorAll('[data-btab]').forEach(c => c.onclick = () => { state.borrowTab = c.dataset.btab; renderBorrow(); });
  const searchInput = document.getElementById('borrowSearchInput');
  searchInput.oninput = (e) => {
    state.borrowSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderBorrow();
    const again = document.getElementById('borrowSearchInput');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
  };
  document.getElementById('borrowSortSelect').onchange = (e) => { state.borrowSort = e.target.value; renderBorrow(); };
  wireViewToggle(renderBorrow, '#view-borrow', 'borrowView');
  requestAnimationFrame(() => applyPremiumMotion(el));
}
function borrowCard(b) {
  const eff = effectiveBorrowStatus(b);
  const info = borrowDaysInfo(b);
  return `<div class="glass asset-card borrow-item" data-id="${escapeHtml(b['รหัสรายการ'])}">
    <div class="asset-card-top">
      <div class="asset-card-icon">${ICONS.swap}</div>
      <div class="status-badge ${statusClass(eff)}">${escapeHtml(eff)}</div>
    </div>
    <div>
      <div class="asset-card-title">${escapeHtml(b['ชื่อครุภัณฑ์'])}</div>
      <div class="asset-card-sub">${escapeHtml(b['ผู้ยืม'])}</div>
      ${info ? `<div class="asset-card-sub">${escapeHtml(info)}</div>` : ''}
    </div>
  </div>`;
}
function effectiveBorrowStatus(b) {
  if (b['สถานะ'] === 'คืนแล้ว' || b['สถานะ'] === 'รออนุมัติ' || b['สถานะ'] === 'ถูกปฏิเสธ') return b['สถานะ'];
  const due = toDate(b['กำหนดคืน']);
  if (!isNaN(due) && due.getTime() < new Date().setHours(0, 0, 0, 0)) return 'เกินกำหนด';
  return b['สถานะ'] || 'กำลังยืม';
}
function borrowRow(b) {
  const eff = effectiveBorrowStatus(b);
  const info = borrowDaysInfo(b);
  return `<div class="glass list-item borrow-item" data-id="${escapeHtml(b['รหัสรายการ'])}">
    <div class="li-icon">${ICONS.swap}</div>
    <div class="li-body">
      <div class="li-title">${escapeHtml(b['ชื่อครุภัณฑ์'])}</div>
      <div class="li-sub">${escapeHtml(b['ผู้ยืม'])}${info ? ' · ' + info : ''}</div>
    </div>
    <div class="status-badge ${statusClass(eff)}">${escapeHtml(eff)}</div>
  </div>`;
}
   function printAllBorrow() {
  const all = state.borrow || [];
  if (!all.length) { toast('ยังไม่มีรายการยืม-คืนให้พิมพ์'); return; }
  const orgName = (state.settings && state.settings.orgName) || ORG_NAME;
  const cell = 'border:1px solid #000; padding:4px 5px; vertical-align:top;';

  // จัดกลุ่ม: รออนุมัติ(0) → ค้างคืน(1) → ประวัติ(2)
  const groupOf = b => {
    if (b['สถานะ'] === 'รออนุมัติ') return 0;
    if (b['สถานะ'] === 'คืนแล้ว' || b['สถานะ'] === 'ถูกปฏิเสธ') return 2;
    return 1;
  };
  const list = [...all].sort((a, b) => {
    const g = groupOf(a) - groupOf(b);
    if (g !== 0) return g;
    if (groupOf(a) === 2) return toDate(b['วันที่ยืม'] || 0) - toDate(a['วันที่ยืม'] || 0); // ประวัติ: ล่าสุดก่อน
    return toDate(a['กำหนดคืน'] || 0) - toDate(b['กำหนดคืน'] || 0);                          // อื่นๆ: ใกล้ครบกำหนดก่อน
  });

  const cntPending = all.filter(b => groupOf(b) === 0).length;
  const activeList = all.filter(b => groupOf(b) === 1);
  const cntOverdue = activeList.filter(b => effectiveBorrowStatus(b) === 'เกินกำหนด').length;
  const cntHistory = all.filter(b => groupOf(b) === 2).length;

  const rows = list.map((b, i) => {
    const eff = effectiveBorrowStatus(b);
    const comps = borrowCompLabels(b);
    const isOver = eff === 'เกินกำหนด';
    return `<tr>
      <td style="${cell} text-align:center;">${toThaiNumber(i + 1)}</td>
      <td style="${cell}">${toThaiNumber(escapeHtml(b['ชื่อครุภัณฑ์']))}${comps.length ? `<div style="font-size:10.5pt;">ส่วนควบ: ${comps.map(x => toThaiNumber(escapeHtml(x))).join(', ')}</div>` : ''}</td>
      <td style="${cell}">${escapeHtml(b['ผู้ยืม'])}</td>
      <td style="${cell} text-align:center;">${thaiDate(b['วันที่ยืม'])}</td>
      <td style="${cell} text-align:center;">${thaiDate(b['กำหนดคืน'])}</td>
      <td style="${cell} text-align:center;">${b['วันที่คืนจริง'] ? thaiDate(b['วันที่คืนจริง']) : '-'}</td>
      <td style="${cell} text-align:center;${isOver ? ' font-weight:700;' : ''}">${escapeHtml(eff)}</td>
      <td style="${cell}">${escapeHtml(b['ผู้อนุมัติ'] || '-')}</td>
    </tr>`;
  }).join('');

  const html = `
    <style>@page{ size:A4; margin:12mm; } table{ page-break-inside:auto; } tr{ page-break-inside:avoid; } thead{ display:table-header-group; }</style>
    <div style="font-family:'TH Sarabun New','Sarabun','Kanit',sans-serif; font-size:14pt; color:#000;">
      <div style="text-align:center; font-weight:700; font-size:18pt;">รายงานรายการยืม-คืนครุภัณฑ์</div>
      <div style="text-align:center; margin-bottom:3mm;">${toThaiNumber(escapeHtml(orgName))}</div>
      <div style="margin-bottom:4mm; font-size:12.5pt;">
        ทั้งหมด ${toThaiNumber(all.length)} รายการ · รออนุมัติ ${toThaiNumber(cntPending)} · ค้างคืน ${toThaiNumber(activeList.length)} (เกินกำหนด ${toThaiNumber(cntOverdue)}) · คืนแล้ว/ถูกปฏิเสธ ${toThaiNumber(cntHistory)}
      </div>
      <table style="width:100%; border-collapse:collapse; table-layout:fixed; font-size:11.5pt;">
        <thead>
          <tr style="background:#f2f2f2; text-align:center; font-weight:700;">
            <th style="border:1px solid #000; padding:4px; width:5%;">ที่</th>
            <th style="border:1px solid #000; padding:4px; width:26%;">ครุภัณฑ์</th>
            <th style="border:1px solid #000; padding:4px; width:17%;">ผู้ยืม</th>
            <th style="border:1px solid #000; padding:4px; width:11%;">วันที่ยืม</th>
            <th style="border:1px solid #000; padding:4px; width:11%;">กำหนดคืน</th>
            <th style="border:1px solid #000; padding:4px; width:11%;">วันที่คืนจริง</th>
            <th style="border:1px solid #000; padding:4px; width:9%;">สถานะ</th>
            <th style="border:1px solid #000; padding:4px; width:10%;">ผู้อนุมัติ</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="margin-top:6mm; font-size:11pt; text-align:right;">วันที่พิมพ์รายงาน: ${escapeHtml(thaiDateLong())}</div>
    </div>`;

  const pa = document.getElementById('printArea');

function sigCanvasToPng(cv) {
  const w = cv.width, h = cv.height;
  const d = cv.getContext('2d').getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return '';
  const pad = 8;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  const sw = x1 - x0 + 1, sh = y1 - y0 + 1, k = Math.min(1, 360 / sw);
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(sw * k)); out.height = Math.max(1, Math.round(sh * k));
  out.getContext('2d').drawImage(cv, x0, y0, sw, sh, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');   // ตัดขอบว่างให้ไฟล์เล็ก พื้นหลังโปร่งใส
}
function createSigPad(cv) {
  const ctx = cv.getContext('2d');
  let drawing = false, dirty = false, last = null;
  const r0 = cv.getBoundingClientRect(), dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(r0.width * dpr); cv.height = Math.round(r0.height * dpr);
  ctx.lineWidth = 2.6 * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    drawing = true; dirty = true; last = pos(e);
    ctx.beginPath(); ctx.arc(last[0], last[1], ctx.lineWidth / 2, 0, 7); ctx.fill();
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p;
  });
  const end = () => { drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  return {
    clear() { ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; },
    png() { return dirty ? sigCanvasToPng(cv) : ''; }
  };
}
function sigFileToPng(file) {   // ไฟล์ลายเซ็นที่อัปโหลด -> PNG ขนาดเล็ก
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 500 / img.width), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.onerror = () => reject(new Error('อ่านรูปไม่สำเร็จ'));
      img.src = fr.result;
    };
    fr.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    fr.readAsDataURL(file);
  });
}
// อัปโหลดลายเซ็นขึ้น Drive "โดยไม่ผ่านการบีบเป็น JPEG" (uploadImageToDrive จะทำพื้นหลังดำ)
async function uploadSignature(v, name) {
  if (!v) return '';
  if (!/^data:image\//i.test(v)) return v;           // เป็น URL อยู่แล้ว
  const r = await gasUploadImageToDrive(v, 'sig-' + (name || 'x'));
  return r.url;                                      // PNG โปร่งใสยังคงเดิม
}

    <div id="sgDrawBox"><canvas id="sgCanvas" class="sig-canvas"></canvas><div class="hint">ใช้นิ้วหรือปากกาเซ็นในกรอบ</div></div>

        await loadAll();
        let createdBorrow = null;
        const returnedId = borrowRes && (borrowRes.id || borrowRes.borrowId || borrowRes['รหัสรายการ']);
        if (returnedId) {
          createdBorrow = state.borrow.find(b => String(b['รหัสรายการ']) === String(returnedId)) || null;
        }
        if (!createdBorrow) {
          const candidates = state.borrow.filter(b =>
            String(b['รหัสครุภัณฑ์']) === String(assetId) &&
            String(b['ผู้ยืม'] || '') === String(val('f_borrower') || '') &&
            String(b['วันที่ยืม'] || '') === String(val('f_borrowdate') || '')
          );
          createdBorrow = candidates.length ? candidates[candidates.length - 1] : null;
        }
        closeSheet();
        if (createdBorrow) {
          toast('บันทึกการยืมแล้ว — กำลังเปิดบันทึกขอเบิก-ยืม');
          openPrintMemoForm({ borrow: createdBorrow });
        } else {
          toast('บันทึกการยืมแล้ว แต่ไม่พบรายการสำหรับสร้างเอกสาร');
          renderBorrow();
        }
      } else {
        closeSheet();
        toast('ส่งคำขอยืมแล้ว รอแอดมินอนุมัติ');
        await reloadThen(renderBorrow);
      }
    } catch (err) { toast(err.message || 'ทำรายการไม่สำเร็จ'); }
    finally { setLoading(false); setButtonBusy(saveBtn, false); }
  };
}

function renderMaint() {
  const el = document.getElementById('view-maint');
  if (state.maintTab === undefined) state.maintTab = 'active';
  if (state.maintSearch === undefined) state.maintSearch = '';
  if (state.maintSort === undefined) state.maintSort = 'date_desc';
  if (state.maintView === undefined) state.maintView = getViewMode('maint');

  const pending = state.maint.filter(m => m['สถานะ'] === 'รอซ่อม');
  const active = state.maint.filter(m => m['สถานะ'] !== 'ซ่อมเสร็จ');
  const history = state.maint.filter(m => m['สถานะ'] === 'ซ่อมเสร็จ');
  const totalCost = state.maint.reduce((s, m) => s + (Number(m['ค่าใช้จ่าย(บาท)']) || 0), 0);

  const TABS = [
    { id: 'pending', label: 'รอซ่อม', count: pending.length },
    { id: 'active',  label: 'ค้างซ่อม', count: active.length },
    { id: 'history', label: 'ซ่อมเสร็จแล้ว', count: history.length }
  ];

  let list = { pending, active, history }[state.maintTab] || [];
  const q = state.maintSearch.toLowerCase();
  if (q) list = list.filter(m => String(m['ชื่อครุภัณฑ์']||'').toLowerCase().includes(q) || String(m['อาการ/ปัญหา']||'').toLowerCase().includes(q) || String(m['ผู้แจ้ง']||'').toLowerCase().includes(q));

  const [sField, sDir] = state.maintSort.split('_');
  const sMul = sDir === 'desc' ? -1 : 1;
  list = [...list].sort((a, b) => {
    if (sField === 'date') return sMul * (toDate(a['วันที่แจ้ง']||0) - toDate(b['วันที่แจ้ง']||0));
    if (sField === 'name') return sMul * String(a['ชื่อครุภัณฑ์']||'').localeCompare(String(b['ชื่อครุภัณฑ์']||''), 'th');
    if (sField === 'cost') return sMul * ((Number(a['ค่าใช้จ่าย(บาท)'])||0) - (Number(b['ค่าใช้จ่าย(บาท)'])||0));
    return 0;
  });

  const isGrid = state.maintView === 'grid';

  el.innerHTML = `
    <div class="section-title">
      งานซ่อมบำรุง <small>${active.length} รายการค้างซ่อม</small>
      <span class="section-actions">
        ${viewToggleHtml('maint', state.maintView)}
        <button class="icon-btn" id="btnExportMaint" title="ส่งออก CSV">${ICONS.download}</button>
      </span>
    </div>
    <div class="stat-grid" style="margin-bottom:14px;">
      <div class="stat-card warn"><div class="stat-num">${pending.length}</div><div class="stat-label">รอซ่อม</div></div>
      <div class="stat-card ok"><div class="stat-num">${active.length}</div><div class="stat-label">ค้างซ่อม</div></div>
      <div class="stat-card info"><div class="stat-num">${Number(totalCost).toLocaleString()}</div><div class="stat-label">ค่าใช้จ่ายสะสม (บาท)</div></div>
    </div>
    <div class="search-row">
      <input class="input" id="maintSearchInput" placeholder="ค้นหาชื่อครุภัณฑ์ อาการ หรือผู้แจ้ง..." value="${escapeHtml(state.maintSearch)}">
      <select class="input sort-select" id="maintSortSelect">
        <option value="date_desc" ${state.maintSort==='date_desc'?'selected':''}>แจ้งล่าสุดก่อน</option>
        <option value="date_asc" ${state.maintSort==='date_asc'?'selected':''}>แจ้งเก่าสุดก่อน</option>
        <option value="name_asc" ${state.maintSort==='name_asc'?'selected':''}>ชื่อครุภัณฑ์ ก-ฮ</option>
        <option value="cost_desc" ${state.maintSort==='cost_desc'?'selected':''}>ค่าใช้จ่ายมาก-น้อย</option>
      </select>
    </div>
    <div class="chip-row">
      ${TABS.map(t => `<div class="chip ${state.maintTab===t.id?'active':''}" data-mtab="${t.id}">${t.label} (${t.count})</div>`).join('')}
    </div>
    <div id="maintList" class="${isGrid ? 'asset-grid' : ''}">${list.length ? list.map(isGrid ? maintCard : maintRow).join('') : emptyState(
      state.maintTab==='pending' ? 'ไม่มีงานรอซ่อม' :
      state.maintTab==='active'  ? 'ไม่มีงานซ่อมค้าง' : 'ยังไม่มีประวัติ'
    )}</div>
  `;
  document.querySelectorAll('.maint-item').forEach(it => it.onclick = () => openMaintDetail(it.dataset.id));
  document.getElementById('btnExportMaint').onclick = () => exportCsv('ซ่อมบำรุง.csv', ['รหัสรายการ','รหัสครุภัณฑ์','ชื่อครุภัณฑ์','วันที่แจ้ง','อาการ/ปัญหา','ผู้แจ้ง','สถานะ','วันที่ซ่อมเสร็จ','ค่าใช้จ่าย(บาท)','ผู้รับผิดชอบ','หมายเหตุ'], state.maint);
  document.querySelectorAll('[data-mtab]').forEach(c => c.onclick = () => { state.maintTab = c.dataset.mtab; renderMaint(); });
  const searchInput = document.getElementById('maintSearchInput');
  searchInput.oninput = (e) => {
    state.maintSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderMaint();
    const again = document.getElementById('maintSearchInput');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
  };
  document.getElementById('maintSortSelect').onchange = (e) => { state.maintSort = e.target.value; renderMaint(); };
    wireViewToggle(renderMaint, '#view-maint', 'maintView');
  requestAnimationFrame(() => applyPremiumMotion(el));
}

   /* ---- ตัวช่วย: แปลงรายการส่วนควบที่ยืมไปกับรายการยืมหนึ่งรายการ ให้เป็นข้อความ เช่น ["แม็กกาซีน ×2", "สายสะพาย"] ---- */
function borrowCompLabels(b) {
  // parseCompRefs อยู่ใน supabase-helpers.js: "CMP-1:2,CMP-2" -> [{id:'CMP-1', n:2}, {id:'CMP-2', n:1}]
  const refs = parseCompRefs(b['รหัสส่วนควบที่ยืม']);
  return refs.map(r => {
    const c = state.components.find(x => x['รหัสส่วนควบ'] === r.id);
    const name = c ? compDisplayName(c) : r.id; // ถ้าส่วนควบถูกลบไปแล้ว ให้แสดงรหัสแทน
    return name + (r.n > 1 ? ' ×' + r.n : '');
  });
}

function confirmSheet(message, opts={}) {
  return new Promise(resolve => {
    const root = document.getElementById('modalRoot');
    if (!root) return resolve(false);
    const title = opts.title || 'ยืนยันรายการ';
    const tone = opts.tone || 'warn';
    const icon = tone === 'bad' ? ICONS.warn : (tone === 'info' ? ICONS.info : ICONS.warn);
    root.innerHTML = `<div class="overlay confirm-overlay" id="confirmOverlay"><div class="sheet confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="confirm-icon">${icon}</div><div class="confirm-title" id="confirmTitle">${escapeHtml(title)}</div><div class="confirm-message">${escapeHtml(message)}</div><div class="confirm-actions"><button class="btn btn-ghost" id="confirmNo">ยกเลิก</button><button class="btn ${tone==='bad'?'btn-danger':'btn-primary'}" id="confirmYes">${escapeHtml(opts.okText || 'ยืนยัน')}</button></div></div></div>`;
    const finish = value => { root.innerHTML=''; resolve(value); };
    document.getElementById('confirmNo').onclick = () => finish(false);
    document.getElementById('confirmYes').onclick = () => finish(true);
    document.getElementById('confirmOverlay').addEventListener('click', e => { if (e.target.id === 'confirmOverlay') finish(false); });

  });
}

let pageScrollBeforeSheet = null;
function rememberPageScroll() {
  if (pageScrollBeforeSheet === null && !document.querySelector('#modalRoot .overlay')) {

}
function restorePageScroll() {
  if (pageScrollBeforeSheet === null) return;

}
   
/* ===== ระบบซ้อนหน้า: ปิดแล้วกลับหน้าก่อนหน้า (เก็บ DOM จริง ปุ่มยังกดได้) ===== */
const sheetStack = [];   // เก็บ element ของหน้าที่ถูกซ่อนไว้

function showSheet(html, extraClass) {
  rememberPageScroll();
  const root = document.getElementById('modalRoot');
  const curOverlay = root.querySelector('.overlay');
  // ถ้ามีหน้าเปิดอยู่ (ไม่ใช่กล่องยืนยัน/ค้นหาด่วน) ให้ซ่อนไว้ใต้หน้าใหม่ ไม่ลบทิ้ง
  if (curOverlay && !curOverlay.classList.contains('confirm-overlay') && !curOverlay.classList.contains('command-overlay')) {
    curOverlay.style.display = 'none';
    curOverlay.removeAttribute('id');          // กัน id ซ้ำ
    sheetStack.push(curOverlay);
  } else {
    root.innerHTML = '';
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="overlay" id="overlayEl"><div class="sheet ${extraClass||''}">
    <button class="sheet-close" type="button" title="ปิด" aria-label="ปิด">${ICONS.close}</button>
    <div class="sheet-handle"></div>${html}</div></div>`;
  const overlay = wrap.firstElementChild;
  root.appendChild(overlay);
  overlay.querySelector('.sheet-close').addEventListener('click', closeSheet);
}

   /* เปิดหน้าที่ใช้ HTML overlay ของตัวเอง (ฟอร์มบันทึกข้อความ / ตัวแก้เอกสาร) โดยซ้อนทับหน้าเดิม */
function showRawSheet(overlayHtml) {
  rememberPageScroll();
  const root = document.getElementById('modalRoot');
  const cur = root.querySelector('.overlay');
  if (cur && !cur.classList.contains('confirm-overlay') && !cur.classList.contains('command-overlay')) {
    cur.style.display = 'none';
    cur.removeAttribute('id');
    sheetStack.push(cur);
  } else {
    root.innerHTML = '';
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = overlayHtml;
  const overlay = wrap.firstElementChild;
  root.appendChild(overlay);
  return overlay;
}

/* ปิดหน้าปัจจุบัน แล้วแสดงหน้าก่อนหน้าที่ซ่อนไว้ */
function closeSheet() {
  stopScanner();
  const root = document.getElementById('modalRoot');
  const overlays = Array.from(root.children);
  const top = overlays[overlays.length - 1];
  if (top) top.remove();
  const prev = sheetStack.pop();
  if (prev && document.body.contains(root)) {
    prev.style.display = '';
    prev.id = 'overlayEl';
    return;                                    // กลับหน้าเดิม ปุ่มต่าง ๆ ยังกดได้ตามปกติ
  }
  root.innerHTML = '';
  memoPreviewDesk = null;
  paperContainers = paperContainers.filter(c => document.body.contains(c));
  restorePageScroll();
}

/* ปิดทุกหน้าทีเดียว (ใช้ตอนต้องการล้างทั้งหมด) */
function closeAllSheets() {
  sheetStack.length = 0;
  stopScanner();
  document.getElementById('modalRoot').innerHTML = '';
  memoPreviewDesk = null;
  paperContainers = paperContainers.filter(c => document.body.contains(c));
  restorePageScroll(); 
}

/* ========================================================= PAPER (A4 บนโต๊ะ, ย่อ/ขยายอัตโนมัติ) */
const MM_PX = 96 / 25.4;
const A4_W = 210 * MM_PX, A4_H = 297 * MM_PX;
let paperContainers = [];
function registerPaper(container) { if (container && paperContainers.indexOf(container) === -1) paperContainers.push(container); }
function fitPaper(container) {
  if (!container) return;
  const sizer = container.querySelector('.paper-sizer');
  const scaleEl = container.querySelector('.paper-scale');
  const page = container.querySelector('.a4-page');
  if (!sizer || !scaleEl || !page) return;
  const pad = container.classList.contains('paper-desk') ? 32 : 0;
  const w = Math.max(80, container.clientWidth - pad);
  const scale = w / A4_W;
  scaleEl.style.transform = 'scale(' + scale + ')';
  const pageH = page.offsetHeight || A4_H;
  sizer.style.width = (A4_W * scale) + 'px';
  sizer.style.height = (pageH * scale) + 'px';
}
function refitAllPapers() {
  paperContainers = paperContainers.filter(c => document.body.contains(c));
  paperContainers.forEach(c => fitPaper(c));
}
window.addEventListener('resize', () => { clearTimeout(window._refitT); window._refitT = setTimeout(refitAllPapers, 120); });
function wrapPfDoc(innerHtml, editable) {
  return `<div class="pf-doc" id="memoDocBody" ${editable ? 'contenteditable="true" spellcheck="false"' : ''}>${thaiifyHtml(innerHtml || '')}</div>`;

function alignPfRankToName(container) {
  if (!container) return;
  const doc = container.querySelector('.pf-doc');
  const scaleEl = container.querySelector('.paper-scale');
  if (!doc || !scaleEl) return;

  // วัดจากพิกัดจริงบนหน้ากระดาษ แล้วขยับเฉพาะ "ยศ"
  // โดยไม่แตะ grid / ลายเซ็น / ชื่อ / ตำแหน่ง / วันที่
  const scale = scaleEl.offsetWidth ? (scaleEl.getBoundingClientRect().width / scaleEl.offsetWidth) : 1;
  doc.querySelectorAll('.pf-sign').forEach(sign => {
    const rank = sign.querySelector('.pf-sign-rank .pf-rank');
    const nameLine = sign.querySelector('.pf-sign-rank + div');
    if (!rank || !nameLine) return;

    // รีเซ็ตก่อนวัด เพื่อให้คำนวณซ้ำได้ถูกต้องเมื่อชื่อมีการแก้ไข
    rank.style.transform = 'translateX(0)';

    const firstText = nameLine.firstChild;
    if (!firstText || firstText.nodeType !== Node.TEXT_NODE) return;

    const range = document.createRange();
    range.setStart(firstText, 0);
    range.setEnd(firstText, Math.min(1, firstText.nodeValue.length));
    const openParenRect = range.getBoundingClientRect();
    const rankRect = rank.getBoundingClientRect();
    if (!openParenRect.width && !openParenRect.height) return;

    const delta = (openParenRect.left - rankRect.right) / (scale || 1);
    rank.style.transform = `translateX(${delta}px)`;
  });
}

function mountPaper(container, pfDocWrapperHtml) {
  if (!container) return;
  container.innerHTML = `<div class="paper-sizer"><div class="paper-scale"><div class="a4-page">${pfDocWrapperHtml}</div></div></div>`;
  registerPaper(container);
  requestAnimationFrame(() => {
    fitPaper(container);
    requestAnimationFrame(() => alignPfRankToName(container));
  });
}

  `;

  const openMemo = (m) => {
    if (!m) return;
    openMemoEditor({
      id: m['รหัสใบเบิก'],
      docHtml: m['เนื้อหาเอกสาร(HTML)'],
      borrowId: m['รหัสรายการยืม'],
      readOnly: !isAdmin()
    });
  };

  // ยกเลิก observer ของรอบวาดก่อนหน้า (กันค้างเมื่อสลับมุมมอง/วาดหน้าใหม่)
  if (drawMemos._io) { drawMemos._io.disconnect(); drawMemos._io = null; }

  if (isGrid) {
    // สร้างกระดาษ A4 ตัวอย่างเฉพาะการ์ดที่เลื่อนมาใกล้จอ ไม่สร้างทุกใบพร้อมกัน
    const mountThumb = (card) => {
      const m = list.find(x => x['รหัสใบเบิก'] === card.dataset.id);
      const thumb = card.querySelector('[data-thumb]');
      if (m && thumb && !thumb.dataset.mounted) {
        thumb.dataset.mounted = '1';
        mountPaper(thumb, wrapPfDoc(m['เนื้อหาเอกสาร(HTML)'], false));
      }
    };

    let io = null;
    if ('IntersectionObserver' in window) {
      io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          io.unobserve(en.target);
          mountThumb(en.target);
        });
      }, { rootMargin: '400px' });
      drawMemos._io = io;
    }

    document.querySelectorAll('.memo-card').forEach(card => {
      const m = list.find(x => x['รหัสใบเบิก'] === card.dataset.id);
      if (io) io.observe(card);
      else mountThumb(card);   // เบราว์เซอร์เก่าที่ไม่มี IntersectionObserver
      card.onclick = () => openMemo(m);
    });
  } else {
    document.querySelectorAll('.memo-row').forEach(row => {
      const m = list.find(x => x['รหัสใบเบิก'] === row.dataset.id);
      row.onclick = () => openMemo(m);
    });
  }

  wireViewToggle(drawMemos, '#view-memos', 'memosView');
}

/* ---------- เปิดหน้าเอกสารเพื่อแก้ไขจริง / พิมพ์ / บันทึก ---------- */
function openMemoEditor(opts) {
  const isNew = !opts.id;
  const readOnly = !!opts.readOnly && !isAdmin();
    showRawSheet(`<div class="overlay" id="overlayEl">
    <div class="sheet memo-doc-sheet">
      <button class="sheet-close" id="sheetCloseBtn" type="button" title="ปิด" aria-label="ปิด">${ICONS.close}</button>
      <div class="sheet-handle"></div>
      <div class="sheet-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span>เอกสารบันทึกข้อความ</span><span class="doc-dirty" id="docDirty">ยังไม่บันทึก</span>
      </div>
      <div class="doc-toolbar">
        <div class="hint">${readOnly ? 'โหมดดูอย่างเดียว — เอกสารนี้ไม่สามารถแก้ไขหรือลบได้' : 'แตะข้อความในเอกสารเพื่อแก้ไขได้โดยตรง เหมือนพิมพ์ทับเอกสารจริง'}</div>
        <div class="zoom-ctl">
          <button class="zbtn" id="zOut" type="button">−</button>
          <span class="zoom-lbl" id="zLbl">100%</span>
          <button class="zbtn" id="zIn" type="button">+</button>
          <button class="zbtn" id="zFit" type="button">พอดี</button>
        </div>
      </div>
      <div class="paper-desk" id="memoPaperDesk"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="btnMemoClose">ปิด</button>
        ${!isNew && isAdmin() && !readOnly ? `<button class="btn btn-danger" id="btnMemoDelete">ลบเอกสาร</button>` : ''}
        <button class="btn btn-ghost" id="btnMemoPrint">พิมพ์</button>
        ${!readOnly ? `<button class="btn btn-primary" id="btnMemoSave">บันทึกเอกสาร</button>` : ''}
      </div>
    </div>
  </div>`);
  document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
  document.getElementById('btnMemoClose').onclick = closeSheet;

  const desk = document.getElementById('memoPaperDesk');
  mountPaper(desk, wrapPfDoc(opts.docHtml, !readOnly));
  registerPaper(desk);
  let userZoom = null;
  function applyZoom() {
    const scaleEl = desk.querySelector('.paper-scale');
    const sizer = desk.querySelector('.paper-sizer');
    const page = desk.querySelector('.a4-page');
    if (!scaleEl || !sizer || !page) return;
    if (userZoom === null) {
      fitPaper(desk);
      document.getElementById('zLbl').textContent = Math.round(((desk.clientWidth - 32) / A4_W) * 100) + '%';
      return;
    }
    scaleEl.style.transform = 'scale(' + userZoom + ')';
    sizer.style.width = (A4_W * userZoom) + 'px';
    sizer.style.height = ((page.offsetHeight || A4_H) * userZoom) + 'px';
    document.getElementById('zLbl').textContent = Math.round(userZoom * 100) + '%';
  }
  document.getElementById('zIn').onclick = () => { userZoom = Math.min(2, (userZoom ?? ((desk.clientWidth - 32) / A4_W)) + 0.1); applyZoom(); };
  document.getElementById('zOut').onclick = () => { userZoom = Math.max(0.3, (userZoom ?? ((desk.clientWidth - 32) / A4_W)) - 0.1); applyZoom(); };
  document.getElementById('zFit').onclick = () => { userZoom = null; applyZoom(); };

  const getBody = () => document.getElementById('memoDocBody');
   let docNoCommitted = !isNew;   // เอกสารเก่าไม่ต้องนับเลขซ้ำ
const commitDocNoOnce = () => {
  if (docNoCommitted) return;
  docNoCommitted = true;
  const e = document.getElementById('ed_docno');
  if (e) commitDocNo(e.textContent.trim());
};
  const dirtyEl = document.getElementById('docDirty');
  if (!readOnly) desk.addEventListener('input', () => {
    dirtyEl.classList.add('show');
    requestAnimationFrame(() => alignPfRankToName(desk));
  });
  requestAnimationFrame(() => alignPfRankToName(desk));

// พิมพ์เลขอารบิกลงในเอกสาร -> แปลงเป็นเลขไทยทันที (ตอนออกจากช่องที่กำลังแก้)
desk.addEventListener('focusout', () => {
  const b = document.getElementById('memoDocBody');
  if (!b) return;
  const walker = document.createTreeWalker(b, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    const t = toThaiNumber(n.nodeValue);
    if (t !== n.nodeValue) n.nodeValue = t;
  }
});

  document.getElementById('btnMemoPrint').onclick = () => {
  commitDocNoOnce();  
  const b = getBody();
  if (b) document.getElementById('printArea').innerHTML = thaiifyHtml(b.outerHTML);
  triggerPrint(() => { document.getElementById('printArea').innerHTML = ''; });
};
  const saveMemoBtn = document.getElementById('btnMemoSave');
  if (saveMemoBtn) saveMemoBtn.onclick = async () => {
    const b = getBody();
    if (!b) { toast('ไม่พบเนื้อหาเอกสาร'); return; }
    const g = (id) => { const e = document.getElementById(id); return e ? e.textContent.trim() : ''; };
    const payload = {
      id: opts.id || undefined,
      subject: g('ed_subject') || 'ไม่ระบุเรื่อง',
      docNo: g('ed_docno'),
      // ฐานข้อมูลเก็บวันที่มาตรฐาน ISO; ตัว HTML ของเอกสารยังแสดงเลขไทยตามรูปแบบเดิม
      docDate: normalizeDocumentDateForDb(g('ed_docdate')),
      requesterName: g('ed_reqname') || g('ed_reqname2'),
      html: thaiifyHtml(b.innerHTML),
      borrowId: opts.borrowId || '',
      status: 'บันทึกแล้ว'
    };
    const btn = document.getElementById('btnMemoSave'); if (!btn || btn.disabled) return; setButtonBusy(btn, true, 'กำลังบันทึก...'); setLoading(true, 'กำลังบันทึกเอกสาร...');
    try {
      const res = await apiPost(isNew ? 'addMemo' : 'updateMemo', payload);
      if (isNew && res && res.id) opts.id = res.id;
      commitDocNoOnce();
      dirtyEl.classList.remove('show');
      toast('บันทึกเอกสารแล้ว');
      await reloadThen(() => { if (state.tab === 'memos') renderMemos(); });
    } catch (err) { toast(err.message || 'บันทึกเอกสารไม่สำเร็จ'); }
    finally { setLoading(false); setButtonBusy(btn, false); }
  };
  if (!isNew && isAdmin()) {
    document.getElementById('btnMemoDelete').onclick = async () => {
      if (!await confirmSheet('ยืนยันการลบเอกสารนี้?', {title:'ลบเอกสาร', okText:'ลบเอกสาร', tone:'bad'})) return;
      try { await apiPost('deleteMemo', { id: opts.id }); closeSheet(); toast('ลบเอกสารแล้ว'); await reloadThen(() => { if (state.tab === 'memos') renderMemos(); }); }
      catch (err) { toast(err.message || 'ลบไม่สำเร็จ'); }
    };
  }
}

      qty: 1,
      unit: unitForCategory(asset ? asset['หมวดหมู่'] : '')
    }];
  }
  if (opts.items) return opts.items.map(a => ({ id: a['รหัสครุภัณฑ์'] || '', name: a['ชื่อครุภัณฑ์'] || '', brand: a['ยี่ห้อ/รุ่น'] || '', serial: a['หมายเลขเครื่อง'] || '', qty: 1, unit: unitForCategory(a['หมวดหมู่']) }));
  return [{ id: '', name: '', brand: '', serial: '', qty: 1, unit: 'เครื่อง' }];

function itemPhraseList(items) {
  const phrases = items.map(it => {
    let p = escapeHtml(it.name);
    if (it.brand) p += ' ยี่ห้อ ' + escapeHtml(it.brand);
    p += ' จำนวน ' + toThaiNumber(it.qty || 1) + ' ' + escapeHtml(it.unit || 'เครื่อง');
    if (it.serial) p += ' หมายเลข SN ' + toThaiNumber(it.serial); // แปลง Serial เป็นเลขไทย
    return p;
  });
  if (!phrases.length) return '';
  if (phrases.length === 1) return phrases[0];
  return phrases.slice(0, -1).join(', ') + ' และ' + phrases[phrases.length - 1];
}

let memoPreviewDesk = null;

  clearTimeout(refreshMemoLivePreview._t);

    if (!memoPreviewDesk || !document.body.contains(memoPreviewDesk)) return;
    if (!memoPreviewDesk.offsetParent) return;
    const run = () => {

      const memo = collectMemoFormData();
      mountPaper(memoPreviewDesk, wrapPfDoc(buildMemoBodyHtml(memo), false));
    };
    if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 600 });
    else run();
  }, 300);
}
   
/* ---------- เลขหนังสือรันอัตโนมัติ ---------- */
function thaiToArabic(s) {
  return String(s == null ? '' : s).replace(/[๐-๙]/g, d => '๐๑๒๓๔๕๖๗๘๙'.indexOf(d));
}
function nextDocNo() {
  const n = parseInt(state.settings && state.settings.docNoNext, 10);
  return (isFinite(n) && n > 0) ? n : '';
}
// เรียกหลังใช้เลขหนังสือแล้ว: ถ้าเลขที่ใช้ >= เลขถัดไป ให้เลื่อนเป็นเลขที่ใช้ + 1
async function commitDocNo(docNoText) {
  const pre  = thaiToArabic((state.settings && state.settings.docNoPrefix) || '').replace(/\s+/g, '');
  const full = thaiToArabic(docNoText).replace(/\s+/g, '');
  if (!full.startsWith(pre)) return;
  const m = /^(\d+)$/.exec(full.slice(pre.length));
  if (!m) return;                       // ไม่ใช่เลขล้วน เช่น ช่องว่าง/จุดไข่ปลา
  const used = parseInt(m[1], 10);
  if (used < (Number(nextDocNo()) || 0)) return;   // ใช้เลขย้อนหลัง ไม่ถอยเลขถัดไป
  const next = String(used + 1);
  try {
    await apiPost('updateSystemSettings', { docNoNext: next });
    state.settings.docNoNext = next;
  } catch (e) { console.warn('อัปเดตเลขหนังสือถัดไปไม่สำเร็จ', e); }
}

function wireSignerCard(prefix, label) {

  const findOfficer = () => { const i = findOfficerIndexByName(fullName()); return i !== '' ? state.users[Number(i)] : null; };
  const setSig = v => {
    $('Sig').value = v;
    $('SigIcon').innerHTML = v ? `<img src="${v}" style="width:100%;height:100%;object-fit:contain;">` : ICONS.edit;
    $('SigTitle').textContent = v ? 'เซ็นแล้ว (แตะเพื่อเซ็นใหม่)' : 'ลายเซ็น (ไม่บังคับ)';
  };

  $('Trigger').onclick = () => openOfficerPickerSheet(fullName(), (name, u) => {
    if (name !== fullName()) setSig('');                 // เปลี่ยนคน = ลายเซ็นเดิมใช้ไม่ได้
    let rank, nm, pos;
    if (u) { rank = u['ยศ'] || ''; nm = u['ชื่อ-สกุล'] || ''; pos = u['ตำแหน่ง'] || ''; }
    else { const s = splitRankName(name); rank = s.rank; nm = s.name; pos = ''; }

    $('Icon').innerHTML = (u && u['รูปถ่าย'])
      ? `<img src="${u['รูปถ่าย']}" style="width:100%;height:100%;object-fit:cover;border-radius:13px;">` : ICONS.user;

function rpMonthKey(v) { const d = toDate(v); if (isNaN(d)) return ''; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function rpLastMonths(n) {
  const out = [], now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push({ key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), label: TH_MONTHS_ABBR[d.getMonth()] });
  }
  return out;
}
function rpInPeriod(v) {
  const p = state.rpPeriod || 'all';
  if (p === 'all') return true;
  const d = toDate(v);
  return !isNaN(d) && (Date.now() - d.getTime()) <= Number(p) * 86400000;
}
function rpActiveBorrow(b) { return !['คืนแล้ว', 'รออนุมัติ', 'ถูกปฏิเสธ'].includes(b['สถานะ']); }
function rpTop(list, keyFn, n) {
  const m = {};
  list.forEach(x => { const k = keyFn(x); if (k) m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, n);
}
function rpKpi(num, label, cls, sub) {
  return `<div class="glass rp-kpi ${cls || ''}"><div class="k-num">${num}</div><div class="k-label">${label}</div>${sub ? `<div class="k-sub">${sub}</div>` : ''}</div>`;
}
function rpBars(items, denom) {
  if (!items.length) return '<div class="hint" style="margin-top:0;">ไม่มีข้อมูล</div>';
  return items.map(it => {
    const w = denom ? Math.min(100, Math.round(it.n / denom * 100)) : 0;
    return `<div class="rp-bar-row"><div class="rp-bar-head"><span>${escapeHtml(it.label)}</span><span><b>${Number(it.n).toLocaleString()}</b>${it.note ? ` <small>${it.note}</small>` : ''}</span></div><div class="rp-track"><div class="rp-fill ${it.cls || ''}" style="width:${w}%"></div></div></div>`;
  }).join('');
}
function rpTable(cols, rows, foot) {
  if (!rows.length) return '<div class="hint" style="margin-top:0;">ไม่มีข้อมูล</div>';
  const cls = i => cols[i][1] ? 'num' : '';
  return `<div class="rp-table-wrap"><table class="rp-table">
    <thead><tr>${cols.map(c => `<th class="${c[1] ? 'num' : ''}">${c[0]}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${cls(i)}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
    ${foot ? `<tfoot><tr>${foot.map((c, i) => `<td class="${cls(i)}">${c}</td>`).join('')}</tr></tfoot>` : ''}
  </table></div>`;
}

function rpOverview(body) {
  const A = state.assets, total = A.length;
  const cnt = s => A.filter(a => a['สถานะ'] === s).length;
  const value = A.reduce((s, a) => s + (Number(a['มูลค่า(บาท)']) || 0), 0);
  const ready = cnt('พร้อมใช้งาน'), readyPct = total ? Math.round(ready / total * 100) : 0;
  const active = state.borrow.filter(rpActiveBorrow);
  const overdue = active.filter(b => effectiveBorrowStatus(b) === 'เกินกำหนด').length;
  const pending = state.borrow.filter(b => b['สถานะ'] === 'รออนุมัติ').length;
  const openMaint = state.maint.filter(m => m['สถานะ'] !== 'ซ่อมเสร็จ').length;
  const win = renewalWindowDays();
  const renewals = A.filter(a => { const d = daysUntil(a['วันครบกำหนดตรวจสภาพ/ต่อทะเบียน']); return d !== null && d <= win && a['สถานะ'] !== 'จำหน่ายแล้ว'; }).length;

  const alerts = [];
  if (overdue) alerts.push(['bad', ICONS.warn, `มีครุภัณฑ์เกินกำหนดคืน ${overdue} รายการ`, 'borrow', 'ดูรายการ']);
  if (isAdmin() && pending) alerts.push(['warn', ICONS.clock, `มีคำขอยืมรออนุมัติ ${pending} รายการ`, 'borrow', 'ตรวจสอบ']);

const RP_VEHICLE_TYPES = [
  ['รถวิทยุ', /วิทยุ/],
  ['รถกระบะ', /กระบะ/],
  ['รถจักรยานยนต์', /จักรยานยนต์|มอเตอร์ไซ/],
  ['รถตู้', /รถตู้/],
  ['รถบรรทุก', /บรรทุก/],
  ['รถเก๋ง/ซีดาน', /เก๋ง|ซีดาน/],
  ['รถอเนกประสงค์ (SUV/PPV)', /SUV|PPV|อเนกประสงค์/i]
];
function rpNameKey(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' '); }
function rpVehicleType(a) {
  const t = [a['ชื่อครุภัณฑ์'], a['ยี่ห้อ/รุ่น'], a['หมายเหตุ']].join(' ');
  for (const [name, re] of RP_VEHICLE_TYPES) if (re.test(t)) return name;
  return rpNameKey(a['ชื่อครุภัณฑ์']) || 'ไม่ระบุ';
}
function rpGroup(list, keyFn) {
  const m = new Map();
  list.forEach(a => {
    const k = keyFn(a);
    if (!m.has(k)) m.set(k, { key: k, cats: new Set(), n: 0, r: 0, b: 0, m: 0, d: 0, v: 0 });
    const g = m.get(k);
    g.n++; g.v += Number(a['มูลค่า(บาท)']) || 0;
    if (a['หมวดหมู่']) g.cats.add(a['หมวดหมู่']);
    const s = a['สถานะ'];
    if (s === 'พร้อมใช้งาน') g.r++;
    else if (s === 'กำลังยืม') g.b++;
    else if (s === 'ซ่อมบำรุง') g.m++;
    else if (s === 'จำหน่ายแล้ว') g.d++;
  });
  return Array.from(m.values()).sort((x, y) => y.n - x.n || x.key.localeCompare(y.key, 'th'));
}

  let onTime = 0, dayList = [];
  returned.forEach(b => {
    const due = toDate(b['กำหนดคืน']), ret = toDate(b['วันที่คืนจริง']), out = toDate(b['วันที่ยืม']);
    if (!isNaN(due) && !isNaN(ret) && ret.setHours(0, 0, 0, 0) <= due.setHours(0, 0, 0, 0)) onTime++;
    const r2 = toDate(b['วันที่คืนจริง']);
    if (!isNaN(r2) && !isNaN(out)) dayList.push((r2 - out) / 86400000);
  });
  const onTimePct = returned.length ? Math.round(onTime / returned.length * 100) : null;
  const avgDays = dayList.length ? (dayList.reduce((s, x) => s + x, 0) / dayList.length).toFixed(1) : null;
  const overdueAll = state.borrow.filter(b => rpActiveBorrow(b) && effectiveBorrowStatus(b) === 'เกินกำหนด')
    .map(b => ({ b, days: -daysUntil(b['กำหนดคืน']) })).sort((x, y) => y.days - x.days);
  const topPeople = rpTop(P, b => b['ผู้ยืม'], 8), topAssets = rpTop(P, b => b['ชื่อครุภัณฑ์'], 8);
  const trend = {};
  rpLastMonths(6).forEach(m => trend[m.key] = 0);
  state.borrow.forEach(b => { const k = rpMonthKey(b['วันที่ยืม']); if (k in trend) trend[k]++; });

  body.innerHTML = `
    <div class="rp-kpis">
      ${rpKpi(P.length.toLocaleString(), 'รายการยืมในช่วงนี้', '')}
      ${rpKpi(stillOut.length, 'ยังไม่คืน', 'warn')}
      ${rpKpi(returned.length, 'คืนแล้ว', 'ok')}
      ${rpKpi(overdueAll.length, 'ค้างเกินกำหนด (ทั้งระบบ)', overdueAll.length ? 'bad' : '')}
      ${rpKpi(onTimePct === null ? '-' : onTimePct + '%', 'คืนตรงเวลา', onTimePct !== null && onTimePct < 80 ? 'warn' : 'ok', returned.length ? onTime + ' จาก ' + returned.length + ' รายการ' : '')}
      ${rpKpi(avgDays === null ? '-' : avgDays, 'ระยะเวลายืมเฉลี่ย (วัน)', 'info')}
    </div>
    <div class="glass rp-card"><h4>รายการค้างเกินกำหนดคืน <small>เรียงจากเกินนานที่สุด</small></h4>
      ${rpTable([['ผู้ยืม'], ['ครุภัณฑ์'], ['กำหนดคืน'], ['เกิน', 1]],
        overdueAll.map(x => [escapeHtml(x.b['ผู้ยืม']), escapeHtml(x.b['ชื่อครุภัณฑ์']), systemDate(x.b['กำหนดคืน']), `<span class="status-badge status-overdue">${x.days} วัน</span>`]))}
    </div>
    <div class="rp-grid2">
      <div class="glass rp-card"><h4>ผู้ยืมบ่อยที่สุด <small>ครั้ง</small></h4>${rpBars(topPeople.map(x => ({ label: x[0], n: x[1] })), topPeople.length ? topPeople[0][1] : 0)}</div>
      <div class="glass rp-card"><h4>ครุภัณฑ์ถูกยืมบ่อยที่สุด <small>ครั้ง</small></h4>${rpBars(topAssets.map(x => ({ label: x[0], n: x[1], cls: 'gold' })), topAssets.length ? topAssets[0][1] : 0)}</div>
    </div>
    <div class="glass rp-card"><h4>แนวโน้มการยืมย้อนหลัง 6 เดือน</h4><div class="chart-wrap"><canvas id="rpBorrowTrend"></canvas></div></div>
    <div class="btn-row" style="margin-top:0;"><button class="btn btn-ghost" id="btnRpExportBorrow">ส่งออกรายการยืม-คืนช่วงนี้ (CSV)</button></div>`;
  drawLine('rpBorrowTrend', trend);
  document.getElementById('btnRpExportBorrow').onclick = () => exportCsv('ยืมคืน.csv', ['รหัสรายการ', 'รหัสครุภัณฑ์', 'ชื่อครุภัณฑ์', 'ผู้ยืม', 'วันที่ยืม', 'กำหนดคืน', 'วันที่คืนจริง', 'สถานะ', 'ผู้อนุมัติ', 'หมายเหตุ'], P);
}

/* ---------- แท็บ: ซ่อมบำรุง ---------- */
function rpMaint(body) {
  const M = state.maint.filter(m => rpInPeriod(m['วันที่แจ้ง']));
  const cost = m => Number(m['ค่าใช้จ่าย(บาท)']) || 0;
  const done = M.filter(m => m['สถานะ'] === 'ซ่อมเสร็จ'), open = M.filter(m => m['สถานะ'] !== 'ซ่อมเสร็จ');
  const totalCost = M.reduce((s, m) => s + cost(m), 0);
  const costed = M.filter(m => cost(m) > 0);
  const avgCost = costed.length ? Math.round(totalCost / costed.length) : 0;
  const byAsset = {};
  M.forEach(m => { const k = m['ชื่อครุภัณฑ์'] || 'ไม่ระบุ'; (byAsset[k] = byAsset[k] || { n: 0, c: 0 }); byAsset[k].n++; byAsset[k].c += cost(m); });
  const topAssets = Object.entries(byAsset).sort((a, b) => b[1].c - a[1].c || b[1].n - a[1].n).slice(0, 8);
  const openList = open.map(m => ({ m, wait: -daysUntil(m['วันที่แจ้ง']) })).sort((x, y) => y.wait - x.wait);
  const monthCost = {};
  const months = rpLastMonths(6);
  months.forEach(x => monthCost[x.key] = 0);
  state.maint.forEach(m => { const k = rpMonthKey(m['วันที่ซ่อมเสร็จ'] || m['วันที่แจ้ง']); if (k in monthCost) monthCost[k] += cost(m); });
  const barObj = {};
  months.forEach(x => barObj[x.label] = monthCost[x.key]);
  const st = s => M.filter(m => m['สถานะ'] === s).length;

  body.innerHTML = `
    <div class="rp-kpis">
      ${rpKpi(M.length, 'งานซ่อมในช่วงนี้', '')}
      ${rpKpi(open.length, 'ค้างซ่อม', open.length ? 'warn' : '')}
      ${rpKpi(done.length, 'ซ่อมเสร็จแล้ว', 'ok')}
      ${rpKpi(totalCost.toLocaleString(), 'ค่าใช้จ่ายรวม (บาท)', 'gold')}
      ${rpKpi(avgCost.toLocaleString(), 'ค่าใช้จ่ายเฉลี่ยต่องาน (บาท)', 'info', costed.length ? 'จาก ' + costed.length + ' งานที่ระบุราคา' : '')}
    </div>
    <div class="rp-grid2">
      <div class="glass rp-card"><h4>สถานะงานซ่อม</h4>
        ${rpBars(['รอซ่อม', 'กำลังซ่อม', 'ซ่อมเสร็จ'].map(s => ({ label: s, n: st(s), cls: RP_STATUS_CLS[s], note: '(' + (M.length ? Math.round(st(s) / M.length * 100) : 0) + '%)' })), M.length)}
      </div>
      <div class="glass rp-card"><h4>ค่าใช้จ่ายรายเดือน <small>6 เดือนล่าสุด (บาท)</small></h4><div class="chart-wrap"><canvas id="rpMaintCost"></canvas></div></div>
    </div>
    <div class="glass rp-card"><h4>งานที่ยังค้างอยู่ <small>เรียงจากรอนานที่สุด</small></h4>
      ${rpTable([['ครุภัณฑ์'], ['อาการ/ปัญหา'], ['แจ้งเมื่อ'], ['สถานะ'], ['รอมา', 1]],
        openList.map(x => [escapeHtml(x.m['ชื่อครุภัณฑ์']), escapeHtml(x.m['อาการ/ปัญหา']), systemDate(x.m['วันที่แจ้ง']),
          `<span class="status-badge ${statusClass(x.m['สถานะ'])}">${escapeHtml(x.m['สถานะ'])}</span>`, x.wait + ' วัน']))}
    </div>
    <div class="glass rp-card"><h4>ครุภัณฑ์ที่ซ่อมบ่อย/ค่าใช้จ่ายสูง <small>8 อันดับ</small></h4>
      ${rpTable([['ครุภัณฑ์'], ['จำนวนครั้ง', 1], ['ค่าใช้จ่าย (บาท)', 1]], topAssets.map(x => [escapeHtml(x[0]), x[1].n, x[1].c.toLocaleString()]))}
    </div>
    <div class="btn-row" style="margin-top:0;"><button class="btn btn-ghost" id="btnRpExportMaint">ส่งออกงานซ่อมช่วงนี้ (CSV)</button></div>`;
  drawBar('rpMaintCost', barObj);
  document.getElementById('btnRpExportMaint').onclick = () => exportCsv('ซ่อมบำรุง.csv', ['รหัสรายการ', 'รหัสครุภัณฑ์', 'ชื่อครุภัณฑ์', 'วันที่แจ้ง', 'อาการ/ปัญหา', 'ผู้แจ้ง', 'สถานะ', 'วันที่ซ่อมเสร็จ', 'ค่าใช้จ่าย(บาท)', 'ผู้รับผิดชอบ', 'หมายเหตุ'], M);
}

async function renderAudit() {
  if (!isAdmin()) return;
  const el = document.getElementById('view-audit');
  el.innerHTML = emptyState('กำลังโหลดข้อมูลการตรวจนับ...');
  try {
    const records = await apiGet('getAuditRecords', { year: state.auditYear, token: state.sessionToken });
    state.auditRecords = records || [];
  } catch (err) {
    state.auditRecords = [];
    toast('โหลดข้อมูลตรวจนับไม่สำเร็จ: ' + (err.message || ''));
  }
  drawAuditView();
}
function auditRecordFor(assetId) { return state.auditRecords.find(r => r['รหัสครุภัณฑ์'] === assetId); }
function auditIsChecked(a) {
  const r = auditRecordFor(a['รหัสครุภัณฑ์']);
  return !!(r && r['ผล'] && r['ผล'] !== 'ยังไม่ตรวจ');
}

  function auditYearOptions() {
  const now = new Date().getFullYear();
  const years = [];
  for (let y = now; y >= now - 4; y--) years.push(y);
  if (!years.includes(state.auditYear)) years.unshift(state.auditYear);
  return years.map(y => `<option value="${y}" ${y === state.auditYear ? 'selected' : ''}>พ.ศ. ${y + 543}</option>`).join('');
}
   
function drawAuditView() {
  const el = document.getElementById('view-audit');
  if (state.auditCat === undefined) state.auditCat = 'all';
  if (state.auditPending === undefined) state.auditPending = false;

  const total = state.assets.length;
  const checked = state.assets.filter(auditIsChecked).length;
  const pct = total ? Math.round((checked / total) * 100) : 0;

  // สถิติแยกตามหมวด (แสดงเฉพาะหมวดที่มีครุภัณฑ์)
  const catStats = getCategories().map(c => {
    const list = state.assets.filter(a => a['หมวดหมู่'] === c);
    return { name: c, total: list.length, done: list.filter(auditIsChecked).length };
  }).filter(s => s.total > 0);

  // รายการที่จะแสดงตามตัวกรอง
  let list = state.assets.filter(a => state.auditCat === 'all' || a['หมวดหมู่'] === state.auditCat);
  const catTotal = list.length;
  const catDone = list.filter(auditIsChecked).length;
  const catPct = catTotal ? Math.round((catDone / catTotal) * 100) : 0;
  if (state.auditPending) list = list.filter(a => !auditIsChecked(a));

  const showVehicleBtn = state.auditCat === 'all' || state.auditCat === 'ยานพาหนะ';
  const emptyMsg = state.auditPending
    ? 'ตรวจครบทุกรายการในหมวดนี้แล้ว 🎉'
    : 'ยังไม่มีครุภัณฑ์ในหมวดนี้';

  el.innerHTML = `
     <div class="section-title">ตรวจนับพัสดุประจำปี
      <span class="section-actions"><select class="input sort-select" id="auditYearSelect" style="min-width:130px;">${auditYearOptions()}</select></span>
    </div>

    <div class="glass" style="padding:18px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px;">
        <span>ความคืบหน้ารวมทั้งระบบ</span><span>${checked} / ${total} รายการ (${pct}%)</span>
      </div>
      <div class="audit-progress-track"><div class="audit-progress-fill" style="width:${pct}%;"></div></div>
     <div class="btn-row">
     <button class="btn btn-ok" id="btnBulkAudit">ตรวจนับหลายรายการพร้อมกัน</button>
     <button class="btn btn-danger" id="btnClearAuditAll">ล้างผลตรวจทั้งหมด</button>
     <button class="btn btn-ghost" id="btnClearAuditSelected">ล้างผลตรวจเฉพาะรายการ</button>
     <button class="btn btn-primary" id="btnPrintOfficialGeneral">พิมพ์รายงานครุภัณฑ์ทั่วไป (แบบราชการ)</button>
     ${state.assets.some(a => a['หมวดหมู่'] === 'สื่อสาร') ? `<button class="btn btn-ghost" id="btnPrintCommsReport">พิมพ์รายงานเครื่องมือสื่อสาร</button>` : ''}
     ${showVehicleBtn ? `<button class="btn btn-ghost" id="btnPrintVehicleReport">พิมพ์แบบ บชก.3 (ยานพาหนะ)</button>` : ''}
      </div>
    </div>

    <div class="chip-row">
      <div class="chip ${state.auditCat === 'all' ? 'active' : ''}" data-acat="all">ทั้งหมด ${checked}/${total}</div>
      ${catStats.map(s => `
        <div class="chip ${state.auditCat === s.name ? 'active' : ''}" data-acat="${escapeHtml(s.name)}">
          ${escapeHtml(s.name)} ${s.done}/${s.total}${s.done === s.total ? ' ✓' : ''}
        </div>`).join('')}
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
      <div class="chip ${state.auditPending ? 'active' : ''}" id="auditPendingChip">เฉพาะที่ยังไม่ตรวจ</div>
      <span class="hint" style="margin:0;">
        ${state.auditCat === 'all' ? 'ทุกหมวด' : escapeHtml(state.auditCat)}: ตรวจแล้ว ${catDone}/${catTotal} (${catPct}%)
      </span>
    </div>
    <div class="audit-progress-track" style="margin-bottom:14px;"><div class="audit-progress-fill" style="width:${catPct}%;"></div></div>

    <div id="auditList">${list.length ? list.map(auditRow).join('') : emptyState(emptyMsg)}</div>
  `;

  document.querySelectorAll('[data-acat]').forEach(c => c.onclick = () => {
    state.auditCat = c.dataset.acat;
    drawAuditView();
  });
  document.getElementById('auditPendingChip').onclick = () => {
    state.auditPending = !state.auditPending;
    drawAuditView();
  };
  document.querySelectorAll('.audit-btn[data-status]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    setAuditStatus(b.dataset.id, b.dataset.status);
  });
  document.getElementById('btnPrintOfficialGeneral').onclick = printOfficialGeneralReport;
     document.getElementById('btnBulkAudit').onclick = openBulkAuditModal;
     document.getElementById('btnClearAuditAll').onclick = clearAllAuditResults;
     document.getElementById('btnClearAuditSelected').onclick = () => openBulkAuditModal('clear');
     const commsBtn = document.getElementById('btnPrintCommsReport');
     if (commsBtn) commsBtn.onclick = printCommsAuditReport;
     const vBtn = document.getElementById('btnPrintVehicleReport');
     if (vBtn) vBtn.onclick = printVehicleAuditReport;
  document.querySelectorAll('[data-vehicle-audit]').forEach(x => x.onclick = () => openVehicleAuditForm(x.dataset.vehicleAudit));
  document.getElementById('auditYearSelect').onchange = (e) => { state.auditYear = Number(e.target.value); renderAudit(); };
}
   
function auditRow(a) {
  const rec = auditRecordFor(a['รหัสครุภัณฑ์']);
  const status = rec ? rec['ผล'] : 'ยังไม่ตรวจ';
  const cls = { 'พบปกติ': 'status-ready', 'ชำรุด': 'status-repair', 'สูญหาย': 'status-overdue', 'ยังไม่ตรวจ': 'status-disposed' }[status] || '';
  const isVehicle = a['หมวดหมู่'] === 'ยานพาหนะ';
  return `<div class="glass list-item" style="cursor:${isVehicle?'pointer':'default'};" ${isVehicle ? `data-vehicle-audit="${escapeHtml(a['รหัสครุภัณฑ์'])}"` : ''}>
    <div class="li-icon">${catIcon(a['หมวดหมู่'])}</div>
    <div class="li-body"><div class="li-title">${escapeHtml(a['ชื่อครุภัณฑ์'])}</div><div class="li-sub">${escapeHtml(a['ทะเบียนรถ']||a['รหัสครุภัณฑ์'])}</div></div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
      <span class="status-badge ${cls}">${status}</span>
      ${isVehicle ? `<span class="hint" style="margin:0;">แตะเพื่อกรอกผลตรวจ →</span>` : `
      <div class="audit-btn-row">
        <button class="audit-btn ok ${status==='พบปกติ'?'active-ok':''}" data-id="${escapeHtml(a['รหัสครุภัณฑ์'])}" data-status="พบปกติ">พบปกติ</button>
        <button class="audit-btn warn ${status==='ชำรุด'?'active-warn':''}" data-id="${escapeHtml(a['รหัสครุภัณฑ์'])}" data-status="ชำรุด">ชำรุด</button>
        <button class="audit-btn bad ${status==='สูญหาย'?'active-bad':''}" data-id="${escapeHtml(a['รหัสครุภัณฑ์'])}" data-status="สูญหาย">สูญหาย</button>
      </div>`}
    </div>
  </div>`;
}
function openBulkAuditModal(action = 'set') {
  const clearMode = action === 'clear';
  const selected = new Set();
  let bCat = 'all', bQ = '', bPendingOnly = !clearMode;
  const root = document.createElement('div');
  root.className = 'bulk-audit-modal-root';
  root.style.position = 'relative';
  root.style.zIndex = '90';
  document.body.appendChild(root);

  function filteredList() {
    let list = state.assets.filter(a => bCat === 'all' || a['หมวดหมู่'] === bCat);
    const q = bQ.toLowerCase();
    if (q) list = list.filter(a => String(a['ชื่อครุภัณฑ์']||'').toLowerCase().includes(q) || String(a['รหัสครุภัณฑ์']||'').toLowerCase().includes(q));
    if (clearMode) list = list.filter(a => auditIsChecked(a));
    else if (bPendingOnly) list = list.filter(a => !auditIsChecked(a));
    return list;
  }

  function closeModal() { root.remove(); }

  /* ยืนยันภายใน modal นี้เอง เพื่อไม่ให้ confirmSheet ของ #modalRoot ไปอยู่ใต้ modal หลัก */
  function confirmInsideBulk(message, opts = {}) {
    return new Promise(resolve => {
      const oldConfirm = root.querySelector('.bulk-confirm-overlay');
      if (oldConfirm) oldConfirm.remove();

      const overlay = document.createElement('div');
      overlay.className = 'overlay bulk-confirm-overlay';
      overlay.style.cssText = 'position:fixed !important; inset:0 !important; z-index:1000 !important; display:flex !important; align-items:center !important; justify-content:center !important; background:rgba(15,25,38,.58) !important; touch-action:none !important;';
      const tone = opts.tone || 'warn';
      const icon = tone === 'bad' ? ICONS.warn : ICONS.info;
      overlay.innerHTML = `
        <div class="sheet confirm-sheet" role="dialog" aria-modal="true" style="position:relative; z-index:1001 !important; max-width:520px; width:calc(100% - 28px); border-radius:24px; margin:14px; padding:24px 20px;">
          <div class="confirm-icon">${icon}</div>
          <div class="confirm-title">${escapeHtml(opts.title || 'ยืนยันรายการ')}</div>
          <div class="confirm-message">${escapeHtml(message)}</div>
          <div class="confirm-actions">
            <button class="btn btn-ghost" id="bulkConfirmNo">ยกเลิก</button>
            <button class="btn ${tone === 'bad' ? 'btn-danger' : 'btn-primary'}" id="bulkConfirmYes">${escapeHtml(opts.okText || 'ยืนยัน')}</button>
          </div>
        </div>`;
      root.appendChild(overlay);

      const finish = value => { overlay.remove(); resolve(value); };
      overlay.querySelector('#bulkConfirmNo').onclick = () => finish(false);
      overlay.querySelector('#bulkConfirmYes').onclick = () => finish(true);
      overlay.addEventListener('click', e => { if (e.target === overlay) finish(false); });
      setTimeout(() => overlay.querySelector('#bulkConfirmYes')?.focus(), 30);
    });
  }

  function draw() {
    const prevSheet = root.querySelector('.sheet:not(.confirm-sheet)');
    const prevScroll = prevSheet ? prevSheet.scrollTop : 0;
    const list = filteredList();
    const allChecked = list.length > 0 && list.every(a => selected.has(a['รหัสครุภัณฑ์']));
    const catCounts = getCategories().map(c => ({ c, n: state.assets.filter(a => a['หมวดหมู่']===c).length })).filter(x => x.n);
    const title = clearMode ? 'ล้างผลตรวจที่เลือก' : 'ตรวจนับหลายรายการพร้อมกัน';
    const step3 = clearMode ? 'ล้างผลตรวจให้ ' + selected.size + ' รายการที่เลือก' : 'บันทึกผลตรวจให้ ' + selected.size + ' รายการที่เลือก';

    root.innerHTML = `
      <div class="overlay" style="z-index:95 !important;">
        <div class="sheet" style="max-height:92vh;">
          <button class="sheet-close" id="baClose" type="button">${ICONS.close}</button>
          <div class="sheet-handle"></div>
          <div class="sheet-title">${title}</div>

          <div class="mf-section">
            <div class="mf-section-title"><span class="mf-step">1</span> ค้นหา / กรองรายการ</div>
            <div class="search-row"><input class="input" id="baSearch" placeholder="ค้นหาชื่อหรือรหัส..." value="${escapeHtml(bQ)}"></div>
            <div class="chip-row">
              <div class="chip ${bCat==='all'?'active':''}" data-bcat="all">ทุกหมวดหมู่</div>
              ${catCounts.map(x => `<div class="chip ${bCat===x.c?'active':''}" data-bcat="${escapeHtml(x.c)}">${escapeHtml(x.c)}</div>`).join('')}
            </div>
            ${clearMode ? '' : `
            <div class="chip-row">
              <div class="chip ${bPendingOnly?'active':''}" id="baPendingChip">เฉพาะที่ยังไม่ตรวจ</div>
            </div>`}
          </div>

          <div class="mf-section">
            <div class="mf-section-title"><span class="mf-step">2</span> เลือกรายการ <small style="font-weight:400; color:var(--ink-dim);">เลือกแล้ว ${selected.size} รายการ</small></div>
            <label class="glass list-item" style="cursor:pointer; margin-bottom:9px;">
              <input type="checkbox" id="baSelectAll" ${allChecked?'checked':''} style="width:18px;height:18px;flex:none;">
              <div class="li-body"><div class="li-title">เลือกทั้งหมดในรายการนี้ (${list.length} รายการ)</div></div>
            </label>
            <div id="baList">${list.length ? list.map(a => {
              const rec = auditRecordFor(a['รหัสครุภัณฑ์']);
              const st = rec ? rec['ผล'] : 'ยังไม่ตรวจ';
              return `
              <label class="glass list-item" style="cursor:pointer;">
                <input type="checkbox" class="ba-chk" data-id="${escapeHtml(a['รหัสครุภัณฑ์'])}" ${selected.has(a['รหัสครุภัณฑ์'])?'checked':''} style="width:18px;height:18px;flex:none;">
                <div class="li-icon">${catIcon(a['หมวดหมู่'])}</div>
                <div class="li-body"><div class="li-title">${escapeHtml(a['ชื่อครุภัณฑ์'])}</div><div class="li-sub">${escapeHtml(a['รหัสครุภัณฑ์'])}</div></div>
                <div class="status-badge ${statusClass(st)}">${st}</div>
              </label>`;
            }).join('') : emptyState(clearMode ? 'ยังไม่มีรายการที่มีผลตรวจให้ล้าง' : 'ไม่พบรายการที่ตรงกับตัวกรอง')}
            </div>
          </div>

          <div style="position:sticky; bottom:0; z-index:5; background:var(--panel); border-top:1px solid var(--panel-line); padding:10px 0 4px;">
            <div class="mf-section-title" style="margin-bottom:8px;"><span class="mf-step">3</span> ${step3}</div>
            <div class="btn-row" style="margin-top:0;">
              ${clearMode
                ? `<button class="btn btn-danger" id="baClear" style="flex:1; padding:13px;">ล้างผลตรวจที่เลือก</button>`
                : `<button class="audit-btn ok" id="baOk" style="flex:1; padding:13px;">พบปกติ</button>
                   <button class="audit-btn warn" id="baWarn" style="flex:1; padding:13px;">ชำรุด</button>
                   <button class="audit-btn bad" id="baBad" style="flex:1; padding:13px;">สูญหาย</button>`}
            </div>
          </div>
        </div>
      </div>`;

    const newSheet = root.querySelector('.sheet');
    if (newSheet) newSheet.scrollTop = prevScroll;

    root.querySelector('#baClose').onclick = closeModal;
    const searchEl = root.querySelector('#baSearch');
    searchEl.oninput = (e) => {
      bQ = e.target.value;
      const pos = e.target.selectionStart;
      draw();
      const again = root.querySelector('#baSearch');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(err){} }
    };
    root.querySelectorAll('[data-bcat]').forEach(c => c.onclick = () => { bCat = c.dataset.bcat; draw(); });
    const pendingChip = root.querySelector('#baPendingChip');
    if (pendingChip) pendingChip.onclick = () => { bPendingOnly = !bPendingOnly; draw(); };

    root.querySelector('#baSelectAll').onchange = (e) => {
      if (e.target.checked) list.forEach(a => selected.add(a['รหัสครุภัณฑ์']));
      else list.forEach(a => selected.delete(a['รหัสครุภัณฑ์']));
      draw();
    };
    root.querySelectorAll('.ba-chk').forEach(chk => chk.onchange = () => {
      if (chk.checked) selected.add(chk.dataset.id); else selected.delete(chk.dataset.id);
      draw();
    });

    if (clearMode) {
      root.querySelector('#baClear').onclick = clearSelectedAuditResults;
    } else {
      root.querySelector('#baOk').onclick = () => applyBulk('พบปกติ');
      root.querySelector('#baWarn').onclick = () => applyBulk('ชำรุด');
      root.querySelector('#baBad').onclick = () => applyBulk('สูญหาย');
    }
  }

  async function clearSelectedAuditResults() {
    const ids = Array.from(selected);
    if (!ids.length) { toast('กรุณาเลือกอย่างน้อย 1 รายการที่มีผลตรวจ'); return; }
    if (!await confirmInsideBulk('ยืนยันล้างผลตรวจของ ' + ids.length + ' รายการที่เลือก?', {title:'ล้างผลตรวจ', okText:'ล้างผลตรวจ', tone:'bad'})) return;

    setLoading(true, 'กำลังล้างผลตรวจ 0/' + ids.length + '...');
    const loadingText = document.getElementById('loadingText');
    let done = 0, failed = 0;
    for (const id of ids) {
      try { await clearAuditStatus(id); }
      catch (err) { failed++; }
      done++;
      if (loadingText) loadingText.textContent = 'กำลังล้างผลตรวจ ' + done + '/' + ids.length + '...';
    }
    setLoading(false);
    closeModal();
    selected.clear();
    drawAuditView();
    toast('ล้างผลตรวจแล้ว ' + (ids.length - failed) + '/' + ids.length + ' รายการ' + (failed ? ' (ล้มเหลว ' + failed + ')' : ''));
  }

  async function applyBulk(status) {
    const ids = Array.from(selected);
    if (!ids.length) { toast('กรุณาเลือกอย่างน้อย 1 รายการ'); return; }
    if (!await confirmInsideBulk('ยืนยันบันทึกผลตรวจ "' + status + '" ให้ทั้งหมด ' + ids.length + ' รายการ?', {title:'บันทึกผลตรวจหลายรายการ', okText:'บันทึกผลตรวจ'})) return;

    setLoading(true, 'กำลังบันทึกผลตรวจ 0/' + ids.length + '...');
    const loadingText = document.getElementById('loadingText');
    let done = 0, failed = 0;
    for (const id of ids) {
      const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === id);
      try {
        await apiPost('saveAuditRecord', { assetId: id, assetName: asset ? asset['ชื่อครุภัณฑ์'] : '', year: state.auditYear, status });
        const idx = state.auditRecords.findIndex(r => r['รหัสครุภัณฑ์'] === id);
        const rec = { 'รหัสครุภัณฑ์': id, 'ผล': status, 'ปีที่ตรวจ': state.auditYear, 'ผู้ตรวจ': state.user.name, 'วันที่ตรวจ': new Date() };
        if (idx === -1) state.auditRecords.push(rec); else state.auditRecords[idx] = rec;
      } catch (err) { failed++; }
      done++;
      if (loadingText) loadingText.textContent = 'กำลังบันทึกผลตรวจ ' + done + '/' + ids.length + '...';
    }
    setLoading(false);
    closeModal();
    selected.clear();
    drawAuditView();
    toast('บันทึกผลตรวจแล้ว ' + (ids.length - failed) + '/' + ids.length + ' รายการ' + (failed ? ' (ล้มเหลว ' + failed + ')' : ''));
  }

  draw();
}

async function clearAllAuditResults() {
  const ids = state.auditRecords
    .filter(r => r['ผล'] && r['ผล'] !== 'ยังไม่ตรวจ')
    .map(r => r['รหัสครุภัณฑ์']);

  if (!await confirmSheet('ยืนยันล้างผลตรวจทั้งหมด ' + ids.length + ' รายการของปี พ.ศ. ' + (state.auditYear + 543) + '?', {

  })) return;

  setLoading(true, 'กำลังล้างผลตรวจ 0/' + ids.length + '...');

      });
