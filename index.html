    } catch (err) { toast(err.message || 'บันทึกไม่สำเร็จ'); }
  };
}

/* ========================= ตรวจประจำเดือน (รายบุคคล) ========================= */
// ป้ายสั้นของหมวดหมู่ที่ใช้ในสรุปบนการ์ด — [ปรับตรงนี้] เพิ่ม/แก้คำเรียกได้
const MC_SHORT = { 'อาวุธปืน':'ปืน', 'สื่อสาร':'วิทยุ', 'ยานพาหนะ':'รถ', 'คอมพิวเตอร์/IT':'คอมฯ', 'เครื่องแบบ/สนาม':'เครื่องแบบ' };

const mcKey = u => officerId(u) || u['ชื่อ-สกุล'] || '';
function mcRecordFor(u) { return (state.mcRecords || []).find(r => r['รหัสจนท.'] === mcKey(u)); }

// พัสดุที่ จนท. คนนี้ถืออยู่ตอนนี้ (รายการยืมที่ยังไม่คืน)
function mcHoldingsOf(u) {
  const full = officerFullName(u), nm = u['ชื่อ-สกุล'];
  return state.borrow.filter(b => {
    const st = effectiveBorrowStatus(b);
    if (st !== 'กำลังยืม' && st !== 'เกินกำหนด') return false;
    return eqCiJs_(b['ผู้ยืม'], full) || eqCiJs_(b['ผู้ยืม'], nm);
  });
}
function mcSummary(u) {
  const hold = mcHoldingsOf(u);
  const byCat = {}; let comps = 0;
  hold.forEach(b => {
    const a = state.assets.find(x => x['รหัสครุภัณฑ์'] === b['รหัสครุภัณฑ์']);
    const cat = a ? a['หมวดหมู่'] : 'อื่นๆ';
    const label = MC_SHORT[cat] || cat;
    byCat[label] = (byCat[label] || 0) + 1;
    parseCompRefs(b['รหัสส่วนควบที่ยืม']).forEach(r => { comps += r.n; });
  });
  const parts = Object.entries(byCat).map(([k, v]) => k + ' ' + v);
  if (comps) parts.push('ส่วนควบ ' + comps);
  return { hold, text: parts.join(', '), names: hold.map(b => b['ชื่อครุภัณฑ์']).join(', ') };
}

async function mcLoad() {
  try { state.mcRecords = await apiGet('getMonthlyChecks', { year: state.mcYear, month: state.mcMonth }) || []; }
  catch (e) { state.mcRecords = []; toast('โหลดผลตรวจประจำเดือนไม่สำเร็จ: ' + (e.message || '')); }
}

async function renderMonthly() {
  if (!isAdmin()) return;
  const el = document.getElementById('view-monthly');
  const now = new Date();
  if (!state.mcYear) state.mcYear = now.getFullYear();
  if (!state.mcMonth) state.mcMonth = now.getMonth() + 1;
  if (state.mcPending === undefined) state.mcPending = false;
  if (state.mcSearch === undefined) state.mcSearch = '';
  el.innerHTML = emptyState('กำลังโหลดผลตรวจประจำเดือน...');
  await mcLoad();

  const years = []; for (let y = now.getFullYear(); y >= now.getFullYear() - 3; y--) years.push(y);
  if (!years.includes(state.mcYear)) years.push(state.mcYear);

  el.innerHTML = `
    <div class="section-title">ตรวจประจำเดือน
      <span class="section-actions">
        <select class="input sort-select" id="mcMonth" style="min-width:120px;">
          ${TH_MONTHS_FULL.map((m, i) => `<option value="${i + 1}" ${state.mcMonth === i + 1 ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
        <select class="input sort-select" id="mcYear" style="min-width:110px;">
          ${years.map(y => `<option value="${y}" ${state.mcYear === y ? 'selected' : ''}>พ.ศ. ${y + 543}</option>`).join('')}
        </select>
      </span>
    </div>
    <div class="glass" style="padding:16px; margin-bottom:14px;" id="mcProgress"></div>
    <div class="search-row"><input class="input" id="mcSearch" placeholder="ค้นหาชื่อหรือตำแหน่ง..." value="${escapeHtml(state.mcSearch)}" autocomplete="off"></div>
    <div class="chip-row"><div class="chip ${state.mcPending ? 'active' : ''}" id="mcPendingChip">เฉพาะที่ยังไม่ตรวจเดือนนี้</div></div>
    <div class="hint" id="mcHiddenHint" style="margin:0 0 10px;"></div>
    <div class="mc-grid" id="mcGrid"></div>
  `;

  const reload = async () => {
    setLoading(true, 'กำลังโหลดผลตรวจ...');
    try { await mcLoad(); } finally { setLoading(false); }
    drawMonthlyBody();
  };
  document.getElementById('mcMonth').onchange = (e) => { state.mcMonth = Number(e.target.value); reload(); };
  document.getElementById('mcYear').onchange = (e) => { state.mcYear = Number(e.target.value); reload(); };
  document.getElementById('mcPendingChip').onclick = (e) => {
    state.mcPending = !state.mcPending; e.currentTarget.classList.toggle('active', state.mcPending); drawMonthlyBody();
  };
  document.getElementById('mcSearch').oninput = (e) => { state.mcSearch = e.target.value; drawMonthlyBody(); };
  drawMonthlyBody();
}

function drawMonthlyBody() {
  const grid = document.getElementById('mcGrid');
  if (!grid) return;

  // คนที่ไม่มีพัสดุในครอบครอง "และ" ยังไม่มีผลตรวจเดือนนี้ -> ซ่อน
  const all = (state.users || []).map(u => ({ u, sum: mcSummary(u), rec: mcRecordFor(u) }));
  const visible = all.filter(x => x.sum.hold.length > 0 || x.rec);
  const hiddenCount = all.length - visible.length;

  const total = visible.length;
  const done = visible.filter(x => x.rec).length;
  const bad = visible.filter(x => x.rec && x.rec['ผล'] === 'มีปัญหา').length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('mcProgress').innerHTML = `
    <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; gap:8px; flex-wrap:wrap;">
      <span>ตรวจแล้ว <b>${done}/${total}</b> คน (${pct}%)</span>
      <span style="color:${bad ? 'var(--bad)' : 'var(--ink-dim)'};">${bad ? 'มีปัญหา ' + bad + ' คน' : 'ยังไม่พบปัญหา'}</span>
    </div>
    <div class="audit-progress-track"><div class="audit-progress-fill" style="width:${pct}%;"></div></div>`;
  document.getElementById('mcHiddenHint').textContent =
    hiddenCount ? 'ซ่อน ' + hiddenCount + ' คนที่ไม่มีพัสดุในความครอบครอง' : '';

  const q = (state.mcSearch || '').trim().toLowerCase();
  let list = visible.filter(x => !q ||
    officerFullName(x.u).toLowerCase().includes(q) || String(x.u['ตำแหน่ง'] || '').toLowerCase().includes(q));
  if (state.mcPending) list = list.filter(x => !x.rec);
  // ยึดลำดับเจ้าหน้าที่ตาม ยศ -> ตำแหน่ง -> ชื่อ ทุกกรณี
  // ไม่เอาสถานะตรวจแล้ว/ยังไม่ตรวจมาแทรกก่อนลำดับยศและตำแหน่ง
  list.sort(compareMonthlyOfficers);

  grid.innerHTML = list.length ? list.map(x => mcCardHtml(x)).join('')
    : emptyState(state.mcPending && total ? 'ตรวจครบทุกคนแล้ว 🎉' : 'ไม่มีเจ้าหน้าที่ที่ถือพัสดุอยู่');

grid.querySelectorAll('.mc-card').forEach(card => {
  const u = state.users.find(x => mcKey(x) === card.dataset.key);
  if (!u) return;
  // กดที่การ์ด -> เปิดหน้าต่างตรวจทีละชิ้น
  card.onclick = (e) => {
    if (e.target.closest('.mc-btn, .mc-clear')) return;
    mcChecklistSheet(u);
  };
  card.querySelector('.mc-ok').onclick = () => mcChecklistSheet(u);   // ปุ่ม "ครบ" ก็เปิดหน้าต่างตรวจเหมือนกัน
  card.querySelector('.mc-bad').onclick = () => mcChecklistSheet(u);
  const clr = card.querySelector('.mc-clear');
  if (clr) clr.onclick = () => mcClear(u);
});
}

  const hasHold = sum.hold.length > 0;
  return `<div class="glass mc-card ${r === 'ครบ' ? 'done-ok' : (r === 'มีปัญหา' ? 'done-bad' : '')}" data-key="${escapeHtml(mcKey(u))}">
    <div class="mc-head">
      ${photo}
      <div style="min-width:0;">
        <div class="mc-name">${escapeHtml(officerFullName(u))}</div>

      </div>
    </div>
    <div class="mc-hold">
      ${hasHold ? escapeHtml(sum.text) : '<span style="color:var(--ink-dim);">ไม่มีพัสดุในความครอบครองขณะนี้</span>'}

async function mcSave(u, result, note) {
  const sum = mcSummary(u);
  const payload = {
    year: state.mcYear, month: state.mcMonth, officerId: mcKey(u), officerName: officerFullName(u),
    result, note, holdingsSnapshot: (sum.text ? sum.text + ' | ' : '') + sum.names
  };
  try {
    await apiPost('saveMonthlyCheck', payload);
    const rec = {
      'รหัสจนท.': payload.officerId, 'ชื่อผู้ถูกตรวจ': payload.officerName, 'ผล': result, 'หมายเหตุ': note,
      'ผู้ตรวจ': state.user.name, 'วันที่ตรวจ': new Date()
    };
    const i = state.mcRecords.findIndex(r => r['รหัสจนท.'] === payload.officerId);
    if (i === -1) state.mcRecords.push(rec); else state.mcRecords[i] = rec;
    drawMonthlyBody();
    toast(result === 'ครบ' ? 'บันทึก: ครบ' : 'บันทึก: มีปัญหา');
  } catch (err) { toast(err.message || 'บันทึกผลตรวจไม่สำเร็จ'); }
}

async function mcClear(u) {
  if (!await confirmSheet('ล้างผลตรวจเดือนนี้ของ ' + officerFullName(u) + ' ?', { title: 'ล้างผลตรวจ', okText: 'ล้างผล', tone: 'bad' })) return;
  try {
    await apiPost('clearMonthlyCheck', { year: state.mcYear, month: state.mcMonth, officerId: mcKey(u), officerName: officerFullName(u) });
    state.mcRecords = state.mcRecords.filter(r => r['รหัสจนท.'] !== mcKey(u));
    drawMonthlyBody();
    toast('ล้างผลตรวจแล้ว');
  } catch (err) { toast(err.message || 'ล้างผลตรวจไม่สำเร็จ'); }
}

  });

    const note = val('mcNote').trim();
    if (!note) { toast('กรุณาระบุรายละเอียดปัญหา'); return; }
    const btn = document.getElementById('mcSaveBad'); if (btn.disabled) return;
    setButtonBusy(btn, true);

   // รายการที่ต้องตรวจของ จนท. คนนี้ (พัสดุทีละชิ้น + ส่วนควบ)
function mcItemsOf(u) {
  const items = [];
  mcHoldingsOf(u).forEach(b => {
    items.push({ label: b['ชื่อครุภัณฑ์'] || '-', sub: b['รหัสครุภัณฑ์'] || '' });
    parseCompRefs(b['รหัสส่วนควบที่ยืม']).forEach(r => {
      const c = state.components.find(x => x['รหัสส่วนควบ'] === r.id);
      items.push({ label: 'ส่วนควบ: ' + (c ? compDisplayName(c) : r.id), sub: r.n > 1 ? '× ' + r.n : '' });
    });
  });
  return items;
}

function mcChecklistSheet(u) {
  const items = mcItemsOf(u);
  if (!items.length) { mcProblemSheet(u); return; }   // ไม่มีพัสดุ -> ใช้หน้าต่างเดิม
  const rec = mcRecordFor(u);
  const st = items.map(() => 0);   // 0 = ยังไม่ตรวจ, 1 = ครบ, 2 = ไม่ครบ

  showSheet(`
    <div class="sheet-title">ตรวจพัสดุ — ${escapeHtml(officerFullName(u))}</div>
    <div class="hint" id="ckCount" style="margin-bottom:8px;"></div>
    <div id="ckList" style="max-height:50vh; overflow:auto;">
      ${items.map((it, i) => `
        <div class="ck-row" data-i="${i}" style="display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid rgba(128,128,128,.2);">
          <div style="flex:1; min-width:0;">
            <div style="font-weight:600;">${escapeHtml(it.label)}</div>
            ${it.sub ? `<small style="color:var(--ink-dim);">${escapeHtml(it.sub)}</small>` : ''}
          </div>
          <button type="button" class="mc-btn ok ck-ok">✓ ครบ</button>
          <button type="button" class="mc-btn bad ck-bad">✗ ไม่ครบ</button>
        </div>`).join('')}
    </div>
    <div class="field" id="ckNoteWrap" style="margin-top:10px; display:none;"><label>รายละเอียดเพิ่มเติม (ถ้ามี)</label>
      <textarea class="input" id="ckNote" rows="2" placeholder="เช่น สภาพชำรุด, หาย">${escapeHtml(rec && rec['ผล'] === 'มีปัญหา' ? rec['หมายเหตุ'] : '')}</textarea>
    </div>
    <div class="btn-row"><button class="btn btn-ghost" id="ckCancel">ยกเลิก</button><button class="btn btn-primary" id="ckSave" disabled>บันทึก</button></div>
  `);

  const refresh = () => {
    const done = st.filter(Boolean).length;
    const bad = st.filter(s => s === 2).length;
    document.getElementById('ckCount').textContent =
      'ตรวจแล้ว ' + done + '/' + items.length + (bad ? ' · ไม่ครบ ' + bad : '');
    document.getElementById('ckNoteWrap').style.display = bad ? '' : 'none';
    const btn = document.getElementById('ckSave');
    btn.disabled = done < items.length;
    btn.textContent = done < items.length ? 'ตรวจให้ครบทุกชิ้นก่อน'
      : (bad ? 'บันทึก "มีปัญหา"' : 'บันทึก "ครบ"');
    btn.className = 'btn ' + (bad ? 'btn-danger' : 'btn-primary');
  };
  document.querySelectorAll('#ckList .ck-row').forEach(row => {
    const i = Number(row.dataset.i);
    const ok = row.querySelector('.ck-ok'), bd = row.querySelector('.ck-bad');
    const set = v => { st[i] = v; ok.classList.toggle('on', v === 1); bd.classList.toggle('on', v === 2); refresh(); };
    ok.onclick = () => set(1);
    bd.onclick = () => set(2);
  });
  refresh();

  document.getElementById('ckCancel').onclick = closeSheet;
  document.getElementById('ckSave').onclick = async () => {
    const btn = document.getElementById('ckSave'); if (btn.disabled) return;
    const badItems = items.filter((_, i) => st[i] === 2).map(it => it.label);
    setButtonBusy(btn, true);
    if (!badItems.length) {
      await mcSave(u, 'ครบ', '');
    } else {
      const extra = (document.getElementById('ckNote').value || '').trim();
      await mcSave(u, 'มีปัญหา', 'ไม่ครบ: ' + badItems.join(', ') + (extra ? ' | ' + extra : ''));
    }
    closeSheet();
  };
}

function wireAuditCommitteeSettingsHandlers() {
  document.querySelectorAll('.ac-trigger').forEach(t => {
    t.onclick = () => {
      const idx = t.dataset.idx;
      const q = sel => document.querySelector(sel + '[data-idx="' + idx + '"]');
      const cur = (q('.ac-rank').value + ' ' + q('.ac-name').value).trim();
      openOfficerPickerSheet(cur, (name, u) => {
        if (u) {
          q('.ac-rank').value = u['ยศ'] || '';
          q('.ac-name').value = u['ชื่อ-สกุล'] || '';
          q('.ac-position').value = u['ตำแหน่ง'] || '';
        } else {
          const s = splitRankName(name);
          q('.ac-rank').value = s.rank;
          q('.ac-name').value = s.name;
        }
        q('.ac-title').textContent = (q('.ac-rank').value + ' ' + q('.ac-name').value).trim();
      });
    };
  });
  const btn = document.getElementById('btnSaveAuditCommittee');
  if (!btn) return;
  btn.onclick = async () => {
    const committee = DEFAULT_AUDIT_COMMITTEE.map((_, idx) => ({
      role: DEFAULT_AUDIT_COMMITTEE[idx].role,
      rank: (document.querySelector('.ac-rank[data-idx="' + idx + '"]') || {}).value || '',
      name: (document.querySelector('.ac-name[data-idx="' + idx + '"]') || {}).value || '',
      position: (document.querySelector('.ac-position[data-idx="' + idx + '"]') || {}).value || ''
    }));
    setButtonBusy(btn, true); setLoading(true, 'กำลังบันทึกคณะกรรมการ...');
    try {
      await apiPost('updateSystemSettings', {
        auditCommittee: JSON.stringify(committee),
        auditPeriodStart: val('ac_start'),
        auditPeriodEnd: val('ac_end')
      });
      toast('บันทึกคณะกรรมการตรวจสอบพัสดุแล้ว');
      await reloadThen(renderSettings);
    } catch (err) { toast(err.message || 'บันทึกไม่สำเร็จ'); }
    finally { setLoading(false); setButtonBusy(btn, false); }
  };
}
 /* [เพิ่ม] โหลดและแสดงบันทึกกิจกรรมล่าสุดในหน้าตั้งค่า (แท็บ "บันทึกกิจกรรม") */
async function loadActivityPanel() {
  const box = document.getElementById('activityPanelList');
  if (!box) return;
  box.innerHTML = emptyState('กำลังโหลดบันทึกกิจกรรม...');
  try {
    state.activity = await apiGet('getActivityLog', { token: state.sessionToken });
  } catch (e) {
    toast('โหลดบันทึกกิจกรรมไม่สำเร็จ: ' + (e.message || ''));
  }
  const list = state.activity || [];
  const again = document.getElementById('activityPanelList');   // กันกรณีผู้ใช้สลับหน้าไปแล้ว
  if (!again) return;
  // [ปรับตรงนี้] 40 = จำนวนรายการล่าสุดที่แสดง
  again.innerHTML = list.length ? list.slice(0, 40).map(activityRow).join('') : emptyState('ยังไม่มีบันทึกกิจกรรม');
}

/* =========================================================
   [ENHANCED] ลำดับยศ + ตำแหน่งตำรวจ — ตัวจัดเรียงกลางของทั้งระบบ
   หลัก: ยศ -> ตำแหน่งหลัก -> ตำแหน่งย่อย/วงเล็บ -> หน่วย -> ชื่อ
   ========================================================= */
const POLICE_RANK_ORDER = [
  'พลตำรวจเอก','พลตำรวจโท','พลตำรวจตรี','พล.ต.อ.','พล.ต.ท.','พล.ต.ต.',
  'พันตำรวจเอก','พันตำรวจโท','พันตำรวจตรี','พ.ต.อ.','พ.ต.ท.','พ.ต.ต.',
  'ร้อยตำรวจเอก','ร้อยตำรวจโท','ร้อยตำรวจตรี','ร.ต.อ.','ร.ต.ท.','ร.ต.ต.',
  'ดาบตำรวจ','ด.ต.','จ่าสิบตำรวจ','จ.ส.ต.','สิบตำรวจเอก','ส.ต.อ.',
  'สิบตำรวจโท','ส.ต.ท.','สิบตำรวจตรี','ส.ต.ต.'
];
const POLICE_RANK_INDEX = (() => {
  const m = {};
  POLICE_RANK_ORDER.forEach((r, i) => { m[r] = i; });
  return m;
})();
function normalizePoliceRank(rank) {
  const r = String(rank || '').trim().replace(/\s+/g, ' ').replace(/\s*หญิง\s*$/u, '').trim();
  const canonical = {
    'พลตำรวจเอก':'พล.ต.อ.','พลตำรวจโท':'พล.ต.ท.','พลตำรวจตรี':'พล.ต.ต.',
    'พันตำรวจเอก':'พ.ต.อ.','พันตำรวจโท':'พ.ต.ท.','พันตำรวจตรี':'พ.ต.ต.',
    'ร้อยตำรวจเอก':'ร.ต.อ.','ร้อยตำรวจโท':'ร.ต.ท.','ร้อยตำรวจตรี':'ร.ต.ต.',
    'ดาบตำรวจ':'ด.ต.','จ่าสิบตำรวจ':'จ.ส.ต.','สิบตำรวจเอก':'ส.ต.อ.',
    'สิบตำรวจโท':'ส.ต.ท.','สิบตำรวจตรี':'ส.ต.ต.'
  };
  return canonical[r] || r;
}
function policeRankIndex(rank) {
  const r = normalizePoliceRank(rank);
  return Object.prototype.hasOwnProperty.call(POLICE_RANK_INDEX, r) ? POLICE_RANK_INDEX[r] : 999;
}

function normalizePolicePosition(position) {
  return String(position || '')
    .replace(/\u00A0/g, ' ')
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/\s*([()])\s*/g, '$1');
}

/*
 * แยก "ตำแหน่ง" ออกจากข้อความหน่วย/สังกัดอย่างเด็ดขาด
 * เช่น
 *   รอง สว. ส.ทล.3        -> ตำแหน่งหลัก = รอง สว., แบบย่อย = 0
 *   รอง สว. ส.ทล.4        -> ตำแหน่งหลัก = รอง สว., แบบย่อย = 0
 *   รอง สว.(ป.) ส.ทล.3   -> ตำแหน่งหลัก = รอง สว., แบบย่อย = 1
 *   รอง สว.(ป.) ส.ทล.4   -> ตำแหน่งหลัก = รอง สว., แบบย่อย = 1
 *
 * จุดสำคัญคือ "ส.ทล.3 / ส.ทล.4" ไม่เคยถูกนำมาใช้ตัดสินว่า
 * รอง สว. หรือ รอง สว.(ป.) อันไหนมาก่อน
 */
const POLICE_POSITION_RULES = [
  { key:'ผบก.', base:'ผบก.', variant:0, re:/^ผบก\.?/u },
  { key:'รอง ผบก.', base:'รอง ผบก.', variant:0, re:/^รอง\s*ผบก\.?/u },
  { key:'ผกก.', base:'ผกก.', variant:0, re:/^ผกก\.?/u },
  { key:'รอง ผกก.', base:'รอง ผกก.', variant:0, re:/^รอง\s*ผกก\.?/u },
  { key:'สว.', base:'สว.', variant:0, re:/^สว\.?/u },
  { key:'รอง สว.', base:'รอง สว.', variant:0, re:/^รอง\s*สว\.?/u },
  { key:'รอง สว.(ป.)', base:'รอง สว.', variant:1, re:/^รอง\s*สว\.?\s*\(ป\.\)/u },
  { key:'สวป.', base:'สวป.', variant:0, re:/^สวป\.?/u },
  { key:'รอง สวป.', base:'รอง สวป.', variant:0, re:/^รอง\s*สวป\.?/u },
  { key:'ผบ.หมู่', base:'ผบ.หมู่', variant:0, re:/^ผบ\.?\s*หมู่/u },
  { key:'ผบ.หมู่(ป.)', base:'ผบ.หมู่', variant:1, re:/^ผบ\.?\s*หมู่\s*\(ป\.\)/u },
  { key:'รอง ผบ.หมู่', base:'รอง ผบ.หมู่', variant:0, re:/^รอง\s*ผบ\.?\s*หมู่/u },
  { key:'เจ้าหน้าที่', base:'เจ้าหน้าที่', variant:0, re:/^เจ้าหน้าที่/u },
  { key:'ผู้บังคับหมู่', base:'ผู้บังคับหมู่', variant:0, re:/^ผู้บังคับหมู่/u }
];

/* ลำดับ "ตำแหน่งหลัก" เท่านั้น — ไม่รวม (ป.) */
const POLICE_POSITION_BASE_ORDER = [
  'ผบก.', 'รอง ผบก.',
  'ผกก.', 'รอง ผกก.',
  'สว.', 'รอง สว.',
  'สวป.', 'รอง สวป.',
  'ผบ.หมู่', 'รอง ผบ.หมู่',
  'เจ้าหน้าที่', 'ผู้บังคับหมู่'
];
const POLICE_POSITION_BASE_INDEX = Object.fromEntries(POLICE_POSITION_BASE_ORDER.map((x,i)=>[x,i]));

function parsePolicePosition(position) {
  const raw = normalizePolicePosition(position);
  if (!raw) return {raw:'', base:'', variant:0, unit:'', known:false};

  /* ตรวจแบบมี (ป.) ก่อนเสมอ เพื่อไม่ให้ regex ของ "รอง สว." จับก่อน */
  const variantRules = POLICE_POSITION_RULES.filter(x => x.variant > 0)
    .sort((a,b) => b.re.source.length - a.re.source.length);
  for (const rule of variantRules) {
    const m = raw.match(rule.re);
    if (m) {
      return {
        raw,
        base: rule.base,
        variant: rule.variant,
        unit: raw.slice(m[0].length).trim(),
        known: true
      };
    }
  }

  /* แบบปกติ */
  const normalRules = POLICE_POSITION_RULES.filter(x => x.variant === 0)
    .sort((a,b) => b.re.source.length - a.re.source.length);
  for (const rule of normalRules) {
    const m = raw.match(rule.re);
    if (m) {
      return {
        raw,
        base: rule.base,
        variant: 0,
        unit: raw.slice(m[0].length).trim(),
        known: true
      };
    }
  }

  return {raw, base:raw, variant:0, unit:'', known:false};
}

function comparePolicePositions(a, b) {
  const A = parsePolicePosition(a);
  const B = parsePolicePosition(b);
  if (A.raw === B.raw) return 0;

  const ia = Object.prototype.hasOwnProperty.call(POLICE_POSITION_BASE_INDEX, A.base)
    ? POLICE_POSITION_BASE_INDEX[A.base] : 500;
  const ib = Object.prototype.hasOwnProperty.call(POLICE_POSITION_BASE_INDEX, B.base)
    ? POLICE_POSITION_BASE_INDEX[B.base] : 500;
  if (ia !== ib) return ia - ib;

  /* ตำแหน่งหลักเดียวกัน: ตำแหน่งธรรมดามาก่อนตำแหน่งย่อย (ป.) */
  if (A.variant !== B.variant) return A.variant - B.variant;

  /* ถ้าตำแหน่งหลัก + แบบย่อยเหมือนกัน ค่อยดูหน่วย เช่น ส.ทล.3 < ส.ทล.4 */
  const uc = A.unit.localeCompare(B.unit, 'th', {numeric:true, sensitivity:'base'});
  if (uc !== 0) return uc;

  /* fallback สำหรับข้อมูลที่ยังไม่รู้จัก */
  return A.raw.localeCompare(B.raw, 'th', {numeric:true, sensitivity:'base'});
}

function comparePoliceOfficers(a, b) {
  const ra = policeRankIndex(a && a['ยศ']);
  const rb = policeRankIndex(b && b['ยศ']);
  if (ra !== rb) return ra - rb;

  const pc = comparePolicePositions(a && a['ตำแหน่ง'], b && b['ตำแหน่ง']);
  if (pc) return pc;

  return officerFullName(a).localeCompare(officerFullName(b), 'th', {
    numeric:true, sensitivity:'base'
  });
}
function compareMonthlyOfficers(a, b) {
  const ua = a && a.u ? a.u : a;
  const ub = b && b.u ? b.u : b;
  return comparePoliceOfficers(ua, ub);
}

    return 'ไม่ระบุหมายเลขเครื่อง';

  function mcSerialHtmlFromBorrow(b){
    const a = mcAssetByBorrow(b);
    const serial = String(a && a['หมายเลขเครื่อง'] || '').trim();
    const plate = String(a && a['ทะเบียนรถ'] || '').trim();
    if (serial) return `<span class="mc-serial-pill">S/N ${escapeHtml(serial)}</span>`;
    if (plate) return `<span class="mc-serial-pill">ทะเบียน ${escapeHtml(plate)}</span>`;

  function mcHoldingsTextEnhanced(u){
    const hold = mcHoldingsOf(u);
    const byCat = {};
    let comps = 0;
    hold.forEach(b => {
      const a = mcAssetByBorrow(b);
      const cat = a ? (MC_SHORT[a['หมวดหมู่']] || a['หมวดหมู่'] || 'อื่นๆ') : 'อื่นๆ';
      byCat[cat] = (byCat[cat] || 0) + 1;
      parseCompRefs(b['รหัสส่วนควบที่ยืม']).forEach(r => { comps += r.n; });
    });
    const parts = Object.entries(byCat).map(([k,v]) => `${k} ${v}`);
    if (comps) parts.push('ส่วนควบ ' + comps);
    return parts.join(', ');
  }

  async function mcSwipeCommit(result, item){
    if(!item) return;
    // Tinder workflow: ปัดซ้าย = ครบ, ปัดขวา = มีปัญหา
    // กรณีมีปัญหาให้ใช้หน้ากรอกรายละเอียดเดิม เพื่อไม่ทิ้งข้อมูลสาเหตุ
    if(result === 'มีปัญหา'){
      mcProblemSheet(item.u);
      return;
    }
    await mcSave(item.u, 'ครบ', '');
    const list=mcMonthlyVisibleList();
    const idx=list.findIndex(x=>mcKey(x.u)===mcKey(item.u));
    if(idx>=0 && list.length>1) mcSwipeKey=mcKey(list[(idx+1)%list.length].u);
    drawMonthlyBodyEnhanced();
  }

  function bindMcSwipeGestures(list, item){
    const card = document.getElementById('mcSwipeCard');
    if(!card || !item) return;
    const okL  = document.getElementById('mcSwipeOkLabel');
    const badL = document.getElementById('mcSwipeBadLabel');
    const THRESH = Math.max(70, Math.min(120, card.offsetWidth * 0.25));
    let pid = null, sx = 0, sy = 0, py = 0, dx = 0, mode = null, side = '';

    const setSide = s => {
      if (s === side) return; side = s;
      card.classList.toggle('swipe-ok',  s === 'ok');
      card.classList.toggle('swipe-bad', s === 'bad');
      if (s) { try { navigator.vibrate && navigator.vibrate(10); } catch(_){} }
    };
    const paint = x => {
      const rot = Math.max(-10, Math.min(10, x / 22));
      card.style.transform = `translate3d(${x}px,0,0) rotate(${rot}deg)`;
      const p = Math.min(1, Math.abs(x) / THRESH);
      const isOk = Math.sign(x) === MC_SWIPE_OK_DIR;
      okL.style.opacity  = isOk ? p : 0;
      badL.style.opacity = isOk ? 0 : p;
      setSide(Math.abs(x) >= THRESH ? (isOk ? 'ok' : 'bad') : '');
    };
    const snapBack = anim => {
      card.style.transition = anim ? 'transform .28s cubic-bezier(.2,.9,.3,1.15)' : 'none';
      card.style.transform = ''; card.style.opacity = '';
      okL.style.opacity = 0; badL.style.opacity = 0; setSide('');
    };

    card.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      pid = e.pointerId; sx = e.clientX; sy = py = e.clientY; dx = 0; mode = null;
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e => {
      if (e.pointerId !== pid) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if (!mode) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        mode = Math.abs(mx) > Math.abs(my) * 1.2 ? 'h' : 'v';
        if (mode === 'h') { try { card.setPointerCapture(pid); } catch(_){} card.classList.add('dragging'); }
      }
      if (mode === 'h') { dx = mx; paint(dx); }
    });
    card.addEventListener('pointerup', e => {
      if (e.pointerId !== pid) return; pid = null;
      card.classList.remove('dragging');
      if (mode !== 'h') return;
      window.__mcJustSwiped = true; setTimeout(() => { window.__mcJustSwiped = false; }, 400);
      if (Math.abs(dx) < THRESH) { snapBack(true); return; }
      const dir = Math.sign(dx);
      const result = dir === MC_SWIPE_OK_DIR ? 'ครบ' : 'มีปัญหา';
      card.style.transition = 'transform .22s ease-in, opacity .22s ease-in';
      card.style.transform = `translate3d(${dir * window.innerWidth}px,0,0) rotate(${dir * 18}deg)`;
      card.style.opacity = '0';
      setTimeout(() => {
        if (result === 'มีปัญหา') snapBack(false);   // การ์ดกลับมารออยู่หลังหน้ากรอกปัญหา ถ้ายกเลิกก็ไม่หาย
        mcSwipeCommit(result, item);
      }, 220);
    });
    card.addEventListener('pointercancel', e => {
      if (e.pointerId !== pid) return; pid = null;
      card.classList.remove('dragging');
      if (mode === 'h') snapBack(true);
    });
    // กันคลิกหลุดหลังลาก (ไม่ให้เปิด checklist / กดปุ่มโดยไม่ตั้งใจ)
    card.addEventListener('click', e => {
      if (window.__mcJustSwiped) { e.stopPropagation(); e.preventDefault(); }
    }, true);
  }

      items.push({
        label: b['ชื่อครุภัณฑ์'] || '-',
        serial: mcSerialTextFromBorrow(b),
        sub: asset && asset['ยี่ห้อ/รุ่น'] ? asset['ยี่ห้อ/รุ่น'] : ''
      });
      parseCompRefs(b['รหัสส่วนควบที่ยืม']).forEach(r => {
        const c = state.components.find(x => x['รหัสส่วนควบ'] === r.id);
        items.push({
          label: 'ส่วนควบ: ' + (c ? compDisplayName(c) : r.id),
          serial: '',
          sub: r.n > 1 ? 'จำนวน × ' + r.n : ''
        });
      });
    });

    if (!items.length) { mcProblemSheet(u); return; }

    const rec = mcRecordFor(u);
    // ถ้าเคยบันทึกผลแล้ว ให้เปิดรายละเอียดพร้อมสถานะเดิมทันที
    // โดยเฉพาะผล "ครบ" ต้องแสดงเป็นตรวจครบทุกชิ้น ไม่ใช่ย้อนกลับไปเป็น 0/จำนวน
    const st = items.map(() => (rec && rec['ผล'] === 'ครบ') ? 1 : 0);

    showSheet(`
      <div class="sheet-title">ตรวจพัสดุ · ${escapeHtml(officerFullName(u))}</div>
      <div class="mc-checklist-head">
        <div>
          <div style="font-weight:600;">รายการที่ต้องตรวจ</div>

          ${rec ? `<div style="margin-top:6px;font-weight:600;color:${rec['ผล'] === 'ครบ' ? 'var(--ok)' : 'var(--bad)'};">● บันทึกผลแล้ว: ${escapeHtml(rec['ผล'])}</div>` : ''}
        </div>
        <div class="mc-checklist-count" id="ckCount">${rec && rec['ผล'] === 'ครบ' ? items.length : 0}/${items.length}</div>
      </div>
      <div id="ckList" style="max-height:50vh;overflow:auto;">
        ${items.map((it,i)=>`
          <div class="ck-row" data-i="${i}">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;">${escapeHtml(it.label)}</div>
              ${it.serial ? `<div class="ck-serial">S/N ${escapeHtml(it.serial)}</div>` : ''}
              ${it.sub ? `<small style="display:block;color:var(--ink-dim);margin-top:2px;">${escapeHtml(it.sub)}</small>` : ''}
            </div>
            <button type="button" class="mc-btn ok ck-ok ${st[i] === 1 ? 'on' : ''}">✓ ครบ</button>
            <button type="button" class="mc-btn bad ck-bad ${st[i] === 2 ? 'on' : ''}">✗ ไม่ครบ</button>
          </div>`).join('')}
      </div>
      <div class="field" id="ckNoteWrap" style="margin-top:10px;display:none;">
        <label>รายละเอียดเพิ่มเติม</label>
        <textarea class="input" id="ckNote" rows="2" placeholder="เช่น สภาพชำรุด, หมายเลขเครื่องไม่ตรง, สูญหาย">${escapeHtml(rec && rec['ผล']==='มีปัญหา' ? rec['หมายเหตุ'] : '')}</textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="ckCancel">ยกเลิก</button>
        <button class="btn btn-primary" id="ckSave" disabled>ตรวจให้ครบทุกชิ้นก่อน</button>
      </div>
    `);

    const refresh = () => {
      const done = st.filter(Boolean).length;
      const bad = st.filter(s => s === 2).length;
      const counter = document.getElementById('ckCount');
      const noteWrap = document.getElementById('ckNoteWrap');
      const save = document.getElementById('ckSave');
      if (counter) counter.innerHTML = `<b>${done}</b>/${items.length}${bad ? ' · ไม่ครบ ' + bad : ''}`;
      if (noteWrap) noteWrap.style.display = bad ? '' : 'none';
      if (save) {
        save.disabled = done < items.length;
        save.textContent = done < items.length ? 'ตรวจให้ครบทุกชิ้นก่อน' : (bad ? 'บันทึก "มีปัญหา"' : 'บันทึก "ครบ"');
        save.className = 'btn ' + (bad ? 'btn-danger' : 'btn-primary');
      }
    };

    document.querySelectorAll('#ckList .ck-row').forEach(row => {
      const i = Number(row.dataset.i);
      const ok = row.querySelector('.ck-ok');
      const bad = row.querySelector('.ck-bad');
      const set = v => {
        st[i] = v;
        ok.classList.toggle('on', v === 1);
        bad.classList.toggle('on', v === 2);
        refresh();
      };
      ok.onclick = () => set(1);
      bad.onclick = () => set(2);
    });
    refresh();

    document.getElementById('ckCancel').onclick = closeSheet;
    document.getElementById('ckSave').onclick = async () => {
      const btn = document.getElementById('ckSave');
      if (!btn || btn.disabled) return;
      const badItems = items.filter((_,i)=>st[i]===2);
      setButtonBusy(btn, true);
      if (!badItems.length) {
        await mcSave(u, 'ครบ', '');

          'ไม่ครบ/ผิดปกติ: ' + serialProblems.join(', ') + (extra ? ' | ' + extra : '')
        );
      }
      closeSheet();
    };
  }

  function mcRenderPrintReport(){
    const orgName = (state.settings && state.settings.orgName) || ORG_NAME;
    const monthName = TH_MONTHS_FULL[(state.mcMonth||1)-1] || '';
    const thaiYear = (Number(state.mcYear)||new Date().getFullYear()) + 543;

    // สร้างรายการครุภัณฑ์สำหรับรายงาน: ชื่อ + หมายเลขครุภัณฑ์ + จำนวน
    // แยกตามผู้ครอบครอง เพื่อให้อ่านง่ายและตรวจสอบย้อนกลับได้
    const source = (state.users || [])
      .map(u => ({u, rec:mcRecordFor(u), hold:mcHoldingsOf(u)}))
      .filter(x => x.hold.length > 0 || x.rec)
      .sort((a,b) => compareMonthlyOfficers(a,b));

    const detailRows = [];
    source.forEach(x => {
      const grouped = {};
      x.hold.forEach(b => {
        const a = mcAssetByBorrow(b) || {};
        const name = String(b['ชื่อครุภัณฑ์'] || a['ชื่อครุภัณฑ์'] || '-').trim() || '-';
        const assetNo = String(a['หมายเลขเครื่อง'] || '').trim() || (String(a['ทะเบียนรถ'] || '').trim() ? 'ทะเบียน ' + String(a['ทะเบียนรถ']).trim() : '-');
        const key = name + '||' + assetNo;
        if (!grouped[key]) grouped[key] = {name, assetNo, qty:0};
        grouped[key].qty += 1;
      });

      const items = Object.values(grouped);

  function renderMonthlyEnhanced(){
    if (!isAdmin()) return;
    const el = document.getElementById('view-monthly');
    const now = new Date();
    if (!state.mcYear) state.mcYear = now.getFullYear();
    if (!state.mcMonth) state.mcMonth = now.getMonth()+1;
    if (state.mcPending === undefined) state.mcPending = false;
    if (state.mcSearch === undefined) state.mcSearch = '';

    el.innerHTML = emptyState('กำลังโหลดผลตรวจประจำเดือน...');
    mcLoad().finally(() => {
      const years = [];
      for(let y=now.getFullYear(); y>=now.getFullYear()-3; y--) years.push(y);
      if(!years.includes(state.mcYear)) years.push(state.mcYear);

      el.innerHTML = `
        <div class="section-title">
          <span>
            ตรวจประจำเดือน
            <small>ติดตามผลการตรวจรายบุคคล พร้อมหมายเลขเครื่อง / Serial</small>
          </span>
        </div>

        <div class="mc-toolbar">
          <div class="mc-toolbar-left">
            <div class="mc-period">
              <select class="input" id="mcMonth">
                ${TH_MONTHS_FULL.map((m,i)=>`<option value="${i+1}" ${state.mcMonth===i+1?'selected':''}>${m}</option>`).join('')}
              </select>
              <select class="input" id="mcYear">
                ${years.map(y=>`<option value="${y}" ${state.mcYear===y?'selected':''}>พ.ศ. ${y+543}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="mc-toolbar-right">
            <div class="mc-tool-group" aria-label="เครื่องมือมุมมองและพิมพ์รายงาน">

              ${mcPrintButtonHtml()}
            </div>
          </div>
        </div>

        <div class="mc-progress-card" id="mcProgress"></div>

        <div class="search-row" style="margin-bottom:10px;">
          <div class="mc-search-wrap">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="5.8" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>

        <div id="mcSwipeNavWrap"></div>
        <div class="mc-grid mc-grid-${mcViewMode()==='list'?'list':'cards'}" id="mcGrid"></div>
      `;

      const reload = async()=>{
        setLoading(true,'กำลังโหลดผลตรวจ...');
        try{ await mcLoad(); } finally{ setLoading(false); }
        drawMonthlyBodyEnhanced();
      };

      document.getElementById('mcMonth').onchange=e=>{state.mcMonth=Number(e.target.value);reload();};
      document.getElementById('mcYear').onchange=e=>{state.mcYear=Number(e.target.value);reload();};
      document.getElementById('mcPendingChip').onclick=e=>{
        state.mcPending=!state.mcPending;

      document.getElementById('mcSearch').oninput=e=>{

        };
      });
      const printBtn = document.getElementById('mcPrintReport');
      if (printBtn) printBtn.onclick=mcRenderPrintReport;

      drawMonthlyBodyEnhanced();
    });
  }

  function drawMonthlyBodyEnhanced(){
    const grid=document.getElementById('mcGrid');
    if(!grid) return;

    const all=(state.users||[]).map(u=>({u,sum:mcSummary(u),rec:mcRecordFor(u)}));
    const visible=all.filter(x=>x.sum.hold.length>0||x.rec);
    const hiddenCount=all.length-visible.length;
    const total=visible.length;
    const done=visible.filter(x=>x.rec).length;
    const bad=visible.filter(x=>x.rec&&x.rec['ผล']==='มีปัญหา').length;
    const pending=total-done;
    const pct=total?Math.round(done/total*100):0;

    const sumEl=document.getElementById('mcSummary');
    if(sumEl){
      sumEl.innerHTML=`
        <div class="mc-summary-card"><div class="num">${total}</div><div class="lbl">ผู้ที่ต้องตรวจ</div></div>
        <div class="mc-summary-card ok"><div class="num">${done}</div><div class="lbl">ตรวจแล้ว</div></div>
        <div class="mc-summary-card bad"><div class="num">${bad}</div><div class="lbl">มีปัญหา</div></div>
        <div class="mc-summary-card pending"><div class="num">${pending}</div><div class="lbl">ยังไม่ตรวจ</div></div>`;
    }

    const progress=document.getElementById('mcProgress');
    if(progress){
      progress.innerHTML=`
        <div class="mc-progress-top">
          <div class="mc-progress-main">ความคืบหน้า <b>${done}/${total}</b> คน · ${pct}%</div>
          <div class="mc-progress-note ${bad?'bad':''}">${bad?'พบปัญหา '+bad+' คน':'ยังไม่พบปัญหาจากผลที่บันทึก'}</div>
        </div>
        <div class="audit-progress-track"><div class="audit-progress-fill" style="width:${pct}%;"></div></div>`;
    }

    const hint=document.getElementById('mcHiddenHint');
    if(hint) hint.textContent=hiddenCount
      ? `ซ่อน ${hiddenCount} คนที่ไม่มีพัสดุในความครอบครองและยังไม่มีผลตรวจ`
      : '';

    const list=mcMonthlyVisibleList();
    const mode=mcViewMode();
    grid.className='mc-grid mc-grid-'+(mode==='list'?'list':'cards');
    if(mode==='grid') grid.classList.add('mc-swipe-mode');

    const navWrap=document.getElementById('mcSwipeNavWrap');
    if(mode==='grid'){
      if(!list.some(x=>mcKey(x.u)===mcSwipeKey)) mcSwipeKey=list.length?mcKey(list[0].u):'';
      const idx=list.findIndex(x=>mcKey(x.u)===mcSwipeKey);
      const item=idx>=0?list[idx]:null;
      if(navWrap) navWrap.innerHTML=mcSwipeSelectHtml(list);
      grid.innerHTML=item ? mcSwipeCardHtml(item) : `<div class="hint mc-swipe-empty">ไม่มีผู้ที่ตรงกับเงื่อนไข</div>`;

      const select=document.getElementById('mcSwipeSelect');
      if(select) select.onchange=()=>{mcSwipeKey=select.value;drawMonthlyBodyEnhanced();};
      const prev=document.getElementById('mcSwipePrev');
      const next=document.getElementById('mcSwipeNext');
      if(prev) prev.onclick=()=>mcSwipeMoveTo(-1,list);
      if(next) next.onclick=()=>mcSwipeMoveTo(1,list);

      if(item){
        const card=document.getElementById('mcSwipeCard');
        const inner=card ? card.querySelector('.mc-card') : null;
        if(inner){
          const u=item.u;
          inner.onclick=e=>{ if(e.target.closest('.mc-btn,.mc-clear')) return; mcChecklistSheetEnhanced(u); };
          const ok=inner.querySelector('.mc-ok'); if(ok) ok.onclick=()=>mcChecklistSheetEnhanced(u);
          const badBtn=inner.querySelector('.mc-bad'); if(badBtn) badBtn.onclick=()=>mcChecklistSheetEnhanced(u);
          const clr=inner.querySelector('.mc-clear'); if(clr) clr.onclick=()=>mcClear(u);
        }
        bindMcSwipeGestures(list,item);
      }
      return;
    }

    if(navWrap) navWrap.innerHTML='';
    grid.innerHTML=list.length
      ? list.map(x=>mcCardHtmlEnhanced(x)).join('')
      : emptyState(state.mcPending&&total?'ตรวจครบทุกคนแล้ว 🎉':'ไม่มีเจ้าหน้าที่ที่ตรงกับเงื่อนไข');

    grid.querySelectorAll('.mc-card').forEach(card=>{
      const u=state.users.find(x=>mcKey(x)===card.dataset.key);
      if(!u) return;
      card.onclick=e=>{
        if(e.target.closest('.mc-btn,.mc-clear')) return;
        mcChecklistSheetEnhanced(u);
      };
      const ok=card.querySelector('.mc-ok'); if(ok) ok.onclick=()=>mcChecklistSheetEnhanced(u);
      const badBtn=card.querySelector('.mc-bad'); if(badBtn) badBtn.onclick=()=>mcChecklistSheetEnhanced(u);
      const clr=card.querySelector('.mc-clear'); if(clr) clr.onclick=()=>mcClear(u);
    });
  }

  // ให้การบันทึกผลจากฟังก์ชันเดิมรีเฟรชหน้ารูปแบบใหม่ด้วย
  try { drawMonthlyBody = drawMonthlyBodyEnhanced; } catch(e) {}

  // Override เฉพาะฟังก์ชันหน้าเดือน — ฟังก์ชันเดิมทั้งหมดด้านอื่นยังอยู่ครบ
  window.renderMonthly = renderMonthlyEnhanced;

  // Function declarations ใน global scope จะถูกเรียกจากระบบ navigation
  // จึงกำหนด property ไว้ด้วยเพื่อรองรับโค้ดเดิมที่เรียกผ่าน window
  try { renderMonthly = renderMonthlyEnhanced; } catch(e) {}
})();

/* สลับคลาส modal-open เมื่อมี popup (ดูเฉพาะลูกตรงของ #modalRoot ไม่ใช่ทั้ง subtree) */
/* ล็อกหน้าหลักตอนมี popup: ตรึง body แล้วคืนตำแหน่งเลื่อนตอนปิด */
(function watchModalRoot() {
  const root = document.getElementById('modalRoot');
  if (!root) return;
  let locked = false, lockY = 0;
   
const lock = () => {
  if (window.matchMedia('(pointer:coarse)').matches) { locked = true; return; }
  lockY = window.scrollY;
  const b = document.body.style;
  b.position = 'fixed';
  b.top = (-lockY) + 'px';
  b.left = '0'; b.right = '0'; b.width = '100%';
  locked = true;
};
  const unlock = () => {
    const b = document.body.style;
    b.position = '';
    b.top = '';
    b.left = '';
    b.right = '';
    b.width = '';
    locked = false;
    window.scrollTo({ top: lockY, left: 0, behavior: 'instant' });
  };
  const sync = () => {
    const open = !!root.querySelector(':scope > .overlay');
    document.body.classList.toggle('modal-open', open);
    if (open && !locked) lock();
    else if (!open && locked) unlock();
  };

  new MutationObserver(sync).observe(root, { childList: true });
  sync();
})();


init();   // <-- ของเดิม คงไว้ตามเดิม
/* ===== จดจำตำแหน่งเลื่อนของหน้า ===== */
(function rememberScroll() {
  let t = null;
  window.addEventListener('scroll', () => {
    if (document.querySelector('#modalRoot .overlay')) return;   // ตอนมี popup เปิดอยู่ไม่ต้องจด
    clearTimeout(t);
    t = setTimeout(() => saveUi({ scrollY: Math.round(window.scrollY) }), 200);
  }, { passive: true });
  // iOS: ปิดแท็บ/สลับแอปแล้วยังเก็บทัน
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !document.querySelector('#modalRoot .overlay')) {
      saveUi({ scrollY: Math.round(window.scrollY) });
    }
  });
})();
   
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
