<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบพัสดุครุภัณฑ์ - ตำรวจทางหลวง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<script src="chart.umd.js"></script> 
<script src="qrcode.min.js"></script> 
<style>
/* =========================================================
   DESIGN TOKENS — "รุ่งอรุณ ทางหลวง" (dawn patrol)
   warm dawn-sky gradient behind crisp navy/gold official cards.
   ========================================================= */
:root{
  --dawn-1:#fdf2e4; --dawn-2:#f7e6de; --dawn-3:#eef0ec; --dawn-4:#e4ecee;
  --bg-0:#eef1f0; --bg-1:#f6f1ea;
  --panel:#ffffff; --panel-soft:#fbfaf7; --panel-line:#eae3d6; --panel-hi:#f6efe1;
  --ink:#20303f; --ink-dim:#6c7b83; --ink-faint:#a3aeae;
  --navy:#17324f; --navy-deep:#0c1e33; --navy-wash:rgba(23,50,79,.07); --navy-line:rgba(23,50,79,.22);
  --gold:#bb8a3f; --gold-deep:#8a641f; --gold-wash:rgba(187,138,63,.14); --gold-line:rgba(187,138,63,.4);
  --ok:#2a8f68; --ok-wash:rgba(42,143,104,.12);
  --warn:#c1852a; --warn-wash:rgba(193,133,42,.14);
  --bad:#c1495a; --bad-wash:rgba(193,73,90,.12);
  --off:#7b8790; --off-wash:rgba(123,135,144,.12);
  --info:#4a86b4; --info-wash:rgba(74,134,180,.12);
  --r-xl:26px; --r-lg:20px; --r-md:16px; --r-sm:13px; --r-tag:99px;
  --font-th:'Kanit',sans-serif; --font-disp:'Fraunces','Kanit',serif; --font-num:'Inter','Kanit',sans-serif;
  --shadow-sm:0 1px 2px rgba(32,48,63,.05), 0 6px 16px rgba(32,48,63,.05);
  --shadow-md:0 10px 28px rgba(32,48,63,.09);
  --shadow-lg:0 20px 48px rgba(20,32,45,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
html,body{margin:0;padding:0;height:100%;}
html{overflow-x:hidden; width:100%; touch-action:pan-y;}
body{
  font-family:var(--font-th); color:var(--ink); min-height:100vh;
  background:
    radial-gradient(900px 480px at 8% -8%, var(--dawn-1), transparent 60%),
    radial-gradient(820px 460px at 100% 0%, var(--dawn-2), transparent 55%),
    radial-gradient(1000px 620px at 50% 120%, var(--dawn-4), transparent 60%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0));
  background-attachment:fixed; padding-bottom:calc(112px + env(safe-area-inset-bottom)); overflow-x:hidden; width:100%;
  touch-action:pan-y; overscroll-behavior-x:none;
}
::-webkit-scrollbar{width:0;height:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
svg{display:block; flex:none;}
img{max-width:100%;}
input,select,button,textarea{max-width:100%;}
:focus-visible{outline:2px solid var(--navy); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; padding:16px 16px 12px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; row-gap:8px;
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  background:linear-gradient(180deg, rgba(247,241,234,.92), rgba(247,241,234,.6));
  border-bottom:1px solid var(--panel-line);
}
.brand{display:flex; align-items:center; gap:11px; min-width:0;}
.brand-badge{
  width:40px;height:40px;border-radius:13px; display:flex;align-items:center;justify-content:center; flex:none;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff;
  box-shadow:0 6px 16px rgba(187,138,63,.35);
}
.brand-badge svg{width:19px;height:19px;}
.brand-title{font-size:14.5px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-sub{font-size:11px; color:var(--ink-dim); font-weight:300;}
.profile{display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:flex-end; min-width:0;}
.profile-name{font-size:12px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;}

/* ---------- tag / pill / badge system ---------- */
.tag{
  display:inline-flex; align-items:center; max-width:100%; font-size:11px; padding:5px 11px; gap:4px;
  border-radius:var(--r-tag); font-weight:500; line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tag-brass{ background:var(--gold-wash); color:var(--gold-deep); }
.tag-off{ background:var(--off-wash); color:var(--off); }
.role-pill{ font-size:10.5px; padding:5px 12px; border-radius:var(--r-tag); font-weight:500; flex:none;
  background:var(--navy); color:#fff; box-shadow:0 4px 12px rgba(23,50,79,.25); }
.role-pill.viewer{ background:var(--off-wash); color:var(--off); box-shadow:none; }

/* ---------- page shell ---------- */
.page{max-width:640px; margin:0 auto; padding:18px 16px 6px; width:100%;}
.section-title{font-size:17px; font-weight:600; margin:22px 2px 12px; display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; font-family:var(--font-disp);}
.section-title small{font-size:11.5px; color:var(--ink-dim); font-weight:400; font-family:var(--font-th);}
.section-actions{display:flex; gap:8px; align-items:center; flex:none;}

/* ---------- glass components ---------- */
.glass{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);
}

/* ---------- notification banner ---------- */
.alert-banner{
  display:flex; align-items:center; gap:10px; padding:13px 15px; border-radius:var(--r-md);
  margin-bottom:14px; font-size:13px; flex-wrap:wrap; row-gap:6px;
}
.alert-banner.bad{ background:var(--bad-wash); color:var(--bad); }
.alert-banner.warn{ background:var(--warn-wash); color:var(--warn); }
.alert-banner svg{width:18px;height:18px;flex:none;}
.alert-banner span:not(.alert-link){min-width:0; word-break:break-word;}
.alert-banner .alert-link{ margin-left:auto; font-weight:600; cursor:pointer; text-decoration:underline; white-space:nowrap; }

/* ---------- dashboard hero ---------- */
.hero-card{
  padding:24px 24px 26px; position:relative; overflow:hidden; border:none; color:#fff;
  background:
    radial-gradient(340px 200px at 88% -10%, rgba(187,138,63,.55), transparent 60%),
    linear-gradient(150deg, var(--navy) 0%, var(--navy-deep) 100%);
  box-shadow:var(--shadow-md);
}
.hero-card::after{
  content:""; position:absolute; right:-30px; bottom:-40px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
}
.hero-row{display:flex; align-items:stretch; gap:18px; flex-wrap:wrap; row-gap:14px; position:relative;}
.hero-row > div{flex:1; min-width:140px;}
.hero-divider{width:1px; background:rgba(255,255,255,.18); flex:none;}
.hero-label{font-size:12px; color:rgba(255,255,255,.68); font-weight:400; margin-bottom:6px;}
.hero-num{font-family:var(--font-num); font-size:32px; font-weight:700; letter-spacing:-.01em; color:#fff;
  font-variant-numeric:tabular-nums; line-height:1.1; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
.hero-num--sm{font-size:22px; color:var(--gold);}
.hero-unit{font-family:var(--font-th); font-size:12.5px; color:rgba(255,255,255,.6); font-weight:400;}

.stat-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
.stat-card{padding:15px 8px; border-radius:var(--r-md); text-align:center;}
.stat-num{font-family:var(--font-num); font-size:22px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums;}
.stat-label{font-size:11px; color:var(--ink-dim); margin-top:5px; font-weight:300; overflow-wrap:break-word;}
.stat-card.warn .stat-num{color:var(--warn);}
.stat-card.bad .stat-num{color:var(--bad);}
.stat-card.ok .stat-num{color:var(--ok);}
.stat-card.info .stat-num{color:var(--info);}

.chart-card{padding:18px; margin-bottom:12px;}
.chart-card h4{margin:0 0 10px; font-size:13px; font-weight:500; color:var(--ink-dim);}
.chart-wrap{position:relative; height:200px; max-width:100%;}

/* ---------- search / filter / sort ---------- */
.search-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.input, select.input{
  width:100%; padding:12px 15px; border-radius:var(--r-sm); border:1px solid var(--panel-line);
  background:var(--panel-soft); color:var(--ink); font-family:inherit; font-size:16px; outline:none; min-width:0;
}
.input::placeholder{color:var(--ink-faint);}
.input:focus{border-color:var(--navy-line); background:#fff;}
.search-row .input{flex:1 1 180px;}
.sort-select{flex:1 1 140px; width:auto; min-width:0;}
.chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; -ms-overflow-style:none; scrollbar-width:none;}
.chip{
  flex:none; padding:8px 15px; border-radius:var(--r-tag); font-size:12.5px; border:1px solid var(--panel-line);
  background:#fff; color:var(--ink-dim); cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}

/* ---------- date inputs: Safari/iOS friendly sizing ---------- */
input[type="date"]{
  width:100%; max-width:100%; min-width:0; box-sizing:border-box;
  -webkit-appearance:none; appearance:none;
}
input[type="date"]::-webkit-date-and-time-value{ text-align:left; }

/* ---------- list items ---------- */
.list-item{
  padding:14px 15px; border-radius:var(--r-md); margin-bottom:9px; width:100%;
  display:flex; align-items:center; gap:12px; cursor:pointer;
}
.li-icon{
  width:42px;height:42px;border-radius:13px; flex:none; display:flex;align-items:center;justify-content:center;
  background:var(--navy-wash); color:var(--navy);
}
.li-icon svg{width:19px;height:19px;}
.li-icon img{width:100%;height:100%;object-fit:cover;border-radius:13px;}
.li-body{flex:1; min-width:0;}
.li-title{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.li-sub{font-size:11.5px; color:var(--ink-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.status-badge{font-size:11px; padding:5px 11px; border-radius:var(--r-tag); font-weight:500; flex:none; line-height:1.5; white-space:nowrap;}
.status-ready{background:var(--ok-wash); color:var(--ok);}
.status-borrowed{background:var(--warn-wash); color:var(--warn);}
.status-repair{background:var(--bad-wash); color:var(--bad);}
.status-disposed{background:var(--off-wash); color:var(--off);}
.status-overdue{background:rgba(193,73,90,.18); color:var(--bad); font-weight:600;}
.status-returned{background:var(--off-wash); color:var(--off);}
.status-pending{background:var(--info-wash); color:var(--info);}
.status-rejected{background:var(--off-wash); color:var(--off); text-decoration:line-through;}
.empty-state{text-align:center; padding:44px 20px; color:var(--ink-dim); font-size:13px;}

/* ---------- pagination ---------- */
.pagination{display:flex; align-items:center; justify-content:center; gap:14px; padding:16px 0 4px; font-size:12.5px; color:var(--ink-dim); flex-wrap:wrap;}
.pagination button{padding:8px 16px; border-radius:var(--r-tag); border:1px solid var(--panel-line); background:#fff; color:var(--ink); cursor:pointer; font-size:12.5px;}
.pagination button:disabled{opacity:.4; cursor:default;}

/* ---------- fab ---------- */
.fab{
  position:fixed; right:18px; bottom:calc(104px + env(safe-area-inset-bottom)); z-index:45; width:56px;height:56px; border-radius:50%;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff; border:none;
  box-shadow:0 14px 30px rgba(187,138,63,.4); cursor:pointer; display:flex;align-items:center;justify-content:center;
}
.fab svg{width:22px;height:22px;}

/* ---------- bottom tab bar (floating) ---------- */
.tabbar{
  position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); left:14px; right:14px; z-index:50; display:flex; justify-content:space-around;
  padding:8px 4px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--panel-line); border-radius:24px; box-shadow:var(--shadow-lg);
  max-width:640px; margin:0 auto;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 1px;
  color:var(--ink-dim); background:none; border:none; font-family:inherit; cursor:pointer; min-width:0; border-radius:16px;
}
.tab .ico{width:19px;height:19px; position:relative;}
.tab .ico svg{width:19px;height:19px;}
.tab .lbl{font-size:9.5px; font-weight:400; white-space:nowrap;}
.tab.active{color:var(--navy); background:var(--gold-wash);}
.tab.active .lbl{font-weight:600;}
.tab-dot{position:absolute; top:-3px; right:-5px; width:8px;height:8px;border-radius:50%; background:var(--bad); border:1.5px solid #fff;}

/* ---------- sheet / modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(15,25,38,.46); backdrop-filter:blur(4px); z-index:80;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto; border-radius:28px 28px 0 0;
  background:#ffffff; border:1px solid var(--panel-line); border-bottom:none;
  box-shadow:0 -16px 48px rgba(20,32,45,.2);
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  animation:slideup .22s ease-out;
  position:relative;
}
@keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px;height:4px;border-radius:99px; background:var(--panel-line); margin:0 auto 14px;}
.sheet-title{font-size:17px; font-weight:600; margin-bottom:16px; font-family:var(--font-disp); padding-right:34px;}
.sheet-close{
  position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--panel-line); background:#fff; color:var(--ink-dim); cursor:pointer;
  display:flex; align-items:center; justify-content:center; z-index:6; flex:none;
}
.sheet-close svg{width:15px;height:15px;}
.sheet-close:hover{background:var(--bad-wash); color:var(--bad); border-color:transparent;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-dim); margin-bottom:6px;}
.btn-row{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.btn{
  flex:1 1 120px; padding:13px; border-radius:var(--r-sm); border:none; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer;
}
.btn-primary{background:linear-gradient(150deg, var(--navy), var(--navy-deep)); color:#fff; box-shadow:0 8px 20px rgba(23,50,79,.28);}
.btn-ghost{background:#fff; color:var(--ink); border:1px solid var(--panel-line);}
.btn-danger{background:var(--bad-wash); color:var(--bad);}
.btn-ok{background:var(--ok-wash); color:var(--ok);}

/* ---------- login screen ---------- */
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:36px 26px; text-align:center;
  background:
    radial-gradient(560px 360px at 20% 0%, rgba(187,138,63,.35), transparent 60%),
    radial-gradient(620px 420px at 100% 10%, rgba(255,255,255,.08), transparent 55%),
    linear-gradient(150deg, var(--navy-deep), var(--navy) 60%, #1c3f63);
  color:#fff;
}
.login-badge{
  width:78px;height:78px;border-radius:24px; display:flex;align-items:center;justify-content:center; margin-bottom:24px;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff; box-shadow:0 16px 38px rgba(0,0,0,.25);
  animation:badgeIn .5s ease-out;
}
.login-badge svg{width:36px;height:36px;}
@keyframes badgeIn{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}
.login-title{font-size:20px; font-weight:600; margin-bottom:6px; font-family:var(--font-disp);}
.login-sub{font-size:13px; color:rgba(255,255,255,.72); margin-bottom:28px; max-width:300px; line-height:1.65; font-weight:300;}
.spinner{width:26px;height:26px;border-radius:50%; border:3px solid rgba(255,255,255,.25); border-top-color:var(--gold); animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:100; padding:12px 22px; border-radius:var(--r-tag);
  background:var(--navy-deep); color:#f2f6fa; border:1px solid var(--navy-deep); font-size:13px; box-shadow:var(--shadow-lg);
  opacity:0; transition:opacity .25s, transform .25s; max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(4px);}
.detail-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--panel-line); font-size:13px; gap:12px; flex-wrap:wrap; row-gap:2px;}
.detail-row span:first-child{color:var(--ink-dim); flex:none;}
.detail-row span:last-child{text-align:right; word-break:break-word; overflow-wrap:anywhere; min-width:0; flex:1;}
.hint{font-size:11px; color:var(--ink-dim); margin-top:14px; line-height:1.6;}

/* ---------- role select login ---------- */
.role-select-box{width:100%; max-width:300px;}
.role-select-card{
  display:flex; align-items:center; gap:14px; padding:16px 18px; margin-bottom:12px; border-radius:18px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); cursor:pointer; text-align:left;
  transition:.18s ease;
}
.role-select-card:hover, .role-select-card:active{ background:rgba(255,255,255,.16); transform:translateY(-1px); }
.rsc-icon{width:42px;height:42px;border-radius:13px; display:flex;align-items:center;justify-content:center; flex:none;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff;}
.rsc-icon svg{width:19px;height:19px;}
.rsc-body{flex:1; min-width:0;}
.rsc-title{font-size:14.5px; font-weight:600; color:#fff;}
.rsc-sub{font-size:11.5px; color:rgba(255,255,255,.65); margin-top:2px;}
.role-login-form{width:100%; max-width:300px; text-align:left;}
.role-login-form .field label{color:rgba(255,255,255,.72);}
.role-login-form .field input{background:rgba(255,255,255,.95);}
.link-btn{color:var(--gold); font-size:12.5px; cursor:pointer; text-decoration:underline;}

/* ---------- app entrance ---------- */
@keyframes appIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.app-in{animation:appIn .4s ease-out;}

/* ---------- print form (บันทึกข้อความ - ทางราชการ) ---------- */
#printArea{display:none;}
@media print{
  html,body{background:#fff !important;}
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important; position:absolute; top:0; left:0; width:100%; padding:16mm 20mm; color:#000; font-family:'TH Sarabun New','Kanit',sans-serif; font-size:16px; line-height:1.9;}
}
.pf-topline{display:flex; align-items:flex-start; gap:10px; margin-bottom:2px;}
.pf-emblem{
  width:64px; flex:none; font-size:10px; color:#8a641f; text-align:center; padding:0; line-height:1.4;
}
.pf-emblem img{width:56px; height:auto; display:block; margin:0 auto;}
.pf-emblem-placeholder{border:1px dashed #bb8a3f; border-radius:6px; padding:14px 4px;}
.pf-title-wrap{flex:1; text-align:center;}
.pf-title{font-size:22px; font-weight:700; margin:6px 0 2px;}
.pf-spacer{width:64px; flex:none;}
.pf-field-line{font-size:16px; margin:5px 0;}
.pf-two-col{display:flex; justify-content:space-between; gap:16px; font-size:16px; margin:5px 0; flex-wrap:wrap;}
.pf-body{font-size:16px; margin:10px 0; text-align:justify; text-indent:44px; line-height:1.9;}
.pf-sign{width:290px; margin:16px 60px 16px auto; text-align:center; line-height:2.1; font-size:16px;}
.pf-sign .pf-sign-gap{height:34px;}
.pf-note{font-size:16px; margin:4px 0 4px 0;}
@media print{
  .pf-emblem-placeholder{border:none;}
}

/* ---------- print form (print helper form fields inside sheet) ---------- */
.memo-two-col{display:flex; gap:10px; flex-wrap:wrap;}
.memo-two-col > .field{flex:1 1 160px;}
.memo-section-label{font-size:12.5px; font-weight:600; color:var(--navy); margin:14px 0 8px; padding-top:10px; border-top:1px solid var(--panel-line);}
.memo-section-label:first-of-type{border-top:none; margin-top:0; padding-top:0;}
.memo-signer-pick{display:flex; gap:8px; margin-bottom:8px;}
.memo-signer-pick select{flex:1;}

/* ---------- refresh / connection / loading ---------- */
.refresh-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-width:42px;height:38px;padding:0 11px;border:1px solid var(--panel-line);
  border-radius:var(--r-tag);background:#fff;color:var(--ink);cursor:pointer;font-size:12px;

<script>
/* ========================================================= SESSION (localStorage) */
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const sess = JSON.parse(raw);
    if (!sess || !sess.token || !sess.role) return null;
    return sess;
  } catch (e) { return null; }
}
function saveSession(sess) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(sess)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

/* ========================================================= INIT / LOGIN */
let selectedRole = null;

async function init() {
  const sess = loadSession();
  if (!sess) { showRoleSelect(); return; }

  // เข้าแอปทันทีด้วย session ที่มีอยู่ ไม่ต้องรอ server ยืนยันก่อน
  // (ลด perceived wait time จาก cold start ของ Apps Script ไปเกือบหมด)
  await completeLogin({ role: sess.role, name: sess.name, token: sess.token });

  // ตรวจสอบ token กับ server แบบเงียบๆ อยู่เบื้องหลัง
  // ถ้า token หมดอายุ/ไม่ถูกต้องจริง ค่อยเด้งออก — ไม่บล็อกการใช้งาน
  validateSessionInBackground(sess);
}

async function validateSessionInBackground(sess) {
  try {
    const check = await apiGet('validateSession', { token: sess.token });
    if (!check || !check.valid) {
      clearSession();
      toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
      setTimeout(() => location.reload(), 1500);
    }
    // ถ้า valid ก็ไม่ต้องทำอะไร ผู้ใช้ใช้งานอยู่แล้ว
  } catch (err) {
    // เชื่อมต่อไม่สำเร็จชั่วคราว — ไม่ต้องทำอะไร ปล่อยให้ใช้งานต่อด้วย session เดิม
    console.warn('ตรวจสอบเซสชันเบื้องหลังไม่สำเร็จ (จะลองใหม่รอบหน้า):', err.message);
  }
}

function showSessionCheckError(errMsg) {
  document.getElementById('loginSpinner').style.display = 'none';
  document.getElementById('loginSubText').innerHTML =
    'ตำรวจทางหลวง<br>เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ<br><span style="font-size:11px;opacity:.7;">' +
    (errMsg ? escapeHtmlSafe(errMsg) : '') + '</span>';
  document.getElementById('sessionRetryBox').style.display = 'block';
}
function escapeHtmlSafe(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('btnRetrySession').addEventListener('click', () => {
  document.getElementById('sessionRetryBox').style.display = 'none';
  init();
});

function showRoleSelect() {
  selectedRole = null;
  document.getElementById('loginSpinner').style.display = 'none';
  document.getElementById('loginSubText').innerHTML = 'ตำรวจทางหลวง<br>กรุณาเลือกระดับผู้ใช้งานเพื่อเข้าสู่ระบบ';
  document.getElementById('roleSelectBox').style.display = 'block';
  document.getElementById('roleLoginForm').style.display = 'none';
}

document.querySelectorAll('.role-select-card').forEach(card => {
  card.addEventListener('click', async () => {
    selectedRole = card.dataset.role;

    // ดูอย่างเดียว: เข้าใช้งานได้ทันทีโดยไม่ต้องกรอกรหัสผ่าน เพื่อความรวดเร็ว
    if (selectedRole === 'viewer') {
      document.getElementById('roleSelectBox').style.display = 'none';
      document.getElementById('loginSpinner').style.display = 'block';
      document.getElementById('loginSubText').innerHTML = 'ตำรวจทางหลวง<br>กำลังเข้าสู่ระบบ...';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'loginAsViewer', payload: {} })
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || 'เข้าสู่ระบบไม่สำเร็จ');
        saveSession({ role: j.data.role, token: j.data.token, name: j.data.displayName });
        await completeLogin({ role: j.data.role, name: j.data.displayName, token: j.data.token });
      } catch (err) {
        toast(err.message || 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่');
        showRoleSelect();
      }
      return;
    }

    document.getElementById('roleSelectBox').style.display = 'none';
    document.getElementById('roleLoginForm').style.display = 'block';
    document.getElementById('rl_roleLabel').textContent = 'แอดมิน';
    document.getElementById('rl_password').value = '';
    document.getElementById('roleLoginError').textContent = '';
    setTimeout(() => document.getElementById('rl_password').focus(), 50);
  });
});
document.getElementById('btnBackToRoles').addEventListener('click', showRoleSelect);
document.getElementById('rl_password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doRoleLogin(); });
document.getElementById('btnRoleLogin').addEventListener('click', doRoleLogin);
document.getElementById('btnLogout').addEventListener('click', () => {
  if (!confirm('ยืนยันการออกจากระบบ?')) return;
  clearSession();
  location.reload();
});

async function doRoleLogin() {
  const password = val('rl_password');
  const errEl = document.getElementById('roleLoginError');
  errEl.textContent = '';
  if (!selectedRole) { errEl.textContent = 'กรุณาเลือกระดับผู้ใช้งาน'; return; }
  if (!password) { errEl.textContent = 'กรุณากรอกรหัสผ่าน'; return; }

  const btn = document.getElementById('btnRoleLogin');
  btn.disabled = true;
  btn.textContent = 'กำลังเข้าสู่ระบบ...';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'loginWithRole',
        payload: { role: selectedRole, password }
      })
    });

    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'เข้าสู่ระบบไม่สำเร็จ');

    const displayName = j.data.displayName ||
      (j.data.role === 'admin' ? 'แอดมิน' : 'ผู้ดูอย่างเดียว');

    saveSession({
      role: j.data.role,
      token: j.data.token,
      name: displayName
    });

    await completeLogin({
      role: j.data.role,
      name: displayName,
      token: j.data.token
    });
  } catch (err) {
    errEl.textContent = err.message || 'เข้าสู่ระบบไม่สำเร็จ';
    document.getElementById('rl_password').focus();
  } finally {
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
  }
}

async function completeLogin({ role, name, token }) {
  state.role = role;
  state.sessionToken = token;
  state.user = { name: name || (role === 'admin' ? 'แอดมิน' : 'ผู้ดูอย่างเดียว') };

  const pill = document.getElementById('rolePill');
  pill.textContent = role === 'admin' ? 'แอดมิน' : 'ดูอย่างเดียว';
  pill.classList.toggle('viewer', role !== 'admin');
  document.getElementById('profileName').textContent = state.user.name;
  document.getElementById('usersTabBtn').style.display = isAdmin() ? 'flex' : 'none';
  document.getElementById('settingsTabBtn').style.display = isAdmin() ? 'flex' : 'none';

  document.getElementById('loginScreen').style.display = 'none';
  const appEl = document.getElementById('app');
  appEl.style.display = 'block';
  appEl.classList.add('app-in');
  try {
    await loadAll(true);
    renderTab('dashboard');
  } catch (err) {
    document.getElementById('app').style.display = 'block';
    renderTab('dashboard');
    toast('เข้าสู่ระบบแล้ว แต่โหลดข้อมูลไม่สำเร็จ: ' + (err.message || 'กรุณารีเฟรช'));
  }
}

/* ========================================================= API */
let busyCount = 0;
let lastSyncAt = null;

let loadingTimerInterval = null;
let loadingStartedAt = null;

function setLoading(show, text = 'กำลังโหลดข้อมูล...') {
  const overlay = document.getElementById('loadingOverlay');
  const label = document.getElementById('loadingText');
  if (!overlay) return;
  if (show) {
    busyCount++;
    if (label) label.textContent = text;
    overlay.classList.add('show');
    if (!loadingTimerInterval) {
      loadingStartedAt = Date.now();
      const timerEl = document.getElementById('loadingTimer');
      loadingTimerInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - loadingStartedAt) / 1000);
        if (timerEl) {
          timerEl.textContent = sec + ' วินาที';
          if (sec >= 8) timerEl.textContent += ' (เซิร์ฟเวอร์กำลังเริ่มทำงาน อาจใช้เวลาสักครู่ในการโหลดครั้งแรก)';
        }
      }, 1000);
    }
  } else {
    busyCount = Math.max(0, busyCount - 1);
    if (!busyCount) {
      overlay.classList.remove('show');
      if (loadingTimerInterval) { clearInterval(loadingTimerInterval); loadingTimerInterval = null; }
    }
  }
}
function setConnection(ok) {
  const dot = document.getElementById('connectionDot');
  if (dot) dot.classList.toggle('offline', !ok);
}
function updateSyncLabel() {
  const el = document.getElementById('lastSync');
  if (!el || !lastSyncAt) return;
  el.textContent = 'อัปเดต ' + lastSyncAt.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}
function setButtonBusy(btn, busy, textBusy = 'กำลังบันทึก...') {
  if (!btn) return;
  if (busy) { btn.dataset.originalText = btn.textContent; btn.disabled = true; btn.textContent = textBusy; btn.setAttribute('aria-busy','true'); }
  else { btn.disabled = false; btn.textContent = btn.dataset.originalText || 'บันทึก'; btn.removeAttribute('aria-busy'); }
}

async function fetchJson(url, options = {}, timeout = 20000, retries = 1) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    if (attempt > 0) {
      const label = document.getElementById('loadingText');
      if (label) label.textContent = 'เชื่อมต่อไม่สำเร็จ กำลังลองใหม่ (ครั้งที่ ' + (attempt + 1) + ')...';
    }
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, {...options, signal: controller.signal, cache:'no-store'});
      const text = await res.text();
      const looksLikeHtml = text.trim().startsWith('<');
      if (!res.ok || looksLikeHtml) {
        if (attempt < retries) {
          await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
          continue;
        }
        throw new Error(looksLikeHtml
          ? 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (ลองใหม่อีกครั้ง)'
          : 'เซิร์ฟเวอร์ตอบกลับผิดพลาด (' + res.status + ')');
      }
      const j = JSON.parse(text);
      if (!j.ok) throw new Error(j.error || 'ไม่สามารถดำเนินการได้');
      return j.data;
    } catch (err) {
      if (err.name === 'AbortError') {
        if (attempt < retries) { continue; }
        throw new Error('การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่');
      }
      if (attempt >= retries) throw err;
    } finally {
      clearTimeout(timer);
    }
  }
}

async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  return fetchJson(API_URL + '?' + qs);
}
async function apiPost(action, payload) {
  return fetchJson(API_URL, { method: 'POST', body: JSON.stringify({ action, sessionToken: state.sessionToken, actorName: state.user?.name, payload }) });
}
   
async function loadAll(showLoader = false) {
  if (showLoader) setLoading(true, 'กำลังอัปเดตข้อมูล...');
  try {
    const data = await apiGet('getAll', { token: state.sessionToken });
    state.assets = data.assets || [];
    state.borrow = data.borrow || [];
    state.maint = data.maint || [];
    state.components = data.components || [];
    state.dashboard = data.dashboard || null;
    state.memos = data.memos || [];
    state.settings = data.settings || {};
    if (isAdmin()) {
      state.users = data.users || [];
      state.activity = data.activity || [];
    }
    setConnection(true);
    lastSyncAt = new Date();
    updateSyncLabel();
    updateBorrowDot();
    return { successCount: 1, errors: [] };
  } catch (err) {
    setConnection(false);
    toast('ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + (err.message || ''));
    throw err;
  } finally {
    if (showLoader) setLoading(false);
  }
}

async function refreshData() {
  const btn = document.getElementById('refreshBtn');
  if (btn?.disabled) return;
  if (btn) { btn.disabled = true; btn.classList.add('loading'); }
  try {
    await loadAll(true);
    renderTab(state.tab || 'dashboard');
    toast('อัปเดตข้อมูลล่าสุดแล้ว');
  } catch (err) {
    setConnection(false);
    toast(err.message || 'รีเฟรชข้อมูลไม่สำเร็จ');
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
  }
}

function componentsOf(assetId) { return state.components.filter(c => c['รหัสครุภัณฑ์หลัก'] === assetId); }
function updateBorrowDot() {
  const pending = state.borrow.filter(b => b['สถานะ'] === 'รออนุมัติ').length;
  document.getElementById('borrowTabDot').style.display = (isAdmin() && pending > 0) ? 'block' : 'none';
}

/* ========================================================= UTIL */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function thaiDate(v) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return v;
  return d.getDate() + '/' + (d.getMonth() + 1) + '/' + (d.getFullYear() + 543);
}
function thaiDateTime(v) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return v;
  return thaiDate(v) + ' ' + d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}
function thaiDateLong(v) {
  const d = v ? new Date(v) : new Date();
  if (isNaN(d)) return '';
  return d.getDate() + ' ' + TH_MONTHS_FULL[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function thaiDateAbbr(v) {
  const d = v ? new Date(v) : new Date();
  if (isNaN(d)) return '';
  return d.getDate() + ' ' + TH_MONTHS_ABBR[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function isoDate(v) {
  const d = v ? new Date(v) : new Date();
  return d.toISOString().slice(0, 10);
}
function daysUntil(v) {
  if (!v) return null;
  const d = new Date(v);
  if (isNaN(d)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}
function statusClass(s) {
  return { 'พร้อมใช้งาน':'status-ready','กำลังยืม':'status-borrowed','ซ่อมบำรุง':'status-repair','จำหน่ายแล้ว':'status-disposed',
           'เกินกำหนด':'status-overdue','คืนแล้ว':'status-returned','รอซ่อม':'status-repair','กำลังซ่อม':'status-borrowed','ซ่อมเสร็จ':'status-ready',
           'รออนุมัติ':'status-pending','ถูกปฏิเสธ':'status-rejected' }[s] || '';
}
function catIcon(c) {
  return { 'อาวุธปืน':ICONS.gun, 'ยานพาหนะ':ICONS.vehicle, 'สื่อสาร':ICONS.radio, 'คอมพิวเตอร์/IT':ICONS.computer, 'เครื่องแบบ/สนาม':ICONS.uniform }[c] || ICONS.other;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- officer roster (จนท.ในสังกัด) helpers — ใช้ทำ dropdown เลือกชื่อแทนการพิมพ์ ---------- */
function officerLabel(u) {
  const rank = u['ยศ'] ? u['ยศ'] + ' ' : '';
  const pos = u['ตำแหน่ง'] ? ' — ' + u['ตำแหน่ง'] : '';
  return rank + (u['ชื่อ-สกุล'] || '') + pos;
}
function officerFullName(u) {
  return (u['ยศ'] ? u['ยศ'] + ' ' : '') + (u['ชื่อ-สกุล'] || '');
}
function officersByMemoRole(role) {

// รหัสระบุตัวจนท.ที่นิ่งและไม่ซ้ำกัน ใช้แทนการจับคู่ด้วยชื่อ (กันปัญหาชื่อซ้ำ/แก้ไข-ลบไม่ได้)
function officerId(u) { return u ? (u['รหัสจนท.'] || '') : ''; }
// สร้าง <select> รายชื่อ จนท.ในสังกัด + ตัวเลือก "อื่นๆ / พิมพ์เอง" กันกดผิดคน แต่ยังยืดหยุ่นกรณีคนนอกทำเนียบ
function officerSelectOptions(selectedIdx) {
  const list = state.users || [];
  let opts = `<option value="">-- เลือกรายชื่อ --</option>`;
  opts += list.map((u, i) => `<option value="${i}" ${String(selectedIdx)===String(i)?'selected':''}>${escapeHtml(officerLabel(u))}</option>`).join('');
  opts += `<option value="__other__" ${selectedIdx==='__other__'?'selected':''}>อื่นๆ / พิมพ์ชื่อเอง</option>`;
  return opts;
}
function findOfficerIndexByName(name) {
  if (!name) return '';
  const list = state.users || [];
  const idx = list.findIndex(u => eqCiJs_(officerFullName(u), name) || eqCiJs_(u['ชื่อ-สกุล'], name));
  return idx === -1 ? '' : String(idx);
}
function eqCiJs_(a, b) {
  return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase();
}

/* ---------- CSV export ---------- */
function exportCsv(filename, headers, rows) {
  const escapeCell = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(escapeCell).join(',')];
  rows.forEach(r => lines.push(headers.map(h => escapeCell(r[h])).join(',')));
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('ดาวน์โหลดไฟล์ CSV แล้ว');
}

let chartRefs = {};
function drawDoughnut(id, dataObj) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (chartRefs[id]) chartRefs[id].destroy();
  const labels = Object.keys(dataObj), values = Object.values(dataObj);
  chartRefs[id] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor:['#17324f','#2a8f68','#4a86b4','#bb8a3f','#c1495a','#8b98a3'], borderWidth:2, borderColor:'#ffffff' }] },
    options: { plugins:{ legend:{ position:'bottom', labels:{ color:'#4a5a63', font:{ family:'Kanit', size:11 }, padding:12 } } }, cutout:'62%' }
  });
}
function drawBar(id, dataObj) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (chartRefs[id]) chartRefs[id].destroy();
  const labels = Object.keys(dataObj), values = Object.values(dataObj);
  chartRefs[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor:'#17324f', borderRadius:8, maxBarThickness:34 }] },
    options: { plugins:{ legend:{ display:false } },
      scales:{ x:{ ticks:{ color:'#6c7b83', font:{ family:'Kanit', size:10.5 } }, grid:{ display:false } },
               y:{ ticks:{ color:'#6c7b83', font:{ family:'Kanit', size:10.5 } }, grid:{ color:'rgba(23,50,79,.08)' } } } }
  });
}
function drawLine(id, dataObj) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (chartRefs[id]) chartRefs[id].destroy();
  const labels = Object.keys(dataObj).map(k => { const [y,m] = k.split('-'); return TH_MONTHS_ABBR[parseInt(m,10)-1]; });
  const values = Object.values(dataObj);
  chartRefs[id] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ data: values, borderColor:'#bb8a3f', backgroundColor:'rgba(187,138,63,.12)', fill:true, tension:.35, pointBackgroundColor:'#17324f', pointRadius:4 }] },
    options: { plugins:{ legend:{ display:false } },
      scales:{ x:{ ticks:{ color:'#6c7b83', font:{ family:'Kanit', size:11 } }, grid:{ display:false } },
               y:{ beginAtZero:true, ticks:{ stepSize:1, color:'#6c7b83', font:{ family:'Kanit', size:10.5 } }, grid:{ color:'rgba(23,50,79,.08)' } } } }
  });
}

function sortAssets(list) {
  const [field, dir] = state.assetSort.split('_');
  const mul = dir === 'desc' ? -1 : 1;
  return [...list].sort((a, b) => {
    if (field === 'name') return mul * String(a['ชื่อครุภัณฑ์']||'').localeCompare(String(b['ชื่อครุภัณฑ์']||''), 'th');
    if (field === 'value') return mul * ((Number(a['มูลค่า(บาท)'])||0) - (Number(b['มูลค่า(บาท)'])||0));
    if (field === 'date') return mul * (new Date(a['วันที่รับเข้า']||0) - new Date(b['วันที่รับเข้า']||0));
    return 0;
  });
}

/* ========================================================= BORROW */
function renderBorrow() {
  const el = document.getElementById('view-borrow');
  const pending = state.borrow.filter(b => b['สถานะ'] === 'รออนุมัติ');
  const active = state.borrow.filter(b => b['สถานะ'] !== 'คืนแล้ว' && b['สถานะ'] !== 'รออนุมัติ' && b['สถานะ'] !== 'ถูกปฏิเสธ');
  const history = state.borrow.filter(b => b['สถานะ'] === 'คืนแล้ว' || b['สถานะ'] === 'ถูกปฏิเสธ').slice(-15).reverse();
  el.innerHTML = `
    <div class="section-title">
      รายการยืม-คืน <small>${active.length} รายการค้างคืน</small>
      <span class="section-actions"><button class="icon-btn" id="btnExportBorrow" title="ส่งออก CSV">${ICONS.download}</button></span>
    </div>
    ${pending.length ? `<div class="section-title" style="margin-top:0;">คำขอรออนุมัติ <small>${pending.length} รายการ</small></div>
    <div id="borrowPending">${pending.map(borrowRow).join('')}</div>` : ''}
    <div class="section-title">รายการค้างคืน</div>
    <div id="borrowActive">${active.length ? active.map(borrowRow).join('') : emptyState('ไม่มีรายการค้างคืน')}</div>
    <div class="section-title">ประวัติ</div>
    <div>${history.length ? history.map(borrowRow).join('') : emptyState('ยังไม่มีประวัติ')}</div>
  `;
  document.querySelectorAll('.borrow-item').forEach(it => it.onclick = () => openBorrowDetail(it.dataset.id));
  document.getElementById('btnExportBorrow').onclick = () => exportCsv('ยืมคืน.csv', ['รหัสรายการ','รหัสครุภัณฑ์','ชื่อครุภัณฑ์','ผู้ยืม','วันที่ยืม','กำหนดคืน','วันที่คืนจริง','สถานะ','ผู้อนุมัติ','หมายเหตุ'], state.borrow);
}
function effectiveBorrowStatus(b) {
  if (b['สถานะ'] === 'คืนแล้ว' || b['สถานะ'] === 'รออนุมัติ' || b['สถานะ'] === 'ถูกปฏิเสธ') return b['สถานะ'];
  const due = new Date(b['กำหนดคืน']);
  if (!isNaN(due) && due.getTime() < new Date().setHours(0,0,0,0)) return 'เกินกำหนด';
  return b['สถานะ'] || 'กำลังยืม';
}
function borrowRow(b) {
  return `<div class="glass list-item borrow-item" data-id="${b['รหัสรายการ']}">
    <div class="li-icon">${ICONS.swap}</div>
    <div class="li-body">
      <div class="li-title">${escapeHtml(b['ชื่อครุภัณฑ์'])}</div>
      <div class="li-sub">ผู้ยืม: ${escapeHtml(b['ผู้ยืม'])} · กำหนดคืน ${thaiDate(b['กำหนดคืน'])}</div>
    </div>
    <div class="status-badge ${statusClass(effectiveBorrowStatus(b))}">${effectiveBorrowStatus(b)}</div>
  </div>`;
}
function borrowedComponentIds(b) { return String(b['รหัสส่วนควบที่ยืม'] || '').split(',').map(s => s.trim()).filter(Boolean); }
function openBorrowDetail(id) {
  const b = state.borrow.find(x => x['รหัสรายการ'] === id);
  if (!b) return;
  const compIds = borrowedComponentIds(b);
  const compNames = compIds.map(cid => { const c = state.components.find(x => x['รหัสส่วนควบ'] === cid); return c ? c['ชื่อส่วนควบ'] : cid; });
  const status = b['สถานะ'];
  showSheet(`
    <div class="sheet-title">${escapeHtml(b['ชื่อครุภัณฑ์'])}</div>
    <div class="detail-row"><span>ผู้ยืม</span><span>${escapeHtml(b['ผู้ยืม'])}</span></div>
    <div class="detail-row"><span>วันที่ยืม</span><span>${thaiDate(b['วันที่ยืม'])}</span></div>
    <div class="detail-row"><span>กำหนดคืน</span><span>${thaiDate(b['กำหนดคืน'])}</span></div>
    <div class="detail-row"><span>สถานะ</span><span class="status-badge ${statusClass(effectiveBorrowStatus(b))}">${effectiveBorrowStatus(b)}</span></div>
    ${b['ผู้อนุมัติ'] ? `<div class="detail-row"><span>ผู้อนุมัติ</span><span>${escapeHtml(b['ผู้อนุมัติ'])}</span></div>` : ''}
    ${b['วันที่คืนจริง'] ? `<div class="detail-row"><span>วันที่คืนจริง</span><span>${thaiDate(b['วันที่คืนจริง'])}</span></div>` : ''}
    ${compNames.length ? `<div class="detail-row"><span>ส่วนควบที่ยืมด้วย</span><span>${compNames.map(escapeHtml).join(', ')}</span></div>` : ''}
    <div class="detail-row"><span>หมายเหตุ</span><span>${escapeHtml(b['หมายเหตุ']) || '-'}</span></div>
    <div class="btn-row"><button class="btn btn-ghost" id="btnPrintForm">พิมพ์บันทึกขอเบิก-ยืม</button></div>
    ${isAdmin() && status === 'รออนุมัติ' ? `<div class="btn-row">
      <button class="btn btn-danger" id="btnReject">ปฏิเสธ</button>
      <button class="btn btn-ok" id="btnApprove">อนุมัติ</button>
    </div>` : ''}
    ${isAdmin() && (status === 'กำลังยืม' || status === 'เกินกำหนด' || effectiveBorrowStatus(b) === 'เกินกำหนด') ? `<div class="btn-row"><button class="btn btn-primary" id="btnReturn">บันทึกการคืน</button></div>` : ''}
  `);
  document.getElementById('btnPrintForm').onclick = () => openPrintMemoForm({ borrow: b, componentNames: compNames });
  if (isAdmin() && status === 'รออนุมัติ') {
    document.getElementById('btnApprove').onclick = async () => {
      const btn = document.getElementById('btnApprove'); if (btn.disabled) return; setButtonBusy(btn,true,'กำลังอนุมัติ...'); setLoading(true,'กำลังอนุมัติคำขอ...');
      try { await apiPost('approveBorrowRequest', { borrowId: id }); closeSheet(); toast('อนุมัติการยืมแล้ว'); await loadAll(); renderBorrow(); }
      catch(err) { toast(err.message || 'อนุมัติไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn,false); }
    };
    document.getElementById('btnReject').onclick = async () => {
      if (!confirm('ยืนยันการปฏิเสธคำขอยืมนี้?')) return;
      const btn = document.getElementById('btnReject'); if (btn.disabled) return; setButtonBusy(btn,true,'กำลังปฏิเสธ...'); setLoading(true,'กำลังปฏิเสธคำขอ...');
      try { await apiPost('rejectBorrowRequest', { borrowId: id }); closeSheet(); toast('ปฏิเสธคำขอแล้ว'); await loadAll(); renderBorrow(); }
      catch(err) { toast(err.message || 'ปฏิเสธไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn,false); }
    };
  }
  const returnBtn = document.getElementById('btnReturn');
  if (returnBtn) {
    returnBtn.onclick = async () => {
      const btn = document.getElementById('btnReturn'); if (btn.disabled) return; setButtonBusy(btn,true,'กำลังบันทึกการคืน...'); setLoading(true,'กำลังบันทึกการคืน...');
      try { await apiPost('returnAsset', { borrowId: id, returnDate: isoDate() }); closeSheet(); toast('บันทึกการคืนแล้ว'); await loadAll(); renderBorrow(); }
      catch(err) { toast(err.message || 'บันทึกการคืนไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn,false); }
    };
  }
}

    ${admin ? `<div class="field">

      <select class="input" id="f_approverPick">${officerSelectOptions(defaultApproverIdx)}</select>
      <input class="input" id="f_approver" placeholder="พิมพ์ชื่อผู้อนุมัติ" style="margin-top:8px; display:none;">
    </div>` : ''}
    <div class="field"><label>หมายเหตุ</label><input class="input" id="f_bnote"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnCancel">ยกเลิก</button>
      <button class="btn btn-primary" id="btnSave">${admin ? 'บันทึก' : 'ส่งคำขอ'}</button>
    </div>
  `);
  if (!available.length) { toast('ไม่มีครุภัณฑ์ที่พร้อมให้ยืมในขณะนี้'); }

  function wirePicker(pickId, textId) {
    const pick = document.getElementById(pickId), text = document.getElementById(textId);
    pick.onchange = () => {
      if (pick.value === '__other__') { text.style.display = 'block'; text.value=''; text.focus(); }
      else if (pick.value === '') { text.style.display = 'none'; text.value = ''; }
      else { text.style.display = 'none'; text.value = officerFullName(state.users[Number(pick.value)]); }
    };
    if (pick.value && pick.value !== '__other__' && pick.value !== '') pick.onchange();
  }
  wirePicker('f_borrowerPick', 'f_borrower');
  if (admin) wirePicker('f_approverPick', 'f_approver');

  function refreshComponentPicker() {
    const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === val('f_asset'));
    const wrap = document.getElementById('f_compWrap');
    if (!asset || asset['หมวดหมู่'] !== GUN_CATEGORY) { wrap.innerHTML = ''; return; }
    const comps = componentsOf(asset['รหัสครุภัณฑ์']).filter(c => c['สถานะ'] === 'พร้อมใช้งาน');
    wrap.innerHTML = `<label>ส่วนควบที่ยืมไปด้วย</label>` + (comps.length
      ? comps.map(c => `<label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:400; margin-bottom:7px; color:var(--ink);">
          <input type="checkbox" class="f_comp_chk" value="${c['รหัสส่วนควบ']}" style="width:16px;height:16px;"> ${escapeHtml(c['ชื่อส่วนควบ'])} <span style="color:var(--ink-dim); font-size:11px;">(${c['ประเภท']||'-'})</span>
        </label>`).join('')
      : `<div class="hint">ยังไม่มีส่วนควบที่พร้อมใช้งานสำหรับอาวุธปืนนี้</div>`);
  }
  refreshComponentPicker();
  document.getElementById('f_asset').onchange = refreshComponentPicker;
  document.getElementById('btnCancel').onclick = closeSheet;
  document.getElementById('btnSave').onclick = async () => {
    const assetId = val('f_asset');
    const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === assetId);
    if (!val('f_borrower').trim()) { toast('กรุณาเลือกหรือกรอกชื่อผู้ยืม'); return; }
    if (!val('f_asset')) { toast('ไม่พบครุภัณฑ์ที่พร้อมให้ยืม'); return; }
    if (!val('f_borrowdate') || !val('f_duedate')) { toast('กรุณาระบุวันที่ยืมและกำหนดคืน'); return; }
    if (val('f_duedate') < val('f_borrowdate')) { toast('กำหนดคืนต้องไม่ก่อนวันที่ยืม'); return; }
    const componentIds = Array.from(document.querySelectorAll('.f_comp_chk:checked')).map(el => el.value);
    const saveBtn = document.getElementById('btnSave');
    if (saveBtn.disabled) return;
    setButtonBusy(saveBtn, true);
    setLoading(true, admin ? 'กำลังบันทึกการยืม...' : 'กำลังส่งคำขอ...');
    try {
      const payload = {
        assetId, assetName: asset ? asset['ชื่อครุภัณฑ์'] : '', borrower: val('f_borrower'),
        borrowerLineId: '',
        borrowDate: val('f_borrowdate'), dueDate: val('f_duedate'),
        approver: admin ? val('f_approver') : '', note: val('f_bnote'), componentIds
      };
      await apiPost(admin ? 'borrowAsset' : 'requestBorrow', payload);
      closeSheet(); toast(admin ? 'บันทึกการยืมแล้ว' : 'ส่งคำขอยืมแล้ว รอแอดมินอนุมัติ'); await loadAll(); renderBorrow();
    } catch (err) { toast(err.message || 'ทำรายการไม่สำเร็จ'); }
    finally { setLoading(false); setButtonBusy(saveBtn, false); }
  };
}

/* ========================================================= MAINTENANCE */
function renderMaint() {
  const el = document.getElementById('view-maint');
  const open = state.maint.filter(m => m['สถานะ'] !== 'ซ่อมเสร็จ');
  const done = state.maint.filter(m => m['สถานะ'] === 'ซ่อมเสร็จ').slice(-15).reverse();
  el.innerHTML = `
    <div class="section-title">
      งานซ่อมบำรุง <small>${open.length} รายการค้าง</small>
      <span class="section-actions"><button class="icon-btn" id="btnExportMaint" title="ส่งออก CSV">${ICONS.download}</button></span>
    </div>
    <div>${open.length ? open.map(maintRow).join('') : emptyState('ไม่มีงานซ่อมค้าง')}</div>
    <div class="section-title">ประวัติซ่อมเสร็จแล้ว</div>
    <div>${done.length ? done.map(maintRow).join('') : emptyState('ยังไม่มีประวัติ')}</div>
  `;
  document.querySelectorAll('.maint-item').forEach(it => it.onclick = () => openMaintDetail(it.dataset.id));
  document.getElementById('btnExportMaint').onclick = () => exportCsv('ซ่อมบำรุง.csv', ['รหัสรายการ','รหัสครุภัณฑ์','ชื่อครุภัณฑ์','วันที่แจ้ง','อาการ/ปัญหา','ผู้แจ้ง','สถานะ','วันที่ซ่อมเสร็จ','ค่าใช้จ่าย(บาท)','ผู้รับผิดชอบ','หมายเหตุ'], state.maint);
}
function maintRow(m) {

      <div class="li-title">${escapeHtml(m['ชื่อครุภัณฑ์'])}</div>
      <div class="li-sub">${escapeHtml(m['อาการ/ปัญหา'])}</div>
    </div>

/* ========================================================= USERS / OFFICERS (จนท.ในสังกัด — admin only) */
function renderUsers() {

  const el = document.getElementById('view-users');
  el.innerHTML = `
    <div class="section-title">
      รายชื่อข้าราชการตำรวจในสังกัด <small>${state.users.length} คน</small>
      <span class="section-actions">
        <button class="icon-btn" id="btnAddUser" title="เพิ่มรายชื่อ">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </span>
    </div>
    <div class="hint" style="margin-top:0;">ทำเนียบนี้ใช้สำหรับเลือกชื่อแบบดรอปดาวน์ในหน้าเบิก-ยืม และบันทึกขอเบิกพัสดุ (กันพิมพ์ชื่อผิด) ไม่ได้ผูกกับการเข้าสู่ระบบ (ระบบใช้รหัสผ่านตามระดับผู้ใช้งานแทน) — กำหนด "บทบาทในบันทึกเบิก-ยืม" ให้แต่ละคนเพื่อให้ระบบเลือกผู้อนุมัติ/ผู้จ่ายพัสดุให้อัตโนมัติตอนพิมพ์บันทึกข้อความ</div>
    <div id="userList">${state.users.length ? state.users.map(userRow).join('') : emptyState('ยังไม่มีรายชื่อ จนท.ในสังกัด')}</div>
    <div class="section-title">บันทึกกิจกรรมล่าสุด</div>

  const memoRole = u['บทบาทเบิก-ยืม'];
  const roleTag = memoRole && memoRole !== 'ไม่ระบุ (เลือกเองตอนพิมพ์)' ? `<span class="tag tag-brass" style="margin-top:4px;">${escapeHtml(memoRole)}</span>` : '';

      <div class="li-title">${escapeHtml(officerFullName(u))}</div>
      <div class="li-sub">${escapeHtml(u['ตำแหน่ง']) || 'ไม่ระบุตำแหน่ง'}${u['หน่วยงาน'] ? ' · ' + escapeHtml(u['หน่วยงาน']) : ''}</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">

      <div class="li-title">${escapeHtml(a['การกระทำ'])}${a['รายละเอียด'] ? ' · ' + escapeHtml(a['รายละเอียด']) : ''}</div>

      </div>
      <div class="field"><label>ชื่อ-สกุล</label><input class="input" id="u_name" value="${editing ? escapeHtml(u['ชื่อ-สกุล']) : ''}"></div>

      <select class="input" id="u_memorole">${MEMO_ROLES.map(r => `<option ${editing && u['บทบาทเบิก-ยืม']===r?'selected':''}>${r}</option>`).join('')}</select>
    </div>
    <div class="field"><label>ระดับผู้ใช้งาน (สำหรับอ้างอิงเท่านั้น ไม่ผูกกับรหัสผ่านเข้าระบบ)</label>
      <select class="input" id="u_role"><option value="viewer" ${editing && u['สิทธิ์']==='viewer'?'selected':''}>ดูอย่างเดียว</option><option value="admin" ${editing && u['สิทธิ์']==='admin'?'selected':''}>แอดมิน</option></select>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnCancel">ยกเลิก</button>
      <button class="btn btn-primary" id="btnSave">บันทึก</button>
    </div>
    ${editing ? `<div class="btn-row"><button class="btn btn-danger" id="btnDeleteUser">ลบรายชื่อนี้</button></div>` : ''}
  `);
  document.getElementById('btnCancel').onclick = closeSheet;
  document.getElementById('btnSave').onclick = async () => {
    if (!val('u_name').trim()) { toast('กรุณากรอกชื่อ-สกุล'); return; }
    const saveBtn = document.getElementById('btnSave'); if (saveBtn.disabled) return; setButtonBusy(saveBtn,true); setLoading(true,'กำลังบันทึกรายชื่อ จนท....');
    try {
      if (!editing) {
        await apiPost('addUser', { name: val('u_name'), rank: val('u_rank'), position: val('u_position'), unit: val('u_unit'), role: val('u_role'), memoRole: val('u_memorole') });
      } else {
        await apiPost('updateUserRole', { officerId: officerId(u) || undefined, lineUserId: (!officerId(u) && u['LINEUserId']) || undefined, username: (!officerId(u) && u['ชื่อผู้ใช้']) || undefined, name: val('u_name'), rank: val('u_rank'), position: val('u_position'), unit: val('u_unit'), role: val('u_role'), memoRole: val('u_memorole') });
      }
      closeSheet();
      toast(editing ? 'แก้ไขรายชื่อและยศเรียบร้อยแล้ว' : 'บันทึกรายชื่อและยศเรียบร้อยแล้ว');
      try {
        await loadAll();
        renderUsers();
      } catch(refreshErr) {
        toast('บันทึกสำเร็จแล้ว แต่รีเฟรชรายการไม่ทัน — กดรีเฟรชข้อมูลอีกครั้งได้');
      }
    } catch(err) {
      toast('บันทึกไม่สำเร็จ: ' + (err.message || 'เกิดข้อผิดพลาด'));

      setLoading(false);
      setButtonBusy(saveBtn,false);
    }
  };
  if (editing) {

      const oid = officerId(u);
      const identifier = u['LINEUserId'] || u['ชื่อผู้ใช้'] || u['ชื่อ-สกุล'];
      const deleteBtn = document.getElementById('btnDeleteUser');
      if (deleteBtn?.disabled) return;
      setButtonBusy(deleteBtn, true, 'กำลังลบ...');
      setLoading(true, 'กำลังลบรายชื่อ จนท....');

        await apiPost('deleteUser', oid ? { officerId: oid } : { identifier });

        toast('ลบรายชื่อ "' + (u['ชื่อ-สกุล'] || '') + '" เรียบร้อยแล้ว');
        try {
          await loadAll();
          renderUsers();
        } catch(refreshErr) {
          toast('ลบสำเร็จแล้ว แต่รีเฟรชรายการไม่ทัน — กดรีเฟรชข้อมูลอีกครั้งได้');
        }
      } catch(err) {
        toast('ลบไม่สำเร็จ: ' + (err.message || 'เกิดข้อผิดพลาด'));
      } finally {
        setLoading(false);
        setButtonBusy(deleteBtn, false, 'ลบรายชื่อนี้');
      }
    };
  }
}

/* ========================================================= ใบเบิก-ยืม (เอกสารบันทึกข้อความ) — จัดการ/แก้ไข/พิมพ์ */
function renderMemos() {
  const el = document.getElementById('view-memos');
  const list = [...state.memos];
  el.innerHTML = `
    <div class="section-title">เอกสารใบเบิก-ยืม <small>${list.length} ฉบับ</small></div>
    <div class="hint" style="margin-top:0;">คลิกที่เอกสารเพื่อเปิดดู/แก้ไขได้โดยตรงบนหน้าเอกสารจริง แบบเห็นหน้าตาเอกสารเหมือนโปรแกรมเวิร์ด แล้วค่อยบันทึกหรือพิมพ์</div>
    <div id="memoGrid" class="memo-grid">${list.length ? list.map(memoCard).join('') : emptyState('ยังไม่มีเอกสารที่บันทึกไว้ — กดปุ่ม + เพื่อสร้างเอกสารใหม่')}</div>
  `;
  document.querySelectorAll('.memo-card').forEach(it => it.onclick = () => {
    const m = state.memos.find(x => x['รหัสใบเบิก'] === it.dataset.id);
    if (m) openMemoEditor({ id: m['รหัสใบเบิก'], html: m['เนื้อหาเอกสาร(HTML)'], borrowId: m['รหัสรายการยืม'] });
  });
}
// การ์ดเอกสารแบบย่อหน้ากระดาษ (thumbnail) ให้เห็นหน้าตาเอกสารจริงคร่าวๆ เหมือนเบราว์เซอร์ไฟล์ของเวิร์ด

  return `<div class="glass memo-card" data-id="${m['รหัสใบเบิก']}">

      <div class="li-title">${escapeHtml(m['เรื่อง']) || 'ไม่ระบุเรื่อง'}</div>
      <div class="li-sub">${escapeHtml(m['ผู้ขอเบิก']) || ''} ${m['ผู้ขอเบิก'] ? '·' : ''} ${thaiDate(m['วันที่สร้าง'])}</div>

    <p class="pf-body">จึงเรียนมาเพื่อโปรดพิจารณา</p>

// เปิดหน้าเอกสารแบบแก้ไขได้โดยตรง (คลิกที่ข้อความในเอกสารเพื่อพิมพ์ทับได้เลย) — เห็นหน้าเอกสารจริงระหว่างแก้ไข
function openMemoEditor(opts) {
  const isNew = !opts.id;
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="memoOverlay" style="align-items:flex-start; padding-top:20px;">
    <div class="sheet memo-editor-sheet">
      <button class="sheet-close" id="memoCloseBtn" type="button" title="ปิด" aria-label="ปิด">${ICONS.close}</button>
      <div class="sheet-handle"></div>
      <div class="sheet-title" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <span>เอกสารบันทึกข้อความ</span>
      </div>
      <div class="hint" style="margin-top:0;">คลิกตรงข้อความในเอกสารด้านล่างเพื่อแก้ไขได้โดยตรง เหมือนพิมพ์ทับในเอกสารจริง</div>
      <div id="memoDocWrap">${opts.html}</div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="btnMemoClose">ปิด</button>
        ${!isNew && isAdmin() ? `<button class="btn btn-danger" id="btnMemoDelete">ลบเอกสาร</button>` : ''}
        <button class="btn btn-ghost" id="btnMemoPrint">พิมพ์</button>
        <button class="btn btn-primary" id="btnMemoSave">บันทึกเอกสาร</button>
      </div>
    </div>
  </div>`;
  // ไม่ปิดเมื่อคลิกนอกจอ กันข้อมูลที่กำลังพิมพ์หายโดยไม่ตั้งใจ — ต้องกดปิด/ยกเลิกอย่างชัดเจนเท่านั้น
  document.getElementById('memoCloseBtn').onclick = closeSheet;
  document.getElementById('btnMemoClose').onclick = closeSheet;
  document.getElementById('btnMemoPrint').onclick = () => {
    const body = document.getElementById('memoDocBody');
    if (body) document.getElementById('printArea').innerHTML = body.innerHTML;
    setTimeout(() => window.print(), 80);
  };
  document.getElementById('btnMemoSave').onclick = async () => {
    const body = document.getElementById('memoDocBody');
    if (!body) { toast('ไม่พบเนื้อหาเอกสาร'); return; }
    const g = (id) => { const elx = document.getElementById(id); return elx ? elx.textContent.trim() : ''; };
    const payload = {
      id: opts.id || undefined,
      subject: g('ed_subject') || 'ไม่ระบุเรื่อง',
      docNo: g('ed_docno'),
      docDate: g('ed_docdate'),
      requesterName: g('ed_reqname') || g('ed_reqname2'),
      html: body.innerHTML,
      borrowId: opts.borrowId || '',
      status: 'บันทึกแล้ว'
    };
    const btn = document.getElementById('btnMemoSave'); if (btn.disabled) return; setButtonBusy(btn,true,'กำลังบันทึก...'); setLoading(true,'กำลังบันทึกเอกสาร...');
    try {
      const res = await apiPost(isNew ? 'addMemo' : 'updateMemo', payload);
      if (isNew && res && res.id) opts.id = res.id;
      toast('บันทึกเอกสารแล้ว');
      await loadAll();
      if (state.tab === 'memos') renderMemos();
    } catch (err) {
      toast(err.message || 'บันทึกเอกสารไม่สำเร็จ');
    } finally { setLoading(false); setButtonBusy(btn,false); }
  };
  if (!isNew && isAdmin()) {
    document.getElementById('btnMemoDelete').onclick = async () => {
      if (!confirm('ยืนยันการลบเอกสารนี้?')) return;
      try {
        await apiPost('deleteMemo', { id: opts.id });
        closeSheet(); toast('ลบเอกสารแล้ว'); await loadAll(); if (state.tab === 'memos') renderMemos();
      } catch (err) { toast(err.message || 'ลบไม่สำเร็จ'); }
    };
  }
}

/* ========================================================= ตั้งค่าระบบ (Settings) — ธีม / ข้อมูลหน่วยงาน / เลขหนังสือ / รหัสผ่าน / สำรองข้อมูล */
const THEME_KEY = 'hpAssetThemeV1';
const THEMES = [
  { id:'dawn',  name:'รุ่งอรุณ ทางหลวง', swatches:['#17324f','#bb8a3f','#fdf2e4'] },
  { id:'night', name:'ราตรีตรวจการณ์',   swatches:['#0c1e33','#3d7bd6','#0a1420'] },
  { id:'forest',name:'มรกตพงไพร',        swatches:['#1f3d33','#3fae7a','#eef6f0'] },
  { id:'ember', name:'อัคคีสัญญาณ',      swatches:['#3a1f22','#d9704a','#fbeee4'] }
];
function applyTheme(id) {
  document.documentElement.setAttribute('data-theme', id);
  try { localStorage.setItem(THEME_KEY, id); } catch(e) {}
}
function currentTheme() {
  try { return localStorage.getItem(THEME_KEY) || 'dawn'; } catch(e) { return 'dawn'; }
}
applyTheme(currentTheme()); // ใช้ธีมที่เคยเลือกไว้ทันทีตั้งแต่โหลดหน้า

function renderSettings() {
  if (!isAdmin()) return;
  const el = document.getElementById('view-settings');
  const s = state.settings || {};
  const active = currentTheme();
  el.innerHTML = `
    <div class="section-title">ตั้งค่าระบบ</div>

    <div class="section-title" style="margin-top:6px; font-size:14px;">ธีมเว็บ</div>

      <div id="themeSwatchRow" style="display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;">
        ${THEMES.map(t => `
          <div class="theme-swatch-card ${active===t.id?'active':''}" data-theme-id="${t.id}" style="cursor:pointer; border:2px solid ${active===t.id?'var(--gold)':'var(--panel-line)'}; border-radius:14px; padding:10px; width:120px; text-align:center;">
            <div style="display:flex; height:34px; border-radius:8px; overflow:hidden; margin-bottom:8px;">
              ${t.swatches.map(c => `<div style="flex:1; background:${c};"></div>`).join('')}
            </div>
            <div style="font-size:12px;">${t.name}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="section-title" style="margin-top:20px; font-size:14px;">ข้อมูลหน่วยงาน &amp; เลขหนังสือ</div>
    <div class="glass" style="padding:16px; margin-bottom:6px;">
      <div class="field"><label>ส่วนราชการ (แสดงในหัวบันทึกข้อความ)</label><input class="input" id="st_org" value="${escapeHtml(s.orgName || ORG_NAME)}"></div>
      <div class="field"><label>เบอร์โทรศัพท์หน่วยงาน</label><input class="input" id="st_phone" value="${escapeHtml(s.orgPhone || '')}"></div>

      </div>
      <div class="field"><label>แจ้งเตือนล่วงหน้าก่อนครบกำหนดตรวจสภาพ/ต่อทะเบียน (วัน)</label><input class="input" type="number" id="st_renewaldays" value="${s.renewalAlertDays || 30}"></div>

    <div class="glass" style="padding:16px; margin-bottom:6px;">

  });
  document.getElementById('btnSaveSettings').onclick = async () => {

  document.getElementById('btnChangePw').onclick = async () => {
    const role = val('st_pwrole'), pw = val('st_pwnew');
    if (!pw || pw.length < 4) { toast('กรุณากรอกรหัสผ่านใหม่อย่างน้อย 4 ตัวอักษร'); return; }
    if (!confirm('ยืนยันเปลี่ยนรหัสผ่านระดับ "' + (role === 'admin' ? 'แอดมิน' : 'ดูอย่างเดียว') + '" ?')) return;
    const btn = document.getElementById('btnChangePw'); if (btn.disabled) return; setButtonBusy(btn,true); setLoading(true,'กำลังเปลี่ยนรหัสผ่าน...');
    try {
      await apiPost('changeRolePassword', { role, newPassword: pw });
      document.getElementById('st_pwnew').value = '';
      toast('เปลี่ยนรหัสผ่านแล้ว');
    } catch(err) { toast(err.message || 'เปลี่ยนรหัสผ่านไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn,false); }
  };
  document.getElementById('btnExportAll').onclick = () => {
    const data = { assets: state.assets, borrow: state.borrow, maint: state.maint, components: state.components, memos: state.memos, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'สำรองข้อมูลระบบพัสดุ.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    toast('ดาวน์โหลดไฟล์สำรองข้อมูลแล้ว');
  };
}

/* ========================================================= SHEET/MODAL */
function showSheet(html) {
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="overlayEl"><div class="sheet">
    <button class="sheet-close" id="sheetCloseBtn" type="button" title="ปิด" aria-label="ปิด">${ICONS.close}</button>
    <div class="sheet-handle"></div>${html}</div></div>`;
  // หมายเหตุ: จงใจไม่ปิดชีตเมื่อคลิกพื้นหลังนอกจอ (overlay) แล้ว
  // เพราะระหว่างกรอกฟอร์มถ้าคลิกพลาดไปโดนพื้นหลัง ข้อมูลที่พิมพ์ไว้จะหายทันที
  // ต้องกดปุ่มปิด (X) หรือปุ่มยกเลิกในฟอร์มเท่านั้นจึงจะปิด
  document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
}
function closeSheet() { document.getElementById('modalRoot').innerHTML = ''; }
function val(id) { return document.getElementById(id).value; }

/* ========================================================= สร้างข้อมูลเริ่มต้นสำหรับเอกสารใบเบิก-ยืม แล้วเปิดหน้าแก้ไขจริง */
function buildMemoItemList(opts) {
  // สร้างรายการสิ่งของจาก opts.items (หน้ารายละเอียดครุภัณฑ์) หรือ opts.borrow (รายการยืม)
  if (opts.borrow) {
    const b = opts.borrow;
    return [{ name: b['ชื่อครุภัณฑ์'] || '', brand: '', serial: '', qty: 1 }];
  }
  if (opts.items) {
    return opts.items.map(a => ({ name: a['ชื่อครุภัณฑ์'] || '', brand: a['ยี่ห้อ/รุ่น'] || '', serial: a['หมายเลขเครื่อง'] || '', qty: 1 }));
  }
  return [{ name: '', brand: '', serial: '', qty: 1 }];
}

// ช่องเลือกผู้ลงนามแบบดรอปดาวน์ (กันพิมพ์/เลือกชื่อผิด) — เลือกแล้วเติม ยศ/ตำแหน่ง ให้อัตโนมัติ แต่ยังแก้ไขได้
function signerPickerHtml(prefix, defaultIdx, rankVal, nameVal, positionVal) {
  return `
    <div class="memo-signer-pick">
      <select class="input" id="${prefix}Pick">${officerSelectOptions(defaultIdx)}</select>
    </div>
    <div class="memo-two-col">
      <div class="field" style="max-width:130px;"><label>ยศ</label><input class="input" id="${prefix}Rank" value="${escapeHtml(rankVal||'')}"></div>
      <div class="field"><label>ชื่อ-สกุล</label><input class="input" id="${prefix}Name" value="${escapeHtml(nameVal||'')}"></div>
    </div>
    <div class="field"><label>ตำแหน่ง</label><input class="input" id="${prefix}Position" value="${escapeHtml(positionVal||'')}"></div>
  `;
}
function wireSignerPicker(prefix) {
  const pick = document.getElementById(prefix + 'Pick');
  pick.onchange = () => {
    if (pick.value === '' || pick.value === '__other__') return;
    const u = state.users[Number(pick.value)];
    if (!u) return;
    document.getElementById(prefix + 'Rank').value = u['ยศ'] || '';
    document.getElementById(prefix + 'Name').value = u['ชื่อ-สกุล'] || '';
    document.getElementById(prefix + 'Position').value = u['ตำแหน่ง'] || '';
  };
}

// อ่านค่าปัจจุบันจากทุกช่องในฟอร์ม รวมเป็น object ของเอกสาร ใช้ทั้งตอนพรีวิวสดและตอนกดสร้างเอกสารจริง
function collectMemoFormData() {
  const itemNames = document.querySelectorAll('.memo-item-name');
  const itemBrands = document.querySelectorAll('.memo-item-brand');
  const itemSerials = document.querySelectorAll('.memo-item-serial');
  const itemQtys = document.querySelectorAll('.memo-item-qty');
  const finalItems = Array.from(itemNames).map((el, i) => ({
    name: el.value.trim(), brand: itemBrands[i] ? itemBrands[i].value.trim() : '', serial: itemSerials[i] ? itemSerials[i].value.trim() : '', qty: (itemQtys[i] && itemQtys[i].value) || 1
  })).filter(it => it.name);
  const prefix = (state.settings && state.settings.docNoPrefix) || '';
  const docNoSuffix = document.getElementById('m_docno_suffix') ? val('m_docno_suffix') : '';
  return {
    org: val('m_org'), docNo: prefix + docNoSuffix, docDate: val('m_docdate'),
    subject: val('m_subject'), addressee: val('m_addressee'),
    items: finalItems,
    dueDateText: document.getElementById('m_duedate') ? val('m_duedate') : '',
    requester: { rank: val('m_reqRank'), name: val('m_reqName'), position: val('m_reqPosition'), date: val('m_reqDate') },
    approver: { rank: val('m_apvRank'), name: val('m_apvName'), position: val('m_apvPosition'), date: val('m_apvDate') },
    issuer: { rank: val('m_issRank'), name: val('m_issName'), position: val('m_issPosition'), date: val('m_issDate') }
  };
}
function refreshMemoLivePreview() {
  const target = document.getElementById('memoLivePreview');
  if (!target) return;
  const memo = collectMemoFormData();
  target.innerHTML = buildMemoBodyHtml(memo, false);
}

function openPrintMemoForm(opts) {
  const items = buildMemoItemList(opts);
  const borrow = opts.borrow || null;
  const dueDateText = borrow ? thaiDateAbbr(borrow['กำหนดคืน']) : '';
  const defaultSubject = 'ขอเบิก' + (items[0] && items[0].name ? items[0].name : 'พัสดุครุภัณฑ์');
  const requesterNameDefault = borrow ? (borrow['ผู้ยืม'] || '') : (state.user && state.user.name) || '';
  const approverNameDefault = borrow ? (borrow['ผู้อนุมัติ'] || '') : '';

  const reqIdx = findOfficerIndexByName(requesterNameDefault);
  const reqOfficer = reqIdx !== '' ? state.users[Number(reqIdx)] : null;

  let apvIdx = findOfficerIndexByName(approverNameDefault);
  if (apvIdx === '') {
    const apv1 = officersByMemoRole('ผู้อนุมัติ ลำดับที่ 1')[0];
    if (apv1) apvIdx = String(state.users.indexOf(apv1));
  }
  const apvOfficer = apvIdx !== '' && apvIdx !== undefined ? state.users[Number(apvIdx)] : null;

  const issuer1 = officersByMemoRole('ผู้จ่ายพัสดุ')[0];
  const issIdx = issuer1 ? String(state.users.indexOf(issuer1)) : '';
  const issOfficer = issuer1 || null;

  const itemFieldsHtml = items.map((it, i) => `
    <div class="memo-two-col">
      <div class="field"><label>ชื่อพัสดุ #${i+1}</label><input class="input memo-item-name" value="${escapeHtml(it.name)}"></div>
      <div class="field" style="max-width:90px;"><label>จำนวน</label><input class="input memo-item-qty" type="number" min="1" value="${it.qty}"></div>
    </div>
    <div class="memo-two-col">
      <div class="field"><label>ยี่ห้อ/รุ่น</label><input class="input memo-item-brand" value="${escapeHtml(it.brand)}"></div>
      <div class="field"><label>หมายเลขเครื่อง/SN</label><input class="input memo-item-serial" value="${escapeHtml(it.serial)}"></div>
    </div>
  `).join('');

  const orgLine = ORG_NAME + ((state.settings && state.settings.orgPhone) ? (' โทร. ' + state.settings.orgPhone) : (' โทร. ' + ORG_PHONE));
  const docPrefix = (state.settings && state.settings.docNoPrefix) || '';

  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="overlayEl">
    <div class="sheet memo-editor-sheet">
      <button class="sheet-close" id="sheetCloseBtn" type="button" title="ปิด" aria-label="ปิด">${ICONS.close}</button>
      <div class="sheet-handle"></div>
      <div class="sheet-title">สร้างเอกสารบันทึกข้อความ</div>
      <div class="hint" style="margin-top:0;">กรอกข้อมูลด้านล่าง — ตัวอย่างเอกสารหน้าตาเหมือนของจริง (แบบเวิร์ด) จะอัปเดตให้เห็นทันทีทางขวา/ด้านล่าง เลือกชื่อผู้ลงนามจากดรอปดาวน์เพื่อกันเลือกผิดคน</div>
      <div class="mf-grid" id="mfGrid">
        <div class="mf-fields" id="mfFields">

          <div class="memo-section-label">ส่วนหัวหนังสือ</div>
          <div class="field"><label>ส่วนราชการ</label><input class="input" id="m_org" value="${escapeHtml(orgLine)}"></div>
          <div class="memo-two-col">
            <div class="field"><label>ที่ (เลขที่หนังสือ)</label>
              <div style="display:flex; gap:6px; align-items:center;">
                <span class="tag tag-off" style="flex:none;">${escapeHtml(docPrefix) || 'ยังไม่ตั้งค่าเลขที่คงที่'}</span>
                <input class="input" id="m_docno_suffix" placeholder="กรอกเลขที่ครั้งนี้ เช่น 45" style="flex:1;">
              </div>
              ${!docPrefix ? `<div class="hint" style="margin-top:4px;">ยังไม่ได้ตั้งเลขที่หนังสือส่วนคงที่ — ไปตั้งค่าได้ที่เมนู "ตั้งค่าระบบ"</div>` : ''}
            </div>
            <div class="field"><label>วันที่</label><input class="input" id="m_docdate" value="${escapeHtml(thaiDateLong())}"></div>
          </div>
          <div class="field"><label>เรื่อง</label><input class="input" id="m_subject" value="${escapeHtml(defaultSubject)}"></div>
          <div class="field"><label>เรียน (ผู้บังคับบัญชา)</label><input class="input" id="m_addressee" placeholder="เช่น สว.ส.ทล.3 กก.1 บก.ทล."></div>

          <div class="memo-section-label">รายการพัสดุที่ขอเบิก/ยืม</div>
          <div id="m_itemsWrap">${itemFieldsHtml}</div>
          ${dueDateText ? `<div class="field"><label>กำหนดส่งคืนภายในวันที่</label><input class="input" id="m_duedate" value="${escapeHtml(dueDateText)}"></div>` : ''}

          <div class="memo-section-label">ผู้ขอเบิก/ยืม (ผู้ลงชื่อครั้งที่ 1 และ 3)</div>
          ${signerPickerHtml('m_req', reqIdx, reqOfficer ? reqOfficer['ยศ'] : '', requesterNameDefault, reqOfficer ? reqOfficer['ตำแหน่ง'] : '')}
          <div class="field"><label>วันที่ลงนาม</label><input class="input" id="m_reqDate" value="${escapeHtml(thaiDateAbbr())}"></div>

          <div class="memo-section-label">ผู้อนุมัติ (ผู้ลงชื่อครั้งที่ 2)</div>
          ${signerPickerHtml('m_apv', apvIdx, apvOfficer ? apvOfficer['ยศ'] : '', apvOfficer ? apvOfficer['ชื่อ-สกุล'] : approverNameDefault, apvOfficer ? apvOfficer['ตำแหน่ง'] : '')}
          <div class="hint" style="margin-top:0;">มีผู้อนุมัติลำดับสำรองในทำเนียบ ${['ผู้อนุมัติ ลำดับที่ 1','ผู้อนุมัติ ลำดับที่ 2','ผู้อนุมัติ ลำดับที่ 3'].map(r=>officersByMemoRole(r).length).reduce((a,b)=>a+b,0)} คน — เลือกจากดรอปดาวน์ด้านบนเพื่อสลับผู้ลงนามได้ทันที</div>
          <div class="field"><label>วันที่ลงนาม</label><input class="input" id="m_apvDate" value="${escapeHtml(thaiDateAbbr())}"></div>

          <div class="memo-section-label">ผู้จ่ายพัสดุ (ผู้ลงชื่อครั้งที่ 4)</div>
          ${signerPickerHtml('m_iss', issIdx, issOfficer ? issOfficer['ยศ'] : '', issOfficer ? issOfficer['ชื่อ-สกุล'] : '', issOfficer ? issOfficer['ตำแหน่ง'] : '')}
          <div class="field"><label>วันที่ลงนาม</label><input class="input" id="m_issDate" value="${escapeHtml(thaiDateAbbr())}"></div>

        </div>
        <div class="mf-preview">
          <div class="mf-preview-label">ตัวอย่างเอกสาร (หน้าตาจริงเมื่อพิมพ์)</div>
          <div id="memoLivePreviewWrap"><div id="memoLivePreview"></div></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="btnCancel">ยกเลิก</button>
        <button class="btn btn-primary" id="btnGenerate">เปิดเอกสารเพื่อแก้ไข/พิมพ์ →</button>
      </div>
    </div>
  </div>`;
  // ไม่ปิดเมื่อคลิกนอกจอ — ป้องกันข้อมูลที่กำลังกรอกหายโดยไม่ตั้งใจ
  document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);

  wireSignerPicker('m_req');
  wireSignerPicker('m_apv');
  wireSignerPicker('m_iss');
  document.getElementById('mfFields').addEventListener('input', refreshMemoLivePreview);
  document.getElementById('mfFields').addEventListener('change', refreshMemoLivePreview);
  refreshMemoLivePreview();

  document.getElementById('btnCancel').onclick = closeSheet;
  document.getElementById('btnGenerate').onclick = () => {
    const memo = collectMemoFormData();
    if (!memo.items.length) { toast('กรุณากรอกชื่อพัสดุอย่างน้อย 1 รายการ'); return; }
    if (!memo.requester.name.trim()) { toast('กรุณาเลือกหรือกรอกชื่อผู้ขอเบิก/ยืม'); return; }
    closeSheet();
    const html = buildMemoBodyHtml(memo, true);
    openMemoEditor({ id: null, html, borrowId: borrow ? borrow['รหัสรายการ'] : '' });
  };
}

function itemPhraseList(items) {
  const phrases = items.map(it => {
    let p = escapeHtml(it.name);
    if (it.brand) p += ' ยี่ห้อ ' + escapeHtml(it.brand);
    p += ' จำนวน ' + escapeHtml(String(it.qty || 1)) + ' เครื่อง';
    if (it.serial) p += ' หมายเลข SN ' + escapeHtml(it.serial);
    return p;
  });
  if (phrases.length === 1) return phrases[0];
  return phrases.slice(0, -1).join(', ') + ' และ' + phrases[phrases.length - 1];
}

init();
</script>
</body>
</html>
