/* ปุ่มปัดแถวบนธีมมืด: สีเน้นสว่าง ใช้ตัวหนังสือเข้มให้อ่านชัด */
:root[data-mode="dark"] .sw-btn.tone-bad,
:root[data-mode="dark"] .sw-btn.tone-navy{ color:#0b0f14; }

/* ===== ตัวเลือกธีม (แบบกะทัดรัด) ===== */
.theme-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px;
  max-height:260px; overflow-y:auto; padding:3px; overscroll-behavior:contain;
}
.theme-grid::-webkit-scrollbar{ width:4px; }
.theme-grid::-webkit-scrollbar-thumb{ background:var(--panel-line); border-radius:99px; }
.theme-card{
  cursor:pointer; border:2px solid var(--panel-line); border-radius:12px; padding:6px;
  text-align:center; background:var(--panel-soft); transition:transform .14s ease, border-color .14s ease;
}
.theme-card:hover{ transform:translateY(-1px); }
.theme-card.active{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-wash); }
.theme-card .tsw{ display:flex; height:22px; border-radius:6px; overflow:hidden; margin-bottom:5px; }
.theme-card .tsw i{ flex:1; display:block; }
.theme-card .tnm{ display:block; font-size:11px; line-height:1.3; color:var(--ink); }

/* ===== ตรวจประจำเดือน ===== */
.mc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; }
.mc-grid > .empty-state{ grid-column:1 / -1; }
.mc-card{ padding:16px; display:flex; flex-direction:column; gap:12px; }
.mc-card.done-ok{ border-color:var(--ok) !important; }
.mc-card.done-bad{ border-color:var(--bad) !important; }
.mc-head{ display:flex; align-items:center; gap:12px; }
.mc-avatar{ width:48px; height:48px; border-radius:50%; object-fit:cover; flex:none; border:1px solid var(--panel-line); }
.mc-avatar-ph{ width:48px; height:48px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--icon-bg); color:var(--icon); }
.mc-avatar-ph svg{ width:22px; height:22px; }
.mc-name{ font-size:14.5px; font-weight:600; line-height:1.3; }
.mc-pos{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mc-hold{ font-size:13px; padding:9px 12px; border-radius:12px; background:var(--panel-soft); border:1px solid var(--panel-line); line-height:1.5; }
.mc-hold small{ display:block; color:var(--ink-dim); font-size:11px; margin-top:3px; }
.mc-actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.mc-btn{
  min-height:52px; border-radius:14px; border:2px solid var(--panel-line); background:var(--panel);
  font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; transition:transform .12s ease;
}
.mc-btn:active{ transform:scale(.96); }
.mc-btn.ok{ color:var(--ok); }
.mc-btn.bad{ color:var(--bad); }
.mc-btn.ok.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
.mc-btn.bad.on{ background:var(--bad); border-color:var(--bad); color:#fff; }
.mc-meta{ font-size:11px; color:var(--ink-dim); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.mc-meta .link-btn{ color:var(--ink-dim); }
.mc-note{ font-size:12px; color:var(--bad); background:var(--bad-wash); padding:7px 10px; border-radius:10px; word-break:break-word; }
@media (max-width:520px){ .mc-grid{ grid-template-columns:1fr; } }   
   

/* =========================================================
   [ENHANCED] ตรวจประจำเดือน — UI / Theme / View / Print
   ต่อท้าย CSS เดิมเพื่อไม่ตัดของเดิมออก
   ========================================================= */
.mc-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin:0 0 14px;
}
.mc-toolbar-left,.mc-toolbar-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.mc-period{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:18px;
  background:var(--navy-wash);
  border:1px solid var(--panel-line);
}
.mc-period .input{
  width:auto;
  min-width:130px;
  min-height:40px;
  padding:9px 12px;
  border:0;
  background:var(--panel);
}
.mc-period .input:first-child{min-width:145px;}
.mc-tool-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:42px;
  padding:9px 13px;
  border:1px solid var(--panel-line);
  border-radius:14px;
  background:var(--panel);
  color:var(--ink);
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  font-family:inherit;
  font-size:12.5px;
  font-weight:500;
  transition:transform .16s ease,border-color .16s ease,background .16s ease;
}
.mc-tool-btn:hover{
  transform:translateY(-1px);
  border-color:var(--gold-line);
  background:var(--gold-wash);
}
.mc-tool-btn svg{width:17px;height:17px;}
.mc-tool-btn.primary{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(150deg,var(--navy),var(--navy-deep));
  box-shadow:0 8px 20px rgba(23,50,79,.2);
}
.mc-tool-btn.primary:hover{background:linear-gradient(150deg,var(--gold),var(--gold-deep));}
.mc-view-wrap{display:inline-flex;align-items:center;gap:7px;}
.mc-view-label{font-size:11px;color:var(--ink-dim);}
.mc-view-toggle{display:inline-flex;border:1px solid var(--panel-line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-sm);}
.mc-view-toggle button{
  width:42px;height:40px;border:0;background:transparent;color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.mc-view-toggle button svg{width:17px;height:17px;}
.mc-view-toggle button.active{background:var(--navy);color:#fff;}
.mc-view-toggle button:hover:not(.active){background:var(--gold-wash);color:var(--ink);}

.mc-summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:14px;
}
.mc-summary-card{
  padding:14px 16px;
  border-radius:18px;
  border:1px solid var(--panel-line);
  background:var(--panel);
  box-shadow:var(--shadow-sm);
}
.mc-summary-card .num{
  font-family:var(--font-num);
  font-size:24px;
  font-weight:700;
  line-height:1.1;
}
.mc-summary-card .lbl{
  margin-top:5px;
  font-size:11.5px;
  color:var(--ink-dim);
}
.mc-summary-card.ok .num{color:var(--ok);}
.mc-summary-card.bad .num{color:var(--bad);}
.mc-summary-card.pending .num{color:var(--warn);}

.mc-progress-card{
  padding:16px;
  margin-bottom:14px;
  border-radius:20px;
  border:1px solid var(--panel-line);
  background:linear-gradient(135deg,var(--panel),var(--panel-soft));
  box-shadow:var(--shadow-sm);
}
.mc-progress-top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.mc-progress-main{font-size:13px;font-weight:500;}
.mc-progress-main b{font-family:var(--font-num);font-size:19px;color:var(--navy);}
.mc-progress-note{font-size:11.5px;color:var(--ink-dim);text-align:right;}
.mc-progress-note.bad{color:var(--bad);font-weight:600;}

.mc-search-wrap{position:relative;flex:1 1 260px;min-width:220px;}
.mc-search-wrap svg{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--ink-faint);pointer-events:none;
}
.mc-search-wrap .input{padding-left:40px;}

.mc-grid.mc-grid-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.mc-grid.mc-grid-list .mc-card{
  display:grid;
  grid-template-columns:minmax(220px,1.1fr) minmax(230px,1.25fr) minmax(220px,.9fr) auto;
  align-items:center;
  gap:14px;
  padding:14px 16px;
}
.mc-grid.mc-grid-list .mc-head{min-width:0;}
.mc-grid.mc-grid-list .mc-hold{min-width:0;}
.mc-grid.mc-grid-list .mc-actions{grid-column:auto;min-width:205px;}
.mc-grid.mc-grid-list .mc-note{grid-column:2 / -1;}
.mc-grid.mc-grid-list .mc-meta{grid-column:2 / -1;}

.mc-grid.mc-grid-cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:14px;
}
.mc-grid.mc-grid-cards .mc-card{
  min-width:0;
  padding:16px;
}

.mc-card{
  position:relative;
  overflow:hidden;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.mc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.mc-card.done-ok{
  border-color:color-mix(in srgb,var(--ok) 48%,var(--panel-line)) !important;
  background:linear-gradient(145deg,var(--panel),var(--ok-wash));
}
.mc-card.done-bad{
  border-color:color-mix(in srgb,var(--bad) 48%,var(--panel-line)) !important;
  background:linear-gradient(145deg,var(--panel),var(--bad-wash));
}
.mc-card.done-ok::before,.mc-card.done-bad::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--ok);
}
.mc-card.done-bad::before{background:var(--bad);}

.mc-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  width:max-content;
  max-width:100%;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  background:var(--off-wash);
  color:var(--off);
}
.mc-status.ok{background:var(--ok-wash);color:var(--ok);}
.mc-status.bad{background:var(--bad-wash);color:var(--bad);}
.mc-status.pending{background:var(--warn-wash);color:var(--warn);}

.mc-hold-title{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:5px;
  color:var(--navy);
  font-size:11px;
  font-weight:600;
}
.mc-hold-title svg{width:14px;height:14px;}
.mc-serial-list{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}
.mc-serial-pill{
  display:inline-flex;
  align-items:center;
  max-width:100%;
  padding:4px 8px;
  border-radius:9px;
  background:var(--navy-wash);
  color:var(--navy);
  border:1px solid var(--navy-line);
  font-family:var(--font-num);
  font-size:10.5px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.mc-serial-pill.none{
  font-family:var(--font-th);
  color:var(--ink-faint);
  background:var(--off-wash);
  border-color:transparent;
  font-weight:400;
}
.mc-item-count{font-size:10.5px;color:var(--ink-dim);}

.mc-actions{
  background:var(--panel-soft);
  border:1px solid var(--panel-line);
  padding:6px;
  border-radius:16px;
}
.mc-btn{
  position:relative;
  min-height:50px;
  border-radius:12px;
  border:1px solid var(--panel-line);
  background:var(--panel);
  box-shadow:none;
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,border-color .14s ease;
}
.mc-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.mc-btn.ok{
  color:var(--ok);
  border-color:color-mix(in srgb,var(--ok) 30%,var(--panel-line));
  background:linear-gradient(180deg,var(--panel),var(--ok-wash));
}
.mc-btn.bad{
  color:var(--bad);
  border-color:color-mix(in srgb,var(--bad) 30%,var(--panel-line));
  background:linear-gradient(180deg,var(--panel),var(--bad-wash));
}
.mc-btn.ok.on{
  color:#fff;
  border-color:var(--ok);
  background:linear-gradient(150deg,var(--ok),color-mix(in srgb,var(--ok) 78%,#000));
  box-shadow:0 7px 18px var(--ok-wash);
}
.mc-btn.bad.on{
  color:#fff;
  border-color:var(--bad);
  background:linear-gradient(150deg,var(--bad),color-mix(in srgb,var(--bad) 78%,#000));
  box-shadow:0 7px 18px var(--bad-wash);
}
.mc-btn .mc-btn-sub{display:block;font-size:9.5px;font-weight:400;opacity:.72;margin-top:1px;}

.mc-clear{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:8px;
  background:var(--off-wash);
  text-decoration:none !important;
  cursor:pointer;
}
.mc-clear:hover{background:var(--bad-wash);color:var(--bad) !important;}

.mc-checklist-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;margin-bottom:10px;border-radius:14px;
  background:var(--navy-wash);border:1px solid var(--panel-line);
}
.mc-checklist-count{font-size:12px;color:var(--ink-dim);}
.mc-checklist-count b{font-family:var(--font-num);font-size:16px;color:var(--navy);}
.ck-row{
  display:flex !important;align-items:center;gap:10px !important;
  padding:11px 2px !important;border-bottom:1px solid var(--panel-line) !important;
}
.ck-row:last-child{border-bottom:0 !important;}
.ck-row > div:first-child{padding:3px 0;}
.ck-serial{
  display:inline-flex;align-items:center;gap:5px;margin-top:3px;
  color:var(--navy);font-family:var(--font-num);font-size:10.5px;font-weight:600;
}
.ck-row .mc-btn{min-height:42px;padding:7px 11px;font-size:12px;}

@media (max-width:1100px){
  .mc-grid.mc-grid-list .mc-card{
    grid-template-columns:minmax(190px,1fr) minmax(210px,1fr);
  }
  .mc-grid.mc-grid-list .mc-actions{grid-column:2;}
  .mc-grid.mc-grid-list .mc-note,.mc-grid.mc-grid-list .mc-meta{grid-column:1 / -1;}
}
.mc-tool-group{
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  padding:3px;
  border-radius:16px;
  background:var(--navy-wash);
  border:1px solid var(--panel-line);
}
.mc-tool-group .mc-view-toggle{box-shadow:none;}
.mc-tool-group .mc-print-icon{box-shadow:none;}

@media (max-width:760px){
  .mc-toolbar{align-items:stretch;}
  .mc-toolbar-left,.mc-toolbar-right{width:100%;}
  .mc-period{width:100%;}
  .mc-period .input{flex:1;min-width:0;}
  .mc-toolbar-right{justify-content:flex-end;}
  .mc-tool-group{flex:0 0 auto;}
  .mc-summary{grid-template-columns:repeat(2,minmax(0,1fr));}
  .mc-grid.mc-grid-list .mc-card{
    display:flex;
    flex-direction:column;
    align-items:stretch;
  }
  .mc-grid.mc-grid-list .mc-actions{min-width:0;}
}
@media (max-width:520px){
  .mc-summary{gap:8px;}
  .mc-summary-card{padding:12px;}
  .mc-summary-card .num{font-size:21px;}
  .mc-period{display:grid;grid-template-columns:1fr 1fr;}
  .mc-period .input{width:100%;min-width:0;}
  .mc-search-wrap{min-width:100%;}
  .mc-toolbar-right{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-end;gap:7px;min-width:0;}
  .mc-tool-group{gap:5px;padding:2px;border-radius:15px;}
  .mc-view-toggle{margin-left:0;flex:0 0 auto;}
  .mc-tool-btn.mc-print-icon{width:42px;height:40px;min-width:42px;padding:0;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 42px;}
  .mc-tool-btn.mc-print-icon span{display:none;}
  .mc-tool-btn.mc-print-icon svg{width:18px;height:18px;}
}



/* ===== FINAL MONTHLY LAYOUT — clean, stable, responsive ===== */
#view-monthly .mc-card-list,
#view-monthly .mc-card-grid{box-sizing:border-box;min-width:0;}

/* shared structure */
#view-monthly .mc-list-person,
#view-monthly .mc-list-assets,
#view-monthly .mc-list-actions,
#view-monthly .mc-grid-person{min-width:0;}
#view-monthly .mc-list-person{display:flex;align-items:center;gap:12px;}
#view-monthly .mc-list-person-info{min-width:0;flex:1;}
#view-monthly .mc-list-assets{
  padding:12px 14px;border:1px solid var(--panel-line);border-radius:14px;
  background:var(--panel-soft);min-width:0;
}
#view-monthly .mc-list-summary,
#view-monthly .mc-grid-hold-summary{font-size:12px;font-weight:600;margin:5px 0;color:var(--ink);}
#view-monthly .mc-list-actions{min-width:0;}
#view-monthly .mc-grid-person{display:flex;align-items:center;gap:10px;}
#view-monthly .mc-grid-avatar{display:flex;align-items:center;justify-content:center;flex:none;}
#view-monthly .mc-grid-divider{height:1px;background:var(--panel-line);margin:12px 0;}
#view-monthly .mc-grid-hold{margin:0 !important;}
#view-monthly .mc-card-grid .mc-actions{margin-top:12px;}

/* desktop: List = wide working row */
@media (min-width:900px){
  #view-monthly > *{
    width:100%;max-width:none;margin-left:0;margin-right:0;box-sizing:border-box;
  }
  #view-monthly .mc-toolbar{width:100%;margin-bottom:12px;}
  #view-monthly .mc-summary{width:100%;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px;}
  #view-monthly .mc-progress-card,
  #view-monthly .search-row,
  #view-monthly #mcHiddenHint{width:100%;}

  #view-monthly .mc-grid.mc-grid-list{
    display:flex;flex-direction:column;gap:10px;
  }
  #view-monthly .mc-grid.mc-grid-list .mc-card-list{
    display:grid;
    grid-template-columns:minmax(240px,.9fr) minmax(360px,1.45fr) minmax(260px,.9fr);
    grid-template-areas:"person assets actions" "meta meta meta";
    align-items:center;
    gap:14px 18px;
    padding:16px 18px;
  }
  #view-monthly .mc-grid.mc-grid-list .mc-list-person{grid-area:person;}
  #view-monthly .mc-grid.mc-grid-list .mc-list-assets{grid-area:assets;}
  #view-monthly .mc-grid.mc-grid-list .mc-list-actions{grid-area:actions;width:100%;}
  #view-monthly .mc-grid.mc-grid-list .mc-note,
  #view-monthly .mc-grid.mc-grid-list .mc-meta{grid-area:meta;width:100%;}

  #view-monthly .mc-grid.mc-grid-cards{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  }
  #view-monthly .mc-grid.mc-grid-cards .mc-card-grid{
    display:flex;flex-direction:column;align-items:stretch;min-width:0;
    padding:18px;
  }
}

@media (min-width:900px) and (max-width:1250px){
  #view-monthly .mc-grid.mc-grid-list .mc-card-list{
    grid-template-columns:minmax(210px,.9fr) minmax(300px,1.2fr) minmax(230px,.9fr);
  }
  #view-monthly .mc-grid.mc-grid-cards{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* toolbar desktop/mobile alignment */
#view-monthly .mc-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;}
#view-monthly .mc-toolbar-left{min-width:0;}
#view-monthly .mc-toolbar-right{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto;}
#view-monthly .mc-tool-group{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;}
#view-monthly .mc-view-toggle{display:inline-flex;flex:0 0 auto;}
#view-monthly .mc-print-icon{width:42px;height:40px;min-width:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;}

/* tablet/mobile */
@media (max-width:899px){
  #view-monthly > *{width:100%;max-width:none;box-sizing:border-box;}
  #view-monthly .mc-summary{grid-template-columns:repeat(2,minmax(0,1fr));}
  #view-monthly .mc-toolbar{gap:10px;}
  #view-monthly .mc-toolbar-left{flex:1 1 auto;}
  #view-monthly .mc-toolbar-right{flex:0 0 auto;}

  /* LIST: compact two-column work row */
  #view-monthly .mc-grid.mc-grid-list{
    display:flex;flex-direction:column;gap:9px;
  }
  #view-monthly .mc-grid.mc-grid-list .mc-card-list{
    display:grid !important;
    grid-template-columns:minmax(118px,.72fr) minmax(0,1.28fr);
    grid-template-areas:
      "person assets"
      "person actions"
      "meta meta";
    align-items:start;
    gap:8px 10px;
    padding:10px;
    border-radius:13px;
  }
  #view-monthly .mc-grid.mc-grid-list .mc-list-person{grid-area:person;align-items:flex-start;}
  #view-monthly .mc-grid.mc-grid-list .mc-list-person .mc-avatar,
  #view-monthly .mc-grid.mc-grid-list .mc-list-person .mc-avatar-ph{
    width:34px;height:34px;min-width:34px;
  }
  #view-monthly .mc-grid.mc-grid-list .mc-name{font-size:12px;line-height:1.35;}
  #view-monthly .mc-grid.mc-grid-list .mc-pos{font-size:10px;white-space:normal;line-height:1.3;}
  #view-monthly .mc-grid.mc-grid-list .mc-list-assets{
    grid-area:assets;padding:8px 9px;border-radius:10px;
  }

/* แท็บเล็ต / มือถือ: ย่อให้กะทัดรัด */
@media (max-width:1024px){
  .command-overlay{ padding:max(10px, env(safe-area-inset-top)) 10px 10px !important; }
  .command-sheet{
    width:100% !important;
    max-width:560px !important;
    max-height:calc(100dvh - 20px) !important;
    border-radius:18px !important;
  }
  .command-top{ padding:14px 48px 10px 14px !important; }
  .command-brand{ gap:10px !important; }
  .command-brand-icon{
    width:34px !important; height:34px !important;
    min-width:34px !important; max-width:34px !important;
    min-height:34px !important; max-height:34px !important;
    flex:0 0 34px !important; border-radius:11px !important;
  }
  .command-brand-icon svg{
    width:16px !important; height:16px !important;
    min-width:16px !important; max-width:16px !important;
    min-height:16px !important; max-height:16px !important;
  }
  .command-title{ font-size:15px !important; }
  .command-subtitle{ display:none !important; }   /* ซ่อนบรรทัดรอง ประหยัดที่ */
  .command-close{ top:10px !important; right:10px !important; width:30px !important; height:30px !important; }
  .command-searchbox{ margin:10px 12px 0 !important; height:44px !important; border-radius:13px !important; }
  .command-search{ height:40px !important; line-height:40px !important; font-size:16px !important; } /* 16px กัน iOS ซูมเอง */
  .command-kbd{ display:none !important; }
  .command-hint{ margin:6px 14px 8px !important; }
  .command-results{ padding:0 8px calc(10px + env(safe-area-inset-bottom)) !important; }
  .command-item{ min-height:54px !important; padding:7px 9px !important; }
  .command-item-icon{
    width:34px !important; height:34px !important;
    min-width:34px !important; max-width:34px !important;
    min-height:34px !important; max-height:34px !important;
    flex:0 0 34px !important;
  }
}

/* มือถือ: ชิดบนและเต็มความกว้าง */
@media (max-width:599px){
  .command-sheet{ max-width:none !important; }
  .command-hint{ display:none !important; }
}

/* ===== แก้เลื่อนไม่ได้บน iPad (v2) ===== */

/* 1) ให้ html/body เลิกเป็นตัวเลื่อนแยก ใช้ clip แทน hidden */
html, body{
  overflow-x:clip;
  height:auto;
  min-height:100%;
}

/* 3) หน้าต่างทั้งหมด */
.overlay, .command-overlay{
  height:100vh; height:100dvh;
  overscroll-behavior:contain;
  touch-action:none;               /* พื้นหลังมืด ไม่ต้องเลื่อน */
}
.sheet{
  max-height:92vh !important;
  max-height:92dvh !important;
  overflow-y:auto !important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}

/* 4) ค้นหาด่วน: ให้รายการผลลัพธ์เป็นตัวเลื่อน */
.command-sheet{ touch-action:auto; }
.command-results{
  overflow-y:auto !important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}

/* ===== เลือกผู้ยืม: ลดภาระตอนเลื่อน (iPad) ===== */
.op-sheet .list-item,
.op-sheet .glass{
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  box-shadow:none !important;
  transition:none !important;
  animation:none !important;
  transform:none !important;
}
.op-sheet .list-item:hover{ transform:none !important; }
.op-sheet .list-item{
  content-visibility:auto;               /* ไม่วาดแถวที่อยู่นอกจอ */
  contain-intrinsic-size:auto 66px;
}
.op-sheet .li-avatar{
  width:42px; height:42px;
  background:var(--panel-soft);
}
.op-sheet #opList{
  -webkit-overflow-scrolling:touch;
  transform:translateZ(0);               /* ยกขึ้น GPU layer */
}   

   /* ===== ลายเซ็น ===== */
.sig-canvas{display:block;width:100%;height:210px;border:1.5px dashed var(--navy-line);border-radius:16px;background:#fff;touch-action:none;cursor:crosshair;}
.sig-saved{border:1px solid var(--panel-line);border-radius:16px;background:#fff;padding:16px;text-align:center;}
.sig-saved img{max-width:100%;max-height:180px;}
.photo-upload-row .preview-box.sig-box{width:120px;border-radius:12px;background:#fff;}
.photo-upload-row .preview-box.sig-box img{object-fit:contain;}

/* ===== ลายเซ็นเอกสารใบเบิก ===== */

.pf-sign{
  width:10cm;
  margin:16pt 0 0 4.1cm;
  text-align:center;
}

/* แถว ยศ + ลายเซ็น
   ยศอยู่ฝั่งซ้ายของกลุ่มลายเซ็น โดย "ตัวอักษรสุดท้ายของยศ"
   จัดให้ตรงกับจุดเริ่มต้นของวงเล็บเปิดชื่อ ( ของบรรทัดถัดไป */
.pf-sign-rank{
  display:grid;
  grid-template-columns: 1fr 1fr;
  align-items:center;
  min-height:14mm;
  padding:0 !important;
}

/* ยศ: ใช้คอลัมน์ซ้ายเป็นพื้นที่เดิม เพื่อไม่ให้กระทบตำแหน่งลายเซ็น
   จากนั้น JavaScript จะขยับเฉพาะตัวอักษรยศให้ "ตัวสุดท้าย" ตรงกับ ( ของชื่อ */
.pf-sign-rank .pf-rank{
  grid-column:1;
  justify-self:end;
  text-align:right;
  white-space:nowrap;
  margin:0;
  transform:translateX(0);
}

/* ตำแหน่ง/ชื่อ/วันที่ ห้ามตัดขึ้นบรรทัดใหม่ */
.pf-sign > div:not(.pf-sign-rank){
  white-space:nowrap !important;
}

/* ลายเซ็นอยู่ฝั่งขวา */
.pf-doc .pf-sigimg{
  position:static;
  display:block;
  justify-self:center;
  height:12mm;
  width:auto;
  max-width:4.4cm;
  object-fit:contain;
  transform:none;
  pointer-events:none;
}

/* ชื่อ / ตำแหน่ง / วันที่
   ให้อยู่ใต้ "ลายเซ็น" ฝั่งขวา */
.pf-sign > div:not(.pf-sign-rank){
  width:50%;
  margin-left:50%;
  text-align:center;
  box-sizing:border-box;
}

.pf-sign > div{
  line-height:19pt;
  min-height:19pt;
}

/* ตำแหน่งในบล็อกลายเซ็นทุกเอกสารต้องอยู่บรรทัดเดียว ห้ามตัดขึ้นบรรทัดใหม่ */
.pf-sign [id*="position"]{
  white-space:nowrap !important;
  overflow:visible;
}   

   @media print{
  html, body, body.modal-open{
    position:static !important;
    inset:auto !important;
    width:auto !important;
    height:auto !important;
    overflow:visible !important;
    transform:none !important;
  }
}

/* =========================================================
   ธีม LIQUID GLASS (สไตล์ iOS) — วางท้ายสุดของ <style>
   ========================================================= */
:root[data-theme="liquid"]{
  --dawn-1:#dcecff; --dawn-2:#efe3ff; --dawn-3:#e2f3ff; --dawn-4:#e6ecff;
  --bg-0:#e4ecfa; --bg-1:#f1f5ff;
  --panel:rgba(255,255,255,.34); --panel-soft:rgba(255,255,255,.28);
  --panel-line:rgba(255,255,255,.55); --panel-hi:rgba(255,255,255,.55);
  --ink:#14223b; --ink-dim:#4d5d7a; --ink-faint:#8a97b2;
  --navy:#0a84ff; --navy-deep:#0060df; --navy-wash:rgba(10,132,255,.12); --navy-line:rgba(10,132,255,.35);
  --gold:#5ac8fa; --gold-deep:#1c9ad6; --gold-wash:rgba(90,200,250,.18); --gold-line:rgba(90,200,250,.5);
  --side-1:rgba(20,40,90,.46); --side-2:rgba(10,20,60,.58);
  --glass-blur:blur(26px) saturate(190%); --glass-edge:rgba(255,255,255,.7);
  --glass-shadow:0 10px 34px rgba(40,70,150,.16), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.25);
  --topbar-bg:rgba(255,255,255,.38); --tabbar-bg:rgba(255,255,255,.42); --sheet-bg:rgba(255,255,255,.62);
  --icon:#0a84ff; --icon-bg:rgba(10,132,255,.14);
  --c1:#0a84ff; --c2:#30d158; --c3:#5ac8fa; --c4:#ff9f0a; --c5:#ff375f; --c6:#8e9bb5;
  --chart-line:#0a84ff; --chart-bar:#5ac8fa; --chart-edge:rgba(255,255,255,.7);
  --r-xl:30px; --r-lg:26px; --r-md:20px; --r-sm:16px;
}
:root[data-theme="liquid"] body{
  background:
    radial-gradient(520px 420px at 12% 6%,  rgba(10,132,255,.55), transparent 62%),
    radial-gradient(480px 400px at 92% 12%, rgba(191,90,242,.42), transparent 62%),
    radial-gradient(560px 460px at 78% 92%, rgba(48,209,88,.34), transparent 62%),
    radial-gradient(520px 420px at 6% 88%,  rgba(255,159,10,.30), transparent 62%),
    linear-gradient(160deg,#e6efff,#f3ecff 50%,#e4f6ff);
  background-attachment:fixed;
}
/* การ์ดทุกชนิด = กระจกเบลอ + ขอบสว่างด้านบน */
:root[data-theme="liquid"] .glass:not(.hero-card),
:root[data-theme="liquid"] .stat-card,
:root[data-theme="liquid"] .chart-card,
:root[data-theme="liquid"] .rp-card,
:root[data-theme="liquid"] .rp-kpi,
:root[data-theme="liquid"] .list-item,
:root[data-theme="liquid"] .asset-card,
:root[data-theme="liquid"] .memo-card,
:root[data-theme="liquid"] .mc-card,
:root[data-theme="liquid"] .mc-summary-card,
:root[data-theme="liquid"] .mc-progress-card{
  background:linear-gradient(160deg,rgba(255,255,255,.52),rgba(255,255,255,.22)) !important;
  border:1px solid rgba(255,255,255,.7) !important;
  box-shadow:var(--glass-shadow) !important;
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
}
:root[data-theme="liquid"] .hero-card{
  background:linear-gradient(145deg,rgba(10,132,255,.82),rgba(0,70,190,.78)) !important;
  border:1px solid rgba(255,255,255,.45) !important;
  box-shadow:0 18px 44px rgba(10,100,255,.32), inset 0 1.5px 0 rgba(255,255,255,.55) !important;
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
}
:root[data-theme="liquid"] .hero-num--sm{ color:#bfe9ff; }
/* ช่องกรอก / ปุ่ม */
:root[data-theme="liquid"] .input,
:root[data-theme="liquid"] select.input{
  background:rgba(255,255,255,.5) !important; color:var(--ink);
  border:1px solid rgba(255,255,255,.75); box-shadow:inset 0 1px 2px rgba(40,70,150,.08);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
}
:root[data-theme="liquid"] .input:focus{ background:rgba(255,255,255,.8) !important; box-shadow:0 0 0 4px var(--navy-wash); }
:root[data-theme="liquid"] .chip:not(.active),
:root[data-theme="liquid"] .ax-pill:not(.active),
:root[data-theme="liquid"] .btn-ghost,
:root[data-theme="liquid"] .icon-btn,
:root[data-theme="liquid"] .refresh-btn,
:root[data-theme="liquid"] .ax-round,
:root[data-theme="liquid"] .zbtn,
:root[data-theme="liquid"] .pagination button,
:root[data-theme="liquid"] .sheet-close,
:root[data-theme="liquid"] .mc-tool-btn,
:root[data-theme="liquid"] .mc-view-toggle,
:root[data-theme="liquid"] .view-toggle,
:root[data-theme="liquid"] .loading-card{
  background:rgba(255,255,255,.5) !important; color:var(--ink);
  border:1px solid rgba(255,255,255,.75) !important;
  box-shadow:0 4px 14px rgba(40,70,150,.10), inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
}
:root[data-theme="liquid"] .btn-primary,
:root[data-theme="liquid"] .chip.active,
:root[data-theme="liquid"] .ax-pill.active{
  background:linear-gradient(160deg,#4aa8ff,#0a6cff) !important; color:#fff;
  border-color:rgba(255,255,255,.5) !important;
  box-shadow:0 8px 20px rgba(10,108,255,.35), inset 0 1px 0 rgba(255,255,255,.5) !important;
}
/* แถบบน + เมนูล่าง/ซ้าย */
:root[data-theme="liquid"] .topbar{
  background:var(--topbar-bg) !important; border-bottom:1px solid rgba(255,255,255,.7) !important;
  -webkit-backdrop-filter:blur(26px) saturate(190%); backdrop-filter:blur(26px) saturate(190%);
}
:root[data-theme="liquid"] .tabbar{
  background:var(--tabbar-bg) !important; border:1px solid rgba(255,255,255,.75) !important;
  box-shadow:0 16px 40px rgba(40,70,150,.22), inset 0 1.5px 0 rgba(255,255,255,.95) !important;
  -webkit-backdrop-filter:blur(30px) saturate(200%); backdrop-filter:blur(30px) saturate(200%);
}
:root[data-theme="liquid"] .tab-pill{
  background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.45)) !important;
  box-shadow:0 4px 14px rgba(40,70,150,.2), inset 0 1.5px 0 #fff !important;
}
:root[data-theme="liquid"] .tabbar .tab.active{ color:#0a5fd8 !important; }
@media (min-width:900px){
  :root[data-theme="liquid"] .tabbar{
    background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.22)) !important;
  }
  :root[data-theme="liquid"] .tabbar::before{ color:var(--ink); }
  :root[data-theme="liquid"] .tabbar::after{ color:var(--ink-dim); border-bottom-color:rgba(255,255,255,.6); }
  :root[data-theme="liquid"] .tab{ color:var(--ink-dim); }
  :root[data-theme="liquid"] .tab:hover{ background:rgba(255,255,255,.45); color:var(--ink); }
  :root[data-theme="liquid"] .tab.active{
    background:rgba(255,255,255,.7) !important; color:#0a5fd8;
    box-shadow:inset 0 1px 0 #fff, 0 4px 14px rgba(40,70,150,.15) !important;
  }
}
/* หน้าต่าง popup */
:root[data-theme="liquid"] .sheet{
  background:var(--sheet-bg) !important; border:1px solid rgba(255,255,255,.8) !important;
  box-shadow:0 30px 80px rgba(30,60,140,.3), inset 0 1.5px 0 #fff !important;
  -webkit-backdrop-filter:blur(34px) saturate(200%); backdrop-filter:blur(34px) saturate(200%);
}
:root[data-theme="liquid"] .overlay{ background:rgba(40,60,120,.28); }
:root[data-theme="liquid"] .toast{ background:rgba(255,255,255,.75); color:var(--ink); border-color:rgba(255,255,255,.9); backdrop-filter:blur(20px); }
:root[data-theme="liquid"] .login-wrap{
  background:
    radial-gradient(520px 420px at 15% 8%, rgba(10,132,255,.7), transparent 62%),
    radial-gradient(480px 400px at 90% 90%, rgba(191,90,242,.55), transparent 62%),
    linear-gradient(160deg,#0a2a6b,#1b4fd0 55%,#5a3fd0);
}   


   /* =========================================================
      TOUCH / iPAD PERFORMANCE + MODAL SCROLL
      - มี scroller หลักเพียงชั้นเดียวใน modal
      - ตัวอย่าง A4 ไม่แย่ง gesture กับ modal
      - ไม่ปิด Liquid Glass ทั้งระบบ
      ========================================================= */
body.modal-open{ overflow:hidden; overscroll-behavior:none; }

.nav-collapse-btn{ display:none; }

@media (max-width:1024px), (hover:none) and (pointer:coarse){
  /* ลดเฉพาะ animation ที่ไม่เกี่ยวกับการใช้งาน */
  .hero-card::before{ animation:none !important; }
  .list-item,.asset-card,.stat-card,.chart-card,.mc-card{
    transition:none !important;
  }
  .list-item:hover,.asset-card:hover,.mc-card:hover{
    transform:none !important;
  }

  /* modal: ให้ overlay ไม่เป็น scroller */
  #modalRoot > .overlay,
  #modalRoot > .command-overlay{
    overflow:hidden !important;
    overscroll-behavior:none !important;
  }

  /* สร้างเอกสาร: ให้ .sheet เป็น vertical scroller เพียงตัวเดียว */
  #modalRoot > .overlay > .sheet.memo-form-sheet{
    display:block !important;
    width:100% !important;
    max-width:760px !important;
    height:auto !important;
    max-height:92dvh !important;
    overflow-x:hidden !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch !important;
    overscroll-behavior:contain !important;
    touch-action:pan-y !important;
  }

  /* แท็บกรอก/ตัวอย่างยังใช้เหมือนเดิม แต่ไม่มี nested scroller */
  .memo-form-sheet .mf-tabs{
    display:flex !important;
    position:sticky;
    top:0;
    z-index:5;
  }
  .memo-form-sheet .mf-grid{
    display:block !important;
    overflow:visible !important;
  }
  .memo-form-sheet .mf-fields{
    display:block !important;
    overflow:visible !important;
    min-height:0 !important;
    padding-right:0 !important;
  }
  .memo-form-sheet .mf-preview{
    display:block !important;
    position:static !important;
    min-height:0 !important;
    contain:none !important;
  }
  .memo-form-sheet .mf-grid[data-view="form"] .mf-preview{
    display:none !important;
  }
  .memo-form-sheet .mf-grid[data-view="preview"] .mf-fields{
    display:none !important;
  }

  /* A4 เป็นเนื้อหาของ modal ไม่ใช่กล่อง scroll ซ้อน */
  .memo-form-sheet .mf-preview .paper-desk,
  .memo-doc-sheet .paper-desk{
    overflow:visible !important;
    max-height:none !important;
    -webkit-overflow-scrolling:auto !important;
    overscroll-behavior:initial !important;
    touch-action:auto !important;
  }

  /* ลด repaint เฉพาะตัวกระดาษ ไม่ตัด Liquid Glass ของระบบ */
  .memo-form-sheet .paper-desk,
  .memo-doc-sheet .paper-desk{
    box-shadow:none !important;
  }

  /* modal เอกสารเดี่ยว */
  #modalRoot > .overlay > .sheet.memo-doc-sheet{
    overflow-x:hidden !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch !important;
    overscroll-behavior:contain !important;
    touch-action:pan-y !important;
  }

  /* ไม่ปิด blur ทั้งระบบอีกแล้ว — เฉพาะพื้นที่ modal ที่กำลัง scroll */
  html.touch-device .memo-form-sheet,
  html.touch-device .memo-doc-sheet{
    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;
  }

  /* Liquid Glass บนจอสัมผัสยังโปร่งใส */
  :root[data-theme="liquid"] html.touch-device .memo-form-sheet,
  :root[data-theme="liquid"] html.touch-device .memo-doc-sheet{
    background:rgba(255,255,255,.72) !important;
  }

  /* ค้นหาด่วน: scroller เดียว */
  #modalRoot > .command-overlay > .command-sheet{
    overflow:hidden !important;
  }
  #modalRoot > .command-overlay .command-results{
    overflow-x:hidden !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch !important;
    overscroll-behavior:contain !important;
    touch-action:pan-y !important;
  }

  /* ป้องกัน iPad zoom จากช่องกรอก */
  html.touch-device .input,
  html.touch-device select.input,
  html.touch-device .command-search{
    font-size:16px !important;
  }
}

/* desktop: คงพฤติกรรมสองคอลัมน์และให้แต่ละฝั่งเลื่อนของตัวเอง */
@media (min-width:900px){
  .sheet.memo-form-sheet{
    display:flex !important;
    flex-direction:column;
    height:min(92dvh,960px) !important;
    max-height:min(92dvh,960px) !important;
    overflow:hidden !important;
  }
  .memo-form-sheet .mf-grid{
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
    align-items:stretch;
    grid-template-rows:minmax(0,1fr);
  }
  .memo-form-sheet .mf-fields{
    overflow-y:auto !important;
    min-height:0;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    touch-action:pan-y;
    padding-right:6px;
  }
  .memo-form-sheet .mf-preview{
    position:static !important;
    display:flex !important;
    flex-direction:column;
    min-height:0;
    contain:layout paint;
  }
  .memo-form-sheet .mf-preview .paper-desk{
    flex:1 1 auto;
    min-height:0;
    max-height:none !important;
    overscroll-behavior:contain;
  }
  .memo-form-sheet .btn-row{ flex:none; }
}

/* =========================================================
   DESKTOP NAVBAR — V3 / สไตล์แบบที่ 3
   - คง Navbar เดิมทั้งหมด

function currentTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  // ถ้า id ที่เคยบันทึกไว้ไม่มีในรายการแล้ว (เช่น 'night' ของเดิม) ให้ถอยกลับไปธีมเริ่มต้น
  if (saved && THEMES.some(t => t.id === saved)) return saved;
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return dark ? 'obsidian' : 'dawn';
}
function applyTheme(id) {
  if (!THEMES.some(t => t.id === id)) id = 'dawn';
  const root = document.documentElement;
  root.setAttribute('data-theme', id);
  const t = THEMES.find(x => x.id === id) || {};
  // ป้ายโหมดมืด/กลาส ให้ CSS ใช้จับกลุ่มธีม
  if (t.mode) root.setAttribute('data-mode', t.mode); else root.removeAttribute('data-mode');
  if (t.glass) root.setAttribute('data-glass', '1'); else root.removeAttribute('data-glass');
  try { localStorage.setItem(THEME_KEY, id); } catch (e) {}
}
applyTheme(currentTheme());

    /Macintosh|iPad|iPhone|Android/i.test(navigator.userAgent);
  if (isTouchTablet) document.documentElement.classList.add('touch-device');
})();

    try { if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'obsidian' : 'dawn'); } catch (_) {}
  });
} catch (_) {}

  const root = document.documentElement;
  if (!document.fonts || !document.fonts.load) { root.classList.add('has-thsarabun'); return; }

    document.fonts.load("16pt 'TH Sarabun New'", 'ภาษาไทย'),
    document.fonts.load("700 16pt 'TH Sarabun New'", 'ภาษาไทย')
  ]).then(res => {
    root.classList.toggle('has-thsarabun', res[0].length > 0);
    if (typeof refitAllPapers === 'function') refitAllPapers();
  }).catch(() => { root.classList.remove('has-thsarabun'); });
}

/* ---- 2.3 แปลง "ผล" ที่ตรวจในระบบ (พบปกติ/ชำรุด/สูญหาย/ยังไม่ตรวจ) ----
   ---- ให้ตรงกับ 5 ช่องของแบบฟอร์มราชการ (ดี/ชำรุด/เสื่อมคุณภาพ/เก็บไว้นานไม่ใช้/หมดความจำเป็น) ----
   หมายเหตุ: แบบฟอร์มครุภัณฑ์ทั่วไป+เครื่องมือสื่อสารของราชการไม่มีช่อง "สูญหาย" โดยตรง
   ถ้าในระบบตรวจพบว่า "สูญหาย" จะไม่ติ๊กช่องไหนเลย แต่จะขึ้นข้อความ "สูญหาย" ในช่องความเห็นแทน */
function auditMarkCells(assetId) {
  const rec = auditRecordFor(assetId);
  const result = rec ? rec['ผล'] : 'ยังไม่ตรวจ';
  const mark = '๑';
  const cells = { good: '', broken: '', worn: '', unused: '', obsolete: '' };
  if (result === 'พบปกติ') cells.good = mark;
  else if (result === 'ชำรุด') cells.broken = mark;
  let note = rec ? (rec['หมายเหตุ'] || '') : '';
  if (result === 'สูญหาย' && !note) note = 'สูญหาย';
  return { cells, note };
}

  document.getElementById('profileName').textContent = state.user.name;
  document.getElementById('usersTabBtn').style.display = 'flex';
  document.getElementById('settingsTabBtn').style.display = 'flex';
  document.getElementById('auditTabBtn').style.display = isAdmin() ? 'flex' : 'none';
  document.getElementById('monthlyTabBtn').style.display = isAdmin() ? 'flex' : 'none';
  document.getElementById('loginScreen').style.display = 'none';
  const appEl = document.getElementById('app');
  appEl.style.display = 'block';

/* ========================================================= IMAGE UPLOAD — Drive URL, never Base64 in Sheets */
function isInlineImage(v) { return typeof v === 'string' && v.indexOf('data:image/') === 0; }

// บีบรูปในเบราว์เซอร์ก่อนส่งไป Apps Script
// เป้าหมายคือให้ request เล็กมาก ลด timeout และปัญหา payload ยาวเกินไป
async function compressImageDataUrl(dataUrl, maxBytes = 60000) {
  if (!dataUrl || !isInlineImage(dataUrl)) return dataUrl || '';
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        const maxSide = 1280;
        if (Math.max(w, h) > maxSide) {
          const scale = maxSide / Math.max(w, h);
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
        }
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let quality = 0.78;
        let out = '';
        for (let i = 0; i < 7; i++) {
          canvas.width = w; canvas.height = h;
          ctx.fillStyle = '#fff';   
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          out = canvas.toDataURL('image/jpeg', quality);
          const bytes = Math.ceil((out.length - out.indexOf(',') - 1) * 3 / 4);
          if (bytes <= maxBytes) break;
          if (quality > 0.52) quality -= 0.06;
          else { w = Math.max(480, Math.round(w * 0.82)); h = Math.max(480, Math.round(h * 0.82)); }
        }
        resolve(out);
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('ไม่สามารถอ่านรูปภาพได้'));
    img.src = dataUrl;
  });
}

async function uploadImageToDrive(dataUrl, fileName) {
  if (!dataUrl) return '';
  if (!isInlineImage(dataUrl)) return dataUrl;
  const compressed = await compressImageDataUrl(dataUrl, 60000);
  const result = await apiPost('uploadImage', { dataUrl: compressed, fileName: fileName || 'image' });
  return result && result.url ? result.url : '';
}

async function prepareImageFile(file, maxBytes = 60000) {
  if (!file) return '';
  const raw = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('อ่านไฟล์รูปภาพไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
  return compressImageDataUrl(raw, maxBytes);
}

async function fetchJson(url, options = {}, timeout = 30000, retries = 1) {
  let lastErr = null;
  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, {
        ...options,
        signal: controller.signal,
        cache: 'no-store',
        credentials: 'omit'
      });
      const text = await res.text();
      const looksLikeHtml = text.trim().startsWith('<');
      if (!res.ok || looksLikeHtml) {
        throw new Error(looksLikeHtml ? 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง' : 'เซิร์ฟเวอร์ตอบกลับผิดพลาด (' + res.status + ')');
      }
      const j = JSON.parse(text);
      if (!j.ok) throw new Error(j.error || 'ไม่สามารถดำเนินการได้');
      return j.data;
    } catch (err) {
      lastErr = err;
      // retry แบบเงียบ ๆ เฉพาะ GET/อ่านข้อมูล ไม่แสดง "ครั้งที่ 2" รบกวนผู้ใช้
      if (attempt < retries) await new Promise(r => setTimeout(r, 900));
    } finally {
      clearTimeout(timer);
    }
  }
  if (lastErr?.name === 'AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้ากว่าปกติ กรุณากดรีเฟรชอีกครั้ง');
  throw lastErr || new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');
}

  const walker = document.createTreeWalker(tpl.content, NodeFilter.SHOW_TEXT);

// แปลงวันที่ที่แสดงในเอกสารกลับเป็น ISO สำหรับบันทึกฐานข้อมูล
// รองรับทั้งเลขอารบิก/เลขไทย และรูปแบบเต็ม/ย่อ เช่น 2 ตุลาคม 2569, ๒ ต.ค.๒๕๖๙, 2/10/2569
function normalizeDocumentDateForDb(v) {
  const raw = String(v == null ? '' : v).trim();
  if (!raw) return '';
  const s = thaiToArabic(raw).replace(/\s+/g, ' ').trim();

  const iso = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if (iso) {
    const y = Number(iso[1]), m = Number(iso[2]), d = Number(iso[3]);
    if (y >= 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
      return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }
  }

  const slash = /^(\d{1,2})\s*[/.-]\s*(\d{1,2})\s*[/.-]\s*(\d{4})$/.exec(s);
  if (slash) {
    let y = Number(slash[3]), m = Number(slash[2]), d = Number(slash[1]);
    if (y > 2400) y -= 543;
    if (y >= 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
      return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }
  }

  const monthMap = {};
  TH_MONTHS_FULL.forEach((name, i) => { monthMap[name] = i + 1; });
  TH_MONTHS_ABBR.forEach((name, i) => {
    monthMap[name.replace(/\.$/, '')] = i + 1;
    monthMap[name] = i + 1;
  });
  const text = s.replace(/\s+/g, ' ').replace(/\s*([.])/g, '$1').trim();
  const m = /^(\d{1,2})\s+(.+?)\s*\.?\s*(\d{4})$/.exec(text);
  if (m) {
    const d = Number(m[1]);
    const monthKey = m[2].replace(/\.$/, '').trim();
    const month = monthMap[monthKey];
    let y = Number(m[3]);
    if (y > 2400) y -= 543;
    if (month && y >= 1900 && d >= 1 && d <= 31) {
      return y + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }
  }

  return raw;
}
function isoDate(v) {
  const d = v ? toDate(v) : new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

    if (el.dataset.countAnimated === '1') return;

    // หา text node แรกที่มีตัวเลข (ไม่แตะหน่วย เช่น "รายการ" "บาท")
    const first = Array.from(el.childNodes).find(n => n.nodeType === 3 && /\d/.test(n.nodeValue || ''));
    if (!first) return;

    let target, decimals = 0, suffix = '';
    const rawAttr = el.dataset.count;

    // [เพิ่ม] stat-num ของหน้ายืม-คืน/ซ่อมบำรุง นับเฉพาะตอนเปิดหน้าครั้งแรก (ธง __countStat)
    const allowStat = el.classList.contains('stat-num') && window.__countStat === true;

    if (rawAttr !== undefined && String(rawAttr).trim() !== '') {
      // กรณี Dashboard: ใช้ค่าจาก data-count
      target = Number(String(rawAttr).replace(/,/g, ''));
      decimals = (String(rawAttr).split('.')[1] || '').length;
    } else if (el.matches('.rp-kpi .k-num') || allowStat) {
      // กรณีการ์ดหน้ารายงาน และ stat-num ตอนเปิดหน้า: อ่านจากข้อความที่ render ไว้
      const m = /^\s*([\d,]+(?:\.(\d+))?)(.*)$/.exec(first.nodeValue || '');
      if (!m) return;                                   // ไม่ใช่ตัวเลข เช่น "-" ให้ข้าม
      target = Number(m[1].replace(/,/g, ''));
      decimals = m[2] ? m[2].length : 0;
      suffix = (m[3] || '');                            // เช่น "%"
    } else {
      return;   // ไม่เข้าเงื่อนไข ปล่อยตัวเลขจริงตามเดิม
    }
    if (!isFinite(target)) return;

    const fmt = v => v.toLocaleString('en-US', {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    }) + suffix;

    first.nodeValue = fmt(0);
    el.dataset.countAnimated = '1';

    const start = performance.now(), duration = 820;   // ระยะเวลาแอนิเมชัน (ms)
    const ease = x => 1 - Math.pow(1 - x, 3);
    const tick = now => {
      const p = Math.min(1, (now - start) / duration);
      first.nodeValue = fmt(target * ease(p));
      if (p < 1) requestAnimationFrame(tick);
      else first.nodeValue = fmt(target);              // ล็อกค่าสุดท้ายให้ตรงเป๊ะ
    };
    requestAnimationFrame(tick);
  });
}
function applyPremiumMotion(root=document) {

/* ---------- CSV export ---------- */
function exportCsv(filename, headers, rows) {
  const escapeCell = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(escapeCell).join(',')];
  rows.forEach(r => lines.push(headers.map(h => escapeCell(r[h])).join(',')));
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('ดาวน์โหลดไฟล์ CSV แล้ว');
}

/* ---------- จัดความกว้างปุ่ม + ตำแหน่ง pill (มือถือ) ---------- */
function layoutNav() {
  const bar = document.querySelector('.tabbar');
  const pill = document.getElementById('tabPill');
  if (!bar || !pill) return;
  const tabs = [...bar.querySelectorAll('.tab')];

  // เดสก์ท็อปใช้ sidebar: ล้างค่าที่ JS เคยตั้ง
  if (!window.matchMedia('(max-width:899px)').matches) {
    tabs.forEach(t => { t.style.width = ''; t.classList.remove('promoted', 'nav-hide'); });
    return;
  }
  if (!bar.clientWidth) return;

  const more = document.getElementById('tabMore');
  const primary = tabs.filter(t => !t.classList.contains('tab-secondary') && t !== more && t.style.display !== 'none');
  const secondary = tabs.filter(t => t.classList.contains('tab-secondary') && t.style.display !== 'none');

  // --- ตัดสินใจว่าจะดึงปุ่มรองขึ้นมากี่ปุ่ม (เฉพาะจอ >= 600px เช่น iPad) ---
  let extra = 0;
  if (window.matchMedia('(min-width:600px)').matches) {
    const MIN_TAB = 54, ACTIVE_W = 130;               // [ปรับตรงนี้] ความกว้างต่ำสุดต่อปุ่ม / ปุ่มที่เลือก
    const room = Math.floor((bar.clientWidth - 12 - ACTIVE_W) / MIN_TAB);
    if (primary.length + secondary.length - 1 <= room) extra = secondary.length;
    else extra = Math.max(0, Math.min(secondary.length - 1, room - primary.length));
  }
  secondary.forEach((t, i) => t.classList.toggle('promoted', i < extra));
  const allShown = extra >= secondary.length;
  if (more) {
    more.classList.toggle('nav-hide', allShown);
    const inMore = secondary.some(t => !t.classList.contains('promoted') && t.dataset.tab === state.tab);
    more.classList.toggle('active', inMore);
  }

  // --- ปุ่มที่มองเห็นจริง ---
  const vis = tabs.filter(t => t.style.display !== 'none'
    && !t.classList.contains('nav-hide')
    && (!t.classList.contains('tab-secondary') || t.classList.contains('promoted')));
  const act = vis.find(t => t.classList.contains('active')) || vis[0];
  if (!act) return;

  if (more && !allShown) {
    const cur = document.querySelector('.tab-secondary[data-tab="' + state.tab + '"] .lbl');
    more.querySelector('.lbl').textContent = (more.classList.contains('active') && cur) ? cur.textContent : 'เมนู';
  }

  const first = !layoutNav.done;
  if (first) bar.classList.add('no-anim');

  const aw = Math.ceil(21 + 7 + act.querySelector('.lbl').scrollWidth + 28);
  const inner = bar.clientWidth - 12;
  const iw = (inner - aw) / Math.max(1, vis.length - 1);

  let x = 6;
  vis.forEach(t => {
    const w = (t === act) ? aw : iw;
    t.style.width = w + 'px';
    if (t === act) { pill.style.left = x + 'px'; pill.style.width = w + 'px'; }
    x += w;
  });

  if (first) {
    layoutNav.done = true;
    requestAnimationFrame(() => requestAnimationFrame(() => bar.classList.remove('no-anim')));
  }
}

function sparklineSvg(dataObj) {
  const vals = Object.values(dataObj || {}).map(Number).filter(v => isFinite(v));
  if (!vals.length) return '';
  const w=140,h=34,p=3,min=Math.min(...vals),max=Math.max(...vals),range=(max-min)||1;
  const pts=vals.map((v,i)=>[p+i*((w-p*2)/Math.max(1,vals.length-1)), h-p-((v-min)/range)*(h-p*2)]);
  const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<div class="hero-sparkline" aria-hidden="true"><svg viewBox="0 0 ${w} ${h}"><path d="${d}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5"/></svg></div>`;
}

/* ========================================================= ASSETS (v5: หมวดใหญ่เป็นปุ่ม + รายการ/การ์ดแบบรายชิ้น) */
function sortAssets(list) {
  const [field, dir] = state.assetSort.split('_');
  const mul = dir === 'desc' ? -1 : 1;
  return [...list].sort((a, b) => {
    if (field === 'name') {
      const c = String(a['ชื่อครุภัณฑ์'] || '').localeCompare(String(b['ชื่อครุภัณฑ์'] || ''), 'th');
      // ชื่อเหมือนกัน -> เรียงตามหมายเลขเครื่อง/ทะเบียนต่อ เพื่อให้ของชนิดเดียวกันอยู่ติดกันและเรียงสวย
      if (c !== 0) return mul * c;
      return assetSerialText(a).localeCompare(assetSerialText(b), 'th', { numeric: true });
    }
    if (field === 'value') return mul * ((Number(a['มูลค่า(บาท)']) || 0) - (Number(b['มูลค่า(บาท)']) || 0));
    if (field === 'date') return mul * (toDate(a['วันที่รับเข้า'] || 0) - toDate(b['วันที่รับเข้า'] || 0));
    return 0;
  });
}
const ASSET_STATUS_COLOR = { 'พร้อมใช้งาน':'var(--ok)', 'กำลังยืม':'var(--warn)', 'ซ่อมบำรุง':'var(--bad)', 'จำหน่ายแล้ว':'var(--off)' };
const ASSET_STEP = 30; // TODO: ปรับจำนวน "รายการ" ที่แสดงต่อครั้งได้ตามต้องการ (เดิมนับเป็นกลุ่ม ตอนนี้นับเป็นชิ้น)

function assetSerialHtml(a) {
  const serial = String(a['หมายเลขเครื่อง'] || '').trim();
  const plate = String(a['ทะเบียนรถ'] || '').trim();
  if (serial) return `<span class="ax-serial">S/N ${escapeHtml(serial)}</span>`;
  if (plate) return `<span class="ax-serial">ทะเบียน ${escapeHtml(plate)}</span>`;
  return `<span class="none">ไม่ระบุหมายเลขเครื่อง</span>`;
}
function assetSerialText(a) {
  return String(a['หมายเลขเครื่อง'] || '').trim() || String(a['ทะเบียนรถ'] || '').trim() || '';
}
function assetWarnHtml(a) {
  const dleft = daysUntil(a['วันครบกำหนดตรวจสภาพ/ต่อทะเบียน']);
  if (dleft === null || dleft > renewalWindowDays() || a['สถานะ'] === 'จำหน่ายแล้ว') return '';
  return `<div class="ax-warn ${dleft < 0 ? 'bad' : ''}">${dleft < 0 ? 'เลยกำหนดตรวจสภาพ/ต่อทะเบียน' : 'ใกล้ครบกำหนดอีก ' + dleft + ' วัน'}</div>`;
}

/* กรองตามหมวดหมู่ + สถานะ + คำค้น แล้วเรียงลำดับ */
function assetFiltered() {
  const q = (state.assetSearch || '').trim().toLowerCase();
  const list = state.assets.filter(a => {
    if (state.assetFilter !== 'all' && a['หมวดหมู่'] !== state.assetFilter) return false;
    if (state.assetStatusFilter !== 'all' && a['สถานะ'] !== state.assetStatusFilter) return false;
    if (!q) return true;
    return [a['ชื่อครุภัณฑ์'], a['รหัสครุภัณฑ์'], a['หมายเลขเครื่อง'], a['ทะเบียนรถ'], a['ยี่ห้อ/รุ่น']]
      .map(x => String(x || '').toLowerCase()).join(' | ').includes(q);
  });
  return sortAssets(list);
}

/* มุมมองรายการ: 1 แถว = 1 ครุภัณฑ์ */
function assetRowHtml(a) {

/* ========== ปัดแถวครุภัณฑ์: ปัดซ้ายเพื่อเลือกคำสั่ง ========== */
let swOpenWrap = null;
function swClose(wrap) {
  if (!wrap) return;
  const row = wrap.querySelector('.list-item');
  if (row) row.style.left = '0px';
  wrap.classList.remove('sw-drag');
  delete wrap.dataset.open;
  setTimeout(() => { if (!wrap.dataset.open) wrap.classList.remove('sw-active'); }, 270);
  if (swOpenWrap === wrap) swOpenWrap = null;
}
function swBtn(tone, icon, label, act) {
  return `<button type="button" class="sw-btn tone-${tone}" data-act="${act}">${icon}<span>${label}</span></button>`;
}
function wireSwipeRows(listEl) {
  Array.from(listEl.querySelectorAll('.list-item.asset-item')).forEach(row => {
    const id = row.dataset.id;
    const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === id);
    if (!asset) return;

    const wrap = document.createElement('div');
    wrap.className = 'sw-wrap';
    row.parentNode.insertBefore(wrap, row);
    wrap.appendChild(row);

    const panel = document.createElement('div');
    panel.className = 'sw-actions';
    panel.innerHTML =
        swBtn('ok', ICONS.swap, 'ยืม', 'borrow')
      + (isAdmin() ? swBtn('bad', ICONS.wrench, 'แจ้งซ่อม', 'maint') : '')
      + swBtn('navy', ICONS.scan, 'QR', 'qr');
    wrap.appendChild(panel);

    const runAct = (act) => {
      swClose(wrap);
      if (act === 'borrow') {
        if (asset['สถานะ'] !== 'พร้อมใช้งาน') { toast('ครุภัณฑ์นี้ไม่พร้อมให้ยืม (' + asset['สถานะ'] + ')'); return; }
        openBorrowForm(id);
      }
      else if (act === 'maint') openMaintForm(id);
      else if (act === 'qr') openQrView(asset);
    };
    panel.querySelectorAll('.sw-btn').forEach(b => {
      b.onclick = (e) => { e.stopPropagation(); runAct(b.dataset.act); };
    });

    // แตะแถวตอนที่เปิดอยู่ หรือเพิ่งลากเสร็จ = ไม่เปิดรายละเอียด
    row.addEventListener('click', (e) => {
      if (wrap.dataset.open || row._swMoved) {
        e.stopImmediatePropagation(); e.preventDefault();
        if (wrap.dataset.open) swClose(wrap);
      }
    }, true);

    let sx = 0, sy = 0, dx = 0, startX = 0, w = 0, pid = null, dragging = false, decided = false;
    const panelW = () => Math.min(panel.offsetWidth, wrap.clientWidth * 0.8);

    row.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (swOpenWrap && swOpenWrap !== wrap) swClose(swOpenWrap);
      sx = e.clientX; sy = e.clientY; dx = 0; pid = e.pointerId;
      dragging = false; decided = false; row._swMoved = false;
      w = panelW();
      startX = wrap.dataset.open ? -w : 0;
    });
    row.addEventListener('pointermove', (e) => {
      if (pid !== e.pointerId) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if (!decided) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        decided = true;
        dragging = Math.abs(mx) > Math.abs(my);
        if (dragging) {
          try { row.setPointerCapture(e.pointerId); } catch (_) {}
          wrap.classList.add('sw-drag', 'sw-active');
        }
      }
      if (!dragging) return;
      row._swMoved = true;
      dx = Math.max(-w, Math.min(0, startX + mx));   // ปัดได้เฉพาะทางซ้าย
      row.style.left = dx + 'px';
    });
    const end = (e) => {
      if (pid !== e.pointerId) return;
      pid = null;
      if (!dragging) return;
      dragging = false;
      wrap.classList.remove('sw-drag');
      if (dx < -Math.max(40, w * 0.35)) {
        row.style.left = -w + 'px';
        wrap.dataset.open = '1';
        swOpenWrap = wrap;
      } else {
        swClose(wrap);
      }
      setTimeout(() => { row._swMoved = false; }, 50);
    };
    row.addEventListener('pointerup', end);
    row.addEventListener('pointercancel', end);
  });
}
// แตะที่อื่นแล้วปิดแถวที่เปิดค้างอยู่

}, true);

  return `<div class="glass empty-state">

      <div class="empty-icon">${ICONS.inbox}</div>
      <div class="empty-title">${escapeHtml(text)}</div>
      <div class="empty-sub">ข้อมูลจะแสดงที่นี่เมื่อมีรายการใหม่</div>
      ${action ? `<div class="empty-actions">${action}</div>` : ''}
    </div>
  </div>`;
}

/* ========================= ฟีเจอร์ ๓: สแกน QR/บาร์โค้ด ========================= */
let activeHtml5Qr = null;
function stopScanner() {
  if (!activeHtml5Qr) return;
  const scanner = activeHtml5Qr;
  activeHtml5Qr = null; // เคลียร์ตัวแปรก่อนเลย กันเรียกซ้ำ/กันค้าง
  try {
    // บางกรณี .stop() จะโยน error ทันที (ไม่ใช่ promise reject) เช่นตอนกล้องไม่เคยเริ่มทำงานจริง
    // ต้องครอบ try/catch ไว้ ไม่งั้นจะทำให้ closeSheet() ค้างและปิดหน้าต่างไม่ได้
    const stopResult = scanner.stop();
    if (stopResult && typeof stopResult.then === 'function') {
      stopResult.catch(() => {}).finally(() => { try { scanner.clear(); } catch (e) {} });
    } else {
      try { scanner.clear(); } catch (e) {}
    }
  } catch (e) {
    // สแกนเนอร์ไม่เคยเริ่มทำงานจริง (เช่น ขอสิทธิ์กล้องไม่สำเร็จ) — ไม่ต้องทำอะไรเพิ่ม ปล่อยผ่านได้เลย
    try { scanner.clear(); } catch (e2) {}
  }
}
function openScannerSheet() {
  showSheet(`
    <div class="sheet-title">สแกน QR / บาร์โค้ดครุภัณฑ์</div>
    <div id="qrReaderBox"></div>
    <div class="hint" style="text-align:center;">เล็งกล้องไปที่ QR โค้ดบนป้ายครุภัณฑ์ ระบบจะเปิดรายละเอียดให้อัตโนมัติ</div>
    <div class="btn-row"><button class="btn btn-ghost" id="btnCancelScan">ปิดกล้อง</button></div>
  `);
  document.getElementById('btnCancelScan').onclick = () => { stopScanner(); closeSheet(); };
  if (typeof Html5Qrcode === 'undefined') {
    document.getElementById('qrReaderBox').innerHTML = '<div class="hint" style="color:var(--bad); text-align:center; padding:20px;">ไม่พบไลบรารีสแกน QR กรุณาตรวจสอบว่าเชื่อมต่ออินเทอร์เน็ตอยู่</div>';
    return;
  }
  activeHtml5Qr = new Html5Qrcode('qrReaderBox');
  activeHtml5Qr.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 230 },
    (decodedText) => {
      const code = String(decodedText || '').trim();
      stopScanner();
      closeSheet();
      const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === code);
      if (asset) {
        if (state.tab !== 'assets') renderTab('assets');
        setTimeout(() => openAssetDetail(asset['รหัสครุภัณฑ์']), 200);
      } else {
        toast('ไม่พบครุภัณฑ์รหัส "' + code + '" ในระบบ');
      }
    },
    () => { /* เฟรมที่ยังอ่านไม่ออก — เงียบไว้ */ }
        ).catch(err => {
    document.getElementById('qrReaderBox').innerHTML = '<div class="hint" style="color:var(--bad); text-align:center; padding:20px;">ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์</div>';
    activeHtml5Qr = null; // สำคัญ: เคลียร์ตัวแปรเมื่อเปิดกล้องไม่สำเร็จ กันปุ่มปิดหน้าต่างค้าง
  });
}

   /* ---------- เลือกผู้ยืมจากทำเนียบ (ค้นหาได้ / พิมพ์ชื่อเองได้) ---------- */
function openOfficerPickerSheet(currentName, onPick) {
  const root = document.createElement('div');
  document.body.appendChild(root);
  const low = s => String(s == null ? '' : s).toLowerCase();
  let q = '';

  root.innerHTML = `
    <div class="overlay" style="z-index:95;">
      <div class="sheet op-sheet" style="max-height:92vh;">
        <button class="sheet-close" id="opClose" type="button">${ICONS.close}</button>
        <div class="sheet-handle"></div>
        <div class="sheet-title">เลือกผู้ยืม</div>
        <div class="search-row"><input class="input" id="opSearch" placeholder="ค้นหาชื่อ / ตำแหน่ง หรือพิมพ์ชื่อเอง..." autocomplete="off"></div>
        <div class="hint" id="opCount" style="margin:0 0 10px;"></div>
        <div id="opList"></div>
      </div>
    </div>`;

  const close = () => root.remove();
  const listEl = root.querySelector('#opList');
  const countEl = root.querySelector('#opCount');

  function drawList() {
    const needle = low(q.trim());
    const list = (state.users || []).filter(u =>
      !needle || low(officerFullName(u) + ' ' + (u['ตำแหน่ง'] || '') + ' ' + (u['หน่วยงาน'] || '')).includes(needle));

    const rows = list.map(u => {
      const full = officerFullName(u);
      const avatar = u['รูปถ่าย']
        ? `<img class="li-avatar" src="${u['รูปถ่าย']}" alt="" loading="lazy" decoding="async">`
        : `<div class="li-icon">${ICONS.user}</div>`;
      const selected = currentName && eqCiJs_(full, currentName);
      return `<div class="glass list-item op-item" data-idx="${state.users.indexOf(u)}">
        ${avatar}
        <div class="li-body">
          <div class="li-title">${escapeHtml(full)}</div>
          <div class="li-sub">${escapeHtml(u['ตำแหน่ง'] || 'ไม่ระบุตำแหน่ง')}</div>
        </div>
        ${selected ? '<div class="status-badge status-ready">เลือกอยู่</div>' : ''}
      </div>`;
    }).join('');

    // ถ้าพิมพ์อะไรไว้ ให้มีตัวเลือก "ใช้ชื่อที่พิมพ์" เสมอ
    const typed = q.trim();
    const custom = typed ? `<div class="glass list-item op-custom" style="border-style:dashed;">
        <div class="li-icon">${ICONS.edit}</div>
        <div class="li-body">
          <div class="li-title">ใช้ชื่อ "${escapeHtml(typed)}"</div>
          <div class="li-sub">ผู้ยืมที่ไม่อยู่ในทำเนียบ (พิมพ์ชื่อเอง)</div>
        </div>
        <div class="status-badge status-pending">ใช้ชื่อนี้</div>
      </div>` : '';

    countEl.textContent = 'พบ ' + list.length + ' คนในทำเนียบ';
    listEl.innerHTML = custom + (rows || (typed ? '' : emptyState('ยังไม่มีรายชื่อในทำเนียบ — พิมพ์ชื่อเพื่อใช้ชื่อเองได้')));

    listEl.querySelectorAll('.op-item').forEach(el => el.onclick = () => {
      const u = state.users[Number(el.dataset.idx)];
      onPick(officerFullName(u), u);
      close();
    });
    const c = listEl.querySelector('.op-custom');
    if (c) c.onclick = () => { onPick(typed, null); close(); };
  }

  root.querySelector('#opClose').onclick = close;
  const input = root.querySelector('#opSearch');
  input.oninput = (e) => { q = e.target.value; drawList(); };
  // กด Enter = เลือกคนแรกที่เจอ (ถ้าไม่เจอใครให้ใช้ชื่อที่พิมพ์)
  input.onkeydown = (e) => {
    if (e.key !== 'Enter') return;
    const first = listEl.querySelector('.op-item') || listEl.querySelector('.op-custom');
    if (first) first.click();
  };
  drawList();
  // บนจอสัมผัส (iPad/มือถือ) ไม่โฟกัสอัตโนมัติ เพื่อไม่ให้คีย์บอร์ดบังรายชื่อ
  if (!window.matchMedia('(pointer:coarse)').matches) setTimeout(() => input.focus(), 60);
}
   
// ครุภัณฑ์ที่ผู้ใช้สามารถยื่นคำขอยืมได้จริง:
// 1) สถานะต้องเป็น "พร้อมใช้งาน"
// 2) ต้องไม่มีรายการยืม/คำขอยืมที่ยังถือสิทธิ์อยู่กับผู้ยืมคนอื่น
function assetBorrowState(id) {
  return (state.borrow || []).find(b => {
    if (b['รหัสครุภัณฑ์'] !== id) return false;
    const st = String(b['สถานะ'] || '');
    return ['รออนุมัติ', 'กำลังยืม', 'เกินกำหนด'].includes(st);
  }) || null;
}
function isAssetBorrowable(a) {
  return !!a && String(a['สถานะ'] || '') === 'พร้อมใช้งาน' && !assetBorrowState(a['รหัสครุภัณฑ์']);
}

function openAssetPickerSheet(currentId, onPick, onlyAvailable = true, excludeFn = null) {
  let available = onlyAvailable ? state.assets.filter(isAssetBorrowable) : state.assets.slice();
  if (typeof excludeFn === 'function') available = available.filter(a => !excludeFn(a));
  let pickCat = 'all', pickQ = '';
  const openGroups = new Set();          // กลุ่มที่ผู้ใช้กดเปิดเอง
  const closedGroups = new Set();        // กลุ่มที่ผู้ใช้กดพับเอง
  const pickerRoot = document.createElement('div');
  document.body.appendChild(pickerRoot);

  const CARET = '<svg class="ap-caret" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function matches(a, q) {
    const hay = [
      a['ชื่อครุภัณฑ์'], a['รหัสครุภัณฑ์'], a['หมายเลขเครื่อง'], a['ยี่ห้อ/รุ่น'],
      a['ทะเบียนรถ'], a['หมายเลขตัวถัง'], a['ผู้ครอบครอง/หน่วยงาน']
    ].map(x => String(x || '').toLowerCase()).join(' | ');
    return hay.includes(q);
  }

  function itemHtml(a) {
    const serial = String(a['หมายเลขเครื่อง'] || '').trim();
    const plate = String(a['ทะเบียนรถ'] || '').trim();
    const titleHtml = serial
      ? `<span class="ap-serial">S/N ${escapeHtml(serial)}</span>`
      : (plate ? `<span class="ap-serial">ทะเบียน ${escapeHtml(plate)}</span>` : `<span class="ap-serial none">ไม่ระบุหมายเลขเครื่อง</span>`);
    const subParts = [a['รหัสครุภัณฑ์'], a['ยี่ห้อ/รุ่น'], (serial && plate) ? 'ทะเบียน ' + plate : '']
      .filter(Boolean).map(escapeHtml).join(' · ');
    const badge = a['รหัสครุภัณฑ์'] === currentId
      ? `<div class="status-badge status-ready">เลือกอยู่</div>`
      : (!onlyAvailable ? `<div class="status-badge ${statusClass(a['สถานะ'])}">${escapeHtml(a['สถานะ'])}</div>` : '');
    return `
      <div class="glass list-item ap-item" data-id="${escapeHtml(a['รหัสครุภัณฑ์'])}">
        <div class="li-icon">${catIcon(a['หมวดหมู่'])}</div>
        <div class="li-body">
          <div class="li-title">${titleHtml}</div>
          <div class="li-sub">${subParts}</div>
        </div>
        ${badge}
      </div>`;
  }

  function draw() {
    const prevSheet = pickerRoot.querySelector('.sheet');
    const prevScroll = prevSheet ? prevSheet.scrollTop : 0;

    const q = pickQ.trim().toLowerCase();
    let list = available.filter(a => pickCat === 'all' || a['หมวดหมู่'] === pickCat);
    if (q) list = list.filter(a => matches(a, q));

    // จัดกลุ่มตามชื่อครุภัณฑ์
    const groupsMap = new Map();
    list.forEach(a => {
      const key = String(a['ชื่อครุภัณฑ์'] || 'ไม่ระบุชื่อ').trim();
      if (!groupsMap.has(key)) groupsMap.set(key, []);
      groupsMap.get(key).push(a);
    });
    const groups = Array.from(groupsMap.entries())
      .sort((x, y) => x[0].localeCompare(y[0], 'th'))
      .map(([name, items]) => ({
        name,
        items: items.sort((a, b) => String(a['หมายเลขเครื่อง'] || a['รหัสครุภัณฑ์'] || '').localeCompare(String(b['หมายเลขเครื่อง'] || b['รหัสครุภัณฑ์'] || ''), 'th', { numeric: true })),
        cat: items[0]['หมวดหมู่']
      }));

    // กลุ่มจะเปิดอัตโนมัติเมื่อ: กำลังค้นหา / มีกลุ่มเดียว / รายการทั้งหมดน้อย / มีตัวที่เลือกอยู่ข้างใน
    const autoOpen = !!q || groups.length === 1 || list.length <= 8;
    const isOpen = g => {
      if (closedGroups.has(g.name)) return false;
      if (openGroups.has(g.name)) return true;
      if (g.items.some(a => a['รหัสครุภัณฑ์'] === currentId)) return true;
      return autoOpen;
    };

    const catCounts = getCategories().map(c => ({ c, n: available.filter(a => a['หมวดหมู่'] === c).length })).filter(x => x.n);

    pickerRoot.innerHTML = `
      <div class="overlay" style="z-index:95;">
        <div class="sheet" style="max-height:92vh;">
          <button class="sheet-close" id="apClose" type="button">${ICONS.close}</button>
          <div class="sheet-handle"></div>
          <div class="sheet-title">เลือกครุภัณฑ์</div>
          <div class="search-row"><input class="input" id="apSearch" placeholder="ค้นหาชื่อ / รหัส / หมายเลขเครื่อง / ทะเบียน..." value="${escapeHtml(pickQ)}" autocomplete="off"></div>
          <div class="chip-row">
            <div class="chip ${pickCat === 'all' ? 'active' : ''}" data-pcat="all">ทั้งหมด (${available.length})</div>
            ${catCounts.map(x => `<div class="chip ${pickCat === x.c ? 'active' : ''}" data-pcat="${escapeHtml(x.c)}">${escapeHtml(x.c)} (${x.n})</div>`).join('')}
          </div>
          <div class="hint" style="margin:0 0 10px;">พบ ${list.length} รายการ ใน ${groups.length} กลุ่ม</div>
          <div>${groups.length ? groups.map(g => `
            <div class="ap-group ${isOpen(g) ? 'open' : ''}" data-gname="${escapeHtml(g.name)}">
              <div class="ap-group-head">
                ${CARET}
                <span class="ap-group-name">${escapeHtml(g.name)}${pickCat === 'all' ? ` <small style="font-weight:400;color:var(--ink-dim);">· ${escapeHtml(g.cat)}</small>` : ''}</span>
                <span class="ap-count">${g.items.length} รายการ</span>
              </div>
              <div class="ap-group-body">${g.items.map(itemHtml).join('')}</div>
            </div>`).join('') : emptyState('ไม่พบครุภัณฑ์ที่ค้นหา')}
          </div>
        </div>
      </div>`;

    const newSheet = pickerRoot.querySelector('.sheet');
    if (newSheet) newSheet.scrollTop = prevScroll;

    document.getElementById('apClose').onclick = closePicker;
    const searchEl = document.getElementById('apSearch');
    searchEl.oninput = (e) => {
      pickQ = e.target.value;
      const pos = e.target.selectionStart;
      draw();
      const again = document.getElementById('apSearch');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
    };
    document.querySelectorAll('[data-pcat]').forEach(c => c.onclick = () => {
      pickCat = c.dataset.pcat; openGroups.clear(); closedGroups.clear(); draw();
      const s = pickerRoot.querySelector('.sheet'); if (s) s.scrollTop = 0;
    });
    document.querySelectorAll('.ap-group-head').forEach(h => h.onclick = () => {
      const grp = h.closest('.ap-group');
      const name = grp.dataset.gname;
      const nowOpen = !grp.classList.contains('open');
      grp.classList.toggle('open', nowOpen);
      if (nowOpen) { openGroups.add(name); closedGroups.delete(name); }
      else { closedGroups.add(name); openGroups.delete(name); }
    });
    document.querySelectorAll('.ap-item').forEach(it => it.onclick = () => { onPick(it.dataset.id); closePicker(); });
  }
  function closePicker() { pickerRoot.remove(); }
  draw();
}
   
function assetTimelineHtml(a, id) {
  const events = [];
  if (a['วันที่รับเข้า']) events.push({date:a['วันที่รับเข้า'], title:'รับเข้าครุภัณฑ์', note:a['หน่วยงาน'] || a['ผู้ครอบครอง/หน่วยงาน'] || '', icon:ICONS.download});
  (state.borrow || []).filter(b => b['รหัสครุภัณฑ์'] === id).forEach(b => {
    if (b['วันที่ยืม']) events.push({date:b['วันที่ยืม'], title:'ยืมโดย ' + (b['ผู้ยืม'] || '-'), note:'สถานะ ' + (b['สถานะ'] || 'กำลังยืม'), icon:ICONS.swap});
    if (b['วันที่คืนจริง']) events.push({date:b['วันที่คืนจริง'], title:'คืนครุภัณฑ์', note:'ผู้ยืม ' + (b['ผู้ยืม'] || '-'), icon:ICONS.check});
  });
  (state.maint || []).filter(m => m['รหัสครุภัณฑ์'] === id).forEach(m => {
    if (m['วันที่แจ้ง']) events.push({date:m['วันที่แจ้ง'], title:'แจ้งซ่อม', note:m['อาการ/ปัญหา'] || m['สถานะ'] || '', icon:ICONS.wrench});
    if (m['วันที่ซ่อมเสร็จ']) events.push({date:m['วันที่ซ่อมเสร็จ'], title:'ซ่อมเสร็จ', note:(m['ค่าใช้จ่าย(บาท)'] ? Number(m['ค่าใช้จ่าย(บาท)']).toLocaleString() + ' บาท' : ''), icon:ICONS.check});
  });
  (state.auditRecords || []).filter(r => r['รหัสครุภัณฑ์'] === id).forEach(r => events.push({date:r['วันที่ตรวจ'], title:'ตรวจนับประจำปี', note:r['ผล'] || '', icon:ICONS.check}));
  events.sort((x, y) => toDate(x.date) - toDate(y.date));
  if (!events.length) return '';

  // สไตล์ฝังในตัว: ไม่พึ่ง CSS ภายนอก และบังคับขนาด SVG ทุกตัว
  const svgSz = (svg, px) => String(svg).replace(/<svg[^>]*?(\sviewBox="[^"]*")/, `<svg width="${px}" height="${px}"$1 style="width:${px}px;height:${px}px;display:block;"`);
  const last = events.length - 1;
  return `
  <div style="margin:18px 0 6px; padding-top:14px; border-top:1px solid var(--panel-line);">
    <div style="display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:12px;">
      <span style="width:16px;height:16px;display:inline-flex;color:var(--gold-deep);">${svgSz(ICONS.clock, 16)}</span>
      <span>ไทม์ไลน์ครุภัณฑ์</span>
    </div>
    <div style="position:relative;">
      <div style="position:absolute; left:11px; top:12px; bottom:12px; width:1px; background:var(--panel-line);"></div>
      ${events.map((e, i) => `
      <div style="position:relative; display:flex; gap:10px; align-items:flex-start; padding-bottom:${i === last ? 0 : 14}px;">
        <div style="flex:none; width:23px; height:23px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:1;
          background:${i === last ? 'var(--gold-wash)' : 'var(--panel)'}; border:1px solid ${i === last ? 'var(--gold-line)' : 'var(--panel-line)'};
          color:${i === last ? 'var(--gold-deep)' : 'var(--ink-dim)'}; overflow:hidden;">
          <span style="width:13px;height:13px;display:block;">${svgSz(e.icon, 13)}</span>
        </div>
        <div style="min-width:0; flex:1;">
          <div style="font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.4;">${escapeHtml(e.title)}</div>
          <div style="font-size:11px; color:var(--ink-dim); margin-top:1px;">${systemDate(e.date)}</div>
          ${e.note ? `<div style="font-size:11px; color:var(--ink-faint); margin-top:1px; line-height:1.45; word-break:break-word;">${escapeHtml(e.note)}</div>` : ''}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}
