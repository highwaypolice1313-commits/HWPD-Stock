/* =========================================================
   DESIGN TOKENS — "รุ่งอรุณ ทางหลวง" (dawn patrol)
   ========================================================= */
:root{
  --dawn-1:#fdf2e4; --dawn-2:#f7e6de; --dawn-3:#eef0ec; --dawn-4:#e4ecee;
  --bg-0:#eef1f0; --bg-1:#f6f1ea;
  --panel:#ffffff; --panel-soft:#fbfaf7; --panel-line:#eae3d6; --panel-hi:#f6efe1;
  --ink:#20303f; --ink-dim:#6c7b83; --ink-faint:#a3aeae;
  --navy:#17324f; --navy-deep:#0c1e33; --navy-wash:rgba(23,50,79,.07); --navy-line:rgba(23,50,79,.22);
  --gold:#bb8a3f; --gold-deep:#8a641f; --gold-wash:rgba(187,138,63,.14); --gold-line:rgba(187,138,63,.4);
  --ok:#2a8f68; --ok-wash:rgba(42,143,104,.12);
  --warn:#c1852a; --warn-wash:rgba(193,133,42,.14);
  --bad:#c1495a; --bad-wash:rgba(193,73,90,.12);
  --off:#7b8790; --off-wash:rgba(123,135,144,.12);
  --info:#4a86b4; --info-wash:rgba(74,134,180,.12);
  --side-1:#14304e; --side-2:#0c1e33;
  --r-xl:26px; --r-lg:20px; --r-md:16px; --r-sm:13px; --r-tag:99px;
  --font-th:'Kanit',sans-serif; --font-disp:'Fraunces','Kanit',serif; --font-num:'Inter','Kanit',sans-serif;
  --shadow-sm:0 1px 2px rgba(32,48,63,.05), 0 6px 16px rgba(32,48,63,.05);
  --shadow-md:0 10px 28px rgba(32,48,63,.09);
  --shadow-lg:0 20px 48px rgba(20,32,45,.14);
}
:root[data-theme="forest"]{
  --dawn-1:#eef6ee; --dawn-2:#e6f0e8; --dawn-3:#eaf1ec; --dawn-4:#dfece6; --bg-0:#e9f0ec; --bg-1:#f2f6f1;
  --panel-line:#dfe8e0; --panel-hi:#eaf3ea;
  --navy:#1f3d33; --navy-deep:#122a22; --navy-wash:rgba(31,61,51,.07); --navy-line:rgba(31,61,51,.22);
  --gold:#3fae7a; --gold-deep:#23805a; --gold-wash:rgba(63,174,122,.14); --gold-line:rgba(63,174,122,.4);
  --side-1:#1f3d33; --side-2:#122a22;
}
:root[data-theme="ember"]{
  --dawn-1:#fbeee4; --dawn-2:#f8e3da; --dawn-3:#f3e9e3; --dawn-4:#efe4e0; --bg-0:#f1e8e4; --bg-1:#f8f0ea;
  --panel-line:#ecdcd3; --panel-hi:#f8ece4;
  --navy:#3a1f22; --navy-deep:#241214; --navy-wash:rgba(58,31,34,.07); --navy-line:rgba(58,31,34,.22);
  --gold:#d9704a; --gold-deep:#a8482a; --gold-wash:rgba(217,112,74,.14); --gold-line:rgba(217,112,74,.4);
  --side-1:#3a1f22; --side-2:#241214;
}
:root[data-theme="night"]{
  --dawn-1:#16283f; --dawn-2:#14233a; --dawn-3:#0f1c2d; --dawn-4:#0d1a2a; --bg-0:#09121d; --bg-1:#0c1727;
  --panel:#122236; --panel-soft:#172b42; --panel-line:#24405c; --panel-hi:#1b3350;
  --ink:#e6eef5; --ink-dim:#a3b4c2; --ink-faint:#70859a;
  --navy:#3d7bd6; --navy-deep:#1e4f9a; --navy-wash:rgba(61,123,214,.16); --navy-line:rgba(61,123,214,.45);
  --gold:#d6a24a; --gold-deep:#e0b565; --gold-wash:rgba(214,162,74,.16); --gold-line:rgba(214,162,74,.45);
  --off:#93a3b1; --side-1:#0d1c30; --side-2:#07111e;
}
:root[data-theme="night"] .topbar{background:linear-gradient(180deg,rgba(12,23,39,.94),rgba(12,23,39,.72));}
:root[data-theme="night"] .chip,
:root[data-theme="night"] .btn-ghost,
:root[data-theme="night"] .icon-btn,
:root[data-theme="night"] .refresh-btn,
:root[data-theme="night"] .pagination button,
:root[data-theme="night"] .sheet-close,
:root[data-theme="night"] .zbtn,
:root[data-theme="night"] .mf-item,
:root[data-theme="night"] .mf-tabs button.active,
:root[data-theme="night"] .sheet,
:root[data-theme="night"] .loading-card{background:var(--panel); color:var(--ink);}
:root[data-theme="night"] .input,
:root[data-theme="night"] select.input{background:var(--panel-soft); color:var(--ink);}
:root[data-theme="night"] .input:focus{background:var(--panel);}
:root[data-theme="night"] .section-title{color:var(--ink);}
:root[data-theme="night"] .loading-overlay{background:rgba(9,18,29,.6);}


*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
html,body{margin:0;padding:0;height:100%;}
html{overflow-x:hidden; width:100%; touch-action:pan-y;}
body{
  font-family:var(--font-th); color:var(--ink); min-height:100vh;
  background:
    radial-gradient(900px 480px at 8% -8%, var(--dawn-1), transparent 60%),
    radial-gradient(820px 460px at 100% 0%, var(--dawn-2), transparent 55%),
    radial-gradient(1000px 620px at 50% 120%, var(--dawn-4), transparent 60%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0));
  background-attachment:fixed; padding-bottom:calc(128px + env(safe-area-inset-bottom)); overflow-x:hidden; width:100%;
  touch-action:pan-y; overscroll-behavior-x:none;
}
::-webkit-scrollbar{width:0;height:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
svg{display:block; flex:none;}
img{max-width:100%;}
input,select,button,textarea{max-width:100%;}
:focus-visible{outline:2px solid var(--navy); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; padding:16px 16px 12px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; row-gap:8px;
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  background:linear-gradient(180deg, rgba(247,241,234,.92), rgba(247,241,234,.6));
  border-bottom:1px solid var(--panel-line);
}
.brand{display:flex; align-items:center; gap:11px; min-width:0;}
.brand-badge{
  width:40px;height:40px;border-radius:13px; display:flex;align-items:center;justify-content:center; flex:none;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff;
  box-shadow:0 6px 16px rgba(187,138,63,.35);
}
.brand-badge svg{width:19px;height:19px;}
.brand-title{font-size:14.5px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-sub{font-size:11px; color:var(--ink-dim); font-weight:300;}
.profile{display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:flex-end; min-width:0;}
.profile-name{font-size:12px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;}

.tag{
  display:inline-flex; align-items:center; max-width:100%; font-size:11px; padding:5px 11px; gap:4px;
  border-radius:var(--r-tag); font-weight:500; line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tag-brass{ background:var(--gold-wash); color:var(--gold-deep); }
.tag-off{ background:var(--off-wash); color:var(--off); }
.role-pill{ font-size:10.5px; padding:5px 12px; border-radius:var(--r-tag); font-weight:500; flex:none;
  background:var(--navy); color:#fff; box-shadow:0 4px 12px rgba(23,50,79,.25); }
.role-pill.viewer{ background:var(--off-wash); color:var(--off); box-shadow:none; }

.page{max-width:640px; margin:0 auto; padding:18px 16px 6px; width:100%;}
.section-title{font-size:17px; font-weight:600; margin:22px 2px 12px; display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; font-family:var(--font-disp);}
.section-title small{font-size:11.5px; color:var(--ink-dim); font-weight:400; font-family:var(--font-th);}
.section-actions{display:flex; gap:8px; align-items:center; flex:none;}
.glass{ background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); }

.alert-banner{
  display:flex; align-items:center; gap:10px; padding:13px 15px; border-radius:var(--r-md);
  margin-bottom:14px; font-size:13px; flex-wrap:wrap; row-gap:6px;
}
.alert-banner.bad{ background:var(--bad-wash); color:var(--bad); }
.alert-banner.warn{ background:var(--warn-wash); color:var(--warn); }
.alert-banner svg{width:18px;height:18px;flex:none;}
.alert-banner span:not(.alert-link){min-width:0; word-break:break-word;}
.alert-banner .alert-link{ margin-left:auto; font-weight:600; cursor:pointer; text-decoration:underline; white-space:nowrap; }

.hero-card{
  padding:24px 24px 26px; position:relative; overflow:hidden; border:none; color:#fff;
  background:
    radial-gradient(340px 200px at 88% -10%, rgba(187,138,63,.55), transparent 60%),
    linear-gradient(150deg, var(--navy) 0%, var(--navy-deep) 100%);
  box-shadow:var(--shadow-md);
}
.hero-card::after{
  content:""; position:absolute; right:-30px; bottom:-40px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
}
.hero-row{display:flex; align-items:stretch; gap:18px; flex-wrap:wrap; row-gap:14px; position:relative;}
.hero-row > div{flex:1; min-width:140px;}
.hero-divider{width:1px; background:rgba(255,255,255,.18); flex:none;}
.hero-label{font-size:12px; color:rgba(255,255,255,.68); font-weight:400; margin-bottom:6px;}
.hero-num{font-family:var(--font-num); font-size:32px; font-weight:700; letter-spacing:-.01em; color:#fff;
  font-variant-numeric:tabular-nums; line-height:1.1; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
.hero-num--sm{font-size:22px; color:var(--gold);}
.hero-unit{font-family:var(--font-th); font-size:12.5px; color:rgba(255,255,255,.6); font-weight:400;}

.stat-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
.stat-card{padding:15px 12px; border-radius:var(--r-md); text-align:center;}
.stat-num{font-family:var(--font-num); font-size:22px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums;}
.stat-label{font-size:11px; color:var(--ink-dim); margin-top:5px; font-weight:300; overflow-wrap:break-word;}
.stat-card.warn .stat-num{color:var(--warn);}
.stat-card.bad .stat-num{color:var(--bad);}
.stat-card.ok .stat-num{color:var(--ok);}
.stat-card.info .stat-num{color:var(--info);}

.chart-card{padding:18px; margin-bottom:12px;}
.chart-card h4{margin:0 0 10px; font-size:13px; font-weight:500; color:var(--ink-dim);}
.chart-wrap{position:relative; height:200px; max-width:100%;}

.search-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.input, select.input{
  width:100%; padding:12px 15px; border-radius:var(--r-sm); border:1px solid var(--panel-line);
  background:var(--panel-soft); color:var(--ink); font-family:inherit; font-size:16px; outline:none; min-width:0;
}
.input::placeholder{color:var(--ink-faint);}
.input:focus{border-color:var(--navy-line); background:#fff;}
.search-row .input{flex:1 1 180px;}
.sort-select{flex:1 1 140px; width:auto; min-width:0;}
.chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; -ms-overflow-style:none; scrollbar-width:none;}
.chip{
  flex:none; padding:8px 15px; border-radius:var(--r-tag); font-size:12.5px; border:1px solid var(--panel-line);
  background:#fff; color:var(--ink-dim); cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}

input[type="date"]{ width:100%; max-width:100%; min-width:0; box-sizing:border-box; -webkit-appearance:none; appearance:none; }
input[type="date"]::-webkit-date-and-time-value{ text-align:left; }

.list-item{ padding:14px 15px; border-radius:var(--r-md); margin-bottom:9px; width:100%; display:flex; align-items:center; gap:12px; cursor:pointer; }
.li-icon{ width:42px;height:42px;border-radius:13px; flex:none; display:flex;align-items:center;justify-content:center; background:var(--navy-wash); color:var(--navy); }
.li-icon svg{width:19px;height:19px;}
.li-icon img{width:100%;height:100%;object-fit:cover;border-radius:13px;}
.li-body{flex:1; min-width:0;}
.li-title{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.li-sub{font-size:11.5px; color:var(--ink-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.status-badge{font-size:11px; padding:5px 11px; border-radius:var(--r-tag); font-weight:500; flex:none; line-height:1.5; white-space:nowrap;}
.status-ready{background:var(--ok-wash); color:var(--ok);}
.status-borrowed{background:var(--warn-wash); color:var(--warn);}
.status-repair{background:var(--bad-wash); color:var(--bad);}
.status-disposed{background:var(--off-wash); color:var(--off);}
.status-overdue{background:rgba(193,73,90,.18); color:var(--bad); font-weight:600;}
.status-returned{background:var(--off-wash); color:var(--off);}
.status-pending{background:var(--info-wash); color:var(--info);}
.status-rejected{background:var(--off-wash); color:var(--off); text-decoration:line-through;}
.empty-state{text-align:center; padding:44px 20px; color:var(--ink-dim); font-size:13px;}

.pagination{display:flex; align-items:center; justify-content:center; gap:14px; padding:16px 0 4px; font-size:12.5px; color:var(--ink-dim); flex-wrap:wrap;}
.pagination button{padding:8px 16px; border-radius:var(--r-tag); border:1px solid var(--panel-line); background:#fff; color:var(--ink); cursor:pointer; font-size:12.5px;}
.pagination button:disabled{opacity:.4; cursor:default;}

.view-toggle{ display:inline-flex; border:1px solid var(--panel-line); border-radius:var(--r-tag); overflow:hidden; flex:none; }
.view-toggle button{ border:none; background:#fff; padding:8px 10px; cursor:pointer; color:var(--ink-dim); display:flex; align-items:center; }
.view-toggle button svg{ width:16px; height:16px; }
.view-toggle button.active{ background:var(--navy); color:#fff; }

.asset-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.asset-grid > .empty-state{ grid-column:1 / -1; }
.asset-card{ padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:10px; transition:transform .16s ease, box-shadow .16s ease; }
.asset-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.asset-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.asset-card-icon{ width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; background:var(--navy-wash); color:var(--navy); flex:none; }
.asset-card-title{ font-size:13.5px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.asset-card-sub{ font-size:11px; color:var(--ink-dim); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ap-group{ margin-bottom:10px; }
.ap-group-head{
  display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer;
  border-radius:var(--r-md); background:var(--navy-wash); border:1px solid var(--panel-line);
  font-size:13.5px; font-weight:600; color:var(--navy); user-select:none;
}
.ap-group-head .ap-count{
  margin-left:auto; font-size:11px; font-weight:500; padding:3px 10px; border-radius:var(--r-tag);
  background:var(--gold-wash); color:var(--gold-deep); flex:none;
}
.ap-group-head .ap-caret{ width:16px; height:16px; flex:none; transition:transform .15s ease; }
.ap-group.open .ap-caret{ transform:rotate(90deg); }
.ap-group-body{ display:none; padding-top:8px; }
.ap-group.open .ap-group-body{ display:block; }
.ap-group-name{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ap-serial{ font-family:var(--font-num); font-weight:600; letter-spacing:.01em; }
.ap-serial.none{ color:var(--ink-faint); font-family:var(--font-th); font-weight:400; }
   
@media (min-width:900px){
  .asset-grid{ grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
  .asset-card{ padding:16px; border-radius:18px; }
}

.fab{
  position:fixed; right:18px; bottom:calc(118px + env(safe-area-inset-bottom)); z-index:45; width:56px;height:56px; border-radius:50%;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff; border:none;
  box-shadow:0 14px 30px rgba(187,138,63,.4); cursor:pointer; display:flex;align-items:center;justify-content:center;
}
.fab svg{width:22px;height:22px;}

/* ---------- bottom tab bar (มือถือ) — เลื่อนแนวนอนได้ ไม่บีบเบียดกันอีกต่อไป ---------- */
.tabbar{
  position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); left:10px; right:10px; z-index:50;
  display:flex; justify-content:flex-start; align-items:stretch; overflow-x:auto; overscroll-behavior-x:contain;
  -ms-overflow-style:none; scrollbar-width:none; scroll-snap-type:x proximity;
  padding:8px 8px; gap:3px; background:rgba(255,255,255,.92);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--panel-line); border-radius:22px; box-shadow:var(--shadow-lg);
  max-width:640px; margin:0 auto;
}
.tabbar::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto; scroll-snap-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  min-width:64px; padding:9px 12px; color:var(--ink-dim); background:none; border:none; font-family:inherit; cursor:pointer; border-radius:15px;
}
.tab .ico{width:20px;height:20px; position:relative;}
.tab .ico svg{width:20px;height:20px;}
.tab .lbl{font-size:10.5px; font-weight:400; white-space:nowrap;}
.tab.active{color:var(--navy); background:var(--gold-wash);}
.tab.active .lbl{font-weight:600;}
.tab-dot{position:absolute; top:-8px; right:-9px; min-width:18px; height:18px; padding:0 4px; border-radius:999px; background:#ff3b30; color:#fff; border:2px solid rgba(255,255,255,.96); box-shadow:0 3px 9px rgba(255,59,48,.28); display:none; align-items:center; justify-content:center; font-family:var(--font-num); font-size:9px; font-weight:700; line-height:1; z-index:4; pointer-events:none;}

.overlay{
  position:fixed; inset:0; background:rgba(15,25,38,.46); backdrop-filter:blur(4px); z-index:80;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto; border-radius:28px 28px 0 0;
  background:#ffffff; border:1px solid var(--panel-line); border-bottom:none;
  box-shadow:0 -16px 48px rgba(20,32,45,.2);
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  animation:slideup .22s ease-out; position:relative;
}
@keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px;height:4px;border-radius:99px; background:var(--panel-line); margin:0 auto 14px;}
.sheet-title{font-size:17px; font-weight:600; margin-bottom:16px; font-family:var(--font-disp); padding-right:34px;}
.sheet-close{
  position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--panel-line); background:#fff; color:var(--ink-dim); cursor:pointer;
  display:flex; align-items:center; justify-content:center; z-index:6; flex:none;
}
.sheet-close svg{width:15px;height:15px;}
.sheet-close:hover{background:var(--bad-wash); color:var(--bad); border-color:transparent;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-dim); margin-bottom:6px;}
.btn-row{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.btn{ flex:1 1 120px; padding:13px; border-radius:var(--r-sm); border:none; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; }
.btn-primary{background:linear-gradient(150deg, var(--navy), var(--navy-deep)); color:#fff; box-shadow:0 8px 20px rgba(23,50,79,.28);}
.btn-ghost{background:#fff; color:var(--ink); border:1px solid var(--panel-line);}
.btn-danger{background:var(--bad-wash); color:var(--bad);}
.btn-ok{background:var(--ok-wash); color:var(--ok);}
.btn:disabled{opacity:.6; cursor:wait;}

.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:36px 26px; text-align:center;
  background:
    radial-gradient(560px 360px at 20% 0%, rgba(187,138,63,.35), transparent 60%),
    radial-gradient(620px 420px at 100% 10%, rgba(255,255,255,.08), transparent 55%),
    linear-gradient(150deg, var(--navy-deep), var(--navy) 60%, #1c3f63);
  color:#fff;
}
.login-badge{
  width:78px;height:78px;border-radius:24px; display:flex;align-items:center;justify-content:center; margin-bottom:24px;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff; box-shadow:0 16px 38px rgba(0,0,0,.25);
  animation:badgeIn .5s ease-out;
}
.login-badge svg{width:36px;height:36px;}
@keyframes badgeIn{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}
.login-title{font-size:20px; font-weight:600; margin-bottom:6px; font-family:var(--font-disp);}
.login-sub{font-size:13px; color:rgba(255,255,255,.72); margin-bottom:28px; max-width:300px; line-height:1.65; font-weight:300;}
.spinner{width:26px;height:26px;border-radius:50%; border:3px solid rgba(255,255,255,.25); border-top-color:var(--gold); animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:130; padding:12px 22px; border-radius:var(--r-tag);
  background:var(--navy-deep); color:#f2f6fa; border:1px solid var(--navy-deep); font-size:13px; box-shadow:var(--shadow-lg);
  opacity:0; transition:opacity .25s, transform .25s; max-width:88vw; text-align:center; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(4px);}
.detail-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--panel-line); font-size:13px; gap:12px; flex-wrap:wrap; row-gap:2px;}
.detail-row span:first-child{color:var(--ink-dim); flex:none;}
.detail-row span:last-child{text-align:right; word-break:break-word; overflow-wrap:anywhere; min-width:0; flex:1;}
.hint{font-size:11px; color:var(--ink-dim); margin-top:14px; line-height:1.6;}

.role-select-box{width:100%; max-width:300px;}
.role-select-card{
  display:flex; align-items:center; gap:14px; padding:16px 18px; margin-bottom:12px; border-radius:18px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); cursor:pointer; text-align:left; transition:.18s ease;
}
.role-select-card:hover, .role-select-card:active{ background:rgba(255,255,255,.16); transform:translateY(-1px); }
.rsc-icon{width:42px;height:42px;border-radius:13px; display:flex;align-items:center;justify-content:center; flex:none; background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff;}
.rsc-icon svg{width:19px;height:19px;}
.rsc-body{flex:1; min-width:0;}
.rsc-title{font-size:14.5px; font-weight:600; color:#fff;}
.rsc-sub{font-size:11.5px; color:rgba(255,255,255,.65); margin-top:2px;}
.role-login-form{width:100%; max-width:300px; text-align:left;}
.role-login-form .field label{color:rgba(255,255,255,.72);}
.role-login-form .field input{background:rgba(255,255,255,.95); color:#20303f;}
.link-btn{color:var(--gold); font-size:12.5px; cursor:pointer; text-decoration:underline;}

@keyframes appIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.app-in{animation:appIn .4s ease-out;}

/* =========================================================
   PRINT ENGINE v2
   A4 FIXED PHYSICAL SIZE
   Desktop / iPad / iPhone / Android ใช้ขนาดเอกสารเดียวกัน
   ========================================================= */

#printArea{
  display:none;
}

/* ขนาดกระดาษจริง */
@page{
  size:A4 portrait;
  margin:0;
}

@media print{

  html{
    width:210mm !important;
    min-width:210mm !important;
    max-width:210mm !important;
    margin:0 !important;
    padding:0 !important;
    background:#fff !important;
    overflow:visible !important;

    /* ห้าม browser ปรับขนาดตัวอักษร */
    -webkit-text-size-adjust:none !important;
    text-size-adjust:none !important;
  }

  body{
    width:210mm !important;
    min-width:210mm !important;
    max-width:210mm !important;

    margin:0 !important;
    padding:0 !important;

    background:#fff !important;
    overflow:visible !important;

    /* สำคัญมากสำหรับ iOS */
    -webkit-text-size-adjust:none !important;
    text-size-adjust:none !important;

    /* ป้องกัน browser ทำ font boosting */
    -webkit-font-smoothing:auto !important;
  }

  /* ซ่อน UI ทั้งระบบ */
  body > *:not(#printArea):not(style):not(script){
    display:none !important;
  }

  /* =========================================
     กระดาษ A4 จริง
     ========================================= */

  #printArea{
    display:block !important;

    visibility:visible !important;
    opacity:1 !important;

    position:static !important;

    width:210mm !important;
    min-width:210mm !important;
    max-width:210mm !important;

    min-height:297mm !important;

    margin:0 !important;

    padding:22mm 20mm 20mm 25mm !important;

    box-sizing:border-box !important;

    background:#fff !important;
    color:#000 !important;

    /* สำคัญ:
       ห้ามใช้ zoom / transform กับพื้นที่พิมพ์ */
    zoom:1 !important;
    transform:none !important;

    /* ป้องกัน flex/grid ของหน้าหลักเข้ามามีผล */
    display:block !important;

    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
  }

  #printArea *{
    visibility:visible !important;
  }

  /* เอกสารราชการ */
  #printArea .pf-doc{
    width:100% !important;
    max-width:none !important;

    font-size:16pt !important;
    line-height:18pt !important;

    -webkit-text-size-adjust:none !important;
    text-size-adjust:none !important;
  }

  /* QR */
  #printArea.qr-print-area{
    width:210mm !important;
    min-width:210mm !important;
    max-width:210mm !important;

    min-height:297mm !important;

    padding:20mm !important;

    box-sizing:border-box !important;

    text-align:center !important;

    font-family:'Kanit',sans-serif !important;
  }

  /* รายงาน */
  #printArea.report-print-area{
    width:210mm !important;
    min-width:210mm !important;
    max-width:210mm !important;

    min-height:297mm !important;

    padding:0 !important;

    box-sizing:border-box !important;
  }

  /* รูปในเอกสารห้ามถูกย่อด้วย max-width */
  #printArea img{
    max-width:none !important;
  }

  /* ตารางไม่ให้ browser บีบตาม viewport */
  #printArea table{
    max-width:none !important;
  }

  /* ป้องกัน element ที่มี transform จาก preview */
  #printArea .paper-scale{
    transform:none !important;
    width:210mm !important;
  }

  #printArea .paper-sizer{
    width:210mm !important;
    height:auto !important;
  }

  /* ไม่ให้ scrollbar / touch layout มีผลตอนพิมพ์ */
  #printArea,
  #printArea *{
    overflow:visible !important;
    touch-action:auto !important;
  }

  /* ห้าม element ภายในเปลี่ยนขนาดตาม viewport */
  #printArea input,
  #printArea textarea,
  #printArea select{
    max-width:none !important;
  }
}

/* =========================================================
   บันทึกข้อความ (เอกสารราชการ) — สัดส่วนอ้างอิงจากตัวอย่าง PDF จริง
   ฟอนต์ 16pt · ระยะบรรทัด 18pt · ขอบซ้าย 25mm ขวา 20mm · ย่อหน้า 2.5cm
   ========================================================= */
.pf-doc{
  font-family:'TH Sarabun New','THSarabunNew','TH SarabunPSK','THSarabunPSK','Sarabun','Kanit',sans-serif;
  font-size:16pt; line-height:18pt; color:#000; font-weight:400; outline:none;
  word-break:normal; overflow-wrap:break-word;
}
html:not(.has-thsarabun) .pf-doc{ font-size:14pt; line-height:17.5pt; }
html:not(.has-thsarabun) .pf-title{ font-size:26pt; line-height:30pt; }
.pf-doc b{ font-weight:700; }
.pf-doc img{ max-width:none; }

.pf-topline{ position:relative; height:17.5mm; }
.pf-emblem{ position:absolute; left:0; top:0; height:16mm; }
.pf-emblem img{ display:block; height:16mm; width:auto; max-width:none; }
.pf-emblem-placeholder{
  width:14mm; height:16mm; border:1px dashed #bb8a3f; border-radius:3px; font-size:8pt; line-height:1.2; color:#8a641f;
  display:flex; align-items:center; justify-content:center; text-align:center;
}
.pf-title-wrap{ text-align:center; }
.pf-title{ text-align:center; font-size:29pt; line-height:33pt; font-weight:700; padding-top:4mm; }

.pf-field-line{ margin:0; }
.pf-field-line + .pf-field-line, .pf-two-col + .pf-field-line, .pf-field-line + .pf-two-col{ margin-top:2.5pt; }
.pf-two-col{ display:grid; grid-template-columns:8.25cm 1fr; margin:2.5pt 0 0; }
.pf-label{ font-weight:700; margin-right:2mm; }
.pf-label.pf-plain{ font-weight:400; }
.pf-field-line.pf-addressee{ margin-top:8pt; }

.pf-body{ margin:6pt 0 0; text-indent:2.5cm; text-align:justify; }
.pf-addressee + .pf-body{ margin-top:12pt; }

.pf-sign{ width:10cm; margin:16pt 0 0 4.1cm; text-align:center; }
.pf-sign > div{ line-height:19pt; min-height:19pt; }
.pf-sign-rank{ padding-right:4.6cm; }
.pf-note{ margin:10pt 0 0; text-indent:2.5cm; }
.pf-note + .pf-sign{ margin-top:0; }
.pf-receipt{ margin-top:10pt; }
.pf-receipt + .pf-sign{ margin-top:10pt; }
.pf-sign + .pf-sign{ margin-top:12pt; }

.pf-doc[contenteditable="true"]{ cursor:text; }
.pf-doc[contenteditable="true"] span:hover, .pf-doc[contenteditable="true"] div:hover{ background:rgba(187,138,63,.16); border-radius:3px; }
.pf-doc[contenteditable="true"]:focus{ outline:none; }

/* ---------- กระดาษ A4 บนโต๊ะ (ย่อ/ขยายอัตโนมัติให้พอดีความกว้าง) ---------- */
.a4-page{
  width:210mm; min-height:297mm; background:#fff; color:#000; position:relative;
  padding:22mm 20mm 20mm 25mm; box-sizing:border-box;
}
.paper-desk{
  position:relative; padding:16px; border-radius:16px; overflow:auto; touch-action:pan-x pan-y;
  background:
    radial-gradient(600px 240px at 50% -10%, rgba(255,255,255,.55), transparent 70%),
    linear-gradient(180deg,#dde3e1,#cfd7d5);
  border:1px solid var(--panel-line);
  box-shadow:inset 0 2px 10px rgba(20,32,45,.08);
}
.paper-sizer{ position:relative; margin:0 auto; }
.paper-scale{ position:absolute; top:0; left:0; width:210mm; transform-origin:0 0; }
.paper-scale .a4-page{ box-shadow:0 1px 3px rgba(20,32,45,.14), 0 16px 40px rgba(20,32,45,.2); }

.memo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
.memo-grid > .empty-state{ grid-column:1 / -1; }
.memo-card{ overflow:hidden; cursor:pointer; border-radius:var(--r-lg); padding:0; transition:transform .16s ease, box-shadow .16s ease; }
.memo-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.memo-thumb{
  position:relative; overflow:hidden; aspect-ratio:1 / 1.12; background:#dfe5e3; border-bottom:1px solid var(--panel-line);
  pointer-events:none;
}
.memo-thumb .paper-scale{ position:absolute; top:0; left:0; width:210mm; transform-origin:0 0; }
.memo-thumb .a4-page{ box-shadow:none; }
.memo-card-body{ padding:11px 13px 13px; }
.memo-card-body .li-title{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

.memo-two-col{display:flex; gap:10px; flex-wrap:wrap;}
.memo-two-col > .field{flex:1 1 160px;}
.memo-section-label{font-size:12.5px; font-weight:600; color:var(--navy); margin:14px 0 8px; padding-top:10px; border-top:1px solid var(--panel-line);}
.memo-signer-pick{display:flex; gap:8px; margin-bottom:8px;}
.memo-signer-pick select{flex:1;}

.mf-tabs{ display:flex; gap:4px; padding:4px; border-radius:var(--r-tag); background:var(--off-wash); margin-bottom:14px; }
.mf-tabs button{
  flex:1; border:none; background:transparent; padding:10px 12px; border-radius:var(--r-tag); font-size:13px;
  color:var(--ink-dim); cursor:pointer; font-family:inherit;
}
.mf-tabs button.active{ background:#fff; color:var(--navy); font-weight:600; box-shadow:var(--shadow-sm); }
.mf-grid[data-view="form"] .mf-preview{ display:none; }
.mf-grid[data-view="preview"] .mf-fields{ display:none; }

.mf-section{ background:var(--panel-soft); border:1px solid var(--panel-line); border-radius:var(--r-md); padding:14px 14px 4px; margin-bottom:12px; }
.mf-section-title{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:12px; }
.mf-step{
  width:22px; height:22px; border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center;
  background:var(--navy); color:#fff; font-size:11px; font-weight:600; font-family:var(--font-num);
}
.mf-item{ border:1px dashed var(--panel-line); border-radius:var(--r-md); padding:12px 12px 2px; margin-bottom:10px; background:#fff; }
.mf-item-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:12.5px; font-weight:600; color:var(--navy); }
.mf-item-del{ border:none; background:var(--bad-wash); color:var(--bad); border-radius:var(--r-tag); padding:4px 12px; font-size:11.5px; cursor:pointer; }
.mf-add{ width:100%; padding:10px; margin-bottom:12px; border-radius:var(--r-sm); border:1px dashed var(--gold-line); background:var(--gold-wash); color:var(--gold-deep); font-size:13px; font-weight:500; cursor:pointer; }

.mf-preview-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.mf-preview-title{ font-size:14px; font-weight:600; color:var(--navy); }
.mf-badge{ font-size:11px; padding:4px 10px; border-radius:var(--r-tag); background:var(--gold-wash); color:var(--gold-deep); font-weight:500; }
.mf-preview-hint{ font-size:11px; color:var(--ink-dim); margin-top:8px; text-align:center; }
.mf-preview .paper-desk{ max-height:64vh; }

.doc-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.doc-toolbar .hint{ margin:0; flex:1 1 220px; }
.zoom-ctl{ display:inline-flex; align-items:center; gap:6px; }
.zbtn{
  min-width:34px; height:32px; padding:0 11px; border:1px solid var(--panel-line); background:#fff; color:var(--ink);
  border-radius:var(--r-tag); cursor:pointer; font-size:13px; font-family:inherit;
}
.zbtn:hover{ border-color:var(--gold-line); background:var(--gold-wash); }
.zoom-lbl{ font-size:12px; color:var(--ink-dim); min-width:40px; text-align:center; font-family:var(--font-num); }
.doc-dirty{ font-size:11px; color:var(--warn); background:var(--warn-wash); padding:3px 10px; border-radius:var(--r-tag); display:none; }
.doc-dirty.show{ display:inline-block; }

.refresh-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-width:42px;height:38px;padding:0 11px;border:1px solid var(--panel-line);
  border-radius:var(--r-tag);background:#fff;color:var(--ink);cursor:pointer;font-size:12px;
  box-shadow:var(--shadow-sm);transition:.18s ease;
}
.refresh-btn:hover{transform:translateY(-1px);border-color:var(--gold-line);background:var(--gold-wash);}
.refresh-btn:disabled{opacity:.6;cursor:wait;transform:none;}
.refresh-btn svg{width:17px;height:17px;}
.refresh-btn.loading svg{animation:spin .8s linear infinite;}
.connection-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-wash); flex:none;}
.connection-dot.offline{background:var(--bad);box-shadow:0 0 0 3px var(--bad-wash);}
.loading-overlay{
  position:fixed;inset:0;z-index:120;background:rgba(238,241,240,.6);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;
}
.loading-overlay.show{display:flex;}
.loading-card{min-width:180px;padding:22px 26px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--panel-line);box-shadow:var(--shadow-lg);text-align:center;}
.loading-card .spinner{margin:0 auto 10px; border:3px solid var(--panel-line); border-top-color:var(--navy);}
.loading-text{font-size:13px;color:var(--ink-dim);}
.loading-timer{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.last-sync{font-size:10.5px;color:var(--ink-faint);margin-left:4px;white-space:nowrap;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--panel-line);background:#fff;color:var(--ink);cursor:pointer; flex:none;}
.icon-btn svg{width:17px;height:17px;}
#qrHolder{display:flex;justify-content:center;padding:14px 0;}
#qrHolder canvas, #qrHolder img{border-radius:12px;}

@media (min-width:900px){
  .topbar{min-height:66px;}
  .desktop-tools{display:flex !important;align-items:center;gap:9px;}
  .refresh-btn{height:40px;min-width:44px;}
  .page{min-height:calc(100vh - 66px);}
  .list-item{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;}
  .list-item:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:#d8cdb4;}
  .sheet{max-width:700px;border-radius:24px;max-height:90vh;border-bottom:1px solid var(--panel-line);margin:20px;padding:26px;}
  .overlay{align-items:center;}
  .sheet-handle{display:none;}
  .sheet-title{font-size:21px; margin-bottom:22px;}
  .field{margin-bottom:15px;}
  .field label{font-size:13px; margin-bottom:7px;}
  .btn-row{gap:12px; margin-top:20px;}
  .btn{min-height:46px; padding:12px 18px; font-size:14px; border-radius:14px;}
  .input, select.input{ font-size:14px; }
}
@media (max-width:899px){
  .desktop-tools{display:flex !important;align-items:center;gap:7px;}
  .last-sync{display:none;}
}
@media (max-width:380px){
  .search-row .input, .sort-select{flex-basis:100%;}
  .stat-grid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px;}
  .hero-num{font-size:26px;}
  input[type="date"]{padding-left:10px; padding-right:8px;}
}

    padding-bottom:24px;
    background:
      radial-gradient(1100px 560px at 78% -10%, var(--gold-wash), transparent 62%),
      radial-gradient(900px 480px at 0% 0%, var(--dawn-1), transparent 55%),
      linear-gradient(180deg,var(--bg-1) 0%,var(--bg-0) 100%);
  }
  .tabbar{
    position:fixed; left:16px; top:16px; bottom:16px; width:236px; height:calc(100vh - 32px); z-index:70;
    display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; gap:6px; overflow-x:visible; overflow-y:auto;
    padding:26px 14px 20px; background:linear-gradient(180deg,var(--side-1) 0%,var(--side-2) 100%);
    border:0; border-radius:26px; right:auto; margin:0; box-shadow:var(--shadow-lg);
  }
  .tabbar::before{ content:"ระบบพัสดุครุภัณฑ์"; display:block; color:#fff; font-size:18px; font-weight:600; padding:4px 12px 2px; font-family:var(--font-disp); }
  .tabbar::after{
    content:"ตำรวจทางหลวง"; display:block; color:rgba(255,255,255,.62); font-size:12px; font-weight:300;
    padding:0 12px 24px; border-bottom:1px solid rgba(255,255,255,.10); margin-bottom:10px;
  }
  .tab{

/* ================================================================
   MOBILE BOTTOM NAV — Expanding pill (Liquid Glass)
   ================================================================ */

/* ซ่อนองค์ประกอบของมือถือบนเดสก์ท็อป */
.tabbar .tab-more{ display:none; }
.tab-pill{ display:none; }

@media (max-width:899px){
  /* เว้นที่ให้แถบล่าง + ปุ่ม + */
  body{ padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
  .fab{ bottom:calc(88px + env(safe-area-inset-bottom)); }

  /* --- ตัวแถบ (กระจก) --- */
  .tabbar{
    left:12px; right:12px; max-width:460px; margin:0 auto;
    bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex; justify-content:flex-start; align-items:stretch; gap:0;
    height:60px; padding:6px; overflow:visible; border-radius:30px;
    background:color-mix(in srgb, var(--panel) 58%, transparent) !important;
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid color-mix(in srgb, #fff 55%, transparent);
    box-shadow:0 12px 32px rgba(20,32,45,.18),
               inset 0 1px 0 rgba(255,255,255,.7),
               inset 0 -1px 0 rgba(255,255,255,.15);
  }
  :root[data-theme="night"] .tabbar{ border-color:rgba(255,255,255,.12); }

  /* ปุ่มรองซ่อนไว้ (ใช้ !important เพราะ JS ตั้ง style="display:flex" ให้แอดมิน) */
  .tabbar .tab-secondary{ display:none !important; }
  .tabbar .tab-more{ display:flex; }

  /* --- pill (ก้อนที่เลื่อน) --- */
  .tab-pill{
    display:block; position:absolute; z-index:0; top:6px; bottom:6px; left:6px; width:0;
    border-radius:24px;
    background:linear-gradient(150deg, var(--navy), var(--navy-deep));
    box-shadow:0 6px 16px rgba(23,50,79,.28);
    transition:left .42s cubic-bezier(.3,1.1,.5,1),
               width .42s cubic-bezier(.3,1.1,.5,1);
  }

  /* --- ปุ่ม --- */
  .tabbar .tab{
    position:relative; z-index:1; flex:0 0 auto; min-width:0; height:100%; padding:0;
    flex-direction:row; justify-content:center; align-items:center; gap:7px;
    border-radius:24px; overflow:hidden;
    background:none !important; box-shadow:none !important;
    color:var(--ink-dim);
    transition:width .42s cubic-bezier(.3,1.1,.5,1), color .25s;
  }
  .tabbar .tab .ico{ flex:none; }
  .tabbar .tab .lbl{
    display:block; overflow:hidden; white-space:nowrap;
    max-width:0; opacity:0; font-size:12px; font-weight:500;
    transition:max-width .4s ease, opacity .25s ease;
  }
  .tabbar .tab.active{ color:#fff; }
  .tabbar .tab.active .lbl{ max-width:110px; opacity:1; }
  .tab-dot{ border-color:var(--panel); }

  /* ครั้งแรกที่เปิดแอป: วาง pill ทันทีโดยไม่เลื่อนมาจากศูนย์ */
  .tabbar.no-anim, .tabbar.no-anim *{ transition:none !important; }
}

.more-ico svg{ width:21px; height:21px; }
.more-item.active{ border-color:var(--gold-line); background:var(--gold-wash); font-weight:600; }
.more-item.active .more-ico{ background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff; }   


/* ================================================================
   PREMIUM UI LAYER v2 — THEME SAFE
   สำคัญ: ชั้นนี้ใช้ Design Tokens ของระบบเดิมทั้งหมด
   ไม่ล็อกสีพื้นด้วยสีตายตัว และไม่แตะ JS / API / state
   ================================================================ */
:root{
  --premium-line:color-mix(in srgb, var(--ink) 9%, transparent);
  --premium-line-strong:color-mix(in srgb, var(--ink) 15%, transparent);
  --premium-shadow:0 18px 48px color-mix(in srgb, var(--navy-deep) 14%, transparent);
  --premium-shadow-soft:0 8px 28px color-mix(in srgb, var(--navy-deep) 8%, transparent);
  --premium-highlight:color-mix(in srgb, var(--gold) 14%, transparent);
}

/* พื้นหลัง: ให้แต่ละธีมเป็นคนกำหนดสีเอง */
body{
  background:
    radial-gradient(900px 520px at 92% -12%,var(--gold-wash),transparent 60%),
    radial-gradient(760px 500px at -8% 18%,var(--navy-wash),transparent 58%),
    radial-gradient(900px 560px at 50% 115%,var(--dawn-4),transparent 62%),
    linear-gradient(180deg,var(--bg-1),var(--bg-0));
}

/* topbar */
.topbar{
  min-height:68px;
  background:color-mix(in srgb,var(--bg-1) 84%,transparent);
  border-bottom:1px solid var(--premium-line);
  box-shadow:0 8px 30px color-mix(in srgb,var(--navy-deep) 5%,transparent);
  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
}
.brand-badge{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(145deg,var(--gold),var(--gold-deep));
  box-shadow:0 8px 22px var(--gold-wash);
}
.brand-title{letter-spacing:.01em;}
.brand-sub{letter-spacing:.02em;}
.icon-btn,.refresh-btn{
  border:1px solid var(--premium-line);
  background:color-mix(in srgb,var(--panel) 84%,transparent);
  box-shadow:0 3px 12px color-mix(in srgb,var(--navy-deep) 5%,transparent);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.icon-btn:hover,.refresh-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px color-mix(in srgb,var(--navy-deep) 9%,transparent);
  border-color:var(--gold-line);
}

/* cards */
.glass,
.stat-card,.chart-card,.list-item,.asset-card,.rp-card,.rp-kpi{
  border-color:var(--premium-line);
  box-shadow:var(--premium-shadow-soft);
  background:var(--panel);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.stat-card:hover,.chart-card:hover,.asset-card:hover,.rp-card:hover,.rp-kpi:hover{
  border-color:var(--gold-line);
  box-shadow:var(--premium-shadow);
}
.list-item:hover{border-color:var(--gold-line);}

/* hero ใช้สีของ theme */
.hero-card{
  background:
    radial-gradient(360px 220px at 90% -10%,var(--gold-wash),transparent 62%),
    linear-gradient(145deg,var(--navy),var(--navy-deep));
  box-shadow:var(--premium-shadow);
  border:1px solid color-mix(in srgb,#fff 9%,transparent);
}
.hero-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 0%,color-mix(in srgb,#fff 5%,transparent) 48%,transparent 70%);
  transform:translateX(-80%);animation:premiumShine 9s ease-in-out infinite;
}
@keyframes premiumShine{0%,65%{transform:translateX(-80%)}85%,100%{transform:translateX(100%)}}

/* inputs */
.input,select.input{
  border-color:var(--premium-line);
  background:var(--panel-soft);
  box-shadow:inset 0 1px 2px color-mix(in srgb,var(--navy-deep) 3%,transparent);
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.input:focus,select.input:focus{
  border-color:var(--gold-line);
  box-shadow:0 0 0 4px var(--gold-wash);
  background:var(--panel);
}
.chip{transition:all .18s ease;}
.chip.active{
  background:linear-gradient(135deg,var(--navy),var(--navy-deep));
  box-shadow:0 7px 18px color-mix(in srgb,var(--navy-deep) 16%,transparent);
}

/* buttons — theme-aware */
.btn-primary{
  background:linear-gradient(135deg,var(--navy),var(--navy-deep));
  box-shadow:0 9px 22px color-mix(in srgb,var(--navy-deep) 17%,transparent);
}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.04);}
.btn-ghost{border-color:var(--premium-line);background:var(--panel);}

/* modal / sheet */
.overlay{
  background:color-mix(in srgb,var(--navy-deep) 52%,transparent);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.sheet{
  border-color:var(--premium-line);
  box-shadow:0 28px 90px color-mix(in srgb,var(--navy-deep) 28%,transparent);
  background:var(--panel);
}
.sheet-handle{background:color-mix(in srgb,var(--ink) 18%,transparent);}

/* login — คงเอกลักษณ์ของแต่ละธีม */
.login-wrap{
  background:
    radial-gradient(700px 450px at 80% 5%,var(--gold-wash),transparent 62%),
    radial-gradient(600px 500px at 5% 90%,var(--navy-wash),transparent 60%),
    linear-gradient(145deg,var(--navy-deep),var(--navy) 58%,color-mix(in srgb,var(--navy) 76%,var(--gold) 24%));
}
.login-badge{
  background:linear-gradient(145deg,var(--gold),var(--gold-deep));
  box-shadow:0 16px 38px color-mix(in srgb,var(--navy-deep) 25%,transparent);
}
.role-select-card{
  background:color-mix(in srgb,var(--panel) 10%,transparent);
  border-color:color-mix(in srgb,#fff 13%,transparent);
  backdrop-filter:blur(14px);
  box-shadow:0 12px 35px color-mix(in srgb,#000 12%,transparent);
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}
.role-select-card:hover{
  transform:translateY(-2px);
  border-color:var(--gold-line);
  background:color-mix(in srgb,var(--panel) 15%,transparent);
}
.rsc-icon{color:var(--gold);}

/* desktop: premium sidebar โดยยังใช้สี side-1 / side-2 ของธีม */
@media (min-width:900px){
  .tabbar{
    background:linear-gradient(180deg,var(--side-1),var(--side-2));
    box-shadow:var(--shadow-lg);
    border:1px solid color-mix(in srgb,#fff 5%,transparent);
  }
  .tabbar .tab:hover{
    background:color-mix(in srgb,#fff 7%,transparent);
  }
  .tabbar .tab.active{
    background:linear-gradient(90deg,var(--gold-wash),color-mix(in srgb,#fff 4%,transparent));
    box-shadow:inset 3px 0 0 var(--gold),0 7px 20px color-mix(in srgb,#000 8%,transparent);
  }
  .topbar{
    background:color-mix(in srgb,var(--bg-1) 88%,transparent);
  }
  .section-title{letter-spacing:.005em;}
  .stat-card{border-radius:20px;}
  .chart-card{border-radius:24px;}
  .fab{
    background:linear-gradient(145deg,var(--gold),var(--gold-deep));
    box-shadow:0 16px 34px var(--gold-wash);
  }
}

/* mobile: glass navigation ที่รับสีจาก theme */
@media (max-width:899px){
  .tabbar{
    background:color-mix(in srgb,var(--panel) 76%,transparent) !important;
    border-color:color-mix(in srgb,#fff 55%,transparent) !important;
    box-shadow:0 16px 42px color-mix(in srgb,var(--navy-deep) 16%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 70%,transparent) !important;
  }
  .tab-pill{background:linear-gradient(145deg,var(--navy),var(--navy-deep)) !important;}
  .tabbar .tab.active{color:#fff !important;}
  .fab{
    background:linear-gradient(145deg,var(--gold),var(--gold-deep));
    box-shadow:0 14px 30px var(--gold-wash);
  }
}

/* NIGHT: ใช้ palette เดิมทั้งหมด ไม่บังคับขาว */
:root[data-theme="night"] .topbar{
  background:color-mix(in srgb,var(--bg-1) 90%,transparent) !important;
  border-color:var(--panel-line) !important;
}
:root[data-theme="night"] .glass,
:root[data-theme="night"] .stat-card,
:root[data-theme="night"] .chart-card,
:root[data-theme="night"] .list-item,
:root[data-theme="night"] .asset-card,
:root[data-theme="night"] .rp-card,
:root[data-theme="night"] .rp-kpi{
  background:var(--panel) !important;
  border-color:var(--panel-line) !important;
  color:var(--ink);
}
:root[data-theme="night"] .input,
:root[data-theme="night"] select.input{
  background:var(--panel-soft) !important;
  color:var(--ink);
  border-color:var(--panel-line);
}
:root[data-theme="night"] .input:focus,
:root[data-theme="night"] select.input:focus{background:var(--panel) !important;}
:root[data-theme="night"] .btn-ghost,
:root[data-theme="night"] .icon-btn,
:root[data-theme="night"] .refresh-btn,
:root[data-theme="night"] .pagination button,
:root[data-theme="night"] .sheet-close,
:root[data-theme="night"] .zbtn{
  background:var(--panel) !important;
  color:var(--ink);
  border-color:var(--panel-line) !important;
}
:root[data-theme="night"] .tabbar{
  background:linear-gradient(180deg,var(--side-1),var(--side-2)) !important;
  border-color:color-mix(in srgb,#fff 10%,transparent) !important;
}
:root[data-theme="night"] .sheet{
  background:var(--panel) !important;
  color:var(--ink);
  border-color:var(--panel-line) !important;
}
:root[data-theme="night"] .overlay{background:rgba(0,0,0,.62);}

@media (prefers-reduced-motion:reduce){.hero-card::before{animation:none !important;}}

/* ===== PREMIUM EXPERIENCE LAYER v3 (ย้ายมาไว้ที่ถูกต้อง) ===== */
:root{
  --motion-ease:cubic-bezier(.22,.8,.2,1);
  --skeleton-base:color-mix(in srgb,var(--panel) 72%,var(--ink-faint) 28%);
  --skeleton-hi:color-mix(in srgb,var(--panel) 92%,var(--gold) 8%);
}
html{scroll-behavior:smooth;}
.stat-num,.hero-num,.k-num,.ap-serial{font-variant-numeric:tabular-nums;}
.btn:active,.list-item:active,.asset-card:active,.icon-btn:active,.refresh-btn:active,.fab:active,.chip:active,.tab:active{transform:scale(.97);}
@keyframes premiumItemIn{from{opacity:0;transform:translateY(8px) scale(.992)}to{opacity:1;transform:none}}
.premium-stagger-item{animation:premiumItemIn .42s var(--motion-ease) both;animation-delay:calc(var(--stagger-index,0) * 30ms);}

/* skeleton */
.skeleton-page{display:grid;gap:14px;}
.skeleton-hero{height:164px;border-radius:24px;}
.skeleton-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.skeleton-card{height:92px;border-radius:18px;}
.skeleton-list{display:grid;gap:10px;}
.skeleton-row{height:76px;border-radius:16px;}
.skeleton-shimmer{
  position:relative;overflow:hidden;border:1px solid var(--premium-line);
  background:linear-gradient(110deg,var(--skeleton-base) 8%,var(--skeleton-hi) 18%,var(--skeleton-base) 33%);
  background-size:220% 100%;animation:skeletonShimmer 1.25s linear infinite;
}
@keyframes skeletonShimmer{to{background-position:-220% 0;}}

/* toast */
.toast{
  top:auto!important;bottom:calc(92px + env(safe-area-inset-bottom))!important;left:50%!important;
  transform:translateX(-50%) translateY(12px)!important;display:flex;align-items:center;gap:9px;
  width:max-content;max-width:min(92vw,520px);padding:11px 15px!important;border-radius:16px!important;
}
.toast.show{opacity:1!important;transform:translateX(-50%) translateY(0)!important;}
.toast-icon{width:20px;height:20px;display:grid;place-items:center;flex:none;border-radius:50%;}
.toast-icon svg{width:17px;height:17px;}
.toast-message{line-height:1.4;text-align:left;white-space:normal;}
.toast.ok .toast-icon{color:var(--ok);background:var(--ok-wash);}
.toast.warn .toast-icon{color:var(--warn);background:var(--warn-wash);}
.toast.bad .toast-icon{color:var(--bad);background:var(--bad-wash);}
@media (min-width:900px){.toast{bottom:24px!important;}}

/* confirm sheet */
.confirm-overlay{align-items:center!important;padding:18px;}
.confirm-sheet{width:min(440px,100%);max-width:440px!important;border-radius:26px!important;padding:22px!important;}
.confirm-icon{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;margin-bottom:14px;color:var(--warn);background:var(--warn-wash);}
.confirm-icon svg{width:26px;height:26px;}
.confirm-title{font-size:18px;font-weight:650;color:var(--ink);margin-bottom:7px;font-family:var(--font-disp);}
.confirm-message{font-size:13px;line-height:1.7;color:var(--ink-dim);white-space:pre-line;}
.confirm-actions{display:flex;gap:10px;margin-top:20px;}

/* timeline (ตัวการที่ทำให้ icon ใหญ่) */
.asset-timeline{margin:18px 0 4px;}
.timeline-title{font-size:12px;font-weight:650;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.timeline-title svg{width:16px!important;height:16px!important;color:var(--gold-deep);}
.timeline{position:relative;display:grid;}
.timeline::before{content:"";position:absolute;left:11px;top:13px;bottom:13px;width:1px;background:var(--panel-line);}
.timeline-item{position:relative;display:grid;grid-template-columns:24px 1fr;gap:9px;padding:0 0 14px;}
.timeline-dot{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--panel-line);color:var(--ink-dim);z-index:1;}
.timeline-dot svg{width:13px!important;height:13px!important;}
.timeline-item.current .timeline-dot{color:var(--gold-deep);border-color:var(--gold-line);background:var(--gold-wash);}
.timeline-content{min-width:0;padding-top:1px;}
.timeline-event{font-size:12.5px;font-weight:600;color:var(--ink);}
.timeline-date{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}
.timeline-note{font-size:10.5px;color:var(--ink-faint);margin-top:2px;line-height:1.45;}

/* ตาราง/สรุปในหน้ารายงาน */
.rp-filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.rp-filter select{max-width:240px;}
/* =========================================================
   ชุดธีมใหม่ — [วางไว้ท้ายสุดของ <style> เสมอ]
   ตัวแปรสำคัญ:
   --navy/--navy-deep = สีหลักของปุ่ม/พื้นที่เติมสี
   --icon/--icon-bg   = สีไอคอนและพื้นหลังไอคอน (แยกจาก navy เพื่อไม่ให้จมในธีมมืด)
   --c1..--c6         = สีกราฟโดนัท / --chart-line, --chart-bar = สีกราฟเส้น/แท่ง
   ========================================================= */

/* ---------- ค่าเริ่มต้นของตัวแปรใหม่ (ทุกธีมที่ไม่ได้กำหนดเองจะใช้ค่านี้) ---------- */
:root{
  --icon:var(--navy); --icon-bg:var(--navy-wash);
  --c1:#17324f; --c2:#2a8f68; --c3:#4a86b4; --c4:#bb8a3f; --c5:#c1495a; --c6:#8b98a3;
  --chart-line:#bb8a3f; --chart-bar:#4a86b4;
}

/* บังคับให้ไอคอนทุกจุดใช้โทนของธีม (แก้ปัญหาไอคอนจมในธีมมืด) */
.li-icon,.ax-ico,.asset-card-icon,.more-ico,.avatar-placeholder{ color:var(--icon); background:var(--icon-bg); }
.ax-round{ color:var(--icon); }
.icon-btn,.refresh-btn,.sheet-close,.zbtn,.view-toggle button:not(.active){ color:var(--ink); }

/* ---------- ocean : สว่าง เขียวน้ำทะเล ---------- */
:root[data-theme="ocean"]{
  --dawn-1:#e0f7f5; --dawn-2:#e6f1fb; --dawn-3:#e8f4f2; --dawn-4:#dcecf3;
  --bg-0:#e6f1f2; --bg-1:#f1f8f7;
  --panel-line:#d6e6e6; --panel-hi:#e8f5f3;
  --navy:#0f4c5c; --navy-deep:#0a2f3a; --navy-wash:rgba(15,76,92,.07); --navy-line:rgba(15,76,92,.22);
  --gold:#0ea5a4; --gold-deep:#0b7a7a; --gold-wash:rgba(14,165,164,.14); --gold-line:rgba(14,165,164,.4);
  --side-1:#0f4c5c; --side-2:#0a2f3a;
  --c1:#0f4c5c; --c2:#0ea5a4; --c3:#3b82b6; --c4:#d9a441; --c5:#d6566b; --c6:#8aa3ad;
  --chart-line:#0ea5a4; --chart-bar:#0f4c5c;
}

/* ---------- frost : สว่าง กลาส ---------- */

  --bg-0:#e6eefb; --bg-1:#f3f0ff;

  --panel-line:rgba(110,130,190,.22); --panel-hi:rgba(255,255,255,.75);
  --ink:#1e2a44; --ink-dim:#5b6785; --ink-faint:#98a2bd;
  --navy:#3b5bdb; --navy-deep:#1e3a8a; --navy-wash:rgba(59,91,219,.1); --navy-line:rgba(59,91,219,.3);
  --gold:#8b5cf6; --gold-deep:#6d28d9; --gold-wash:rgba(139,92,246,.14); --gold-line:rgba(139,92,246,.4);
  --side-1:rgba(37,55,120,.74); --side-2:rgba(24,34,90,.84);
  --glass-blur:blur(20px) saturate(165%); --glass-edge:rgba(255,255,255,.85);

  --topbar-bg:rgba(255,255,255,.5); --tabbar-bg:rgba(255,255,255,.62); --sheet-bg:rgba(255,255,255,.78);
  --icon:#3b5bdb; --icon-bg:rgba(59,91,219,.12);
  --c1:#3b5bdb; --c2:#10b981; --c3:#38bdf8; --c4:#f59e0b; --c5:#ec4899; --c6:#94a3b8;
  --chart-line:#8b5cf6; --chart-bar:#3b5bdb;
}
:root[data-theme="frost"] body{
  background:
    radial-gradient(700px 500px at 5% 0%, rgba(96,165,250,.55), transparent 60%),
    radial-gradient(650px 480px at 100% 5%, rgba(244,114,182,.4), transparent 60%),
    radial-gradient(800px 600px at 55% 105%, rgba(167,139,250,.45), transparent 60%),

/* ---------- obsidian : มืด เรียบ น้ำเงินไฟฟ้า/ฟ้า ---------- */
:root[data-theme="obsidian"]{

  --bad:#fb7185; --bad-wash:rgba(251,113,133,.15); --off:#94a3b8; --off-wash:rgba(148,163,184,.15);

  --chart-line:#22d3ee; --chart-bar:#4f8cff;

:root[data-theme="obsidian"] .glass,

/* ---------- graphite : มืด เทาอุ่น/ทองแดง ---------- */

  --bg-0:#121110; --bg-1:#181615;
  --panel:#211e1c; --panel-soft:#2a2623; --panel-line:#3a3531; --panel-hi:#312c29;

  --ok:#6fcf97; --ok-wash:rgba(111,207,151,.15); --warn:#f2c14e; --warn-wash:rgba(242,193,78,.16);
  --bad:#f0788a; --bad-wash:rgba(240,120,138,.16); --off:#a39a90; --off-wash:rgba(163,154,144,.16);

  --icon:#ecc08a; --icon-bg:rgba(201,150,90,.18);
  --c1:#c9965a; --c2:#7bbf8e; --c3:#6fa8c9; --c4:#e8b774; --c5:#d4687a; --c6:#a39a90;

  --chart-line:#4ade80; --chart-bar:#22c55e;

/* เหลี่ยมทั้งระบบ — [ปรับตรงนี้] เปลี่ยน 5px เป็นค่าอื่นถ้าอยากมนมากขึ้น */
:root[data-theme="terminal"] .glass,
:root[data-theme="terminal"] .stat-card, :root[data-theme="terminal"] .chart-card,
:root[data-theme="terminal"] .rp-card, :root[data-theme="terminal"] .rp-kpi,
:root[data-theme="terminal"] .list-item, :root[data-theme="terminal"] .asset-card,
:root[data-theme="terminal"] .memo-card, :root[data-theme="terminal"] .hero-card,
:root[data-theme="terminal"] .input, :root[data-theme="terminal"] select.input,
:root[data-theme="terminal"] .btn, :root[data-theme="terminal"] .chip, :root[data-theme="terminal"] .ax-pill,
:root[data-theme="terminal"] .icon-btn, :root[data-theme="terminal"] .refresh-btn, :root[data-theme="terminal"] .ax-round,
:root[data-theme="terminal"] .sheet, :root[data-theme="terminal"] .tabbar, :root[data-theme="terminal"] .tab,
:root[data-theme="terminal"] .tab-pill, :root[data-theme="terminal"] .status-badge, :root[data-theme="terminal"] .role-pill,

  box-shadow:0 0 0 1px rgba(34,197,94,.1), 0 0 16px rgba(34,197,94,.05);
}
:root[data-theme="terminal"] .hero-num,
:root[data-theme="terminal"] .stat-num{ text-shadow:0 0 10px rgba(74,222,128,.35); }

/* ---------- brutal : สว่าง ขอบดำหนา เงาแข็ง ---------- */
:root[data-theme="brutal"]{
  --dawn-1:#fff1c2; --dawn-2:#ffe0ec; --dawn-3:#fff4d6; --dawn-4:#fff4d6;
  --bg-0:#fff4d6; --bg-1:#fff9e6;
  --panel:#ffffff; --panel-soft:#fffdf4; --panel-line:#111111; --panel-hi:#fff3bf;
  --ink:#111111; --ink-dim:#4a4a4a; --ink-faint:#8a8a8a;
  --navy:#111111; --navy-deep:#000000; --navy-wash:rgba(0,0,0,.06); --navy-line:rgba(0,0,0,.5);
  --gold:#ff4d8d; --gold-deep:#c4165a; --gold-wash:rgba(255,77,141,.16); --gold-line:#111111;
  --ok:#0a8f4f; --ok-wash:rgba(10,143,79,.14); --warn:#b86e00; --warn-wash:rgba(255,178,0,.22);
  --bad:#d6204a; --bad-wash:rgba(214,32,74,.13); --off:#555555; --off-wash:rgba(0,0,0,.08);
  --info:#1d62d8; --info-wash:rgba(29,98,216,.13);
  --side-1:#111111; --side-2:#111111;
  --icon:#111111; --icon-bg:#ffd23f;
  --r-xl:14px; --r-lg:12px; --r-md:10px; --r-sm:8px; --r-tag:8px;
  --font-disp:'Kanit',sans-serif;
  --shadow-sm:3px 3px 0 #111; --shadow-md:5px 5px 0 #111; --shadow-lg:6px 6px 0 #111;
  --c1:#111111; --c2:#0a8f4f; --c3:#1d62d8; --c4:#ffb800; --c5:#ff4d8d; --c6:#8a8a8a;
  --chart-line:#ff4d8d; --chart-bar:#111111; --chart-edge:#111111;
}
:root[data-theme="brutal"] .glass,
:root[data-theme="brutal"] .stat-card, :root[data-theme="brutal"] .chart-card,
:root[data-theme="brutal"] .rp-card, :root[data-theme="brutal"] .rp-kpi,
:root[data-theme="brutal"] .list-item, :root[data-theme="brutal"] .asset-card,
:root[data-theme="brutal"] .memo-card{ border:2px solid #111; box-shadow:3px 3px 0 #111; }
:root[data-theme="brutal"] .asset-card:hover, :root[data-theme="brutal"] .list-item:hover,
:root[data-theme="brutal"] .stat-card:hover, :root[data-theme="brutal"] .chart-card:hover{
  box-shadow:5px 5px 0 #111; border-color:#111; transform:translate(-1px,-1px);
}
:root[data-theme="brutal"] .hero-card{ background:#111; border:2px solid #111; box-shadow:6px 6px 0 var(--gold); }
:root[data-theme="brutal"] .hero-card::before{ display:none; }
:root[data-theme="brutal"] .topbar{ background:#ffd23f; border-bottom:3px solid #111; box-shadow:none; }
:root[data-theme="brutal"] .section-title{ font-weight:700; }
:root[data-theme="brutal"] .input, :root[data-theme="brutal"] select.input{ border:2px solid #111; background:#fff; box-shadow:none; }
:root[data-theme="brutal"] .input:focus{ border-color:#111; box-shadow:3px 3px 0 var(--gold); }
:root[data-theme="brutal"] .btn{ border:2px solid #111; }
:root[data-theme="brutal"] .btn-primary{ background:#111; color:#fff; box-shadow:3px 3px 0 var(--gold); }
:root[data-theme="brutal"] .btn-ghost{ background:#fff; box-shadow:3px 3px 0 #111; }
:root[data-theme="brutal"] .btn:active{ transform:translate(2px,2px); box-shadow:none; }
:root[data-theme="brutal"] .chip, :root[data-theme="brutal"] .ax-pill{ border:2px solid #111; }
:root[data-theme="brutal"] .chip.active, :root[data-theme="brutal"] .ax-pill.active{ background:#111; color:#fff; box-shadow:none; }
:root[data-theme="brutal"] .icon-btn, :root[data-theme="brutal"] .refresh-btn, :root[data-theme="brutal"] .ax-round{
  border:2px solid #111; background:#fff; box-shadow:2px 2px 0 #111;
}
:root[data-theme="brutal"] .sheet{ border:3px solid #111; box-shadow:8px 8px 0 #111; background:#fff; }
:root[data-theme="brutal"] .li-icon, :root[data-theme="brutal"] .ax-ico,
:root[data-theme="brutal"] .asset-card-icon, :root[data-theme="brutal"] .more-ico{ border:2px solid #111; }
@media (max-width:899px){
  :root[data-theme="brutal"] .tabbar{ background:#fff !important; border:2px solid #111 !important; box-shadow:3px 3px 0 #111 !important; }
  :root[data-theme="brutal"] .tab-pill{ background:#111 !important; box-shadow:none !important; }
}

/* =========================================================
   กฎร่วมของ "ธีมมืด" (aurora, obsidian, graphite, terminal)
   ========================================================= */
:root[data-mode="dark"]{ color-scheme:dark; }
:root[data-mode="dark"] .chip:not(.active),
:root[data-mode="dark"] .btn-ghost,
:root[data-mode="dark"] .icon-btn,
:root[data-mode="dark"] .refresh-btn,
:root[data-mode="dark"] .pagination button,
:root[data-mode="dark"] .sheet-close,
:root[data-mode="dark"] .zbtn,
:root[data-mode="dark"] .mf-item,
:root[data-mode="dark"] .mf-tabs button.active,
:root[data-mode="dark"] .loading-card,
:root[data-mode="dark"] .view-toggle button:not(.active),
:root[data-mode="dark"] .audit-btn:not([class*="active-"]){ background:var(--panel); color:var(--ink); }
:root[data-mode="dark"] .input,
:root[data-mode="dark"] select.input{ background:var(--panel-soft); color:var(--ink); }
:root[data-mode="dark"] .input:focus{ background:var(--panel-hi); }
:root[data-mode="dark"] select.input option{ background:var(--opt-bg,#14141c); color:var(--ink); }
:root[data-mode="dark"] .section-title{ color:var(--ink); }
:root[data-mode="dark"] .loading-overlay{ background:rgba(0,0,0,.55); }
:root[data-mode="dark"] .sheet{ background:var(--sheet-bg,var(--panel)); color:var(--ink); }
/* ข้อความ/ไอคอนที่เดิมใช้ --navy เป็นสีตัวอักษร ให้ใช้ --icon ที่สว่างกว่าแทนบนพื้นมืด */
:root[data-mode="dark"] .ap-group-head,
:root[data-mode="dark"] .ax-serial,
:root[data-mode="dark"] .ap-serial,
:root[data-mode="dark"] .ax-chip-sn,
:root[data-mode="dark"] .mf-section-title,
:root[data-mode="dark"] .mf-item-head,
:root[data-mode="dark"] .mf-preview-title,
:root[data-mode="dark"] .mf-tabs button.active,
:root[data-mode="dark"] .memo-section-label,
:root[data-mode="dark"] .gs-cat,
:root[data-mode="dark"] .ax-round{ color:var(--icon); }
:root[data-mode="dark"] .tabbar .tab:not(.active){ color:var(--ink-dim); }

/* =========================================================
   กฎร่วมของ "กลาส" (aurora, frost)
   เบลอเฉพาะการ์ดใหญ่/แผงลอย ไม่เบลอทุกแถวรายการ เพื่อไม่ให้มือถือกระตุก
   ========================================================= */
:root[data-glass] .glass:not(.hero-card),
:root[data-glass] .stat-card, :root[data-glass] .chart-card,
:root[data-glass] .rp-card, :root[data-glass] .rp-kpi, :root[data-glass] .memo-card{
  background:var(--panel); border-color:var(--glass-edge); box-shadow:var(--glass-shadow);
}
:root[data-glass] .stat-card, :root[data-glass] .chart-card,
:root[data-glass] .rp-card, :root[data-glass] .rp-kpi{
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
}
:root[data-glass] .hero-card{ border:1px solid rgba(255,255,255,.22); box-shadow:0 14px 40px rgba(20,20,60,.28), inset 0 1px 0 rgba(255,255,255,.3); }
:root[data-glass] .topbar{
  background:var(--topbar-bg); -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
  border-bottom-color:var(--glass-edge);
}
:root[data-glass] .sheet{
  background:var(--sheet-bg); -webkit-backdrop-filter:blur(30px) saturate(170%); backdrop-filter:blur(30px) saturate(170%);
  border-color:var(--glass-edge);
}
@media (max-width:899px){
  :root[data-glass] .tabbar{ background:var(--tabbar-bg) !important; border-color:var(--glass-edge) !important; }
}
/* frost: ปุ่ม/ช่องกรอกที่เดิมขาวทึบ ให้เป็นขาวโปร่ง */
:root[data-theme="frost"] .chip:not(.active),
:root[data-theme="frost"] .btn-ghost, :root[data-theme="frost"] .icon-btn,
:root[data-theme="frost"] .refresh-btn, :root[data-theme="frost"] .pagination button,
:root[data-theme="frost"] .sheet-close, :root[data-theme="frost"] .zbtn,

:root[data-theme="frost"] .loading-card, :root[data-theme="frost"] .view-toggle button:not(.active),
:root[data-theme="frost"] .audit-btn:not([class*="active-"]){ background:rgba(255,255,255,.62); }
:root[data-theme="frost"] .input:focus{ background:rgba(255,255,255,.9); }
   
/* =========================================================
   [แก้ไขมุมมองการ์ด] มือถือให้การ์ดเป็น 2 คอลัมน์ (เดิมถูกบังคับเหลือ 1 คอลัมน์)
   ใช้กับหน้า ครุภัณฑ์ / ยืม-คืน / ซ่อมบำรุง / จนท.ในสังกัด / เอกสารใบเบิก
   ========================================================= */
@media (max-width:520px){
  /* [ปรับตรงนี้] จำนวนคอลัมน์บนมือถือ: 2 = สองคอลัมน์, เปลี่ยนเป็น 1 ถ้าอยากกลับไปแบบเดิม */
  .asset-grid,
  .memo-grid{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:10px;
  }

  /* ปรับการ์ดให้พอดีกับความกว้างครึ่งจอ */
  .asset-card{ padding:12px; gap:8px; }
  .asset-card-top{ flex-wrap:wrap; gap:6px; }          /* ไอคอนกับสถานะตัดบรรทัดได้ ไม่ล้นการ์ด */
  .asset-card-title{ font-size:13px; }
  .asset-card-sub{ font-size:10.5px; }
  .ax-st{ font-size:11px; }
  .memo-card-body{ padding:9px 10px 11px; }
}

/* จอเล็กมาก (เช่น ≤360px) ลดช่องไฟอีกนิด */
@media (max-width:360px){
  .asset-grid,
  .memo-grid{ gap:8px; }
  .asset-card{ padding:10px; }
}

/* ===== ปัดแถวครุภัณฑ์ (ปัดซ้าย → ปุ่มโผล่ขวา) ===== */
.sw-wrap{ position:relative; margin-bottom:9px; border-radius:var(--r-md); }
@media (min-width:900px){ .sw-wrap{ margin-bottom:10px; border-radius:18px; } }
.sw-wrap > .list-item{
  position:relative; z-index:1; margin-bottom:0 !important;
  touch-action:pan-y; user-select:none; -webkit-user-select:none;
  transition:left .26s cubic-bezier(.2,.8,.2,1);
}
.sw-wrap.sw-drag > .list-item{ transition:none; }
.sw-wrap.sw-active{ overflow:hidden; }

.sw-actions{
  position:absolute; top:0; bottom:0; right:0; z-index:0;
  display:flex; align-items:stretch; gap:8px;
  width:max-content; padding:7px 8px 7px 4px;
  visibility:hidden;
}
.sw-wrap.sw-active .sw-actions{ visibility:visible; }

.sw-btn{
  flex:none; width:62px; padding:0; border:none; border-radius:14px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  color:#fff; font-family:inherit; font-size:11px; font-weight:500;
  box-shadow:0 4px 10px color-mix(in srgb,var(--navy-deep) 28%,transparent), inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .12s ease;
}
.sw-btn svg{ width:20px; height:20px; }
.sw-btn:active{ transform:scale(.93); }

/* ยืม = สีหลักของธีม (navy) */
.sw-btn.tone-ok{
  background:linear-gradient(150deg, var(--navy), var(--navy-deep));
}
/* แจ้งซ่อม = สีเน้นของธีม (gold) */
.sw-btn.tone-bad{
  background:linear-gradient(150deg, var(--gold), var(--gold-deep));
}
/* QR = สีหลักผสมสีเน้น ให้ต่างจากสองปุ่มแรกเล็กน้อย */
.sw-btn.tone-navy{
  background:linear-gradient(150deg,
    color-mix(in srgb,var(--navy) 55%,var(--gold)),
    color-mix(in srgb,var(--navy-deep) 65%,var(--gold-deep)));
}

/* ธีมที่ gold สว่างมาก ตัวหนังสือขาวอาจอ่านยาก ให้ใช้ตัวมืดแทน */
:root[data-theme="graphite"] .sw-btn.tone-bad,
:root[data-theme="terminal"] .sw-btn.tone-bad,
:root[data-theme="obsidian"] .sw-btn.tone-bad{ color:#0b0f14; }
:root[data-theme="graphite"] .sw-btn.tone-navy,
:root[data-theme="terminal"] .sw-btn.tone-navy{ color:#0b0f14; }

/* บรูทัลลิสต์: ขอบดำหนา เงาแข็ง ให้เข้ากับธีม */
:root[data-theme="brutal"] .sw-btn{
  border:2px solid #111; box-shadow:2px 2px 0 #111; border-radius:10px;
}
:root[data-theme="brutal"] .sw-btn.tone-ok{ background:#111; }
:root[data-theme="brutal"] .sw-btn.tone-bad{ background:var(--gold); }
:root[data-theme="brutal"] .sw-btn.tone-navy{ background:#ffd23f; color:#111; }
