<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบพัสดุครุภัณฑ์ - ตำรวจทางหลวง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* =========================================================
   DESIGN TOKENS - ธีม "ขาว-กรมท่า" (white + navy) แบบเอกสารราชการ
   ========================================================= */
:root{
  --bg-0:#eef1f6; --bg-1:#f7f8fb; --bg-2:#e4e9f1;
  --panel:#ffffff; --panel-line:#dde3ec; --panel-hi:#eef2f8;
  --ink:#152438; --ink-dim:#5c6c80; --ink-faint:#93a0b1;
  --brass:#16345a; --brass-deep:#0d2038; --brass-wash:rgba(22,52,90,.07); --brass-line:rgba(22,52,90,.28);
  --gold:#a97c2f; --gold-deep:#7d5a20; --gold-wash:rgba(169,124,47,.12); --gold-line:rgba(169,124,47,.38);
  --ok:#1f8f5f; --ok-wash:rgba(31,143,95,.10);
  --warn:#b9791a; --warn-wash:rgba(185,121,26,.12);
  --bad:#c73b4f; --bad-wash:rgba(199,59,79,.10);
  --off:#5c6c80; --off-wash:rgba(92,108,128,.10);
  --info:#3f7fc1; --info-wash:rgba(63,127,193,.10);
  --r-lg:18px; --r-md:12px; --r-sm:10px; --r-tag:6px;
  --font-th:'Kanit',sans-serif; --font-num:'Inter','Kanit',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-th); color:var(--ink); min-height:100vh;
  background:radial-gradient(1200px 700px at 10% -10%, var(--bg-2), transparent),
             radial-gradient(1000px 640px at 110% 6%, #eaeef5, transparent),
             linear-gradient(180deg, var(--bg-1), var(--bg-0));
  background-attachment:fixed; padding-bottom:88px; overflow-x:hidden;
}
::-webkit-scrollbar{width:0;height:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
svg{display:block;}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; padding:14px 16px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  background:linear-gradient(180deg, rgba(247,248,251,.94), rgba(247,248,251,.72));
  border-bottom:1px solid var(--panel-line);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-badge{
  width:38px;height:38px;border-radius:11px; display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff;
  box-shadow:0 4px 14px rgba(169,124,47,.3);
}
.brand-badge svg{width:19px;height:19px;}
.brand-title{font-size:14.5px; font-weight:600; line-height:1.15;}
.brand-sub{font-size:11px; color:var(--ink-dim); font-weight:300;}
.profile{display:flex; align-items:center; gap:9px;}
.profile img{width:32px;height:32px;border-radius:50%; border:1.5px solid var(--panel-line); object-fit:cover;}

/* ---------- tag / pill / badge system ---------- */
.tag{
  display:inline-flex; align-items:center; font-size:11px; padding:4px 10px 4px 9px;
  border-radius:var(--r-tag); font-weight:500; border-left:3px solid; line-height:1.5; white-space:nowrap;
}
.tag-brass{ background:var(--gold-wash); color:var(--gold); border-color:var(--gold-line); }
.tag-off{ background:var(--off-wash); color:var(--off); border-color:rgba(92,108,128,.35); }
.role-pill{ font-size:10.5px; padding:4px 10px 4px 9px; border-radius:var(--r-tag); font-weight:500; border-left:3px solid;
  background:var(--gold-wash); color:var(--gold); border-color:var(--gold-line); }
.role-pill.viewer{ background:var(--off-wash); color:var(--off); border-color:rgba(92,108,128,.35); }

/* ---------- page shell ---------- */
.page{max-width:640px; margin:0 auto; padding:16px 16px 6px;}
.section-title{font-size:16.5px; font-weight:600; margin:20px 2px 11px; display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.section-title small{font-size:11.5px; color:var(--ink-dim); font-weight:300;}
.section-actions{display:flex; gap:8px; align-items:center;}

/* ---------- glass components ---------- */
.glass{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--r-lg);
  box-shadow:0 1px 2px rgba(21,36,56,.04), 0 10px 24px rgba(21,36,56,.05);
}

/* ---------- notification banner ---------- */
.alert-banner{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--r-md);
  margin-bottom:14px; font-size:13px; border-left:4px solid;
}
.alert-banner.bad{ background:var(--bad-wash); color:var(--bad); border-color:var(--bad); }
.alert-banner.warn{ background:var(--warn-wash); color:var(--warn); border-color:var(--warn); }
.alert-banner svg{width:18px;height:18px;flex:none;}
.alert-banner .alert-link{ margin-left:auto; font-weight:600; cursor:pointer; text-decoration:underline; white-space:nowrap; }

/* ---------- dashboard hero ---------- */
.hero-card{padding:18px 20px;}
.hero-row{display:flex; align-items:stretch; gap:18px;}
.hero-row > div{flex:1; min-width:0;}
.hero-divider{width:1px; background:var(--panel-line); flex:none;}
.hero-label{font-size:12px; color:var(--ink-dim); font-weight:400; margin-bottom:6px;}
.hero-num{font-family:var(--font-num); font-size:30px; font-weight:700; letter-spacing:-.01em; color:var(--ink);
  font-variant-numeric:tabular-nums; line-height:1.1; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
.hero-num--sm{font-size:22px; color:var(--gold);}
.hero-unit{font-family:var(--font-th); font-size:12.5px; color:var(--ink-dim); font-weight:400;}

.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
.stat-card{padding:14px 10px; border-radius:var(--r-md); text-align:center;}
.stat-num{font-family:var(--font-num); font-size:22px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums;}
.stat-label{font-size:11px; color:var(--ink-dim); margin-top:5px; font-weight:300;}
.stat-card.warn .stat-num{color:var(--warn);}
.stat-card.bad .stat-num{color:var(--bad);}
.stat-card.ok .stat-num{color:var(--ok);}
.stat-card.info .stat-num{color:var(--info);}

.chart-card{padding:16px; margin-bottom:12px;}
.chart-card h4{margin:0 0 10px; font-size:13px; font-weight:500; color:var(--ink-dim);}
.chart-wrap{position:relative; height:200px;}

/* ---------- search / filter / sort ---------- */
.search-row{display:flex; gap:8px; margin-bottom:12px;}
.input, select.input{
  width:100%; padding:11px 14px; border-radius:var(--r-sm); border:1px solid var(--panel-line);
  background:#ffffff; color:var(--ink); font-family:inherit; font-size:14px; outline:none;
}
.input::placeholder{color:var(--ink-faint);}
.input:focus{border-color:var(--brass-line);}
.sort-select{flex:none; width:auto; min-width:126px;}
.chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px;}
.chip{
  flex:none; padding:7px 13px; border-radius:var(--r-sm); font-size:12.5px; border:1px solid var(--panel-line);
  background:#ffffff; color:var(--ink-dim); cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--brass-wash); color:var(--brass); border-color:var(--brass-line);}

/* ---------- list items ---------- */
.list-item{
  padding:13px 14px; border-radius:var(--r-md); margin-bottom:9px;
  display:flex; align-items:center; gap:12px; cursor:pointer;
}
.li-icon{
  width:40px;height:40px;border-radius:10px; flex:none; display:flex;align-items:center;justify-content:center;
  background:var(--brass-wash); color:var(--brass);
}
.li-icon svg{width:19px;height:19px;}
.li-icon img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.li-body{flex:1; min-width:0;}
.li-title{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.li-sub{font-size:11.5px; color:var(--ink-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.status-badge{font-size:11px; padding:4px 10px 4px 9px; border-radius:var(--r-tag); font-weight:500; flex:none; border-left:3px solid; line-height:1.5;}
.status-ready{background:var(--ok-wash); color:var(--ok); border-color:rgba(72,191,138,.45);}
.status-borrowed{background:var(--warn-wash); color:var(--warn); border-color:rgba(223,171,76,.45);}
.status-repair{background:var(--bad-wash); color:var(--bad); border-color:rgba(199,59,79,.35);}
.status-disposed{background:var(--off-wash); color:var(--off); border-color:rgba(92,108,128,.35);}
.status-overdue{background:rgba(199,59,79,.14); color:var(--bad); border-color:rgba(199,59,79,.5);}
.status-returned{background:var(--off-wash); color:var(--off); border-color:rgba(92,108,128,.35);}
.status-pending{background:var(--info-wash); color:var(--info); border-color:rgba(63,127,193,.45);}
.status-rejected{background:var(--off-wash); color:var(--off); border-color:rgba(92,108,128,.35); text-decoration:line-through;}
.empty-state{text-align:center; padding:40px 20px; color:var(--ink-dim); font-size:13px;}

/* ---------- pagination ---------- */
.pagination{display:flex; align-items:center; justify-content:center; gap:14px; padding:14px 0 4px; font-size:12.5px; color:var(--ink-dim);}
.pagination button{padding:7px 14px; border-radius:var(--r-sm); border:1px solid var(--panel-line); background:#fff; color:var(--ink); cursor:pointer; font-size:12.5px;}
.pagination button:disabled{opacity:.4; cursor:default;}

/* ---------- fab ---------- */
.fab{
  position:fixed; right:18px; bottom:96px; z-index:45; width:54px;height:54px; border-radius:50%;
  background:linear-gradient(150deg, var(--brass), var(--brass-deep)); color:#fff; border:none;
  box-shadow:0 10px 26px rgba(22,52,90,.3); cursor:pointer; display:flex;align-items:center;justify-content:center;
}
.fab svg{width:22px;height:22px;}

/* ---------- bottom tab bar ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex; justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(255,255,255,.97), rgba(255,255,255,.8));
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--panel-line);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 1px;
  color:var(--ink-dim); background:none; border:none; font-family:inherit; cursor:pointer; min-width:0;
}
.tab .ico{width:19px;height:19px; position:relative;}
.tab .ico svg{width:19px;height:19px;}
.tab .lbl{font-size:9.5px; font-weight:400; white-space:nowrap;}
.tab.active{color:var(--brass);}
.tab-dot{position:absolute; top:-3px; right:-5px; width:8px;height:8px;border-radius:50%; background:var(--bad); border:1.5px solid #fff;}

/* ---------- sheet / modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(16,28,44,.42); backdrop-filter:blur(4px); z-index:80;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto; border-radius:22px 22px 0 0;
  background:#ffffff; border:1px solid var(--panel-line); border-bottom:none;
  box-shadow:0 -12px 40px rgba(21,36,56,.18);
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px;height:4px;border-radius:99px; background:var(--panel-line); margin:0 auto 14px;}
.sheet-title{font-size:16.5px; font-weight:600; margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-dim); margin-bottom:6px;}
.btn-row{display:flex; gap:10px; margin-top:18px;}
.btn{
  flex:1; padding:13px; border-radius:var(--r-sm); border:none; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer;
}
.btn-primary{background:linear-gradient(150deg, var(--brass), var(--brass-deep)); color:#fff;}
.btn-ghost{background:#ffffff; color:var(--ink); border:1px solid var(--panel-line);}
.btn-danger{background:var(--bad-wash); color:var(--bad); border:1px solid rgba(199,59,79,.3);}
.btn-ok{background:var(--ok-wash); color:var(--ok); border:1px solid rgba(31,143,95,.3);}

/* ---------- login screen ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:30px; text-align:center;}
.login-badge{
  width:74px;height:74px;border-radius:20px; display:flex;align-items:center;justify-content:center; margin-bottom:22px;
  background:linear-gradient(150deg, var(--gold), var(--gold-deep)); color:#fff; box-shadow:0 12px 32px rgba(169,124,47,.3);
  animation:badgeIn .5s ease-out;
}
.login-badge svg{width:34px;height:34px;}
@keyframes badgeIn{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}
.login-title{font-size:19px; font-weight:600; margin-bottom:6px;}
.login-sub{font-size:13px; color:var(--ink-dim); margin-bottom:28px; max-width:280px; line-height:1.65; font-weight:300;}
.spinner{width:26px;height:26px;border-radius:50%; border:3px solid var(--panel-line); border-top-color:var(--brass); animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:100; padding:11px 20px; border-radius:var(--r-sm);
  background:#152438; color:#eef3f8; border:1px solid #152438; font-size:13px; box-shadow:0 8px 24px rgba(21,36,56,.3);
  opacity:0; transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(4px);}
.detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--panel-line); font-size:13px; gap:12px;}
.detail-row span:first-child{color:var(--ink-dim); flex:none;}
.detail-row span:last-child{text-align:right;}
.hint{font-size:11px; color:var(--ink-dim); margin-top:14px; line-height:1.6;}

/* ---------- app entrance ---------- */
@keyframes appIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.app-in{animation:appIn .4s ease-out;}

/* ---------- print form ---------- */
#printArea{display:none;}
@media print{
  html,body{background:#fff !important;}
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important; position:absolute; top:0; left:0; width:100%; padding:14mm 16mm; color:#000; font-family:'TH Sarabun New','Kanit',sans-serif;}
  .pf-table{width:100%; border-collapse:collapse; margin:14px 0;}
  .pf-table th, .pf-table td{border:1px solid #333; padding:6px 8px; font-size:13.5px;}
  .pf-table th{background:#eee;}
}
.pf-head{text-align:center; margin-bottom:6px;}
.pf-seal{font-size:11px; color:#7d5a20; border:1px dashed #a97c2f; display:inline-block; padding:10px 22px; border-radius:6px; margin-bottom:8px;}
.pf-title{font-size:19px; font-weight:700; margin:4px 0;}
.pf-org{font-size:14px; margin-bottom:14px;}
.pf-line{display:flex; justify-content:space-between; font-size:14px; margin:4px 0;}
.pf-signblock{width:46%; display:inline-block; vertical-align:top; font-size:14px; line-height:2.1; margin-top:26px;}

/* ---------- refresh / connection / loading ---------- */
.refresh-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-width:42px;height:38px;padding:0 11px;border:1px solid var(--panel-line);
  border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;font-size:12px;
  box-shadow:0 2px 8px rgba(21,36,56,.05);transition:.18s ease;
}
.refresh-btn:hover{transform:translateY(-1px);border-color:var(--brass-line);background:var(--brass-wash);}
.refresh-btn:disabled{opacity:.6;cursor:wait;transform:none;}
.refresh-btn svg{width:17px;height:17px;}
.refresh-btn.loading svg{animation:spin .8s linear infinite;}
.connection-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-wash);}
.connection-dot.offline{background:var(--bad);box-shadow:0 0 0 3px var(--bad-wash);}
.loading-overlay{
  position:fixed;inset:0;z-index:120;background:rgba(245,247,250,.58);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;
}
.loading-overlay.show{display:flex;}
.loading-card{min-width:180px;padding:20px 24px;border-radius:16px;background:#fff;border:1px solid var(--panel-line);box-shadow:0 18px 50px rgba(21,36,56,.16);text-align:center;}
.loading-card .spinner{margin:0 auto 10px;}
.loading-text{font-size:13px;color:var(--ink-dim);}
.last-sync{font-size:10.5px;color:var(--ink-faint);margin-left:4px;white-space:nowrap;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--panel-line);background:#fff;color:var(--ink);cursor:pointer;}
.icon-btn svg{width:17px;height:17px;}
#qrHolder{display:flex;justify-content:center;padding:14px 0;}
#qrHolder canvas, #qrHolder img{border-radius:10px;}

@media (min-width:900px){
  .topbar{min-height:66px;}
  .desktop-tools{display:flex !important;align-items:center;gap:9px;}
  .refresh-btn{height:40px;min-width:44px;}
  .page{min-height:calc(100vh - 66px);}
  .list-item{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;}
  .list-item:hover{transform:translateY(-1px);box-shadow:0 10px 25px rgba(21,36,56,.09);border-color:#cbd5e1;}
  .sheet{max-width:700px;border-radius:20px;max-height:90vh;border-bottom:1px solid var(--panel-line);margin:20px;padding:24px;}
  .overlay{align-items:center;}
  .sheet-handle{display:none;}
}
@media (max-width:899px){
  .desktop-tools{display:flex !important;align-items:center;gap:7px;}
  .last-sync{display:none;}
}

/* =========================================================
   DESKTOP REDESIGN
   ========================================================= */
@media (min-width:900px){
  body{
    padding-bottom:24px;
    background:
      radial-gradient(1000px 500px at 75% -10%, rgba(169,124,47,.10), transparent 65%),
      linear-gradient(180deg,#f5f7fa 0%,#e9eef4 100%);
  }
  .tabbar{
    position:fixed; left:0; top:0; bottom:0; width:236px; height:100vh; z-index:70;
    display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; gap:6px;
    padding:26px 14px 20px; background:linear-gradient(180deg,#102b4b 0%,#0b2038 100%);
    border:0; border-right:1px solid rgba(255,255,255,.08); border-radius:0;
    box-shadow:8px 0 28px rgba(15,35,58,.12);
  }
  .tabbar::before{
    content:"ระบบพัสดุครุภัณฑ์"; display:block; color:#fff; font-size:18px; font-weight:600; padding:4px 12px 2px;
  }
  .tabbar::after{
    content:"ตำรวจทางหลวง"; display:block; color:rgba(255,255,255,.62); font-size:12px; font-weight:300;
    padding:0 12px 24px; border-bottom:1px solid rgba(255,255,255,.10); margin-bottom:10px;
  }
  .tab{
    flex:0 0 auto; width:100%; min-width:0; min-height:48px; display:flex; flex-direction:row; align-items:center;
    justify-content:flex-start; gap:12px; padding:12px 14px; border-radius:11px; color:rgba(255,255,255,.68);
    background:transparent; text-align:left; transition:background .18s ease,color .18s ease,transform .18s ease;
  }
  .tab:hover{ background:rgba(255,255,255,.08); color:#fff; transform:translateX(2px); }
  .tab.active{ color:#fff; background:linear-gradient(90deg,rgba(169,124,47,.28),rgba(169,124,47,.10)); box-shadow:inset 3px 0 0 #c99b4b; }
  .tab .ico, .tab .ico svg{ width:20px; height:20px; }
  .tab .lbl{ font-size:14px; font-weight:400; }
  .tab-dot{top:2px; right:-2px;}

  .topbar{
    margin-left:236px; padding:14px 34px; min-height:72px; background:rgba(255,255,255,.92);
    border-bottom:1px solid #dce3eb; box-shadow:0 4px 18px rgba(21,36,56,.05); backdrop-filter:blur(18px);
  }
  .brand{ visibility:hidden; width:1px; overflow:hidden; }
  .profile{ margin-left:auto; }
  .profile img{ width:38px; height:38px; }

  qr: '<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="5" height="5" stroke="currentColor" stroke-width="1.3"/><rect x="12" y="3" width="5" height="5" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="12" width="5" height="5" stroke="currentColor" stroke-width="1.3"/><rect x="12.5" y="12.5" width="1.8" height="1.8" fill="currentColor"/><rect x="16" y="12.5" width="1" height="1" fill="currentColor"/><rect x="12.5" y="16" width="1" height="1" fill="currentColor"/><rect x="15" y="15" width="2" height="2" stroke="currentColor" stroke-width="1"/></svg>',

};

/* ========================================================= STATE */
const state = {
  user: null, role: 'guest',
  assets: [], borrow: [], maint: [], components: [], users: [], activity: [], dashboard: null,
  tab: 'dashboard', assetFilter: 'all', assetStatusFilter: 'all', assetSearch: '', assetSort: 'name_asc', assetPage: 1
};
const PAGE_SIZE = 12;
const CATS = ['อาวุธปืน','ยานพาหนะ','สื่อสาร','คอมพิวเตอร์/IT','เครื่องแบบ/สนาม','อื่นๆ'];
const COMPONENT_TYPES = ['ซองกระสุน/แม็กกาซีน','ศูนย์เล็ง/กล้อง','ไฟฉายติดปืน','สายสะพาย','ซองพกพา','อุปกรณ์ทำความสะอาด','อื่นๆ'];
const ASSET_STATUSES = ['พร้อมใช้งาน','กำลังยืม','ซ่อมบำรุง','จำหน่ายแล้ว'];

/* ========================================================= INIT / LOGIN */
let loginMode = 'liff';

async function init() {
  await tryLiffLogin();
}

async function tryLiffLogin() {
  setLoginUiForLiffAttempt();
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    await completeLogin({ id: profile.userId, name: profile.displayName, picture: profile.pictureUrl });
  } catch (err) {
    document.getElementById('loginSpinner').style.display = 'none';
    document.getElementById('loginHint').textContent = '';
    showCodeLoginForm();
  }
}

function setLoginUiForLiffAttempt() {
  loginMode = 'liff';
  document.getElementById('loginSubText').innerHTML = 'ตำรวจทางหลวง<br>กำลังเข้าสู่ระบบผ่าน LINE...';
  document.getElementById('loginSpinner').style.display = 'block';
  document.getElementById('codeLoginBox').style.display = 'none';
  document.getElementById('loginHint').textContent = '';
  document.getElementById('toggleLoginModeLink').textContent = 'เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านแทน';
}
function showCodeLoginForm() {
  loginMode = 'code';
  document.getElementById('loginSubText').innerHTML = 'ตำรวจทางหลวง<br>เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่าน';
  document.getElementById('loginSpinner').style.display = 'none';
  document.getElementById('codeLoginBox').style.display = 'block';
  document.getElementById('toggleLoginModeLink').textContent = 'เข้าสู่ระบบผ่าน LINE แทน';
}
document.getElementById('toggleLoginModeLink').addEventListener('click', () => {
  if (loginMode === 'liff') { showCodeLoginForm(); } else { tryLiffLogin(); }
});
document.getElementById('btnCodeLogin').addEventListener('click', doCodeLogin);
document.getElementById('cl_password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doCodeLogin(); });
document.getElementById('cl_username').addEventListener('keydown', (e) => { if (e.key === 'Enter') doCodeLogin(); });

async function doCodeLogin() {
  const username = val('cl_username').trim();
  const password = val('cl_password');
  const errEl = document.getElementById('codeLoginError');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; return; }
  const btn = document.getElementById('btnCodeLogin');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'loginWithCode', payload: { username, password } }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    await completeLogin({ id: j.data.identifier, name: j.data.name, picture: '' }, j.data.role);
  } catch (err) {
    errEl.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
}

async function completeLogin(user, knownRole) {
  state.user = user;
  if (knownRole) {
    state.role = knownRole;
  } else {
    const check = await apiGet('checkUser', { lineUserId: user.id });
    state.role = check.found ? check.role : 'unknown';
  }

    return;
  }
  if (user.picture) {
    document.getElementById('profileImg').src = user.picture;
    document.getElementById('profileImg').style.display = 'inline-block';
  } else {
    document.getElementById('profileImg').style.display = 'none';
  }
  const pill = document.getElementById('rolePill');
  pill.textContent = state.role === 'admin' ? 'แอดมิน' : 'ดูอย่างเดียว';
  if (state.role !== 'admin') pill.classList.add('viewer');
  document.getElementById('usersTabBtn').style.display = isAdmin() ? 'flex' : 'none';

  document.getElementById('loginScreen').style.display = 'none';
  const appEl = document.getElementById('app');
  appEl.style.display = 'block';
  appEl.classList.add('app-in');
  try {
    await loadAll(true);

    toast('เข้าสู่ระบบแล้ว แต่โหลดข้อมูลไม่สำเร็จ: ' + (err.message || 'กรุณารีเฟรช'));
  }
}

let busyCount = 0;
let lastSyncAt = null;

function setLoading(show, text = 'กำลังโหลดข้อมูล...') {
  const overlay = document.getElementById('loadingOverlay');
  const label = document.getElementById('loadingText');
  if (!overlay) return;
  if (show) { busyCount++; if (label) label.textContent = text; overlay.classList.add('show'); }
  else { busyCount = Math.max(0, busyCount - 1); if (!busyCount) overlay.classList.remove('show'); }
}
function setConnection(ok) {
  const dot = document.getElementById('connectionDot');
  if (dot) dot.classList.toggle('offline', !ok);
}
function updateSyncLabel() {
  const el = document.getElementById('lastSync');
  if (!el || !lastSyncAt) return;

}
function setButtonBusy(btn, busy, textBusy = 'กำลังบันทึก...') {
  if (!btn) return;
  if (busy) { btn.dataset.originalText = btn.textContent; btn.disabled = true; btn.textContent = textBusy; btn.setAttribute('aria-busy','true'); }
  else { btn.disabled = false; btn.textContent = btn.dataset.originalText || 'บันทึก'; btn.removeAttribute('aria-busy'); }
}

async function fetchJson(url, options = {}, timeout = 20000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(url, {...options, signal: controller.signal, cache:'no-store'});
    if (!res.ok) throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด (' + res.status + ')');
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'ไม่สามารถดำเนินการได้');
    return j.data;
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่');
    throw err;
  } finally { clearTimeout(timer); }
}
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  return fetchJson(API_URL + '?' + qs);
}
async function apiPost(action, payload) {
  return fetchJson(API_URL, { method: 'POST', body: JSON.stringify({ action, lineUserId: state.user?.id, payload }) });
}

async function loadAll(showLoader = false) {
  if (showLoader) setLoading(true, 'กำลังอัปเดตข้อมูล...');
  try {
    const calls = [
      apiGet('getAssets', {}),
      apiGet('getBorrowLogs', {}),
      apiGet('getMaintLogs', {}),
      apiGet('getComponents', {}),
      apiGet('getDashboard', {})
    ];
    const names = ['assets','borrow','maint','components','dashboard'];
    if (isAdmin()) { calls.push(apiGet('getUsers', {})); names.push('users'); calls.push(apiGet('getActivityLog', {})); names.push('activity'); }
    const results = await Promise.allSettled(calls);
    const errors = [];
    results.forEach((r, i) => {
      if (r.status === 'fulfilled') state[names[i]] = r.value;
      else errors.push(r.reason?.message || 'ไม่สามารถโหลดข้อมูลบางส่วนได้');
    });
    const successCount = results.filter(r => r.status === 'fulfilled').length;
    setConnection(successCount === results.length);
    if (successCount) { lastSyncAt = new Date(); updateSyncLabel(); }
    updateBorrowDot();
    if (errors.length) {
      toast(successCount ? 'อัปเดตได้บางส่วน กรุณาลองรีเฟรชอีกครั้ง' : 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้');
      if (!successCount) throw new Error(errors[0]);
    }
    return { successCount, errors };
  } finally {
    if (showLoader) setLoading(false);
  }
}

async function refreshData() {
  const btn = document.getElementById('refreshBtn');
  if (btn?.disabled) return;
  if (btn) { btn.disabled = true; btn.classList.add('loading'); }
  try {
    await loadAll(true);
    renderTab(state.tab || 'dashboard');
    toast('อัปเดตข้อมูลล่าสุดแล้ว');
  } catch (err) {
    setConnection(false);
    toast(err.message || 'รีเฟรชข้อมูลไม่สำเร็จ');
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
  }
}

function toast(msg) {

function thaiDate(v) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return v;
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function thaiDateTime(v) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return v;
  return thaiDate(v) + ' ' + d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}
function isoDate(v) {
  const d = v ? new Date(v) : new Date();
  return d.toISOString().slice(0, 10);
}
function statusClass(s) {
  return { 'พร้อมใช้งาน':'status-ready','กำลังยืม':'status-borrowed','ซ่อมบำรุง':'status-repair','จำหน่ายแล้ว':'status-disposed',
           'เกินกำหนด':'status-overdue','คืนแล้ว':'status-returned','รอซ่อม':'status-repair','กำลังซ่อม':'status-borrowed','ซ่อมเสร็จ':'status-ready',
           'รออนุมัติ':'status-pending','ถูกปฏิเสธ':'status-rejected' }[s] || '';
}

}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- CSV export ---------- */
function exportCsv(filename, headers, rows) {
  const escapeCell = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(escapeCell).join(',')];
  rows.forEach(r => lines.push(headers.map(h => escapeCell(r[h])).join(',')));
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('ดาวน์โหลดไฟล์ CSV แล้ว');
}

function drawBar(id, dataObj) {

function sortAssets(list) {
  const [field, dir] = state.assetSort.split('_');
  const mul = dir === 'desc' ? -1 : 1;
  return [...list].sort((a, b) => {
    if (field === 'name') return mul * String(a['ชื่อครุภัณฑ์']||'').localeCompare(String(b['ชื่อครุภัณฑ์']||''), 'th');
    if (field === 'value') return mul * ((Number(a['มูลค่า(บาท)'])||0) - (Number(b['มูลค่า(บาท)'])||0));
    if (field === 'date') return mul * (new Date(a['วันที่รับเข้า']||0) - new Date(b['วันที่รับเข้า']||0));
    return 0;
  });
}

/* ========================================================= BORROW */
function renderBorrow() {
  const el = document.getElementById('view-borrow');
  const pending = state.borrow.filter(b => b['สถานะ'] === 'รออนุมัติ');
  const active = state.borrow.filter(b => b['สถานะ'] !== 'คืนแล้ว' && b['สถานะ'] !== 'รออนุมัติ' && b['สถานะ'] !== 'ถูกปฏิเสธ');
  const history = state.borrow.filter(b => b['สถานะ'] === 'คืนแล้ว' || b['สถานะ'] === 'ถูกปฏิเสธ').slice(-15).reverse();
  el.innerHTML = `
    <div class="section-title">
      รายการยืม-คืน <small>${active.length} รายการค้างคืน</small>
      <span class="section-actions"><button class="icon-btn" id="btnExportBorrow" title="ส่งออก CSV">${ICONS.download}</button></span>
    </div>
    ${pending.length ? `<div class="section-title" style="margin-top:0;">คำขอรออนุมัติ <small>${pending.length} รายการ</small></div>
    <div id="borrowPending">${pending.map(borrowRow).join('')}</div>` : ''}
    <div class="section-title">รายการค้างคืน</div>
    <div id="borrowActive">${active.length ? active.map(borrowRow).join('') : emptyState('ไม่มีรายการค้างคืน')}</div>
    <div class="section-title">ประวัติ</div>
    <div>${history.length ? history.map(borrowRow).join('') : emptyState('ยังไม่มีประวัติ')}</div>
  `;
  document.querySelectorAll('.borrow-item').forEach(it => it.onclick = () => openBorrowDetail(it.dataset.id));
  document.getElementById('btnExportBorrow').onclick = () => exportCsv('ยืมคืน.csv', ['รหัสรายการ','รหัสครุภัณฑ์','ชื่อครุภัณฑ์','ผู้ยืม','วันที่ยืม','กำหนดคืน','วันที่คืนจริง','สถานะ','ผู้อนุมัติ','หมายเหตุ'], state.borrow);
}
function effectiveBorrowStatus(b) {
  if (b['สถานะ'] === 'คืนแล้ว' || b['สถานะ'] === 'รออนุมัติ' || b['สถานะ'] === 'ถูกปฏิเสธ') return b['สถานะ'];
  const due = new Date(b['กำหนดคืน']);
  if (!isNaN(due) && due.getTime() < new Date().setHours(0,0,0,0)) return 'เกินกำหนด';
  return b['สถานะ'] || 'กำลังยืม';
}
function borrowRow(b) {
  return `<div class="glass list-item borrow-item" data-id="${b['รหัสรายการ']}">
    <div class="li-icon">${ICONS.swap}</div>
    <div class="li-body">
      <div class="li-title">${escapeHtml(b['ชื่อครุภัณฑ์'])}</div>
      <div class="li-sub">ผู้ยืม: ${escapeHtml(b['ผู้ยืม'])} · กำหนดคืน ${thaiDate(b['กำหนดคืน'])}</div>
    </div>
    <div class="status-badge ${statusClass(effectiveBorrowStatus(b))}">${effectiveBorrowStatus(b)}</div>
  </div>`;
}
function borrowedComponentIds(b) { return String(b['รหัสส่วนควบที่ยืม'] || '').split(',').map(s => s.trim()).filter(Boolean); }
function openBorrowDetail(id) {
  const b = state.borrow.find(x => x['รหัสรายการ'] === id);
  if (!b) return;
  const compIds = borrowedComponentIds(b);
  const compNames = compIds.map(cid => { const c = state.components.find(x => x['รหัสส่วนควบ'] === cid); return c ? c['ชื่อส่วนควบ'] : cid; });
  const status = b['สถานะ'];
  showSheet(`
    <div class="sheet-title">${escapeHtml(b['ชื่อครุภัณฑ์'])}</div>
    <div class="detail-row"><span>ผู้ยืม</span><span>${escapeHtml(b['ผู้ยืม'])}</span></div>
    <div class="detail-row"><span>วันที่ยืม</span><span>${thaiDate(b['วันที่ยืม'])}</span></div>
    <div class="detail-row"><span>กำหนดคืน</span><span>${thaiDate(b['กำหนดคืน'])}</span></div>
    <div class="detail-row"><span>สถานะ</span><span class="status-badge ${statusClass(effectiveBorrowStatus(b))}">${effectiveBorrowStatus(b)}</span></div>
    ${b['ผู้อนุมัติ'] ? `<div class="detail-row"><span>ผู้อนุมัติ</span><span>${escapeHtml(b['ผู้อนุมัติ'])}</span></div>` : ''}
    ${b['วันที่คืนจริง'] ? `<div class="detail-row"><span>วันที่คืนจริง</span><span>${thaiDate(b['วันที่คืนจริง'])}</span></div>` : ''}
    ${compNames.length ? `<div class="detail-row"><span>ส่วนควบที่ยืมด้วย</span><span>${compNames.map(escapeHtml).join(', ')}</span></div>` : ''}
    <div class="detail-row"><span>หมายเหตุ</span><span>${escapeHtml(b['หมายเหตุ']) || '-'}</span></div>
    <div class="btn-row"><button class="btn btn-ghost" id="btnPrintForm">พิมพ์ใบเบิก/ยืมพัสดุ</button></div>
    ${isAdmin() && status === 'รออนุมัติ' ? `<div class="btn-row">
      <button class="btn btn-danger" id="btnReject">ปฏิเสธ</button>
      <button class="btn btn-ok" id="btnApprove">อนุมัติ</button>
    </div>` : ''}
    ${isAdmin() && (status === 'กำลังยืม' || status === 'เกินกำหนด' || effectiveBorrowStatus(b) === 'เกินกำหนด') ? `<div class="btn-row"><button class="btn btn-primary" id="btnReturn">บันทึกการคืน</button></div>` : ''}
  `);
  document.getElementById('btnPrintForm').onclick = () => printRequisitionForm({ borrow: b, componentNames: compNames });
  if (isAdmin() && status === 'รออนุมัติ') {
    document.getElementById('btnApprove').onclick = async () => {
      const btn = document.getElementById('btnApprove'); if (btn.disabled) return; setButtonBusy(btn,true,'กำลังอนุมัติ...'); setLoading(true,'กำลังอนุมัติคำขอ...');
      try { await apiPost('approveBorrowRequest', { borrowId: id }); closeSheet(); toast('อนุมัติการยืมแล้ว'); await loadAll(); renderBorrow(); }
      catch(err) { toast(err.message || 'อนุมัติไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn,false); }
    };
    document.getElementById('btnReject').onclick = async () => {
      if (!confirm('ยืนยันการปฏิเสธคำขอยืมนี้?')) return;
      const btn = document.getElementById('btnReject'); if (btn.disabled) return; setButtonBusy(btn,true,'กำลังปฏิเสธ...'); setLoading(true,'กำลังปฏิเสธคำขอ...');
      try { await apiPost('rejectBorrowRequest', { borrowId: id }); closeSheet(); toast('ปฏิเสธคำขอแล้ว'); await loadAll(); renderBorrow(); }
      catch(err) { toast(err.message || 'ปฏิเสธไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn,false); }
    };
  }
  const returnBtn = document.getElementById('btnReturn');
  if (returnBtn) {
    returnBtn.onclick = async () => {
      const btn = document.getElementById('btnReturn'); if (btn.disabled) return; setButtonBusy(btn,true,'กำลังบันทึกการคืน...'); setLoading(true,'กำลังบันทึกการคืน...');
      try { await apiPost('returnAsset', { borrowId: id, returnDate: isoDate() }); closeSheet(); toast('บันทึกการคืนแล้ว'); await loadAll(); renderBorrow(); }
      catch(err) { toast(err.message || 'บันทึกการคืนไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn,false); }
    };
  }
}

    wrap.innerHTML = `<label>ส่วนควบที่ยืมไปด้วย</label>` + (comps.length
      ? comps.map(c => `<label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:400; margin-bottom:7px; color:var(--ink);">
          <input type="checkbox" class="f_comp_chk" value="${c['รหัสส่วนควบ']}" style="width:16px;height:16px;"> ${escapeHtml(c['ชื่อส่วนควบ'])} <span style="color:var(--ink-dim); font-size:11px;">(${c['ประเภท']||'-'})</span>
        </label>`).join('')
      : `<div class="hint">ยังไม่มีส่วนควบที่พร้อมใช้งานสำหรับอาวุธปืนนี้</div>`);
  }
  refreshComponentPicker();
  document.getElementById('f_asset').onchange = refreshComponentPicker;
  document.getElementById('btnCancel').onclick = closeSheet;
  document.getElementById('btnSave').onclick = async () => {
    const assetId = val('f_asset');
    const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === assetId);
    if (!val('f_borrower').trim()) { toast('กรุณากรอกชื่อผู้ยืม'); return; }
    if (!val('f_asset')) { toast('ไม่พบครุภัณฑ์ที่พร้อมให้ยืม'); return; }
    if (!val('f_borrowdate') || !val('f_duedate')) { toast('กรุณาระบุวันที่ยืมและกำหนดคืน'); return; }
    if (val('f_duedate') < val('f_borrowdate')) { toast('กำหนดคืนต้องไม่ก่อนวันที่ยืม'); return; }
    const componentIds = Array.from(document.querySelectorAll('.f_comp_chk:checked')).map(el => el.value);
    const saveBtn = document.getElementById('btnSave');
    if (saveBtn.disabled) return;
    setButtonBusy(saveBtn, true);
    setLoading(true, admin ? 'กำลังบันทึกการยืม...' : 'กำลังส่งคำขอ...');
    try {
      const payload = {
        assetId, assetName: asset ? asset['ชื่อครุภัณฑ์'] : '', borrower: val('f_borrower'),
        borrowerLineId: !admin ? (state.user.id || '') : '',
        borrowDate: val('f_borrowdate'), dueDate: val('f_duedate'),
        approver: admin ? val('f_approver') : '', note: val('f_bnote'), componentIds
      };
      await apiPost(admin ? 'borrowAsset' : 'requestBorrow', payload);
      closeSheet(); toast(admin ? 'บันทึกการยืมแล้ว' : 'ส่งคำขอยืมแล้ว รอแอดมินอนุมัติ'); await loadAll(); renderBorrow();
    } catch (err) { toast(err.message || 'ทำรายการไม่สำเร็จ'); }
    finally { setLoading(false); setButtonBusy(saveBtn, false); }
  };
}

        ${rows.map((r, i) => `<tr><td style="text-align:center;">${i + 1}</td><td>${r.name}</td><td>${r.code}</td><td style="text-align:center;">${r.qty}</td><td>${r.comp}</td></tr>`).join('')}

      </tbody>
    </table>
    <div style="font-size:14px;">กำหนดส่งคืนภายในวันที่ &nbsp; <b>${dueDateText || '...................................'}</b></div>
    <div style="font-size:14px; margin-top:4px;">หมายเหตุ &nbsp; ${noteText || '-'}</div>
    <div style="font-size:14px; margin-top:16px;">จึงเรียนมาเพื่อโปรดพิจารณาอนุมัติ</div>
    <div style="margin-top:10px;">
      <div class="pf-signblock" style="text-align:center;">
        ลงชื่อ ..................................................... ผู้เบิก/ผู้ยืม<br>
        ( ..................................................... )<br>
        ตำแหน่ง .....................................................<br>
        วันที่ .....................................................
      </div>
      <div class="pf-signblock" style="text-align:center; float:right;">
        ลงชื่อ ..................................................... ผู้อนุมัติ/ผู้จ่ายพัสดุ<br>
        ( ..................................................... )<br>
        ตำแหน่ง .....................................................<br>
        วันที่ .....................................................
      </div>
    </div>
  `;
