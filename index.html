    qty: toThaiNumber((qtys[i] && qtys[i].value) || 1),
    unit: units[i] ? (units[i].value.trim() || 'เครื่อง') : 'เครื่อง'
  })).filter(it => it.name);

  const prefix = (state.settings && state.settings.docNoPrefix) || '';
  const suffix = document.getElementById('m_docno_suffix') ? val('m_docno_suffix') : '';
  const fullDocNo = prefix + suffix;

  return {
    org: toThaiNumber(val('m_org')), 
    docNo: toThaiNumber(fullDocNo), 
    docDate: toThaiNumber(val('m_docdate')), 
    subject: val('m_subject'), 
    
    // **จุดที่แก้ไข**: ครอบ toThaiNumber ที่ช่องเรียน เพื่อแปลงตัวเลข เช่น ส.ทล.3 เป็น ส.ทล.๓
    addressee: toThaiNumber(val('m_addressee')), 
    
    items, 
    itemsText: itemPhraseList(items),
    dueDateText: document.getElementById('m_duedate') ? toThaiNumber(val('m_duedate')) : '',
    requester: { 
      rank: val('m_reqRank'), 
      name: val('m_reqName'), 
      position: toThaiNumber(val('m_reqPosition')), 
      date: toThaiNumber(val('m_reqDate')) 
    },
    approver: { 
      rank: val('m_apvRank'), 
      name: val('m_apvName'), 
      position: toThaiNumber(val('m_apvPosition')), 
      date: toThaiNumber(val('m_apvDate')) 
    },
    issuer: { 
      rank: val('m_issRank'), 
      name: val('m_issName'), 
      position: toThaiNumber(val('m_issPosition')), 
      date: toThaiNumber(val('m_issDate')) 
    }
  };
}

function openPrintMemoForm(opts) {
  const items = buildMemoItemList(opts);

  const requesterNameDefault = borrow ? (borrow['ผู้ยืม'] || '') : (state.user && state.user.name) || '';
  const approverNameDefault = borrow ? (borrow['ผู้อนุมัติ'] || '') : '';

  const reqIdx = findOfficerIndexByName(requesterNameDefault);
  const reqOfficer = reqIdx !== '' ? state.users[Number(reqIdx)] : null;
  const reqSplit = reqOfficer ? { rank: reqOfficer['ยศ'], name: reqOfficer['ชื่อ-สกุล'] } : splitRankName(requesterNameDefault);

  const orgLine = (state.settings && state.settings.orgName) || ORG_NAME;

              </div>
              <div class="field"><label>วันที่</label><input class="input" id="m_docdate" value="${escapeHtml(thaiDateLong())}"></div>

            <div class="field"><label>เรียน (ผู้บังคับบัญชา)</label><input class="input" id="m_addressee" placeholder="เช่น สว.ส.ทล.3 กก.1 บก.ทล."></div>

          </div>
          <div class="mf-section">

            ${signerPickerHtml('m_apv', apvIdx, apvOfficer ? apvOfficer['ยศ'] : '', apvOfficer ? apvOfficer['ชื่อ-สกุล'] : approverNameDefault, apvOfficer ? apvOfficer['ตำแหน่ง'] : '')}
            <div class="hint" style="margin-top:0;">เลือกจากดรอปดาวน์เพื่อสลับผู้ลงนามได้ทันที</div>

          </div>

            <div class="mf-section-title"><span class="mf-step">5</span> ผู้จ่ายพัสดุ</div>
            ${signerPickerHtml('m_iss', issIdx, issOfficer ? issOfficer['ยศ'] : '', issOfficer ? issOfficer['ชื่อ-สกุล'] : '', issOfficer ? issOfficer['ตำแหน่ง'] : '')}

      </div>
    </div>
  </div>`;
  document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);

  document.querySelectorAll('.mf-tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.mf-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('mfGrid').dataset.view = b.dataset.view;
    if (b.dataset.view === 'preview') refreshMemoLivePreview();
  });

  wireSignerPicker('m_req'); wireSignerPicker('m_apv'); wireSignerPicker('m_iss');

  function wireItemRow() {
    document.querySelectorAll('.mf-item-del').forEach(b => b.onclick = () => { b.closest('.mf-item').remove(); refreshMemoLivePreview(); });

       div.innerHTML = `

    const docHtml = buildMemoBodyHtml(memo);
    const borrowId = borrow ? borrow['รหัสรายการ'] : '';
    closeSheet();
    openMemoEditor({ id: null, docHtml, borrowId });
  };
}

 function printOfficialGeneralReport() {
  const orgName = (state.settings && state.settings.orgName) || ORG_NAME;
  const phone = (state.settings && state.settings.orgPhone) || ORG_PHONE;
  const yearBE = toThaiNumber(state.auditYear + 543);

    if (cells.good) sumGood++;

    if (cells.unused) sumUnused++;
    if (cells.obsolete) sumObsolete++;
    const machineCol = [a['หมายเลขเครื่อง'], a['ยี่ห้อ/รุ่น'] ? 'ยี่ห้อ ' + a['ยี่ห้อ/รุ่น'] : '']

   /* ========================= ฟีเจอร์ ๔: ตรวจนับพัสดุประจำปี ========================= */
async function renderAudit() {
  if (!isAdmin()) return;
  const el = document.getElementById('view-audit');
  el.innerHTML = emptyState('กำลังโหลดข้อมูลการตรวจนับ...');
  try {
    const records = await apiGet('getAuditRecords', { year: state.auditYear, token: state.sessionToken });
    state.auditRecords = records || [];
  } catch (err) {
    state.auditRecords = [];
    toast('โหลดข้อมูลตรวจนับไม่สำเร็จ: ' + (err.message || ''));
  }
  drawAuditView();
}
function auditRecordFor(assetId) { return state.auditRecords.find(r => r['รหัสครุภัณฑ์'] === assetId); }
function auditIsChecked(a) {
  const r = auditRecordFor(a['รหัสครุภัณฑ์']);
  return !!(r && r['ผล'] && r['ผล'] !== 'ยังไม่ตรวจ');
}

function drawAuditView() {
  const el = document.getElementById('view-audit');
  if (state.auditCat === undefined) state.auditCat = 'all';
  if (state.auditPending === undefined) state.auditPending = false;

  const total = state.assets.length;
  const checked = state.assets.filter(auditIsChecked).length;
  const pct = total ? Math.round((checked / total) * 100) : 0;

  // สถิติแยกตามหมวด (แสดงเฉพาะหมวดที่มีครุภัณฑ์)
  const catStats = getCategories().map(c => {
    const list = state.assets.filter(a => a['หมวดหมู่'] === c);
    return { name: c, total: list.length, done: list.filter(auditIsChecked).length };
  }).filter(s => s.total > 0);

  // รายการที่จะแสดงตามตัวกรอง
  let list = state.assets.filter(a => state.auditCat === 'all' || a['หมวดหมู่'] === state.auditCat);
  const catTotal = list.length;
  const catDone = list.filter(auditIsChecked).length;
  const catPct = catTotal ? Math.round((catDone / catTotal) * 100) : 0;
  if (state.auditPending) list = list.filter(a => !auditIsChecked(a));

  const showVehicleBtn = state.auditCat === 'all' || state.auditCat === 'ยานพาหนะ';
  const emptyMsg = state.auditPending
    ? 'ตรวจครบทุกรายการในหมวดนี้แล้ว 🎉'
    : 'ยังไม่มีครุภัณฑ์ในหมวดนี้';

  el.innerHTML = `
    <div class="section-title">ตรวจนับพัสดุประจำปี <small>ปี พ.ศ. ${toThaiNumber(state.auditYear + 543)}</small></div>

    <div class="glass" style="padding:18px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px;">
        <span>ความคืบหน้ารวมทั้งระบบ</span><span>${checked} / ${total} รายการ (${pct}%)</span>
      </div>
      <div class="audit-progress-track"><div class="audit-progress-fill" style="width:${pct}%;"></div></div>
      <div class="btn-row">
     <button class="btn btn-primary" id="btnPrintOfficialGeneral">พิมพ์รายงานครุภัณฑ์ทั่วไป (แบบราชการ)</button>
     ${state.assets.some(a => a['หมวดหมู่'] === 'สื่อสาร') ? `<button class="btn btn-ghost" id="btnPrintCommsReport">พิมพ์รายงานเครื่องมือสื่อสาร</button>` : ''}
     ${showVehicleBtn ? `<button class="btn btn-ghost" id="btnPrintVehicleReport">พิมพ์แบบ บชก.3 (ยานพาหนะ)</button>` : ''}
      </div>
    </div>

    <div class="chip-row">
      <div class="chip ${state.auditCat === 'all' ? 'active' : ''}" data-acat="all">ทั้งหมด ${checked}/${total}</div>
      ${catStats.map(s => `
        <div class="chip ${state.auditCat === s.name ? 'active' : ''}" data-acat="${escapeHtml(s.name)}">
          ${escapeHtml(s.name)} ${s.done}/${s.total}${s.done === s.total ? ' ✓' : ''}
        </div>`).join('')}
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
      <div class="chip ${state.auditPending ? 'active' : ''}" id="auditPendingChip">เฉพาะที่ยังไม่ตรวจ</div>
      <span class="hint" style="margin:0;">
        ${state.auditCat === 'all' ? 'ทุกหมวด' : escapeHtml(state.auditCat)}: ตรวจแล้ว ${catDone}/${catTotal} (${catPct}%)

    <div class="audit-progress-track" style="margin-bottom:14px;"><div class="audit-progress-fill" style="width:${catPct}%;"></div></div>

    <div id="auditList">${list.length ? list.map(auditRow).join('') : emptyState(emptyMsg)}</div>
  `;

  document.querySelectorAll('[data-acat]').forEach(c => c.onclick = () => {
    state.auditCat = c.dataset.acat;
    drawAuditView();
  });
  document.getElementById('auditPendingChip').onclick = () => {
    state.auditPending = !state.auditPending;
    drawAuditView();

  document.querySelectorAll('.audit-btn[data-status]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    setAuditStatus(b.dataset.id, b.dataset.status);
  });
  document.getElementById('btnPrintOfficialGeneral').onclick = printOfficialGeneralReport;
     const commsBtn = document.getElementById('btnPrintCommsReport');
     if (commsBtn) commsBtn.onclick = printCommsAuditReport;
     const vBtn = document.getElementById('btnPrintVehicleReport');
     if (vBtn) vBtn.onclick = printVehicleAuditReport;
  document.querySelectorAll('[data-vehicle-audit]').forEach(x => x.onclick = () => openVehicleAuditForm(x.dataset.vehicleAudit));
}

function wireAuditCommitteeSettingsHandlers() {
  document.querySelectorAll('.ac-pick').forEach(pick => {
    pick.onchange = () => {
      const idx = pick.dataset.idx;
      const rankEl = document.querySelector('.ac-rank[data-idx="' + idx + '"]');
      const nameEl = document.querySelector('.ac-name[data-idx="' + idx + '"]');
      const posEl = document.querySelector('.ac-position[data-idx="' + idx + '"]');
      if (pick.value === '' || pick.value === '__other__') {
        rankEl.readOnly = false; nameEl.readOnly = false;
        if (pick.value === '__other__') { rankEl.value = ''; nameEl.value = ''; rankEl.focus(); }
        return;
      }
      const u = state.users[Number(pick.value)];
      if (!u) return;
      rankEl.value = u['ยศ'] || '';
      nameEl.value = u['ชื่อ-สกุล'] || '';
      posEl.value = u['ตำแหน่ง'] || '';
      rankEl.readOnly = true; nameEl.readOnly = true;
    };
  });
  const btn = document.getElementById('btnSaveAuditCommittee');
  if (!btn) return;
  btn.onclick = async () => {
    const committee = DEFAULT_AUDIT_COMMITTEE.map((_, idx) => ({
      role: DEFAULT_AUDIT_COMMITTEE[idx].role,
      rank: (document.querySelector('.ac-rank[data-idx="' + idx + '"]') || {}).value || '',
      name: (document.querySelector('.ac-name[data-idx="' + idx + '"]') || {}).value || '',
      position: (document.querySelector('.ac-position[data-idx="' + idx + '"]') || {}).value || ''
    }));
    setButtonBusy(btn, true); setLoading(true, 'กำลังบันทึกคณะกรรมการ...');
    try {
      await apiPost('updateSystemSettings', {
        auditCommittee: JSON.stringify(committee),
        auditPeriodStart: val('ac_start'),
        auditPeriodEnd: val('ac_end')
      });
      toast('บันทึกคณะกรรมการตรวจสอบพัสดุแล้ว');
      await reloadThen(renderSettings);
    } catch (err) { toast(err.message || 'บันทึกไม่สำเร็จ'); }
    finally { setLoading(false); setButtonBusy(btn, false); }
  };
}

      <div class="glass" style="padding:16px;">
        <div class="field"><label>ส่วนราชการ (แสดงในหัวบันทึกข้อความ)</label><input class="input" id="st_org" value="${escapeHtml(s.orgName || ORG_NAME)}"></div>
        <div class="field"><label>เบอร์โทรศัพท์หน่วยงาน</label><input class="input" id="st_phone" value="${escapeHtml(s.orgPhone || '')}"></div>
        <div class="field"><label>เลขที่หนังสือ (ส่วนคงที่)</label>
          <input class="input" id="st_docprefix" placeholder="เช่น 0026.313/" value="${escapeHtml(s.docNoPrefix || '')}">
          <div class="hint" style="margin-top:6px;">ตอนพิมพ์บันทึกข้อความแต่ละครั้ง ระบบจะให้กรอกเฉพาะเลขที่ท้ายส่วนนี้ เช่น 45, 46, ...</div>
        </div>
        <div class="field"><label>แจ้งเตือนล่วงหน้าก่อนครบกำหนดตรวจสภาพ/ต่อทะเบียน (วัน)</label><input class="input" type="number" id="st_renewaldays" value="${s.renewalAlertDays || 30}"></div>
        <div class="btn-row" style="margin-top:14px;"><button class="btn btn-primary" id="btnSaveSettings">บันทึกการตั้งค่า</button></div>
      </div>
    </div>

    <div class="settings-panel" data-panel="security" style="display:${state.settingsTab==='security'?'block':'none'};">
      <div class="section-title" style="margin-top:6px; font-size:14px;">รหัสผ่านเข้าระบบ</div>
      <div class="glass" style="padding:16px;">
        <div class="hint" style="margin-top:0;">เปลี่ยนรหัสผ่านของแต่ละระดับผู้ใช้งาน (ผู้ใช้ที่ล็อกอินค้างไว้จะไม่หลุด แต่ล็อกอินใหม่ต้องใช้รหัสผ่านใหม่)</div>
        <div class="memo-two-col" style="margin-top:10px;">
          <div class="field"><label>ระดับผู้ใช้งาน</label><select class="input" id="st_pwrole"><option value="admin">แอดมิน</option><option value="viewer">ดูอย่างเดียว</option></select></div>
          <div class="field"><label>รหัสผ่านใหม่</label><input class="input" type="password" id="st_pwnew" placeholder="กรอกรหัสผ่านใหม่"></div>
        </div>
        <div class="btn-row" style="margin-top:6px;"><button class="btn btn-primary" id="btnChangePw">เปลี่ยนรหัสผ่าน</button></div>
      </div>
    </div>

    <div class="settings-panel" data-panel="data" style="display:${state.settingsTab==='data'?'block':'none'};">
      <div class="section-title" style="margin-top:6px; font-size:14px;">ย้ายรูปเก่าออกจาก Google Sheets</div>
      <div class="glass" style="padding:16px; margin-bottom:16px;">
        <div class="hint" style="margin-top:0;">ใช้ครั้งเดียวหลังอัปเดตระบบ เพื่อย้ายรูป Base64 เดิมในชีตไป Google Drive แล้วแทนที่ด้วย URL ขนาดเล็ก ช่วยลดเวลาเปิดระบบอย่างมาก</div>
        <div class="btn-row" style="margin-top:10px;"><button class="btn btn-ghost" id="btnMigrateImages">ย้ายรูปเก่าไป Drive</button></div>
      </div>

      <div class="section-title" style="margin-top:6px; font-size:14px;">สำรองข้อมูล</div>
      <div class="glass" style="padding:16px;">
        <div class="hint" style="margin-top:0;">ดาวน์โหลดข้อมูลทั้งหมดในระบบเป็นไฟล์ JSON ไว้สำรองหรือย้ายระบบ</div>
        <div class="btn-row" style="margin-top:10px;"><button class="btn btn-ghost" id="btnExportAll">ดาวน์โหลดข้อมูลทั้งหมด (JSON)</button></div>
      </div>
    </div>
  `;

  // ---- แท็บ ----
  document.querySelectorAll('#settingsTabRow [data-stab]').forEach(c => {
    c.onclick = () => {
      state.settingsTab = c.dataset.stab;
      document.querySelectorAll('#settingsTabRow [data-stab]').forEach(x => x.classList.toggle('active', x.dataset.stab === state.settingsTab));
      document.querySelectorAll('.settings-panel').forEach(p => { p.style.display = (p.dataset.panel === state.settingsTab) ? 'block' : 'none'; });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });

  document.querySelectorAll('.theme-swatch-card').forEach(card => { card.onclick = () => { applyTheme(card.dataset.themeId); renderSettings(); }; });

  document.getElementById('btnUploadGaruda').onclick = async () => {
    const inp = document.getElementById('st_garuda');
    const file = inp.files && inp.files[0];
    if (!file) { toast('กรุณาเลือกไฟล์รูปภาพก่อน'); return; }
    const btn = document.getElementById('btnUploadGaruda'); setButtonBusy(btn, true, 'กำลังเตรียมรูป...'); setLoading(true, 'กำลังเตรียมตราครุฑ...');
    try {
      const compressed = await prepareImageFile(file, 60000);
      setButtonBusy(btn, true, 'กำลังอัปโหลด...');
      try {
        const url = await uploadImageToDrive(compressed, 'garuda');
        await apiPost('updateSystemSettings', { garudaLogo: url });
        toast('อัปโหลดตราครุฑแล้ว'); await reloadThen(renderSettings);
      }
      catch (err) { toast(err.message || 'อัปโหลดไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn, false); }
    } catch (err) { toast(err.message || 'เตรียมรูปไม่สำเร็จ'); setLoading(false); setButtonBusy(btn, false); }
  };
  const btnRemoveG = document.getElementById('btnRemoveGaruda');
  if (btnRemoveG) btnRemoveG.onclick = async () => {
    if (!confirm('ยืนยันลบรูปตราครุฑ?')) return;
    try { await apiPost('updateSystemSettings', { garudaLogo: '' }); toast('ลบรูปตราครุฑแล้ว'); await reloadThen(renderSettings); }
    catch (err) { toast(err.message || 'ลบไม่สำเร็จ'); }
  };

  document.getElementById('btnSaveSettings').onclick = async () => {
    const btn = document.getElementById('btnSaveSettings'); if (btn.disabled) return; setButtonBusy(btn, true); setLoading(true, 'กำลังบันทึกการตั้งค่า...');
    try {
      await apiPost('updateSystemSettings', { orgName: val('st_org'), orgPhone: val('st_phone'), docNoPrefix: val('st_docprefix'), renewalAlertDays: val('st_renewaldays') });
      toast('บันทึกการตั้งค่าแล้ว'); await reloadThen(renderSettings);
    } catch (err) { toast(err.message || 'บันทึกการตั้งค่าไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn, false); }
  };
  document.getElementById('btnChangePw').onclick = async () => {
    const role = val('st_pwrole'), pw = val('st_pwnew');
    if (!pw || pw.length < 4) { toast('กรุณากรอกรหัสผ่านใหม่อย่างน้อย 4 ตัวอักษร'); return; }
    if (!confirm('ยืนยันเปลี่ยนรหัสผ่านระดับ "' + (role === 'admin' ? 'แอดมิน' : 'ดูอย่างเดียว') + '" ?')) return;
    const btn = document.getElementById('btnChangePw'); if (btn.disabled) return; setButtonBusy(btn, true); setLoading(true, 'กำลังเปลี่ยนรหัสผ่าน...');
    try { await apiPost('changeRolePassword', { role, newPassword: pw }); document.getElementById('st_pwnew').value = ''; toast('เปลี่ยนรหัสผ่านแล้ว'); }
    catch (err) { toast(err.message || 'เปลี่ยนรหัสผ่านไม่สำเร็จ'); } finally { setLoading(false); setButtonBusy(btn, false); }
  };
  document.getElementById('btnMigrateImages').onclick = async () => {
    const btn = document.getElementById('btnMigrateImages');
    if (!confirm('ระบบจะย้ายรูป Base64 เดิมทั้งหมดไป Google Drive แล้วเปลี่ยนค่าในชีตเป็น URL ต้องการดำเนินการหรือไม่?')) return;
    setButtonBusy(btn, true, 'กำลังย้ายรูป...');
    setLoading(true, 'กำลังย้ายรูปเก่าไป Google Drive...');
    try {
      const r = await apiPost('migrateImagesToDrive', {});
      toast('ย้ายรูปแล้ว ' + (r.migrated || 0) + ' รูป' + ((r.failed || 0) ? ' / ล้มเหลว ' + r.failed : ''));
      await reloadThen(renderSettings);
    } catch (err) { toast(err.message || 'ย้ายรูปไม่สำเร็จ'); }
    finally { setLoading(false); setButtonBusy(btn, false); }
  };

  document.getElementById('btnExportAll').onclick = () => {
    const data = { assets: state.assets, borrow: state.borrow, maint: state.maint, components: state.components, memos: state.memos, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'สำรองข้อมูลระบบพัสดุ.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    toast('ดาวน์โหลดไฟล์สำรองข้อมูลแล้ว');
  };

  function wireCategoryUnitRows() {
    document.querySelectorAll('.cu-del').forEach(btn => {
      btn.onclick = () => {
        const row = btn.closest('.cu-row');
        const original = row.querySelector('.cu-original').value;
        // ถ้าหมวดหมู่นี้มีครุภัณฑ์ใช้อยู่แล้ว เตือนก่อนลบ เพราะครุภัณฑ์เดิมจะยังคงชื่อหมวดหมู่เก่าไว้ แต่จะไม่แสดงในตัวกรองอีกต่อไป
        if (original) {
          const count = state.assets.filter(a => a['หมวดหมู่'] === original).length;
          if (count > 0 && !confirm('มีครุภัณฑ์ ' + count + ' รายการอยู่ในหมวดหมู่ "' + original + '" หากลบหมวดหมู่นี้ ครุภัณฑ์เดิมจะยังคงข้อมูลไว้ แต่จะไม่แสดงในตัวกรองหมวดหมู่อีกต่อไป ยืนยันการลบ?')) return;
        }
        row.remove();
      };
    });
  }
  wireCategoryUnitRows();

  document.getElementById('btnAddCategory').onclick = () => {
    const wrap = document.getElementById('cuRows');
    const div = document.createElement('div');
    div.className = 'memo-two-col cu-row';
    div.style.alignItems = 'flex-end';
    div.innerHTML = `
      <input type="hidden" class="cu-original" value="">
      <div class="field" style="flex:2 1 160px;"><label>ชื่อหมวดหมู่</label><input class="input cu-name" placeholder="เช่น เครื่องมือช่าง"></div>
      <div class="field" style="max-width:140px;"><label>หน่วยนับ</label><input class="input cu-unit" placeholder="เช่น เครื่อง"></div>
      <div class="field" style="max-width:56px;"><button type="button" class="btn btn-danger cu-del" style="padding:12px; width:100%;" title="ลบหมวดหมู่นี้">ลบ</button></div>
    `;
    wrap.appendChild(div);
    wireCategoryUnitRows();
    div.querySelector('.cu-name').focus();
  };

  document.getElementById('btnSaveCategoryUnits').onclick = async () => {
    const btn = document.getElementById('btnSaveCategoryUnits');
    const rows = Array.from(document.querySelectorAll('.cu-row'));
    const categories = [];
    const unitsObj = {};
    const renames = [];
    for (const row of rows) {
      const original = row.querySelector('.cu-original').value;
      const name = row.querySelector('.cu-name').value.trim();
      const unit = row.querySelector('.cu-unit').value.trim();
      if (!name) continue; // ข้ามแถวที่ไม่ได้กรอกชื่อหมวดหมู่
      if (categories.includes(name)) { toast('มีชื่อหมวดหมู่ซ้ำกัน: ' + name); return; }
      categories.push(name);
      unitsObj[name] = unit || 'เครื่อง';
      if (original && original !== name) renames.push({ old: original, new: name });
    }
    if (!categories.length) { toast('ต้องมีอย่างน้อย 1 หมวดหมู่'); return; }
    setButtonBusy(btn, true); setLoading(true, 'กำลังบันทึกหมวดหมู่...');
    try {
      await apiPost('updateSystemSettings', {
        assetCategories: JSON.stringify(categories),
        categoryUnits: JSON.stringify(unitsObj),
        categoryRenames: JSON.stringify(renames)
      });
      toast('บันทึกหมวดหมู่และหน่วยนับแล้ว');
      await reloadThen(renderSettings);
    } catch (err) { toast(err.message || 'บันทึกไม่สำเร็จ'); }
    finally { setLoading(false); setButtonBusy(btn, false); }
  };

  wireAuditCommitteeSettingsHandlers();
}

init();
</script>
</body>
</html>
