<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบพัสดุครุภัณฑ์ - ตำรวจทางหลวง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ============ CONFIG ============ */
:root{
  --bg-1:#0a1826; --bg-2:#122539; --bg-3:#1a3350;
  --glass:rgba(255,255,255,.07); --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.12);
  --text:#eaf1f8; --text-dim:#8fa3ba; --gold:#cda44e; --gold-soft:rgba(205,164,78,.16);
  --ok:#49c98a; --warn:#e8b64f; --bad:#e8687a; --off:#7c8ea3;
  --radius:18px; --radius-sm:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Kanit',sans-serif; color:var(--text); min-height:100vh;
  background:radial-gradient(1200px 800px at 15% -10%, var(--bg-3), transparent),
             radial-gradient(1000px 700px at 110% 10%, #16314f, transparent),
             linear-gradient(180deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed; padding-bottom:88px; overflow-x:hidden;
}
::-webkit-scrollbar{width:0;height:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; padding:14px 16px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  background:linear-gradient(180deg, rgba(10,24,38,.85), rgba(10,24,38,.55));
  border-bottom:1px solid var(--glass-brd);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-badge{
  width:38px;height:38px;border-radius:11px; display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg, var(--gold), #8a6a25); font-weight:700; color:#1a1206; font-size:17px;
  box-shadow:0 4px 14px rgba(205,164,78,.35);
}
.brand-title{font-size:14.5px; font-weight:600; line-height:1.15;}
.brand-sub{font-size:11px; color:var(--text-dim); font-weight:300;}
.profile{display:flex; align-items:center; gap:8px;}
.profile img{width:32px;height:32px;border-radius:50%; border:1.5px solid var(--glass-brd); object-fit:cover;}
.role-pill{
  font-size:10.5px; padding:3px 9px; border-radius:99px; font-weight:500; letter-spacing:.2px;
  background:var(--gold-soft); color:var(--gold); border:1px solid rgba(205,164,78,.35);
}
.role-pill.viewer{ background:rgba(124,142,163,.14); color:var(--off); border-color:rgba(124,142,163,.3);}

/* ---------- page shell ---------- */
.page{max-width:640px; margin:0 auto; padding:14px 16px 6px;}
.section-title{font-size:17px; font-weight:600; margin:18px 2px 10px; display:flex; align-items:center; justify-content:space-between;}
.section-title small{font-size:12px; color:var(--text-dim); font-weight:300;}

/* ---------- glass components ---------- */
.glass{
  background:var(--glass); border:1px solid var(--glass-brd); border-radius:var(--radius);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
}
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.stat-card{padding:14px 16px; border-radius:var(--radius-sm);}
.stat-num{font-size:24px; font-weight:600; line-height:1.1;}
.stat-label{font-size:11.5px; color:var(--text-dim); margin-top:4px; font-weight:300;}
.stat-card.accent{border-color:rgba(205,164,78,.35);}
.stat-card.warn .stat-num{color:var(--warn);}
.stat-card.bad .stat-num{color:var(--bad);}
.stat-card.ok .stat-num{color:var(--ok);}

.chart-card{padding:16px; margin-bottom:12px;}
.chart-card h4{margin:0 0 10px; font-size:13.5px; font-weight:500; color:var(--text-dim);}
.chart-wrap{position:relative; height:200px;}

.search-row{display:flex; gap:8px; margin-bottom:12px;}
.input, select.input{
  width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.05); color:var(--text); font-family:inherit; font-size:14px; outline:none;
}
.input::placeholder{color:var(--text-dim);}
.input:focus{border-color:rgba(205,164,78,.5);}
.chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px;}
.chip{
  flex:none; padding:7px 14px; border-radius:99px; font-size:12.5px; border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.04); color:var(--text-dim); cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--gold-soft); color:var(--gold); border-color:rgba(205,164,78,.4);}

.list-item{
  padding:13px 14px; border-radius:var(--radius-sm); margin-bottom:9px;
  display:flex; align-items:center; gap:12px; cursor:pointer;
}
.li-icon{
  width:42px;height:42px;border-radius:11px; flex:none; display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06); font-size:19px;
}
.li-body{flex:1; min-width:0;}
.li-title{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.li-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.status-badge{font-size:10.5px; padding:4px 9px; border-radius:99px; font-weight:500; flex:none;}
.status-ready{background:rgba(73,201,138,.15); color:var(--ok);}
.status-borrowed{background:rgba(232,182,79,.15); color:var(--warn);}
.status-repair{background:rgba(232,104,122,.15); color:var(--bad);}
.status-disposed{background:rgba(124,142,163,.15); color:var(--off);}
.status-overdue{background:rgba(232,104,122,.22); color:var(--bad);}
.status-returned{background:rgba(124,142,163,.15); color:var(--off);}
.empty-state{text-align:center; padding:40px 20px; color:var(--text-dim); font-size:13px;}

.fab{
  position:fixed; right:18px; bottom:96px; z-index:45; width:54px;height:54px; border-radius:50%;
  background:linear-gradient(150deg, var(--gold), #8a6a25); color:#1a1206; border:none; font-size:26px;
  box-shadow:0 10px 26px rgba(205,164,78,.4); cursor:pointer; display:flex;align-items:center;justify-content:center;
}

/* ---------- bottom tab bar ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex; justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(8,18,29,.92), rgba(8,18,29,.72));
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--glass-brd);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  color:var(--text-dim); background:none; border:none; font-family:inherit; cursor:pointer;
}
.tab .ico{font-size:19px;}
.tab .lbl{font-size:10px; font-weight:400;}
.tab.active{color:var(--gold);}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(4,10,17,.6); backdrop-filter:blur(4px); z-index:80;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto; border-radius:22px 22px 0 0;
  background:linear-gradient(180deg, #16283c, #0e1c2c); border:1px solid var(--glass-brd); border-bottom:none;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  animation:slideup .25s ease-out;
}
@keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px;height:4px;border-radius:99px; background:rgba(255,255,255,.2); margin:0 auto 14px;}
.sheet-title{font-size:16.5px; font-weight:600; margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
.btn-row{display:flex; gap:10px; margin-top:18px;}
.btn{
  flex:1; padding:13px; border-radius:12px; border:none; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer;
}
.btn-primary{background:linear-gradient(150deg, var(--gold), #8a6a25); color:#1a1206;}
.btn-ghost{background:rgba(255,255,255,.06); color:var(--text); border:1px solid var(--glass-brd);}
.btn-danger{background:rgba(232,104,122,.15); color:var(--bad); border:1px solid rgba(232,104,122,.3);}

.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:30px; text-align:center;}
.login-badge{
  width:76px;height:76px;border-radius:22px; display:flex;align-items:center;justify-content:center; margin-bottom:22px;
  background:linear-gradient(150deg, var(--gold), #8a6a25); font-size:34px; box-shadow:0 12px 32px rgba(205,164,78,.35);
}
.login-title{font-size:19px; font-weight:600; margin-bottom:6px;}
.login-sub{font-size:13px; color:var(--text-dim); margin-bottom:28px; max-width:280px; line-height:1.6;}
.spinner{width:26px;height:26px;border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:var(--gold); animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:100; padding:11px 20px; border-radius:12px;
  background:rgba(15,28,42,.95); border:1px solid var(--glass-brd); font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.4);
  opacity:0; transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(4px);}
.detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:13px;}
.detail-row span:first-child{color:var(--text-dim);}
.hint{font-size:11px; color:var(--text-dim); margin-top:14px; line-height:1.6;}

/* ---------- print form (official requisition document) ---------- */
#printArea{display:none;}
@media print{
  html,body{background:#fff !important;}
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important; position:absolute; top:0; left:0; width:100%; padding:14mm 16mm; color:#000; font-family:'TH Sarabun New','Kanit',sans-serif;}
  .pf-table{width:100%; border-collapse:collapse; margin:14px 0;}
  .pf-table th, .pf-table td{border:1px solid #333; padding:6px 8px; font-size:13.5px;}
  .pf-table th{background:#eee;}
}
.pf-head{text-align:center; margin-bottom:6px;}
.pf-seal{font-size:11px; color:#666; border:1px dashed #999; display:inline-block; padding:10px 22px; border-radius:6px; margin-bottom:8px;}
.pf-title{font-size:19px; font-weight:700; margin:4px 0;}
.pf-org{font-size:14px; margin-bottom:14px;}
.pf-line{display:flex; justify-content:space-between; font-size:14px; margin:4px 0;}
.pf-signblock{width:46%; display:inline-block; vertical-align:top; font-size:14px; line-height:2.1; margin-top:26px;}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-badge">🛡️</div>
  <div class="login-title">ระบบพัสดุครุภัณฑ์</div>
  <div class="login-sub" id="loginSubText">ตำรวจทางหลวง<br>กำลังเข้าสู่ระบบผ่าน LINE...</div>
  <div class="spinner" id="loginSpinner"></div>
  <div class="hint" id="loginHint"></div>

  <div id="codeLoginBox" style="display:none; width:100%; max-width:280px; margin-top:6px;">
    <div class="field" style="text-align:left;">
      <label>ชื่อผู้ใช้</label>
      <input class="input" id="cl_username" autocomplete="username" placeholder="ชื่อผู้ใช้">
    </div>
    <div class="field" style="text-align:left;">
      <label>รหัสผ่าน</label>
      <input class="input" id="cl_password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน">
    </div>
    <button class="btn btn-primary" style="width:100%;" id="btnCodeLogin">เข้าสู่ระบบ</button>
    <div class="hint" id="codeLoginError" style="color:var(--bad);"></div>
  </div>

  <div style="margin-top:18px;">
    <span id="toggleLoginModeLink" style="color:var(--gold); font-size:12.5px; cursor:pointer; text-decoration:underline;">
      เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านแทน
    </span>
  </div>
</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">🛡️</div>
      <div>
        <div class="brand-title">ระบบพัสดุครุภัณฑ์</div>
        <div class="brand-sub">ตำรวจทางหลวง</div>
      </div>
    </div>
    <div class="profile">
      <span class="role-pill" id="rolePill">…</span>
      <img id="profileImg" src="" alt="">
    </div>
  </div>

  <div class="page" id="view-dashboard"></div>
  <div class="page" id="view-assets" style="display:none;"></div>
  <div class="page" id="view-borrow" style="display:none;"></div>
  <div class="page" id="view-maint" style="display:none;"></div>
  <div class="page" id="view-reports" style="display:none;"></div>

  <button class="fab" id="fabBtn" style="display:none;">＋</button>

  <div class="tabbar">
    <button class="tab active" data-tab="dashboard"><span class="ico">🏠</span><span class="lbl">หน้าหลัก</span></button>
    <button class="tab" data-tab="assets"><span class="ico">📦</span><span class="lbl">ครุภัณฑ์</span></button>
    <button class="tab" data-tab="borrow"><span class="ico">🔄</span><span class="lbl">ยืม-คืน</span></button>
    <button class="tab" data-tab="maint"><span class="ico">🔧</span><span class="lbl">ซ่อมบำรุง</span></button>
    <button class="tab" data-tab="reports"><span class="ico">📊</span><span class="lbl">รายงาน</span></button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<div id="printArea"></div>

<script>
/* =========================================================
   CONFIG — แก้ 2 บรรทัดนี้ก่อนใช้งานจริง
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbw9mgyNR0My7CPuRRX1bRStNcuv1O6nTSivhZssA8svIOOul0VW9v32_rhGwJBDOkp37A/exec';
const LIFF_ID = 'PUT_YOUR_LIFF_ID_HERE';
const ORG_NAME = 'สถานีตำรวจทางหลวง 3 กองกำกับการ 1 กองบังคับการตำรวจทางหลวง';   // แก้เป็นชื่อหน่วยงานของท่าน
const GUN_CATEGORY = 'อาวุธปืน';

/* ========================================================= STATE */
const state = {
  user: null, role: 'guest',
  assets: [], borrow: [], maint: [], components: [], dashboard: null,
  tab: 'dashboard', assetFilter: 'all', assetSearch: ''
};
const CATS = ['อาวุธปืน','ยานพาหนะ','สื่อสาร','คอมพิวเตอร์/IT','เครื่องแบบ/สนาม','อื่นๆ'];
const COMPONENT_TYPES = ['ซองกระสุน/แม็กกาซีน','ศูนย์เล็ง/กล้อง','ไฟฉายติดปืน','สายสะพาย','ซองพกพา','อุปกรณ์ทำความสะอาด','อื่นๆ'];

/* ========================================================= INIT / LOGIN
   ผู้ใช้สามารถเข้าสู่ระบบได้ 2 ทาง:
   1) ผ่าน LINE LIFF (อัตโนมัติ ถ้าตั้งค่า LIFF_ID และเปิดผ่านแอป/เบราว์เซอร์ที่ใช้ LINE ได้)
   2) ด้วยชื่อผู้ใช้ + รหัสผ่าน (ตั้งค่าให้ผู้ใช้แต่ละคนได้จากฝั่ง Apps Script — ดูฟังก์ชัน
      setPasswordForUser() ใน Code.gs) — ใช้กรณีเปิดนอกแอป LINE หรือยังไม่ได้ตั้งค่า LIFF_ID
   ถ้า LIFF ใช้งานไม่ได้ ระบบจะสลับไปแสดงฟอร์มชื่อผู้ใช้/รหัสผ่านให้อัตโนมัติ
   ========================================================= */
let loginMode = 'liff'; // 'liff' | 'code'

async function init() {
  await tryLiffLogin();
}

async function tryLiffLogin() {
  setLoginUiForLiffAttempt();
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    await completeLogin({ id: profile.userId, name: profile.displayName, picture: profile.pictureUrl });
  } catch (err) {
    // LIFF ใช้งานไม่ได้ (ยังไม่ตั้งค่า LIFF_ID / เปิดนอกแอป LINE / ปัญหาการเชื่อมต่อ) — สลับไปใช้รหัสผ่านแทน
    document.getElementById('loginSpinner').style.display = 'none';
    document.getElementById('loginHint').textContent = '';
    showCodeLoginForm();
  }
}

function setLoginUiForLiffAttempt() {
  loginMode = 'liff';
  document.getElementById('loginSubText').innerHTML = 'ตำรวจทางหลวง<br>กำลังเข้าสู่ระบบผ่าน LINE...';
  document.getElementById('loginSpinner').style.display = 'block';
  document.getElementById('codeLoginBox').style.display = 'none';
  document.getElementById('loginHint').textContent = '';
  document.getElementById('toggleLoginModeLink').textContent = 'เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านแทน';
}

function showCodeLoginForm() {
  loginMode = 'code';
  document.getElementById('loginSubText').innerHTML = 'ตำรวจทางหลวง<br>เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่าน';
  document.getElementById('loginSpinner').style.display = 'none';
  document.getElementById('codeLoginBox').style.display = 'block';
  document.getElementById('toggleLoginModeLink').textContent = 'เข้าสู่ระบบผ่าน LINE แทน';
}

document.getElementById('toggleLoginModeLink').addEventListener('click', () => {
  if (loginMode === 'liff') { showCodeLoginForm(); } else { tryLiffLogin(); }
});
document.getElementById('btnCodeLogin').addEventListener('click', doCodeLogin);
document.getElementById('cl_password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doCodeLogin(); });
document.getElementById('cl_username').addEventListener('keydown', (e) => { if (e.key === 'Enter') doCodeLogin(); });

async function doCodeLogin() {
  const username = val('cl_username').trim();
  const password = val('cl_password');
  const errEl = document.getElementById('codeLoginError');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; return; }
  const btn = document.getElementById('btnCodeLogin');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'loginWithCode', payload: { username, password } })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    await completeLogin({ id: j.data.identifier, name: j.data.name, picture: '' }, j.data.role);
  } catch (err) {
    errEl.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
}

async function completeLogin(user, knownRole) {
  state.user = user;
  if (knownRole) {
    state.role = knownRole;
  } else {
    const check = await apiGet('checkUser', { lineUserId: user.id });
    state.role = check.found ? check.role : 'unknown';
  }
  if (state.role === 'unknown') {
    document.getElementById('loginSpinner').style.display = 'none';
    document.getElementById('loginHint').textContent = 'บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้งาน กรุณาติดต่อแอดมินเพื่อเพิ่มชื่อในระบบ (รหัสผู้ใช้: ' + user.id + ')';
    return;
  }
  if (user.picture) {
    document.getElementById('profileImg').src = user.picture;
    document.getElementById('profileImg').style.display = 'inline-block';
  } else {
    document.getElementById('profileImg').style.display = 'none';
  }
  const pill = document.getElementById('rolePill');
  pill.textContent = state.role === 'admin' ? 'แอดมิน' : 'ดูอย่างเดียว';
  if (state.role !== 'admin') pill.classList.add('viewer');

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadAll();
  renderTab('dashboard');
}

/* ========================================================= API */
async function apiGet(action, params) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(API_URL + '?' + qs);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function apiPost(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, lineUserId: state.user.id, payload })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

async function loadAll() {
  const [assets, borrow, maint, components, dashboard] = await Promise.all([
    apiGet('getAssets', {}), apiGet('getBorrowLogs', {}), apiGet('getMaintLogs', {}), apiGet('getComponents', {}), apiGet('getDashboard', {})
  ]);
  state.assets = assets; state.borrow = borrow; state.maint = maint; state.components = components; state.dashboard = dashboard;
}
function componentsOf(assetId) { return state.components.filter(c => c['รหัสครุภัณฑ์หลัก'] === assetId); }

/* ========================================================= UTIL */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function thaiDate(v) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return v;
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function isoDate(v) {
  const d = v ? new Date(v) : new Date();
  return d.toISOString().slice(0, 10);
}
function statusClass(s) {
  return { 'พร้อมใช้งาน':'status-ready','กำลังยืม':'status-borrowed','ซ่อมบำรุง':'status-repair','จำหน่ายแล้ว':'status-disposed',
           'เกินกำหนด':'status-overdue','คืนแล้ว':'status-returned','รอซ่อม':'status-repair','กำลังซ่อม':'status-borrowed','ซ่อมเสร็จ':'status-ready' }[s] || '';
}
function catIcon(c) {
  return { 'อาวุธปืน':'🔫','ยานพาหนะ':'🚓','สื่อสาร':'📡','คอมพิวเตอร์/IT':'💻','เครื่องแบบ/สนาม':'🎽' }[c] || '📦';
}

  chartRefs[id] = new Chart(ctx, {

  `);
  document.getElementById('btnPrintForm').onclick = () => printRequisitionForm({ borrow: b, componentNames: compNames });
  if (isAdmin() && b['สถานะ'] !== 'คืนแล้ว') {
    document.getElementById('btnReturn').onclick = async () => {
      await apiPost('returnAsset', { borrowId: id, returnDate: isoDate() });
      closeSheet(); toast('บันทึกการคืนแล้ว'); await loadAll(); renderBorrow();
    };
  }
}
function openBorrowForm() {
  const available = state.assets.filter(a => a['สถานะ'] === 'พร้อมใช้งาน');
  showSheet(`
    <div class="sheet-title">บันทึกการยืม</div>
    <div class="field"><label>ครุภัณฑ์</label>
      <select class="input" id="f_asset">${available.map(a => `<option value="${a['รหัสครุภัณฑ์']}">${a['ชื่อครุภัณฑ์']} (${a['รหัสครุภัณฑ์']})</option>`).join('')}</select>
    </div>
    <div class="field" id="f_compWrap"></div>
    <div class="field"><label>ผู้ยืม (ชื่อ-สกุล)</label><input class="input" id="f_borrower"></div>
    <div class="field"><label>วันที่ยืม</label><input class="input" type="date" id="f_borrowdate" value="${isoDate()}"></div>
    <div class="field"><label>กำหนดคืน</label><input class="input" type="date" id="f_duedate" value="${isoDate()}"></div>
    <div class="field"><label>ผู้อนุมัติ</label><input class="input" id="f_approver" value="${state.user.name}"></div>
    <div class="field"><label>หมายเหตุ</label><input class="input" id="f_bnote"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnCancel">ยกเลิก</button>
      <button class="btn btn-primary" id="btnSave">บันทึก</button>
    </div>
  `);
  if (!available.length) { toast('ไม่มีครุภัณฑ์ที่พร้อมให้ยืมในขณะนี้'); }
  function refreshComponentPicker() {
    const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === val('f_asset'));
    const wrap = document.getElementById('f_compWrap');
    if (!asset || asset['หมวดหมู่'] !== GUN_CATEGORY) { wrap.innerHTML = ''; return; }
    const comps = componentsOf(asset['รหัสครุภัณฑ์']).filter(c => c['สถานะ'] === 'พร้อมใช้งาน');
    wrap.innerHTML = `<label>ส่วนควบที่ยืมไปด้วย</label>` + (comps.length
      ? comps.map(c => `<label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:400; margin-bottom:7px; color:var(--text);">
          <input type="checkbox" class="f_comp_chk" value="${c['รหัสส่วนควบ']}" style="width:16px;height:16px;"> ${c['ชื่อส่วนควบ']} <span style="color:var(--text-dim); font-size:11px;">(${c['ประเภท']||'-'})</span>
        </label>`).join('')
      : `<div class="hint">ยังไม่มีส่วนควบที่พร้อมใช้งานสำหรับอาวุธปืนนี้</div>`);
  }
  refreshComponentPicker();
  document.getElementById('f_asset').onchange = refreshComponentPicker;
  document.getElementById('btnCancel').onclick = closeSheet;
  document.getElementById('btnSave').onclick = async () => {
    const assetId = val('f_asset');
    const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === assetId);
    if (!val('f_borrower')) { toast('กรุณากรอกชื่อผู้ยืม'); return; }
    const componentIds = Array.from(document.querySelectorAll('.f_comp_chk:checked')).map(el => el.value);
    await apiPost('borrowAsset', {
      assetId, assetName: asset ? asset['ชื่อครุภัณฑ์'] : '', borrower: val('f_borrower'),
      borrowDate: val('f_borrowdate'), dueDate: val('f_duedate'), approver: val('f_approver'), note: val('f_bnote'),
      componentIds
    });
    closeSheet(); toast('บันทึกการยืมแล้ว'); await loadAll(); renderBorrow();
  };
}

/* ========================================================= MAINTENANCE */
function renderMaint() {
  const el = document.getElementById('view-maint');
  const open = state.maint.filter(m => m['สถานะ'] !== 'ซ่อมเสร็จ');
  const done = state.maint.filter(m => m['สถานะ'] === 'ซ่อมเสร็จ').slice(-15).reverse();
  el.innerHTML = `
    <div class="section-title">งานซ่อมบำรุง <small>${open.length} รายการค้าง</small></div>
    <div>${open.length ? open.map(maintRow).join('') : emptyState('ไม่มีงานซ่อมค้าง')}</div>
    <div class="section-title">ประวัติซ่อมเสร็จแล้ว</div>
    <div>${done.length ? done.map(maintRow).join('') : emptyState('ยังไม่มีประวัติ')}</div>
  `;
  document.querySelectorAll('.maint-item').forEach(it => it.onclick = () => openMaintDetail(it.dataset.id));
}
function maintRow(m) {
  return `<div class="glass list-item maint-item" data-id="${m['รหัสรายการ']}">
    <div class="li-icon">🔧</div>
    <div class="li-body">
      <div class="li-title">${m['ชื่อครุภัณฑ์']}</div>
      <div class="li-sub">${m['อาการ/ปัญหา']}</div>
    </div>
    <div class="status-badge ${statusClass(m['สถานะ'])}">${m['สถานะ']}</div>
  </div>`;
}
function openMaintDetail(id) {
  const m = state.maint.find(x => x['รหัสรายการ'] === id);
  if (!m) return;
  showSheet(`
    <div class="sheet-title">${m['ชื่อครุภัณฑ์']}</div>
    <div class="detail-row"><span>วันที่แจ้ง</span><span>${thaiDate(m['วันที่แจ้ง'])}</span></div>
    <div class="detail-row"><span>อาการ/ปัญหา</span><span>${m['อาการ/ปัญหา']}</span></div>
    <div class="detail-row"><span>ผู้แจ้ง</span><span>${m['ผู้แจ้ง'] || '-'}</span></div>
    <div class="detail-row"><span>สถานะ</span><span class="status-badge ${statusClass(m['สถานะ'])}">${m['สถานะ']}</span></div>
    <div class="detail-row"><span>ค่าใช้จ่าย</span><span>${m['ค่าใช้จ่าย(บาท)'] ? Number(m['ค่าใช้จ่าย(บาท)']).toLocaleString()+' บาท' : '-'}</span></div>
    <div class="detail-row"><span>ผู้รับผิดชอบ</span><span>${m['ผู้รับผิดชอบ'] || '-'}</span></div>
    ${isAdmin() && m['สถานะ'] !== 'ซ่อมเสร็จ' ? `
    <div class="field" style="margin-top:14px;"><label>อัปเดตสถานะ</label>
      <select class="input" id="f_mstatus">
        <option ${m['สถานะ']==='รอซ่อม'?'selected':''}>รอซ่อม</option>
        <option ${m['สถานะ']==='กำลังซ่อม'?'selected':''}>กำลังซ่อม</option>
        <option>ซ่อมเสร็จ</option>
      </select>
    </div>
    <div class="field"><label>ผู้รับผิดชอบ/ร้านซ่อม</label><input class="input" id="f_mresp" value="${m['ผู้รับผิดชอบ']||''}"></div>
    <div class="field"><label>ค่าใช้จ่าย (บาท)</label><input class="input" type="number" id="f_mcost" value="${m['ค่าใช้จ่าย(บาท)']||''}"></div>
    <div class="btn-row"><button class="btn btn-primary" id="btnUpdateMaint">บันทึก</button></div>
    ` : ''}
  `);
  if (isAdmin() && m['สถานะ'] !== 'ซ่อมเสร็จ') {
    document.getElementById('btnUpdateMaint').onclick = async () => {
      const status = val('f_mstatus');
      await apiPost('updateMaint', {
        id, status, responsible: val('f_mresp'), cost: val('f_mcost'),
        finishDate: status === 'ซ่อมเสร็จ' ? isoDate() : ''
      });
      closeSheet(); toast('อัปเดตสถานะแล้ว'); await loadAll(); renderMaint();
    };
  }
}
function openMaintForm() {
  showSheet(`
    <div class="sheet-title">แจ้งซ่อมบำรุง</div>
    <div class="field"><label>ครุภัณฑ์</label>
      <select class="input" id="f_asset">${state.assets.map(a => `<option value="${a['รหัสครุภัณฑ์']}">${a['ชื่อครุภัณฑ์']} (${a['รหัสครุภัณฑ์']})</option>`).join('')}</select>
    </div>
    <div class="field"><label>อาการ/ปัญหา</label><input class="input" id="f_issue"></div>
    <div class="field"><label>ผู้แจ้ง</label><input class="input" id="f_reporter" value="${state.user.name}"></div>
    <div class="field"><label>วันที่แจ้ง</label><input class="input" type="date" id="f_rdate" value="${isoDate()}"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnCancel">ยกเลิก</button>
      <button class="btn btn-primary" id="btnSave">บันทึก</button>
    </div>
  `);
  document.getElementById('btnCancel').onclick = closeSheet;
  document.getElementById('btnSave').onclick = async () => {
    const assetId = val('f_asset');
    const asset = state.assets.find(a => a['รหัสครุภัณฑ์'] === assetId);
    if (!val('f_issue')) { toast('กรุณากรอกอาการ/ปัญหา'); return; }
    await apiPost('addMaint', { assetId, assetName: asset ? asset['ชื่อครุภัณฑ์'] : '', issue: val('f_issue'), reporter: val('f_reporter'), reportDate: val('f_rdate') });
    closeSheet(); toast('แจ้งซ่อมแล้ว'); await loadAll(); renderMaint();
  };
}

/* ========================================================= REPORTS */
function renderReports() {
  const el = document.getElementById('view-reports');
  const d = state.dashboard;
  el.innerHTML = `
    <div class="section-title">รายงานสรุป</div>
    <div class="glass chart-card"><h4>จำนวนครุภัณฑ์ตามสถานะ</h4><div class="chart-wrap"><canvas id="statusChart"></canvas></div></div>
    <div class="glass chart-card"><h4>จำนวนครุภัณฑ์ตามหมวดหมู่</h4><div class="chart-wrap"><canvas id="catChart2"></canvas></div></div>
  `;
  drawBar('statusChart', d.byStatus);
  drawDoughnut('catChart2', d.byCategory);
}

/* ========================================================= SHEET/MODAL */
function showSheet(html) {
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="overlayEl"><div class="sheet"><div class="sheet-handle"></div>${html}</div></div>`;
  document.getElementById('overlayEl').addEventListener('click', (e) => { if (e.target.id === 'overlayEl') closeSheet(); });
}
function closeSheet() { document.getElementById('modalRoot').innerHTML = ''; }
function val(id) { return document.getElementById(id).value; }

/* ========================================================= PRINT: ใบเบิก/ยืมพัสดุ (ฟอร์มราชการ) */
function printRequisitionForm(opts) {
  let rows = [];
  let borrowerName = '', dueDateText = '', noteText = '';

  if (opts.borrow) {
    const b = opts.borrow;
    borrowerName = b['ผู้ยืม'] || '';
    dueDateText = thaiDate(b['กำหนดคืน']);
    noteText = b['หมายเหตุ'] || '';
    rows.push({
      name: b['ชื่อครุภัณฑ์'], code: b['รหัสครุภัณฑ์'], qty: 1,
      comp: (opts.componentNames || []).join(', ') || '-'
    });
  } else if (opts.items) {
    rows = opts.items.map(a => ({
      name: a['ชื่อครุภัณฑ์'], code: a['รหัสครุภัณฑ์'], qty: 1,
      comp: (opts.components || []).map(c => c['ชื่อส่วนควบ']).join(', ') || '-'
    }));
  }

  const today = thaiDate(new Date());
  const html = `
    <div class="pf-head">
      <div class="pf-seal">[ ตราครุฑ ]</div>
      <div class="pf-title">บันทึกข้อความ</div>
      <div class="pf-org">เรื่อง ขอเบิก - ยืมพัสดุครุภัณฑ์</div>
    </div>
    <div class="pf-line"><span>ส่วนราชการ&nbsp; ${ORG_NAME}</span><span></span></div>
    <div class="pf-line"><span>ที่ ........................................ /..................</span><span>วันที่ ${today}</span></div>
    <div style="margin:14px 0 6px; font-size:14px;">เรียน&nbsp; ผู้บังคับบัญชา</div>
    <div style="font-size:14px; line-height:1.9; text-indent:38px;">
      ด้วยข้าพเจ้า <b>${borrowerName || '.............................................................'}</b> ตำแหน่ง ...............................................................
      มีความประสงค์ขอเบิก/ยืมพัสดุครุภัณฑ์ของทางราชการ เพื่อนำไปใช้ในการปฏิบัติหน้าที่ราชการ ตามรายการดังต่อไปนี้
    </div>
    <table class="pf-table">
      <thead><tr><th style="width:6%;">ลำดับ</th><th>รายการครุภัณฑ์</th><th style="width:18%;">รหัส/หมายเลขเครื่อง</th><th style="width:8%;">จำนวน</th><th style="width:26%;">ส่วนควบที่เบิก/ยืมด้วย</th></tr></thead>
      <tbody>
        ${rows.map((r, i) => `<tr><td style="text-align:center;">${i + 1}</td><td>${r.name}</td><td>${r.code}</td><td style="text-align:center;">${r.qty}</td><td>${r.comp}</td></tr>`).join('')}
        ${rows.length < 3 ? Array.from({ length: 3 - rows.length }).map(() => `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>`).join('') : ''}
      </tbody>
    </table>
    <div style="font-size:14px;">กำหนดส่งคืนภายในวันที่ &nbsp; <b>${dueDateText || '...................................'}</b></div>
    <div style="font-size:14px; margin-top:4px;">หมายเหตุ &nbsp; ${noteText || '-'}</div>
    <div style="font-size:14px; margin-top:16px;">จึงเรียนมาเพื่อโปรดพิจารณาอนุมัติ</div>

    <div style="margin-top:10px;">
      <div class="pf-signblock" style="text-align:center;">
        ลงชื่อ ..................................................... ผู้เบิก/ผู้ยืม<br>
        ( ..................................................... )<br>
        ตำแหน่ง .....................................................<br>
        วันที่ .....................................................
      </div>
      <div class="pf-signblock" style="text-align:center; float:right;">
        ลงชื่อ ..................................................... ผู้อนุมัติ/ผู้จ่ายพัสดุ<br>
        ( ..................................................... )<br>
        ตำแหน่ง .....................................................<br>
        วันที่ .....................................................
      </div>
    </div>
  `;
  document.getElementById('printArea').innerHTML = html;
  setTimeout(() => window.print(), 80);
}

init();
</script>
</body>
</html>
